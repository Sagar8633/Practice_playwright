  - generic [ref=e18]:
    - paragraph [ref=e19]: Result
    - paragraph [ref=e20]: C. No exploitable mechanism found in 28 event families. Three gross asymmetries exist; none pays the spread.
    - paragraph [ref=e21]: "110 ledger rows (28 hypotheses, traded with and against their event direction, plus first-of-day and M15 variants): 94 rejected in development, 16 with too few events, none weak or candidate. The follow-up on the strongest gross asymmetries, with wider units and longer holds, found no shape or horizon that is net positive in development on at least 200 events."
    - paragraph [ref=e22]: "What the search did find is worth stating precisely. The first 30 minutes of the Asian session predict the next hours (gross PF 1.15, 1.14, 1.10 in the three periods at 1 ATR; 1.29, 1.44, 1.15 at 1:2), one event per day, and the spread at 02:00 server time takes it all back. Continuation after an exhaustion bar and the adverse timing of the TWK flip are the same story at smaller scale. Two more (fading the first expansion out of a low-volatility regime, continuation after an Asian-range sweep) hold in development and validation and vanish out of sample: regime effects, not mechanisms."
  - generic [ref=e23]:
    - heading "1. Result by family" [level=2] [ref=e24]
    - list [ref=e25]:
      - listitem [ref=e26]:
        - strong [ref=e27]: Volatility (H01 to H04).
        - text: Compression breaks, shock bars and the first expansion after a quiet regime all lose with the event and show no stable asymmetry against it; the expansion-out-of-compression fade (gross +0.11R DEV, +0.29R VAL, -0.01R OOS) is the one that fooled development and validation together.
      - listitem [ref=e28]:
        - strong [ref=e29]: Liquidity and range (H05 to H11).
        - text: "Previous-day sweeps, breaks, retests, Asian and London range breaks, opening-range breaks, equal-high sweeps: gross within 0.05R of zero in every period except the Asian-sweep continuation (gross +0.07R DEV, +0.11R VAL, -0.02R OOS). Session ranges on gold at these timeframes are not levels the market respects in a tradeable way."
      - listitem [ref=e30]:
        - strong [ref=e31]: Mean reversion (H12 to H14).
        - text: "Fading a 3-ATR displacement from VWAP has the most significant z-score in the ledger (2.7) and the smallest effect (+0.015R gross): with 89,000 events, significance is cheap and money is not. The 20-bar z-score and the gap from the previous close are the same."
      - listitem [ref=e32]:
        - strong [ref=e33]: Momentum (H15 to H17).
        - text: "Five candles in a row, displacement-retrace-reclaim and break-retest-hold sequences: no continuation tendency in either direction beyond noise."
      - listitem [ref=e34]:
        - strong [ref=e35]: Exhaustion (H18 to H20).
        - text: Wick rejections at the day's extreme and third touches do not reverse. Fading a climax bar loses; continuing after it is gross-positive in all three periods (+0.005R, +0.05R, +0.18R at 1:2) and net-positive only out of sample.
      - listitem [ref=e36]:
        - strong [ref=e37]: Time of day (H21).
        - text: The London and New York first-30-minute directions carry nothing. The Asian one does, gross, in every period, and is the least executable event in the set.
      - listitem [ref=e38]:
        - strong [ref=e39]: TWK as something else (H22 to H24).
        - text: "Contrarian: gross +0.02R to +0.06R in development and validation, zero out of sample, -0.16R to -0.41R net. The flip-adverse-reclaim sequence loses (-0.46R net DEV). The first flip of the day is no better than the rest."
      - listitem [ref=e40]:
        - strong [ref=e41]: State transitions (H25 to H28).
        - text: "Compression to expansion, expansion to retracement, breakout to failure: rejected. Trend to exhaustion has too few events (428) and no net edge either way."
      - listitem [ref=e42]:
        - strong [ref=e43]: First versus later occurrence.
        - text: In no family does the first event of the day behave differently enough from later ones to change a verdict; the differences are within the noise of a few hundred events.
