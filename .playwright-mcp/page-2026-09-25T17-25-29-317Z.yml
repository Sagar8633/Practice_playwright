    - paragraph [ref=e5129]: The state machine spends 50% of M5 bars in RANGE, 23% in TREND, 21% in COMPRESSION, 6% in EXPANSION and 0.4% in EXHAUSTION. Transitions are rare enough to give small samples and common enough to show that none of the four tested changes the next move's odds.
  - generic [ref=e5130]:
    - heading "10. What this rules out, and what is left" [level=2] [ref=e5131]
    - list [ref=e5132]:
      - listitem [ref=e5133]:
        - strong [ref=e5134]: "Ruled out at XM's spread on M3 to M15 gold:"
        - text: volatility-regime breaks and shocks, session-range breaks and sweeps, opening ranges, previous-day levels, equal highs and lows, VWAP and z-score reversion, candle runs, displacement sequences, wick rejections, climax fades, touch counts, session-open momentum, compression-expansion-breakout-failure transitions, the TWK flip as entry, contrarian, sequence or first-of-day signal. Each was measured, not assumed.
      - listitem [ref=e5135]:
        - strong [ref=e5136]: "A real but uneconomic asymmetry:"
        - text: Asian-open continuation. If you ever trade an instrument or account where the spread at that hour is under a tenth of the 5-minute ATR (gold futures, or a raw-spread account at a quieter hour of a different session), it is the first thing to re-test. On XM standard it is dead on arrival.
      - listitem [ref=e5137]:
        - strong [ref=e5138]: "Not measurable here:"
        - text: news reactions (no calendar), order-flow behaviour (no book), sub-minute behaviour (no ticks), and your own selection (no log). Those are the datasets in which an edge could still live; nothing in five years of bars at this cost level contains one.
      - listitem [ref=e5139]:
        - strong [ref=e5140]: The engine is reusable.
        - text: Any new event is a function returning (bar index, side); the ledger, the split, the tests and the follow-up run unchanged. New data (a calendar, ticks, your trades) plugs in as new event families.
  - generic [ref=e5141]:
    - heading "11. Method and limits" [level=2] [ref=e5142]
    - list [ref=e5143]:
      - listitem [ref=e5144]: Events are evaluated on M5 (M3 for the TWK families) with an M15 cross-check reserved for anything reaching WEAK; nothing did.
      - listitem [ref=e5145]: Sessions and opening ranges use server time (EET). Daily rollover at 00:00 server; the Asian range is 01:00 to 09:59, London 10:00 to 14:59, New York 15:00 to 23:59.
      - listitem [ref=e5146]: The primary shape is a 1 ATR stop with a 2 ATR target; the directional shape is 1 ATR each way; 0.25 and 0.5 ATR shapes are in the ledger CSV. Ties inside a one-minute bar count as the stop.
      - listitem [ref=e5147]: The 'drift to horizon' rows in the follow-up (hold with no stop for 100 or 300 bars) are reported for completeness; their variance is enormous and their sign flips between periods, which is why they are not evidence of anything.
      - listitem [ref=e5148]: "Limits: 39 of 61 months; bar paths not ticks; yearly median spread; no slippage beyond the cost multipliers."