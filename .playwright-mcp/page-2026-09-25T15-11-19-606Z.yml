    - paragraph [ref=e760]: "The 5-to-20-minute bucket is where the money goes; trades that survive an hour are net winners. A time exit sounds right, but the engine test shows why it fails: closing a stale trade frees the slot for the next signal, which is on average another loser, and the close itself pays spread. Post-hoc the best time exit (20 minutes, below 0R) would have saved $727 of a $17,360 gross loss. Rejected."
