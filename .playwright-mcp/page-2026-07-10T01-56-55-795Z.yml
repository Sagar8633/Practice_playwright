            - paragraph [ref=e95]:
              - text: Edgeful is a research platform that shows the statistics on a wide range of patterns and circumstances, such as how often gaps fill, how often the market finishes higher or lower based on the opening hour (or other amount of time), how often a stock/future/currency pair reaches its average daily range, and much more.
              - text: Run statistical studies on a wide range of stocks, ETFs, futures contracts, and currency pairs.
            - paragraph [ref=e96]: But let’s get back to the interesting part. A simple strategy that produced well into triple-digit gains over the last year, making only one trade a day.
            - heading "The Strategy Results" [level=2] [ref=e97]
            - paragraph [ref=e98]:
              - emphasis [ref=e99]:
                - strong [ref=e100]: This article was originally written on October 6, 2025. I have kept the original article and criteria intact, which were relevant when the article was written. At the bottom, I have provided updates on how the strategy criteria change over time based on the information and moves the market is giving us.
            - paragraph [ref=e101]:
              - text: I actually noticed a few things on the call, and found that the default settings, which produced the above results, weren’t capitalizing on the really big movement days. A small adjustment for that, and the profit jumped to 433% over the last year. That’s a $43,310 profit on a $10,000 futures account trading 1 contract of the Nasdaq E-mini (NQ). For a smaller account, consider trading MNQ (Nasdaq E-micro).
              - text: That’s a fantastic return for making one trade a day. It does not account for commissions or slippage. Because it is only one trade a day, commissions didn’t adjust the overall profit by much.
              - emphasis [ref=e102]: As you know, historical results are not always indicative of future performance.
            - figure [ref=e103]:
              - link "ORB strategy back test, longs only for NQ futures" [ref=e104] [cursor=pointer]:
                - /url: https://tradethatswing.com/wp-content/uploads/2025/10/nq-overview.jpg
                - img "ORB strategy back test, longs only for NQ futures" [ref=e105]
            - paragraph [ref=e106]: In my own backtest, which differs slightly from the one run during the video, the strategy produced 114 trades. 74.56% were profitable. Profit factor was 2.512. The max drawdown was $2,725, or about 12% of the account balance at the time. If that drawdown occurred when trading commenced, that would be a 27.25% drawdown on a $10,000 account.
            - paragraph [ref=e107]: Because of the high win rate, consecutive losses are fairly rare. There were 3 separate instances of two losses in a row over the 114 trades. No instances of three losses in a row, although it could certainly happen.
            - figure [ref=e108]:
              - link "ORB backtest statistics for NQ futures" [ref=e109] [cursor=pointer]:
                - /url: https://tradethatswing.com/wp-content/uploads/2025/10/nq-trades.jpg
                - img "ORB backtest statistics for NQ futures" [ref=e110]
            - paragraph [ref=e111]:
              - text: This is for a $10,000 account, and trading 1 futures contract through the entire year. Positions were NOT scaled up as the account grew.
              - emphasis [ref=e112]: The loss per trade was capped at $1000
              - text: . That is 10% of the starting account balance, but that risk would drop as the account grows.
            - paragraph [ref=e113]: That’s more risk than I usually take on per trade, but because of the high win rate, the account was never really in danger (if the largest loss occurred near the beginning, it would have been down 27.25%). The equity curve near the top shows how the strategy tends to bounce back quite quickly…or at least it did over the last year.
            - paragraph [ref=e114]:
              - text: To risk less, keep the same parameters with a $20,000 account. The dollar profit remains the same at $43,000, risk is halved (5% per trade at the beginning, but drops as the account gets bigger), and percentage profit is also halved to 216%. Or use a $30,000 account to further reduce percentage risk and percentage returns.
              - text: "[I actually have a"
              - link "position sizing method based on maximum acceptable drawdown" [ref=e115] [cursor=pointer]:
                - /url: https://tradethatswing.com/three-effective-forex-position-sizing-methods/
              - text: . It doesn’t consider individual trade risk. This position sizing method may risk 3% to 5% or more of the account routinely, because even in the event of many losses in a row, the drawdown would be within my acceptable level. Only recommended for very well-tested strategies.]
              - text: Futures contracts are inherently leveraged. So returns would be dramatically less trading an ETF, even a leveraged ETF like TQQQ (26.7% over the last year). And it is advisable to run stats on every instrument, even if they seem related, because results will be quite different if trading ES futures, for example. Different volatility levels and tendencies would mean different parameters used for the trade.
            - heading "The ORB Strategy" [level=2] [ref=e116]
            - paragraph [ref=e117]: The ORB Strategy buys or sells when the price has a 5-minute candle close (changing this will dramatically change results) outside the high or low of the first 15 minutes. 1 trade a day, if it triggers. Technically, the stop loss is the other side of the opening range, and the target is 50% of the opening range.
            - paragraph [ref=e118]: It seems like that is a negative reward:risk! Risk the whole opening range to only make half the opening range???
            - paragraph [ref=e119]: Sort of. Remember, risk is capped at $1000, which is 50 points on an NQ contract. If the opening range is bigger than that, then risk is still capped at 50 points. So in actual practice, the average winning trade is about $846, and the average losing trade is $987, which is closer to 1:1 than it first appears. The high win rate makes it profitable. And palatable for many traders since there are relatively few extended drawdowns.
            - paragraph [ref=e120]: Here are screenshots of the last couple of trades the strategy took. The first was a winner, hitting the target, while the next was a loser, hitting the stop loss.
            - figure [ref=e121]:
              - link "ORB strategy trades examples on NQ futures" [ref=e122] [cursor=pointer]:
                - /url: https://tradethatswing.com/wp-content/uploads/2025/10/nq-algos.png
                - img "ORB strategy trades examples on NQ futures" [ref=e123]
            - paragraph [ref=e124]: The conditions were long only and 1 trade per day. So, if ORB is broken to the downside first, all trades for the day are ignored, even if the price breaks ORB to the upside later in the day. You can see a couple of examples of this on the chart, where there are no trades after an ORB break lower.
            - heading "The Conditions/Settings for This Test" [level=2] [ref=e125]
            - paragraph [ref=e126]: In the video, we tested out scenarios for taking both long and shorts, just longs, and capping opening ranges at 0.5% (if the opening range is bigger than that, there is no trade).
            - paragraph [ref=e127]:
              - text: In my own test, which produced higher returns of 433% over the last year, I expanded the opening range limit to 0.8%. This had a dramatic effect. It increased the number of trades and profit considerably, essentially taking advantage of higher movement days.
              - text: It was long only because most of the year has been moving higher.
              - text: When I ran the test from May 1 to October 3 (uptrend period), the profit was actually higher (450%) than for the entire last year (433%), highlighting that it seems to pay to play in alignment with the major trend, and ignore trades in the opposite direction. This is only tested on uptrends and optimal performance came from only taking longs. Don’t assume the same results from downtrends, as downtrends act differently. I need to do more research on settings for downtrends. At a glance, the results were not very good from just flipping the criteria to only take shorts in a downtrend.
            - paragraph [ref=e128]:
              - text: How can you determine the major trend? Watch the
              - link "Weekly Market Outlook" [ref=e129] [cursor=pointer]:
                - /url: https://tradethatswing.com/swing-trading-stock-market-outlook-for-this-week/
              - text: or track the
              - link "market health indicators" [ref=e130] [cursor=pointer]:
                - /url: https://tradethatswing.com/when-to-buy-stocks-after-a-stock-market-correction/
              - text: yourself.
            - paragraph [ref=e131]: Here are the settings for the test. Each day of the week (all customizable) are the same as the one shown.
            - figure [ref=e133]:
              - link "opening range strategy algo settings for NQ as of Oct 6 2025" [ref=e134] [cursor=pointer]:
                - /url: https://tradethatswing.com/wp-content/uploads/2025/10/algo-settings1.jpg
                - img "opening range strategy algo settings for NQ as of Oct 6 2025" [ref=e135]
            - paragraph [ref=e136]: "And the next page of settings in the algo:"
            - figure [ref=e138]:
              - img "algo settings for NQ opening range strategy as of oct 6 2025" [ref=e139]
            - paragraph [ref=e140]:
              - text: Every instrument is different and has its own personality. Context is also important, as discussed. An overall uptrending period seems to do better with ORB longs only, for NQ. Certain days of the week also perform better than others. You can run the stats and exclude certain days if they tend to perform poorly. All these settings can be tested in
              - link "Edgeful" [ref=e141] [cursor=pointer]:
                - /url: https://edgeful.com/?via=TTS
              - text: ", and customized in the"
              - link "Edgeful Algos" [ref=e142] [cursor=pointer]:
                - /url: https://www.edgeful.com/features/algos?via=TTS
              - text: .
              - text: Or, just trade the ORB strategy on your own. You can track how it performs by day of week, opening range size, which target gets hits the most…
              - strong [ref=e143]: as this will change over time.
              - text: Edgeful provides the data.
              - strong [ref=e144]: This means the settings will change over time. These settings may no longer work at some point. It is the trader’s job to monitor what is working recently and update the strategy inputs accordingly.
            - paragraph [ref=e145]:
              - text: You may also be interested in the
              - link "Gold Initial Balance Breakout Day Trading Strategy" [ref=e146] [cursor=pointer]:
                - /url: https://tradethatswing.com/one-trade-a-day-gold-strategy-411-in-last-year-fully-automatable/
              - text: (fully automated as well).
            - heading "March 5, 2026 Update" [level=2] [ref=e147]
            - paragraph [ref=e148]: The basic strategy stays the same over time, but there may be times it is not worth deploying, or when the criteria need to be updated. We can see this by monitoring results and reviewing the price action.
            - paragraph [ref=e149]:
              - text: This is done every week or two so that as conditions change, they are adapted to. This was discussed in the video above.
              - text: "Here are some recent observations:"
            - list [ref=e150]:
              - listitem [ref=e151]: Shorts haven’t helped. Sticking with long only.
              - listitem [ref=e152]: Thursdays have not worked great for longs. Avoid till they improve.
              - listitem [ref=e153]: Ideally, a bigger max loss is used. This allows the price to chop around (which it has) while still eventually hitting the target. This requires a larger account, though. The increased win rate more than offsets the smaller R:R.
            - paragraph [ref=e154]: The following stats are for a $2000 maximum loss per trade, with a $30,000 account, over the last 3 months. Position size is one contract.
            - figure [ref=e155]:
              - link "ORB stats for NQ, 3 month period." [ref=e156] [cursor=pointer]:
                - /url: https://tradethatswing.com/wp-content/uploads/2025/10/orb-stats-3-months-march-2026.jpg
                - img "ORB stats for NQ, 3 month period." [ref=e157]
            - figure [ref=e158]:
              - link [ref=e159] [cursor=pointer]:
                - /url: https://tradethatswing.com/wp-content/uploads/2025/10/march-5-2026-orb-stats.jpg
            - paragraph [ref=e160]: Keeping risk capped at $1000 still performed well, but only captured about half the profit of expanding the risk level.
            - paragraph [ref=e161]: "Other options to consider:"
            - list [ref=e162]:
              - listitem [ref=e163]: A “move to breakeven” criteria
              - listitem [ref=e164]: Multiple targets
            - paragraph [ref=e165]: If employing a strategy, don’t just trust that what worked in the distant past will work going forward. Stay on top of what is working and what isn’t, adjust accordingly.
