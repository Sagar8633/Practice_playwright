            - paragraph [ref=f9e827]: "What to notice: the honest interview answer about Postman is a trade-off, not a preference: collections are excellent for exploring an API and for handing a runnable artifact to a non-coder, but they do not scale like code — no real refactoring, awkward code review of a giant JSON file, and limited reuse. Say that, and say you keep the regression suite in code and use Postman for exploration and for sharing."
