        - generic [ref=f12e1214]:
          - term [ref=f12e1215]: Qualified
          - definition [ref=f12e1216]: research complete, a current opportunity score, score >= campaigns.min_opportunity_score (70), status not SKIPPED/REJECTED
        - generic [ref=f12e1217]:
