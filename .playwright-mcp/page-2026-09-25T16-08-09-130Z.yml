    - paragraph [ref=e1662]: "Fixed 0.02 lot from $1,000 is ruin for the baseline (equity goes negative) and still a 57% loss for the recommended stack, because a losing 2022 to 2024 at fixed size is unavoidable. Risk sizing at 0.5% turns the baseline into -73% and the recommended stack into -14% with a 15.8% maximum drawdown and no month of forced inactivity. The minimum-lot gate is doing a lot of the work: from a $1,000 account, 0.5% is $5, so any stop wider than $5 per ounce cannot be taken at 0.01 lot and is skipped. That is 3,239 of the 26,352 signals and it is correct behaviour for that account size."
  - generic [ref=e1663]:
    - heading "8. What to enable" [level=2] [ref=e1664]
    - paragraph [ref=e1665]: "Three levels: hard safety, loss reduction, experimental."
    - list [ref=e1666]:
      - listitem [ref=e1667]:
        - strong [ref=e1668]: "Level 1, always on:"
        - text: "risk sizing 0.5% with the minimum-lot skip, daily loss 2%, streak ladder (2 half, 3 pause, 4 stop), spread / ATR <= 0.5, spread / (2R) <= 0.10, margin check, max exposure. Measured: -$2,752 to -$1,551 alone, ruin to -73% with sizing."
      - listitem [ref=e1669]:
        - strong [ref=e1670]: "Level 2, retained on evidence:"
        - text: "2 ATR distance from the previous signal (+$1,596, all periods), 2-bar direction confirmation (+$610; do not use 1 bar), 2 attempts per direction with a pivot-and-1-ATR reset (+$118), and the R locks at +1R and +1.5R (+$626, positive out of sample). Together with Level 1: -$572, -$14% on equity."
      - listitem [ref=e1671]:
        - strong [ref=e1672]: "Level 3, experimental, off by default:"
        - text: "volatility ban (hurts out of sample; use the half-risk rule instead), chop lockout (no effect), hybrid stop (mixed), trade-health exit (negative), HTF and session filters (rejected in phase 1), news window (no data), execution-quality gate (no data). The large-candle lock is the exception: positive alone (+$353) and inside the stack (+$300), so it is included in the recommended set."
      - listitem [ref=e1673]:
        - strong [ref=e1674]: "The result to expect:"
        - text: a system that trades about 170 times a year instead of 700, loses slowly instead of quickly, and survives. Not a system that makes money. That would need a signal with an edge, which phase 2 showed this one is not.
