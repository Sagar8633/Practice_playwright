      - text: Simulating the bots with every point distance rescaled by trailing volatility (the
      - emphasis [ref=e410]: volscaled
      - text: "rows in the fixes table) does not rescue them: M1 gets slightly worse, M5 and M15 improve but stay negative. The fixed-point settings were a problem, but the flip logic underneath is the real one."
