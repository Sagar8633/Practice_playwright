    - paragraph [ref=e1512]: "Direction was a coin flip for every event; range is not. The table shows which events raise the next-100-minute range and by how much, with the order preserved in all three periods for the top eight. The time-of-day profile is the deterministic part: the two hours before and after the US 8:30 releases carry double the range of the New York afternoon."
    - paragraph [ref=e1513]: Monetising range without direction means a straddle, and a straddle at random bars loses 0.26 to 0.37 ATR per attempt because two spreads and one stop are paid to catch a move that usually does not come. After the 15:30 bar the tightest straddle is positive in all three periods (+0.12, +0.29, +0.21 ATR), on Thursdays +0.54, in every year from 2021 to 2026; the shock-bar straddle is positive in all three periods as well (+0.02, +0.12, +0.20) and the climax-bar straddle in two. Wider straddles (0.5 and 1 ATR triggers) lose, so at bar resolution the effect has no plateau, which is a warning; for a release straddle the tight trigger is the design, but it is also the configuration most exposed to fills.
    - paragraph [ref=e1514]: "The unresolved half is the whole question. 86% of these events have a first minute wider than both triggers; the 390 unresolvable events would be losses of 0.5 ATR plus spread if the second trigger fires after the first, and wins if the first side runs. Between -0.21 and +0.45 ATR per event, and the bar data cannot say which. Status in the ledger: WEAK, execution-dependent, the next experiment."
