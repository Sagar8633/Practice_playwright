  - generic [ref=e3193]:
    - heading "10. Final decision" [level=2] [ref=e3194]
    - paragraph [ref=e3195]: C. No measurable edge in the available data
    - paragraph [ref=e3196]: C. The signal's gross directional accuracy is a coin flip on every timeframe, every regime, every location and every timing; the spread is 13% to 49% of the traded move; no subset with stable positive expectancy exists after costs. Continuing development of this indicator as an automated system is not supported by the data.
    - paragraph [ref=e3197]: "What would change the decision: a manual trade log showing positive expectancy on trades that the raw signal dataset classifies as coin flips, which would locate the edge in something not yet measured; or a different signal. Not another filter on this one."
  - generic [ref=e3198]:
    - heading "11. Method and limits" [level=2] [ref=e3199]
    - list [ref=e3200]:
      - listitem [ref=e3201]: "Signals: every Supertrend(1.5, 10) flip on M3 from Sep 2021 to Sep 2026 (26,963), Dukascopy one-minute bars shifted to XM server time, 39 of 61 months present."
      - listitem [ref=e3202]: "Entry: the next one-minute open after the signal close, plus the spread for buys. Path: the following 600 one-minute bars (10 hours), bid highs/lows for buys, ask for sells. First-passage times to each level in ATR(10) of the signal timeframe; a level hit in the same bar as the opposite level counts as the stop. Signals whose path ends in neither are valued at the 10-hour close."
      - listitem [ref=e3203]: "Periods: DEV Sep 2021 to Dec 2023, VAL 2024, OOS Jan 2025 to Sep 2026. Feature buckets are quintiles of each feature's own distribution, not chosen thresholds. Stability = the best-versus-worst bucket order holding in all three periods, and the number of positive calendar years."
      - listitem [ref=e3204]: "Limits: no economic calendar; no manual trade log; per-year median spread rather than per-tick; one-minute rather than tick paths, which flatters every result slightly; the 'strength' variables are the indicator's own internals (penetration of the line, bar body and close location, previous leg length and extent, ATR and ADX slopes), which is all a Supertrend has."