    - list [ref=e1414]:
      - listitem [ref=e1415]:
        - text: "Lot size from risk, never fixed:"
        - code [ref=e1416]: lot = floor(equity x RiskPercent / (stopDistance x tickValuePerLot / tickSize) / lotStep) x lotStep
        - text: ", with"
        - code [ref=e1417]: SYMBOL_VOLUME_MIN/STEP/MAX
        - text: and
        - code [ref=e1418]: OrderCalcMargin
        - text: from the terminal.
      - listitem [ref=e1419]:
        - text: Skip the trade if the minimum lot already risks more than
        - code [ref=e1420]: MaxStopRiskPercent
        - text: (2%); never size up to force a fill. With a $200 account and today's stops this skips most signals, which is the honest answer for that account size.
      - listitem [ref=e1421]:
        - text: "Daily stop: no new entries after"
        - code [ref=e1422]: MaxDailyLossPercent
        - text: "(3%) of the day's starting equity. Streak stop: no new entries for the rest of the day after"
        - code [ref=e1423]: MaxConsecutiveLosses
        - text: (5).
      - listitem [ref=e1424]:
        - text: One position per symbol (already the default);
        - code [ref=e1425]: MaxOpenPositions
        - text: and
        - code [ref=e1426]: MaxTotalExposureLots
        - text: as inputs for multi-chart use.
      - listitem [ref=e1427]: "The table shows the effect on the same trade lists: sizing changes the drawdown and whether the account survives; it does not change the sign of the expectancy."
