          - definition [ref=f13e1219]: status IN (SKIPPED, REJECTED); the tooltip splits pipeline skips from your rejections
        - generic [ref=f13e1220]:
          - term [ref=f13e1221]: Requiring verification
          - definition [ref=f13e1222]: status IN (AI_RESEARCHED, NEEDS_VERIFICATION)
