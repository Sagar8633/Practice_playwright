          - paragraph [ref=f9e792]: "Postman is on your skills list, but your real API depth is Python and pytest. The gap is narrow and specific: interviewers want to hear about collections, environments, pre-request scripts and running the collection in CI with Newman. Postman's own tests are written in JavaScript, which is a bonus reason to do this after the JavaScript entry."
