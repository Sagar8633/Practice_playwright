  - generic [ref=e663]:
    - heading "Why they lose" [level=2] [ref=e664]
    - paragraph [ref=e665]: The mechanics behind the numbers.
    - list [ref=e666]:
      - listitem [ref=e667]:
        - strong [ref=e668]: The signal is noise at this frequency.
        - text: Supertrend(1.5, 10) on a one-minute gold chart flips 70 times a day. Half of all Pine-bot trades end on the purple line within a few minutes; 12% are closed by the next flip; only 8% ever reach the 1:2 target.
      - listitem [ref=e669]:
        - strong [ref=e670]: Spread is the whole loss on M1.
        - text: "Pine M1: $66,887 lost, $63,498 of it spread. Momentum M1: $5,264 lost, $5,222 spread. Before costs both are flat. A strategy that only loses its transaction costs has no information in it."
      - listitem [ref=e671]:
        - strong [ref=e672]: The filters are made from the same bars.
        - text: Buying and selling volume in the Tracker is tick volume split by whether the bar closed up or down, so a LONG flip after green bars nearly always passes the M1 and M3 boxes. ADX above 20 is true after most flips because a flip is a move. Removing every filter (the
        - emphasis [ref=e673]: nofilters
        - text: row) gives 5 times more trades and 6 times more loss; the filters are a volume knob, not an edge.
      - listitem [ref=e674]:
        - strong [ref=e675]: The initial stop is structurally wrong.
        - text: 62% of Momentum M1 trades are quick re-flips (a LONG within 15 minutes of a SHORT). Those take the hard 500-point stop and lost $3,495 of the $5,264 total. The other 38% use a 5-bar pivot that can sit $30 to $80 away on today's gold.
      - listitem [ref=e676]:
        - strong [ref=e677]: The trailing gives back what the trend gives.
        - text: "On M15 the Momentum bot's exits are 45% by the 1:1 trail and 24% by the purple line versus 6% at the target. It is designed to take small pieces of trends and full-size losses on the stop. Tick-level trailing is harsher than my bar-level replay can show: under the worst-path assumption (the"
        - emphasis [ref=e678]: worstpath
        - text: rows) the M1 loss grows from $5,264 to $7,580.
      - listitem [ref=e679]:
        - strong [ref=e680]: Position size guarantees ruin.
        - text: Fixed 0.02 lot with pivot stops means single trades risking 10% to 100% of a $200 account. Every base run except Momentum M15 hits zero from $200 in the last six months alone.
