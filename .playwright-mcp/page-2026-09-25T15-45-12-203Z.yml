    - paragraph [ref=e2932]: "Best excursion within 20 bars measured in spreads: at least 2 x spread: 83%, at least 3 x spread: 75%, at least 5 x spread: 62%, at least 10 x spread: 40%, at least 20 x spread: 19% of signals."
    - paragraph [ref=e2933]: "The cost model used throughout is XM's median spread by year (32 to 51 points), zero commission on the Standard account, and no slippage; slippage would only make every number worse. Expressed in the unit that matters, the spread is 0.25 ATR on the median M3 signal: 0.49 ATR in 2021, 0.13 ATR in 2026."
    - paragraph [ref=e2934]: "Break-even arithmetic for the 1 ATR / 1 ATR shape: the hit rate needed is (1 + 0.25) / 2 = 62.5%; the signal delivers 49.3% gross. For 1 ATR / 2 ATR: 41.7% needed, 33.4% delivered. To reach +0.25R of expectancy the signal would need 75% and 50% respectively. The best move within 20 bars exceeds five spreads for 62% of signals and twenty spreads for 19%, so the market moves enough; the signal simply does not know which way."
  - generic [ref=e2935]:
    - heading "8. Manual versus automated" [level=2] [ref=e2936]
    - paragraph [ref=e2937]: What the bot cannot see, and the questions that would turn your process into rules.
    - list [ref=e2938]:
      - listitem [ref=e2939]: "No manual trade log was available, so the claim that the strategy works manually remains unmeasured. What the bot cannot see is, by elimination, not in the price context measured here: not the trend, not the volatility state, not the location, not the timing, not the indicator's own internal readings (penetration of the line, bar body, close location, previous leg length and extent all rank as noise)."
      - listitem [ref=e2940]: "If the manual edge is real, it lives in something outside this dataset: which signals you skip, what you read on other instruments or the news, or exits you take by eye. The questionnaire below is written to extract exactly that. Its answers become testable rules only with a trade log: timestamp, side, entry, stop, exit, and the reason, for at least 100 manual trades."
    - heading "Questionnaire" [level=3] [ref=e2941]
    - list [ref=e2942]:
      - listitem [ref=e2943]:
        - strong [ref=e2944]: Context 1.
        - text: "Before you look at the Tracker, what is the first thing you check on the chart, and on which timeframe? (Name the object: a level, a moving average, the day's range, the previous day's high/low, DXY, news.)"
      - listitem [ref=e2945]:
        - strong [ref=e2946]: Context 2.
        - text: How do you decide the market is trending right now? Is it a slope you see, a sequence of highs and lows, or the purple line's shape? Over how many bars?
      - listitem [ref=e2947]:
        - strong [ref=e2948]: Context 3.
        - text: Which higher timeframe do you look at, and do you trade with it or against it? The data says both worked in different years; which one do you actually do, and when do you switch?
      - listitem [ref=e2949]:
        - strong [ref=e2950]: Context 4.
        - text: What is the specific thing that makes you close the platform and not trade for the next hour?
      - listitem [ref=e2951]:
        - strong [ref=e2952]: Entry 5.
        - text: When the line flips, do you click immediately, on that bar's close, or on the next bar? If you wait, what has to be true on the next bar?
      - listitem [ref=e2953]:
        - strong [ref=e2954]: Entry 6.
        - text: Do you wait for price to come back toward the line before entering? How far, and for how long, before you give up on the signal?
      - listitem [ref=e2955]:
        - strong [ref=e2956]: Entry 7.
        - text: "What confirmation do you need beyond the flip: a candle colour, a break of the flip bar's high, the M1 table turning green, volume?"
      - listitem [ref=e2957]:
        - strong [ref=e2958]: Entry 8.
        - text: Write down the last twenty flips you did NOT take and the reason for each. Those reasons are the only filter list that matters.
      - listitem [ref=e2959]:
        - strong [ref=e2960]: Location 9.
        - text: Do you draw support and resistance? From which timeframe, and how close to a level does a flip have to be for you to take it or refuse it?
      - listitem [ref=e2961]:
        - strong [ref=e2962]: Location 10.
        - text: Do you avoid flips that come after a very large candle? How large is 'very large' to you?
      - listitem [ref=e2963]:
        - strong [ref=e2964]: Location 11.
        - text: Do you avoid buying near the recent high or selling near the recent low? What is 'near' and what is 'recent'?
      - listitem [ref=e2965]:
        - strong [ref=e2966]: Risk 12.
        - text: "Where exactly do you put the stop by hand: the purple line, the last swing, a round number, a fixed dollar amount? Does it differ between a fresh trend and a re-flip?"
      - listitem [ref=e2967]:
        - strong [ref=e2968]: Risk 13.
        - text: Do you ever skip a signal because the stop would be too far? At what distance?
      - listitem [ref=e2969]:
        - strong [ref=e2970]: Risk 14.
        - text: How do you choose the lot size? Fixed, or from the stop distance and the account?
      - listitem [ref=e2971]:
        - strong [ref=e2972]: Exit 15.
        - text: "When do you take profit by hand: a fixed R, a level, the table turning, a candle pattern, a time of day?"
      - listitem [ref=e2973]:
        - strong [ref=e2974]: Exit 16.
        - text: When do you move the stop, and to what?
      - listitem [ref=e2975]:
        - strong [ref=e2976]: Exit 17.
        - text: When the line flips against an open trade, do you close, hold, or add? Always, or only under some condition?
      - listitem [ref=e2977]:
        - strong [ref=e2978]: Exit 18.
        - text: What makes you decide the trade idea is wrong before the stop is hit?
      - listitem [ref=e2979]:
        - strong [ref=e2980]: Discretion 19.
        - text: Describe the chart picture in which you feel most confident taking a flip, in terms of what is drawn on the chart (not 'strong momentum').
      - listitem [ref=e2981]:
        - strong [ref=e2982]: Discretion 20.
        - text: Describe the picture that keeps you out even though the Tracker says LONG or SHORT.
      - listitem [ref=e2983]:
        - strong [ref=e2984]: Discretion 21.
        - text: Between two flips that look the same on the Tracker, one good and one bad in your eyes, what is the difference?
      - listitem [ref=e2985]:
        - strong [ref=e2986]: Discretion 22.
        - text: "Do you keep a record? If not, start today: timestamp, side, entry, stop, exit, one-line reason for the entry and for the exit, and a screenshot. One hundred of these make the manual edge measurable."
