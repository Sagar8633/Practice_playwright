              - text: Practical example —
              - emphasis [ref=f9e1247]: finding the commit that broke your suite
            - code [ref=f9e1249]: "# Your regression suite passed 40 commits ago and fails now. Which commit did it? # Do NOT read 40 diffs. Binary search them. git bisect start git bisect bad # current HEAD is broken git bisect good HEAD~40 # this one was fine # Git checks out the midpoint. Run your test: pytest tests/test_checkout.py -q git bisect bad # or: git bisect good # Repeat ~6 times for 40 commits (2^6 = 64). Git then prints the exact commit. git bisect reset # Fully automated - let Git run the test itself: git bisect start HEAD HEAD~40 git bisect run pytest tests/test_checkout.py -q # ---------- RECOVERY: you reset --hard and lost work ---------- git reflog # every HEAD position, including \"lost\" ones # 8a3f21b HEAD@{2}: commit: add checkout tests git reset --hard 8a3f21b # it is back. Nothing is ever really gone. # ---------- REBASE vs MERGE ---------- git merge main # keeps both histories, adds a merge commit. Safe, honest. git rebase main # replays your commits on top of main. Linear, cleaner. # THE RULE: never rebase a branch someone else has pulled. You rewrite the # commit hashes, and their history and yours stop agreeing."
            - paragraph [ref=f9e1250]: "The answer to memorise: \"Merge preserves history and is safe on shared branches. Rebase produces a linear history and is better before opening a PR — but never on a branch anyone else has pulled, because it rewrites commit hashes.\""
