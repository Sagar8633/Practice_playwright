    - paragraph [ref=e1734]: The regime switch you asked about is real but it is a switch between two negative states before 2025 and a positive one after, and the only thing that changed after 2025 is that gold trended with a spread a quarter the size in ATR terms. A rule that says 'trade continuation when the market trends' needs a way to know that in advance; ADX, ATR ratio, EMA slope and the M15/H1 direction were all tested as that switch in phase 1 and none replicated.
