              - generic [ref=f9e824]: (err, res) =>
              - text: "{ pm.collectionVariables.set('token', res.json().token); }); } // ---------- TESTS TAB: runs after the response arrives ---------- pm.test('status is 200', () => { pm.response.to.have.status(200); }); pm.test('responds in under 2 seconds', () => { pm.expect(pm.response.responseTime).to.be.below(2000); }); pm.test('body has the expected shape', () => { const body = pm.response.json(); pm.expect(body).to.have.property('bookingid'); pm.expect(body.booking.firstname).to.eql('Sagar'); }); // Pass the new id to the NEXT request in the collection pm.collectionVariables.set('bookingId', pm.response.json().bookingid);"
