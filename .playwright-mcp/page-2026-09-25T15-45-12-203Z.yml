  - generic [ref=e1212]:
    - heading "3. What market conditions does it fail in?" [level=2] [ref=e1213]
    - list [ref=e1214]:
      - listitem [ref=e1215]:
        - strong [ref=e1216]: Immediately after the flip.
        - text: "The 0.25 ATR test hits 43.5% gross: the first quarter-ATR after a flip is more likely to go against the signal than with it. This is the mechanical source of the re-flip losses."
      - listitem [ref=e1217]:
        - strong [ref=e1218]: Low volatility.
        - text: "ATR below 0.8x its 30-day median: -0.48R net, hit rate 25% to 27%, because the fixed spread is a large fraction of the move."
      - listitem [ref=e1219]:
        - strong [ref=e1220]: After a large candle
        - text: "(range above 2 ATR): -0.35R net and the only group with a clearly negative gross (-0.054R)."
      - listitem [ref=e1221]:
        - strong [ref=e1222]: Late session and Asia
        - text: "(00:00 to 10:00 server): -0.35R to -0.43R, the thinnest, most expensive hours."
      - listitem [ref=e1223]:
        - strong [ref=e1224]: After a losing signal.
        - text: "-0.33R versus -0.26R after a winning one; a small, consistent difference, and both negative."
      - listitem [ref=e1225]:
        - strong [ref=e1226]: With the EA's own filters.
        - text: "Signals that pass the volume-ratio, box and ADX filters: -0.306R. Signals that fail them: -0.308R. The filters carry no information about the outcome."
  - generic [ref=e1227]:
    - heading "4. What distinguishes good signals?" [level=2] [ref=e1228]
    - paragraph [ref=e1229]: "Ranked by evidence: the best-versus-worst bucket order must hold in DEV, VAL and OOS to count."
    - paragraph [ref=e1230]: "Nothing distinguishes good signals in a way that can be known at entry. 22 of 37 features keep the same best-versus-worst ordering across DEV, VAL and OOS, which sounds like evidence until you read the values: the best bucket of every one of them is negative in every period. The three strongest separations (cost-to-reward, ATR ratio, session) are three views of the same fact, the spread as a share of the move. The only rows with a positive best bucket are the outcome class itself (a check that the machinery finds real structure when it exists) and a one-signal category."
    - table [ref=e1232]:
      - caption [ref=e1233]: Net expectancy of the 1 ATR / 1 ATR test per quintile (or category). Ranked by how many periods keep the same best-versus-worst order, then by separation. A feature is evidence only if the order holds in all three periods.
