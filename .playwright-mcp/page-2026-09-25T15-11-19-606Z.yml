  - generic [ref=e1251]:
    - heading "4. Proposed filters" [level=2] [ref=e1252]
    - paragraph [ref=e1253]: Only what the data supports. Each keeps its parameters configurable; none is a fixed threshold.
    - list [ref=e1254]:
      - listitem [ref=e1255]:
        - strong [ref=e1256]: Signal age (retained).
        - text: "Problem: rapid re-flips (mechanism 4). Rule: skip the signal if the previous opposite signal is fewer than"
        - code [ref=e1257]: MinOppositeSignalBars
        - text: "bars old (10 on M3). Effect: DEV PF 0.60 to 0.66, VAL 0.58 to 0.74, trades -44%. Risk: it removes the first leg of every V-shaped reversal; in a fast trend day it removes nothing. It is the only filter whose improvement replicates in all three periods, and it is still negative."
      - listitem [ref=e1258]:
        - strong [ref=e1259]: Distance from the previous signal (retained).
        - text: "Problem: chop inside one price zone. Rule: skip if |close - previous signal close| <"
        - code [ref=e1260]: MinSignalDistanceATR
        - text: "x ATR (2.0). Effect on top of signal age: DEV loss -$673 to -$133, VAL -$213 to -$15, but trades fall to 268 / 80 / 390. Risk: over-filtering; the two together remove 78% of trades."
      - listitem [ref=e1261]:
        - strong [ref=e1262]: ATR-capped hybrid stop (retained, small).
        - text: "Problem: uncapped pivot stops ($58 at the 90th percentile in 2026). Rule: SL distance = max(structure,"
        - code [ref=e1263]: StopATRFloor
        - text: x ATR), skip if >
        - code [ref=e1264]: StopATRCap
        - text: "x ATR (1.0 and 4.0). Effect: PF 0.60 to 0.65 DEV, 0.58 to 0.66 VAL; removes the account-sized single losses. Risk: none material; this one is about survival, not edge."
      - listitem [ref=e1265]:
        - strong [ref=e1266]: Risk-based sizing (required).
        - text: Not a filter. Lot = equity x
        - code [ref=e1267]: RiskPercent
        - text: / (stop distance x tick value per lot), broker min/step/max from
        - code [ref=e1268]: SymbolInfoDouble
        - text: ", skip if 0.01 lot would risk more than"
        - code [ref=e1269]: MaxStopRiskPercent
        - text: ", pause after"
        - code [ref=e1270]: MaxDailyLossPercent
        - text: or
        - code [ref=e1271]: MaxConsecutiveLosses
        - text: ". Effect: converts a wipe-out into a drawdown (section 7: baseline -275% at fixed 0.02 lot versus -67% at 0.5% risk). Risk: with a $200 account most signals are skipped because 0.01 lot already exceeds the risk cap; that is the correct behaviour."
      - listitem [ref=e1272]:
        - strong [ref=e1273]: Cost gate (recommended as a guard, not as a filter).
        - text: "Rule: reject if spread / (RR x stop) >"
        - code [ref=e1274]: MaxCostToReward
        - text: (0.10) or spread / stop >
        - code [ref=e1275]: MaxCostToStop
        - text: "(0.20). Effect on M3: neutral (it removes the small-stop trades, which lose and win alike). Its value is on M1, where it rejects three quarters of signals and states the real reason M1 cannot work. Keep it as a safety rule with logging."
      - listitem [ref=e1276]:
        - strong [ref=e1277]: Spread-spike guard (recommended, untestable here).
        - text: "Rule: reject if current spread >"
        - code [ref=e1278]: SpreadSpikeMultiple
        - text: x median spread of the last
        - code [ref=e1279]: SpreadWindowBars
        - text: bars (already in the EA as the auto spread limit). Needs tick spread history to evaluate; see section 14.
    - heading "Rejected filters and why" [level=3] [ref=e1280]
    - list [ref=e1281]:
      - listitem [ref=e1282]:
        - strong [ref=e1283]: Post-loss cooldowns (all 26 variants).
        - text: On M3, trades after a loss are not worse than other trades; cooldowns move the result by single dollars. Would matter on M1, but M1 fails the cost gate anyway.
      - listitem [ref=e1284]:
        - strong [ref=e1285]: Higher-timeframe alignment (M15, H1, EMA slope).
        - text: Sign flips between the range and trend regimes; the OOS gains are hindsight.
      - listitem [ref=e1286]:
        - strong [ref=e1287]: Session filters.
        - text: Hourly expectancy does not replicate between periods.
      - listitem [ref=e1288]:
        - strong [ref=e1289]: Pure ATR stops (1 to 3 ATR).
        - text: Tighter stops produce more stops and the same spread on each; PF falls in DEV at 1.0 and 1.5 ATR.
      - listitem [ref=e1290]:
        - strong [ref=e1291]: Trail activation at 0.25R to 0.75R and break-even at 0.5R to 1R.
        - text: "All worse: normal noise hits the moved stop before the trend starts (winners' median MAE is 0.37R, and 36% of winners go beyond 0.5R against before winning)."
      - listitem [ref=e1292]:
        - strong [ref=e1293]: Time exits.
        - text: Freeing the slot early lets the next losing signal in; post-hoc saving under 5% of the loss.
      - listitem [ref=e1294]:
        - strong [ref=e1295]: Opposite-signal models A, B, D.
        - text: Closing on the opposite signal is worse than holding in every form; Model B (confirm 2 bars) is the least bad and still below the baseline. Your tester setting (reverse) is the worst of all.
      - listitem [ref=e1296]:
        - strong [ref=e1297]: Chop filters (flip count, Bollinger width, opposite candles, ADX slope).
        - text: Either remove almost nothing on M3 (flip count, Bollinger width) or remove winners and losers alike.
      - listitem [ref=e1298]:
        - strong [ref=e1299]: Entry-quality score.
        - text: Marginal and six-parameter; two of its features reverse out of sample.
      - listitem [ref=e1300]:
        - strong [ref=e1301]: Volatility caps (ATR ratio <= 1.5).
        - text: "Helps VAL, hurts OOS badly (PF 0.89): the 2025 to 2026 winners were the high-ATR trades."
  - generic [ref=e1302]:
    - heading "5. Entry decision flow" [level=2] [ref=e1303]
    - generic [ref=e1304]:
      - generic [ref=e1305]: Signal bar closes on the signal timeframe (M3)
      - generic [ref=e1306]: Is the previous opposite signal at least MinOppositeSignalBars old? If not, log RAPID_FLIP and skip
      - generic [ref=e1307]: Is the close at least MinSignalDistanceATR x ATR from the previous signal close? If not, log CHOP and skip
      - generic [ref=e1308]: Do the shipped filters pass (volume ratio, M1 box, M3 box, ADX)? If not, skip as today
      - generic [ref=e1309]: Stop distance = max(structure, StopATRFloor x ATR). Is it <= StopATRCap x ATR? If not, log STOP_TOO_WIDE and skip
      - generic [ref=e1310]: Is spread / (RR x stop) <= MaxCostToReward and spread <= SpreadSpikeMultiple x median spread? If not, log SPREAD and skip
      - generic [ref=e1311]: Lot = equity x RiskPercent / (stop x value per lot), rounded to the broker step. Is 0.01 lot within MaxStopRiskPercent, no daily-loss or streak pause, margin available? If not, log RISK and skip
      - generic [ref=e1312]: Market order with SL and TP attached; log every field in section 13
    - paragraph [ref=e1313]: "HTF alignment, session, cooldown, overextension and the entry score are deliberately not in the flow: each was tested and none replicated. They can stay in the code as switchable inputs, off by default, so a future dataset can re-test them without a rebuild."
  - generic [ref=e1314]:
    - heading "6. Exit decision flow" [level=2] [ref=e1315]
    - generic [ref=e1316]:
      - generic [ref=e1317]: Position open with the initial SL and the 2R TP
      - generic [ref=e1318]: "Initial SL or TP hit: exit (SL first if both inside one bar)"
      - generic [ref=e1319]: "Opposite signal: do nothing (holding beat every close-or-reverse model)"
      - generic [ref=e1320]: "Open profit >= trail activation (+360 pts or +1.0R, both tested, both marginal): SL follows the purple line, never loosens"
      - generic [ref=e1321]: "Open profit >= +1R (optional, neutral): lock +0.25R"
      - generic [ref=e1322]: "Open profit >= +900 pts: lock +180 pts and trail 1:1 with a 720-pt gap (the profitable part of the shipped design; keep it)"
      - generic [ref=e1323]: Exit on the trailed stop or the TP; no time exit, no break-even
    - paragraph [ref=e1324]: "The exit design is the part that works: 1:1 trail exits and TPs are the only positive exit types in every period. The lab did not find a management change that beats the shipped one by more than noise; it found several that are worse."
  - generic [ref=e1325]:
    - heading "7. Risk-management model" [level=2] [ref=e1326]
