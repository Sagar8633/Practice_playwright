            - heading "Opening Range Breakout Strategy up 400% This Year (Strict Rules, Fully Automatable)" [level=1] [ref=e76]
            - generic [ref=e77]:
              - time [ref=e79]: March 5, 2026
              - generic [ref=e80]:
