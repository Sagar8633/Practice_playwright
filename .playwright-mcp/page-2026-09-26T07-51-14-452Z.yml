  - heading "2. What Nyao actually does" [level=2] [ref=e153]
  - paragraph [ref=e154]:
    - text: "Read from the 5,867-line source, not the README. A 0-10 score per direction from EMA 5/12 alignment and slope, RSI 8 zones, candle body times an impulse factor, an ATR 8 chop ratio, a 5-bar breakout and a wick penalty, smoothed over two closed candles and blended 60/40 with the forming one; evaluated once per bar at its first tick (so the forming candle is one tick long). Threshold 4.5. Stop 1% of equity in dollars at the position's lot ($10 at 0.01 lot on $1,000, $2 on $200). Exit: a $0.20 trailing stop that engages at +$0.75 and is floored at entry + spread + $0.50; break-even after about $0.50; a per-tick health score that closes below 0.4 and re-enters immediately; partial closes that never fire at 0.01 lot. Hedge chain on by default: at 1.5 ATR under water with an opposite score of 4.5 the stop is removed and an opposite, larger, stop-less leg is opened, rolled and reseeded up to 2 levels and 3 cycles, lot cap 0.10, chain-loss caps 0, excluded from the basket stop. Lots increase in drawdown. Full audit with dangerous-mechanism flags and the look-ahead check is in"
    - code [ref=e155]: results/nyao/CODE_AUDIT.md
    - text: .
  - heading "3. The trailing stop and the tick calibration" [level=2] [ref=e156]
  - paragraph [ref=e157]: A bar cannot say whether gold retraced 20 points before it reached the bar's high. The engine reports two bounds; then every non-chain trade inside your Dukascopy tick sample (2025, Thursdays and Fridays, server 14:00-19:59, 575 hours) was replayed tick by tick with the EA's own trailing and break-even rules.
