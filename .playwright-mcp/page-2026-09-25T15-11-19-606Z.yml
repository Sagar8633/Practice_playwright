    - paragraph [ref=e4077]: Nothing here reaches positive expectancy after costs in the selection periods, so there is no configuration to recommend for real money. The configuration listed above is the least bad one the rule produced, and it is shown so the numbers are on the record, not as an endorsement.
    - paragraph [ref=e4078]: If you want to keep working on this signal, the useful next step is not another filter. It is (1) the telemetry in section 13 on a demo account running the M3 preset with signal age 10, distance 2 ATR, hybrid stop 1.0/4.0 ATR and risk sizing at 0.5%, and (2) your answers to section 15, so the part of your manual trading that the bot does not do can be written down and tested the same way.
  - generic [ref=e4079]:
    - heading "12. Exact code changes required" [level=2] [ref=e4080]
    - paragraph [ref=e4081]: TWK_MomentumEA.mq5 and TWK_Core.mqh. Inputs first, then where each rule goes.
    - paragraph [ref=e4082]: "Changes are additive: new inputs default to the shipped behaviour. Each block names the function in TWK_MomentumEA.mq5 (v1.40) or TWK_Core.mqh where it goes."
    - generic [ref=e4083]: "// ---- TWK_Core.mqh: expose ATR(10) of the signal TF on the snapshot (it is already computed for the Supertrend) struct TwkSnapshot { ... double atr; int prevSigAgo; double prevSigClose; ... }; // fill in CTwkEngine::Evaluate from the series // ---- TWK_MomentumEA.mq5: inputs (all off = current behaviour) input group \"=== ENTRY QUALITY (filter lab) ===\" input int MinOppositeSignalBars = 0; // skip if the previous opposite signal is younger than this (lab: 10 on M3) input double MinSignalDistanceATR = 0.0; // skip if |close - previous signal close| < this x ATR (lab: 2.0) input double StopATRFloor = 0.0; // SL distance at least this x ATR (lab: 1.0) input double StopATRCap = 0.0; // skip if the SL distance exceeds this x ATR (lab: 4.0) input group \"=== COST GATE ===\" input double MaxCostToReward = 0.0; // skip if spread / (RewardRisk x stop) > this (lab: 0.10) input double MaxCostToStop = 0.0; // skip if spread / stop > this (lab: 0.20) input double SpreadSpikeMultiple = 2.0; // existing auto spread limit, keep input group \"=== RISK ===\" input double MaxStopRiskPercent = 2.0; // skip if the minimum lot risks more than this input double MaxDailyLossPercent = 3.0; // no new entries after this daily loss input int MaxConsecutiveLosses = 5; // no new entries for the rest of the day after this streak // switchable, off by default, kept for re-testing: CooldownMinutesAfterLoss, RequireHTFAlignment, SessionStartHour/EndHour, // TrailActivationR, LockAtR/LockKeepR, TimeExitMinutes/TimeExitBelowR, OppositeConfirmBars // ---- ValidateConditions(): after the ADX check, before the stop logic if(MinOppositeSignalBars > 0 && s.oppAgo >= 0 && s.oppAgo < MinOppositeSignalBars) { Reject(StringFormat(\"RAPID_FLIP: opposite signal %d bars ago\", s.oppAgo)); return false; } if(MinSignalDistanceATR > 0 && MathAbs(s.close - s.prevSigClose) < MinSignalDistanceATR * s.atr) { Reject(\"CHOP: too close to the previous signal\"); return false; } // ---- ValidateConditions(): stop distance (replaces the pivot-only choice when StopATRFloor > 0) double dist = s.slFromPivot ? MathAbs(s.close - s.sl) : MathAbs(s.close - s.purple); if(StopATRFloor > 0) dist = MathMax(dist, StopATRFloor * s.atr); if(StopATRCap > 0 && dist > StopATRCap * s.atr) { Reject(\"STOP_TOO_WIDE\"); return false; } sl = isBuy ? s.close - dist : s.close + dist; tp = isBuy ? s.close + RewardRisk * dist : s.close - RewardRisk * dist; // ---- CheckSpread(): cost gate next to the existing spread limit const double spreadPx = SymbolInfoDouble(_Symbol, SYMBOL_ASK) - SymbolInfoDouble(_Symbol, SYMBOL_BID); if(MaxCostToReward > 0 && spreadPx / (RewardRisk * dist) > MaxCostToReward) { why = \"SPREAD_TOO_HIGH vs reward\"; return false; } if(MaxCostToStop > 0 && spreadPx / dist > MaxCostToStop) { why = \"SPREAD_TOO_HIGH vs stop\"; return false; } // ---- CalculateLot(): risk mode becomes the default, with the skip rule lots = AccountInfoDouble(ACCOUNT_EQUITY) * RiskPercent / 100.0 / MathAbs(lossPerLot); // lossPerLot from OrderCalcProfit(1.0 lot, entry, sl) lots = NormalizeLot(lots); const double minLotLoss = MathAbs(lossPerLot) * SymbolInfoDouble(_Symbol, SYMBOL_VOLUME_MIN); if(lots <= 0 || minLotLoss > AccountInfoDouble(ACCOUNT_EQUITY) * MaxStopRiskPercent / 100.0) { why = \"RISK: min lot exceeds the cap\"; return 0; } // ---- ProcessSignal(): daily loss and streak pause (track g_dayStartEquity, g_dayPnL, g_consecLosses in OnTradeTransaction) if(g_dayPnL <= -g_dayStartEquity * MaxDailyLossPercent / 100.0) { Reject(\"RISK: daily loss limit\"); return; } if(g_consecLosses >= MaxConsecutiveLosses && g_pausedDay == TimeCurrent() / 86400) { Reject(\"RISK: losing streak, paused for today\"); return; }"
  - generic [ref=e4084]:
    - heading "13. Logging and telemetry" [level=2] [ref=e4085]
    - paragraph [ref=e4086]: What to log per signal and per trade so the next analysis needs no guesswork.
    - list [ref=e4087]:
      - listitem [ref=e4088]: "Per signal (whether traded or not): time, side, close, purple, ATR, ADX, volume rows, bars since the opposite signal, distance from the previous signal in ATR, M15 and H1 direction, hour, spread at the signal and at the order, the decision, and the reject tag from section 3.2 if rejected."
      - listitem [ref=e4089]: "Per order: requested price, fill price, slippage, execution latency, spread at fill, lot, equity before, stop distance in points and in ATR, planned reward."
      - listitem [ref=e4090]: "Per position, every SL modification: time, old SL, new SL, source (initial, purple, lock, 1:1, break-even), open profit in R at that moment."
      - listitem [ref=e4091]: "Per exit: exit price, reason, P&L, swap, commission, MFE and MAE in R, duration, spread at exit, whether an opposite signal occurred during the trade."
      - listitem [ref=e4092]: "Per day: starting equity, closed P&L, number of signals, number rejected per tag, max spread seen."
      - listitem [ref=e4093]: Write the CSV per symbol and magic number as today, but append a run id so tester runs never overwrite each other (the current CSV is replaced on every run).
  - generic [ref=e4094]:
    - heading "14. Missing data" [level=2] [ref=e4095]
    - paragraph [ref=e4096]: Things this study could not test honestly.
    - list [ref=e4097]:
      - listitem [ref=e4098]:
        - strong [ref=e4099]: Economic calendar.
        - text: No CPI/NFP/FOMC timestamps were available offline, so the news filter (section 16 of your brief) was not tested. It needs a calendar CSV with UTC timestamps; the lab can then tag trades within +/- N minutes of releases.
      - listitem [ref=e4100]:
        - strong [ref=e4101]: Tick-level spread and slippage.
        - text: XM's history serves bars only; the spread column exists on the last three months of M1 and on M15 back to 2022, so the per-year spread model is a median, not a per-trade value. Spread-spike and slippage filters need the telemetry above from a demo run.
      - listitem [ref=e4102]:
        - strong [ref=e4103]: 22 of 61 months of M1 data
        - text: (Dukascopy rate limit during the session). Every year is represented; the walk-forward windows are shorter than intended.
      - listitem [ref=e4104]:
        - strong [ref=e4105]: Your manual rules.
        - text: The strategy 'performs reasonably well when traded manually' is a claim without a trade log. Without your manual trade history (time, side, entry, exit) the discretionary edge cannot be measured or compared with the bot's trades on the same days.
      - listitem [ref=e4106]:
        - strong [ref=e4107]: Tick data for trailing.
        - text: Management is replayed on one-minute bars with a conservative path rule; tick-level trailing in the Strategy Tester exits earlier in volatile months. Every configuration here would be somewhat worse on ticks, not better.
  - generic [ref=e4108]:
    - heading "15. Manual trading versus the bot" [level=2] [ref=e4109]
    - paragraph [ref=e4110]: What you may be doing by eye that the bot does not. Each line is a testable rule once you answer it.
    - list [ref=e4111]:
      - listitem [ref=e4112]:
        - strong [ref=e4113]: Do you wait for the candle to close, or act mid-bar?
        - text: The bot acts on the closed bar. If you act earlier, your fills are better and your signals differ from the bot's.
      - listitem [ref=e4114]:
        - strong [ref=e4115]: Do you skip the first flip after a sharp reversal and wait for the second?
        - text: Signal age >= 10 bars is the mechanical version; it was the only replicating filter.
      - listitem [ref=e4116]:
        - strong [ref=e4117]: Do you skip flips that happen inside the same price zone as the last one?
        - text: Distance >= 2 ATR from the previous signal is that rule.
      - listitem [ref=e4118]:
        - strong [ref=e4119]: Do you refuse trades when the stop would be 'too far'?
        - text: The ATR cap (4 ATR) is that rule; you probably apply something like it by eye, and the bot never did.
      - listitem [ref=e4120]:
        - strong [ref=e4121]: Do you only trade certain hours?
        - text: The data says no hour is reliably good; if you trade only London/NY, your edge is not coming from the clock.
      - listitem [ref=e4122]:
        - strong [ref=e4123]: Do you check M15 or H1 before entering?
        - text: Say which way. Aligned trades won in 2025 to 2026 and lost in 2021 to 2024; if you switch between fading and following the higher timeframe by feel, that switch is the edge and needs a rule.
      - listitem [ref=e4124]:
        - strong [ref=e4125]: Do you avoid large candles or news minutes?
        - text: Overextension filters removed little; the news filter is untested (missing data).
      - listitem [ref=e4126]:
        - strong [ref=e4127]: Do you stop after a bad run?
        - text: On M3 the data says it does not matter; on M1 it does.
      - listitem [ref=e4128]:
        - strong [ref=e4129]: Do you take partial profits at +1R?
        - text: 13% of trades that reach +1R end as losers; a partial at +1R is a reasonable rule to test with your sizing.
      - listitem [ref=e4130]:
        - strong [ref=e4131]: Do you ever add to a winner, or hold through an opposite flip?
        - text: Holding through the flip beat every close model; adding was not tested.
      - listitem [ref=e4132]:
        - strong [ref=e4133]: Which trades do you not take that the bot takes?
        - text: Write down the last 20 signals you skipped and why. Those reasons are the filter list that matters.