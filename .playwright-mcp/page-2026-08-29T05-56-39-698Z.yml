          - paragraph [ref=f9e77]: "Java is statically typed: you declare what type every variable is, and the compiler stops you before the program runs. Python lets you find out at runtime; Java makes you say it up front. That is the whole mental shift. Everything else — classes, methods, loops — you already know, just with more ceremony. You are not learning to think differently. You are learning to write down what you were already thinking."
