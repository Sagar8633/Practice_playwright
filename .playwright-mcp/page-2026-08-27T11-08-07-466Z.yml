          - definition [ref=f12e1219]: status IN (SKIPPED, REJECTED); the tooltip splits pipeline skips from your rejections
        - generic [ref=f12e1220]:
          - term [ref=f12e1221]: Requiring verification
          - definition [ref=f12e1222]: status IN (AI_RESEARCHED, NEEDS_VERIFICATION)
