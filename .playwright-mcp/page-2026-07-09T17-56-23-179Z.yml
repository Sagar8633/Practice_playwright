            - generic [ref=f5e5411]:
              - generic [ref=f5e6265]: //@version=6
              - generic [ref=f5e6267]: strategy("SRK Pullback v2", overlay=true,
              - generic [ref=f5e6269]: initial_capital=100000,
              - generic [ref=f5e6271]: default_qty_type=strategy.percent_of_equity, default_qty_value=10,
              - generic [ref=f5e6273]: commission_type=strategy.commission.percent, commission_value=0.03,
              - generic [ref=f5e6275]: pyramiding=0, calc_on_every_tick=false)
              - generic [ref=f5e6278]: fastLen = input.int(5, "Red EMA", group="EMAs")
              - generic [ref=f5e6280]: midLen = input.int(10, "Green EMA", group="EMAs")
              - generic [ref=f5e6282]: slowLen = input.int(20, "Blue EMA", group="EMAs")
              - generic [ref=f5e6284]: adxLen = input.int(14, "ADX length", group="Filter")
              - generic [ref=f5e6286]: adxThr = input.float(25,"ADX threshold", group="Filter")
              - generic [ref=f5e6288]: atrLen = input.int(14, "ATR length", group="Risk")
              - generic [ref=f5e6290]: slAtr = input.float(1.5,"Stop = ATR x", group="Risk")
              - generic [ref=f5e6292]: tpAtr = input.float(1.0,"Target= ATR x", group="Risk")
              - generic [ref=f5e6295]: emaR = ta.ema(close, fastLen)
              - generic [ref=f5e6297]: emaG = ta.ema(close, midLen)
              - generic [ref=f5e7096]: emaB = ta.ema(close, slowLen)
              - generic [ref=f5e7098]:
                - text: plot(emaR, "R",
                - text: color.red)
              - generic [ref=f5e7101]:
                - text: plot(emaG, "G",
                - text: color.green)
              - generic [ref=f5e7104]:
                - text: plot(emaB, "B",
                - text: color.blue)
              - generic [ref=f5e7107]: "[dp, dm, adx] = ta.dmi(adxLen, adxLen)"
              - generic [ref=f5e6313]: atr = ta.atr(atrLen)
              - generic [ref=f5e6316]: upTrend = emaR > emaG and emaG > emaB and adx > adxThr
              - generic [ref=f5e6318]: downTrend = emaB > emaG and emaG > emaR and adx > adxThr
              - generic [ref=f5e6321]: longSig = upTrend and ta.crossover(close, emaG)
              - generic [ref=f5e6323]: shortSig = downTrend and ta.crossunder(close, emaG)
              - generic [ref=f5e6326]: var float sl = na
              - generic [ref=f5e6328]: var float tp = na
              - generic [ref=f5e6331]: if longSig and strategy.position_size == 0
              - generic [ref=f5e6333]: sl := close - slAtr * atr
              - generic [ref=f5e6335]: tp := close + tpAtr * atr
              - generic [ref=f5e6337]: strategy.entry("L", strategy.long)
              - generic [ref=f5e6340]: if shortSig and strategy.position_size == 0
              - generic [ref=f5e6342]: sl := close + slAtr * atr
              - generic [ref=f5e6344]: tp := close - tpAtr * atr
              - generic [ref=f5e6346]: strategy.entry("S", strategy.short)
              - generic [ref=f5e6349]: if strategy.position_size > 0
              - generic [ref=f5e6351]: strategy.exit("L-x", from_entry="L", stop=sl, limit=tp)
              - generic [ref=f5e6353]: if strategy.position_size < 0
              - generic [ref=f5e6355]: strategy.exit("S-x", from_entry="S", stop=sl, limit=tp)
              - generic [ref=f5e7109]:
                - text: plotshape(longSig and strategy.position_size==0, "L", shape.triangleup, location.belowbar,
                - text: color.new(color.green,0), size=size.small)
              - generic [ref=f5e7112]:
                - text: plotshape(shortSig and strategy.position_size==0, "S", shape.triangledown, location.abovebar,
                - text: color.new(color.red,0), size=size.small)
