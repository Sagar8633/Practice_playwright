            - heading "Contract testing and service mocking" [level=3] [ref=f9e834]
            - generic [ref=f9e835]: Gap
          - generic [ref=f9e836]:
            - generic [ref=f9e837]: Named in microservice roles
            - generic [ref=f9e838]: ~8 hrs
            - generic [ref=f9e839]: Separates senior from mid-level answers
          - paragraph [ref=f9e840]: "In a microservice system, end-to-end tests are slow and flaky because they need every service running. Contract testing solves this: the consumer records what it expects from the provider, and the provider verifies it can still deliver that — each side testing alone, fast. Service mocking (WireMock) is the other half: stand in for a service you cannot control so you can test failure paths that never happen on demand."
          - generic [ref=f9e841]:
            - generic [ref=f9e842]:
              - heading "Learn these" [level=4] [ref=f9e843]
              - list [ref=f9e844]:
                - listitem [ref=f9e845]: Why E2E fails at scale — the n-services problem
                - listitem [ref=f9e846]: The Pact flow — consumer test → pact file → broker → provider verification → can-i-deploy
                - listitem [ref=f9e847]: Consumer-driven — why the consumer defines the contract
                - listitem [ref=f9e848]: WireMock — stubs, request matching, stateful scenarios
                - listitem [ref=f9e849]: Fault injection — delays, 500s, connection resets
                - listitem [ref=f9e850]: When NOT to use it — contract testing does not test behaviour, only shape
