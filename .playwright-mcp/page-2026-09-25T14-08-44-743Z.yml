    - paragraph [ref=e407]: Gold's median price went from $1,787 in 2021 to $4,526 in 2026 and the median one-minute ATR(10) from 35 points to 220 points. Every distance in the bots is a fixed number of points, so the same setting meant a different trade each year. The 500-point hard stop was 14 ATR in 2021 (almost never hit, target too far to reach) and 2.3 ATR in 2026 (hit constantly). The purple-trail activation at 200 points was 6 ATR in 2021 and under one ATR in 2026, so in 2026 nearly every trade trails immediately and gets stopped on the first pullback. The 1:1 trail's 400-point gap is now narrower than an average one-minute bar.
    - paragraph [ref=e408]: "The pivot stop scales the other way: the Momentum bot's 90th-percentile initial risk on M15 grew from about $10 in 2021 to $58 in 2026 at 0.02 lot, and its worst single trade in 2026 lost $200, which is the whole account you tested with."
