    - paragraph [ref=e3191]: "The GOOD_SIGNAL search was restricted, in advance, to feature buckets whose net 1x1 expectancy is positive in DEV and in VAL with adequate sample sizes. Only the outcome-class labels pass, which is the check that the procedure detects real structure: it does, and there is none in anything observable at entry. Their conjunction is empty. The seven definitions stated in advance from phase 1 and the manual-trading hypotheses are negative in every period and in every one of the six years."
