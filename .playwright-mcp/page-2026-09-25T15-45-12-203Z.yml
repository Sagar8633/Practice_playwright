    - paragraph [ref=e2807]: "With the entry fixed, every stop/target pair in the grid is negative net, from -0.15R (2 ATR stop, 2 ATR target) to -0.80R (0.25 ATR stop). Wider stops lose less per R only because the spread is a smaller share of a bigger R; in dollars they lose about the same. The gross grid is flat within 0.06R of zero, with the lottery shape (0.25 ATR stop, 2 ATR target) at +0.055R gross and -0.74R net. The phase-1 conclusion stands: the exit is not where the money is lost, and it cannot be where it is found."
