- generic [active] [ref=f2e1]: "//@version=6 // ============================================================================= // SRK SMA18 Bot v11 - SIGNAL ENGINE (indicator) // Same rule set as srk_sma18_v11_strategy.pine / SimpleSMA18Bot_v11.mq5, // packaged as an indicator so it can drive TradingView alerts and webhooks. // // NON-REPAINTING BY CONSTRUCTION: every state transition is gated on // barstate.isconfirmed, so nothing changes once a bar has closed. On the // live bar the panel shows the state as of the last CLOSED bar. // // State machine (mirrors the EA exactly): // FLAT -> armed stop order (cancelled when close crosses back through MA18) // -> filled when price trades through the stop level // -> managed by SL / break-even / protection / follow-through // -> exit on stop hit, MA18 close-back, or follow-through failure // One order or one position at a time - never both, never two. // ============================================================================= indicator(\"SRK SMA18 Bot v11 - Signal Engine\", \"SMA18 v11 Signals\", overlay = true, max_labels_count = 500, max_lines_count = 500) // ================================ INPUTS ===================================== var string G0 = \"0 - Chart & sizing\" eaTF = input.timeframe(\"15\", \"TimeFrame (EA input)\", group = G0, tooltip = \"Warning only - the script always uses real chart bars so it cannot repaint.\") ptIn = input.float(0.01, \"_Point size (0 = chart mintick)\", minval = 0, step = 0.001, group = G0, tooltip = \"MT5 _Point for 2-digit XAUUSD is 0.01. Every Points input below is multiplied by this.\") lookbackDays = input.int(60, \"Stats window (days back from now, 0 = all data)\", minval = 0, group = G0, tooltip = \"Restricts the simulated trades in the status panel to the last N days. 60 = last 2 months. Live signalling is unaffected.\") var string G1 = \"1 - Signal\" fastLen = input.int(18, \"FastMAPeriod\", minval = 1, group = G1) trendLen = input.int(200, \"TrendMAPeriod\", minval = 1, group = G1) volLen = input.int(20, \"VolumeMAPeriod\",minval = 1, group = G1) useVol = input.bool(true, \"Volume filter enabled\", group = G1, tooltip = \"MT5 tick volume and TradingView volume come from different feeds. Turn this off on both sides when comparing results.\") swingStr = input.int(2, \"SwingStrength\", minval = 1, maxval = 20, group = G1) bufPts = input.int(11, \"EntryBufferPoints\", minval = 0, group = G1) var string G2 = \"2 - Break-even\" enableBE = input.bool(false, \"EnableBreakEven\", group = G2) bePts = input.int(500, \"BreakEvenTriggerPoints\", minval = 0, group = G2) beOff = input.int(10, \"BreakEvenOffsetPoints\", minval = 0, group = G2) var string G3 = \"3 - Follow-through & max loss\" F_OFF = \"Off - no follow-through exit\" F_NEXT = \"1st candle after entry must break the entry candle high/low\" F_STALL = \"Close on first candle that fails to make a new high/low\" F_TRIG = \"Next candle must exceed the breakout trigger (entry) level\" followMode = input.string(F_OFF, \"FollowMode\", options = [F_OFF, F_NEXT, F_STALL, F_TRIG], group = G3) M_OFF = \"Off - SL = swing only\" M_CAP = \"SL = tighter of swing vs entry +/- MaxLossPoints\" M_REPL = \"SL = entry +/- MaxLossPoints (ignore swing)\" M_RULE = \"Cap loss at MaxLossPoints only during follow-through window\" maxLossMode = input.string(M_OFF, \"MaxLossMode\", options = [M_OFF, M_CAP, M_REPL, M_RULE], group = G3) maxLossPts = input.int(2000, \"MaxLossPoints\", minval = 0, group = G3) fixWindowBug = input.bool(false, \"Close max-loss window even when FollowMode = Off\", group = G3, tooltip = \"Unchecked reproduces the EA: with FollowMode=Off the window never closes, so the cap acts as a hard stop for the whole trade.\") var string G4 = \"4 - Profit protection\" P_NONE = \"PROTECTION_NONE\" P_SWNG = \"PROTECTION_SWING\" P_CHAN = \"PROTECTION_CHANDELIER\" P_TRAL = \"PROTECTION_TRAILING\" protMode = input.string(P_TRAL, \"ProtectionMode\", options = [P_NONE, P_SWNG, P_CHAN, P_TRAL], group = G4) S_IMM = \"START_IMMEDIATELY\" S_PTS = \"START_AFTER_POINTS\" protStartMode = input.string(S_IMM, \"ProtectionStartMode\", options = [S_IMM, S_PTS], group = G4) protStartPts = input.int(2000, \"ProtectionStartPoints\", minval = 0, group = G4) swingBufPts = input.int(200, \"SwingBufferPoints\", minval = 0, group = G4) chLb = input.int(22, \"ChandelierLookback\", minval = 1, group = G4) atrLen = input.int(22, \"ATRPeriod\", minval = 1, group = G4) atrMult = input.float(3.0,\"ATRMultiplier\", minval = 0, step = 0.1, group = G4) trailStartPts = input.int(500, \"TrailingStartPoints\", minval = 0, group = G4) trailDistPts = input.int(200, \"TrailingDistancePoints\",minval = 1, group = G4) trailStepPts = input.int(100, \"TrailingStepPoints\", minval = 0, group = G4) var string G6 = \"6 - Display\" showMAs = input.bool(true, \"Show moving averages\", group = G6) showLevels = input.bool(true, \"Show entry / stop levels\", group = G6) showLabels = input.bool(true, \"Show entry / exit labels\", group = G6) showPanel = input.bool(true, \"Show status panel\", group = G6) pt = ptIn > 0 ? ptIn : syminfo.mintick // ============================== INDICATORS =================================== ma18 = ta.sma(close, fastLen) ma200 = ta.sma(close, trendLen) avgVol = ta.sma(volume, volLen) atrV = ta.atr(atrLen) plot(showMAs ? ma18 : na, \"MA Fast\", color = color.new(#26C6DA, 0), linewidth = 2) plot(showMAs ? ma200 : na, \"MA Trend\", color = color.new(#FFA726, 0), linewidth = 2) // ============================ SWING DETECTION ================================ isSwingLow(int sw) => float c = low[sw] bool ok = not na(c) if ok for i = 1 to sw if na(low[sw + i]) or low[sw + i] <= c or low[sw - i] <= c ok := false break ok isSwingHigh(int sw) => float c = high[sw] bool ok = not na(c) if ok for i = 1 to sw if na(high[sw + i]) or high[sw + i] >= c or high[sw - i] >= c ok := false break ok var float swLowVal = na var int swLowBar = na var float swHighVal = na var int swHighBar = na if isSwingLow(swingStr) swLowVal := low[swingStr] swLowBar := bar_index - swingStr if isSwingHigh(swingStr) swHighVal := high[swingStr] swHighBar := bar_index - swingStr swingLow = (not na(swLowBar) and bar_index - swLowBar <= 99) ? swLowVal : low swingHigh = (not na(swHighBar) and bar_index - swHighBar <= 99) ? swHighVal : high // ============================== ENTRY SIGNALS ================================ volOK = not useVol or volume > avgVol buySig = close > ma200 and close > ma18 and close[1] > ma18[1] and volOK sellSig = close < ma200 and close < ma18 and close[1] < ma18[1] and volOK // =============================== STATE MACHINE =============================== int FLAT = 0 int PEND_L = 1 int PEND_S = 2 int LONG = 3 int SHORT = 4 var int st = FLAT var float entryLvl = na // stop-order price while pending / fill price when live var float slLvl = na // the stop that is live on the order right now var int entryBar = na var bool windowOpen = false var float runProfit = 0.0 var int nTrades = 0 var int nWins = 0 var float cumPts = 0.0 ready = bar_index > math.max(trendLen, 100) + swingStr + 2 conf = barstate.isconfirmed inWindow = lookbackDays == 0 or time >= timenow - lookbackDays * 86400000 // event flags for this bar bool evArm = false bool evCancel = false bool evFill = false bool evExit = false string exitWhy = \"\" float exitPx = na if conf and ready isL = st == LONG // ---------------------------------------------------------------- 1. FILL if st == PEND_L and high >= entryLvl st := LONG // slLvl already carries the SL sent with the order entryBar := bar_index windowOpen := true runProfit := 0.0 evFill := true isL := true else if st == PEND_S and low <= entryLvl st := SHORT entryBar := bar_index windowOpen := true runProfit := 0.0 evFill := true isL := false else if st == PEND_L and close < ma18 // PendingBuyInvalidated() st := FLAT evCancel := true entryLvl := na slLvl := na else if st == PEND_S and close > ma18 // PendingSellInvalidated() st := FLAT evCancel := true entryLvl := na slLvl := na // --------------------------------------------------- 2. LIVE POSITION MGMT if st == LONG or st == SHORT isL := st == LONG // favourable excursion so far (stop entries fill before the bar extreme) runProfit := math.max(runProfit, isL ? (high - entryLvl) / pt : (entryLvl - low) / pt) // effective stop for THIS bar = order SL, tightened by the max-loss cap float effSL = slLvl if maxLossMode == M_RULE and windowOpen and maxLossPts > 0 cap = isL ? entryLvl - maxLossPts * pt : entryLvl + maxLossPts * pt effSL := isL ? math.max(nz(effSL, cap), cap) : math.min(nz(effSL, cap), cap) // ---- 2a. stop hit intrabar -> flat, at the stop price ---- if not na(effSL) and (isL ? low <= effSL : high >= effSL) exitPx := effSL exitWhy := \"StopLoss/Protection\" evExit := true else age = bar_index - entryBar // ---- 2b. follow-through (EA runs this before position mgmt) ---- if followMode != F_OFF and age >= 1 if followMode == F_STALL made = isL ? high > high[1] : low < low[1] if not made exitPx := close exitWhy := \"No follow-through\" evExit := true windowOpen := false else if age == 1 and windowOpen ref = followMode == F_TRIG ? entryLvl : (isL ? high[1] : low[1]) followed = isL ? high > ref : low < ref if not followed exitPx := close exitWhy := \"No follow-through\" evExit := true windowOpen := false else if followMode == F_OFF and fixWindowBug and age >= 1 windowOpen := false // ---- 2c. MA18 close-back exit ---- if not evExit and (isL ? close <= ma18 : close >= ma18) exitPx := close exitWhy := \"MA18 exit\" evExit := true // ---- 2d. break-even + protection ratchet (ModifyStopLoss) ---- if not evExit if enableBE and runProfit >= bePts beLvl = isL ? entryLvl + beOff * pt : entryLvl - beOff * pt slLvl := isL ? math.max(nz(slLvl, beLvl), beLvl) : math.min(nz(slLvl, beLvl), beLvl) protActive = protStartMode == S_IMM or runProfit >= protStartPts if protActive if protMode == P_SWNG ns = isL ? swingLow - swingBufPts * pt : swingHigh + swingBufPts * pt slLvl := isL ? math.max(nz(slLvl, ns), ns) : math.min(nz(slLvl, ns), ns) else if protMode == P_CHAN and atrV > 0 ns = isL ? ta.highest(high, chLb) - atrV * atrMult : ta.lowest(low, chLb) + atrV * atrMult slLvl := isL ? math.max(nz(slLvl, ns), ns) : math.min(nz(slLvl, ns), ns) else if protMode == P_TRAL and runProfit >= trailStartPts ns = isL ? close - trailDistPts * pt : close + trailDistPts * pt improved = na(slLvl) or (isL ? ns - slLvl >= trailStepPts * pt : slLvl - ns >= trailStepPts * pt) if improved slLvl := isL ? math.max(nz(slLvl, ns), ns) : math.min(nz(slLvl, ns), ns) if evExit pts = (isL ? exitPx - entryLvl : entryLvl - exitPx) / pt nTrades += 1 nWins += pts > 0 ? 1 : 0 cumPts += pts st := FLAT entryLvl := na slLvl := na entryBar := na windowOpen := false runProfit := 0.0 // ------------------------------------------------------- 3. ARM NEW ORDER if st == FLAT and not evFill and inWindow if buySig e = high + bufPts * pt entryLvl := e slLvl := maxLossMode == M_REPL ? e - maxLossPts * pt : maxLossMode == M_CAP ? math.max(swingLow, e - maxLossPts * pt) : swingLow st := PEND_L evArm := true else if sellSig e = low - bufPts * pt entryLvl := e slLvl := maxLossMode == M_REPL ? e + maxLossPts * pt : maxLossMode == M_CAP ? math.min(swingHigh, e + maxLossPts * pt) : swingHigh st := PEND_S evArm := true // ================================ PLOTS ====================================== pending = st == PEND_L or st == PEND_S live = st == LONG or st == SHORT plot(showLevels and pending ? entryLvl : na, \"Stop-entry level\", color = color.new(#B39DDB, 0), style = plot.style_linebr, linewidth = 1) plot(showLevels and pending ? slLvl : na, \"Pending SL\", color = color.new(#EF9A9A, 40), style = plot.style_linebr, linewidth = 1) plot(showLevels and live ? entryLvl : na, \"Entry price\", color = color.new(#90CAF9, 0), style = plot.style_linebr, linewidth = 1) plot(showLevels and live ? slLvl : na, \"Active SL\", color = color.new(#EF5350, 0), style = plot.style_linebr, linewidth = 2) plotshape(evArm and st == PEND_L, \"Long armed\", shape.triangleup, location.belowbar, color.new(#26A69A, 0), size = size.tiny) plotshape(evArm and st == PEND_S, \"Short armed\", shape.triangledown, location.abovebar, color.new(#EF5350, 0), size = size.tiny) plotshape(evFill, \"Filled\", shape.circle, location.belowbar, color.new(#FFEB3B, 0), size = size.tiny) plotshape(evExit, \"Exit\", shape.xcross, location.abovebar, color.new(#B0BEC5, 0), size = size.tiny) if showLabels and evFill label.new(bar_index, entryLvl, (st == LONG ? \"LONG \" : \"SHORT \") + str.tostring(entryLvl, format.mintick) + \"\\nSL \" + str.tostring(slLvl, format.mintick), style = st == LONG ? label.style_label_up : label.style_label_down, color = color.new(st == LONG ? #26A69A : #EF5350, 20), textcolor = color.white, size = size.small) if showLabels and evExit label.new(bar_index, exitPx, \"EXIT \" + str.tostring(exitPx, format.mintick) + \"\\n\" + exitWhy, style = label.style_label_left, color = color.new(#546E7A, 20), textcolor = color.white, size = size.small) // ============================== STATUS PANEL ================================= var table p = table.new(position.top_right, 2, 8, border_width = 1) if showPanel and barstate.islast stName = st == FLAT ? \"FLAT\" : st == PEND_L ? \"BUY STOP ARMED\" : st == PEND_S ? \"SELL STOP ARMED\" : st == LONG ? \"LONG\" : \"SHORT\" stCol = st == FLAT ? #546E7A : st == PEND_L or st == LONG ? #2E7D32 : #C62828 risk = live and not na(slLvl) ? math.abs(entryLvl - slLvl) / pt : na openP = live ? (st == LONG ? close - entryLvl : entryLvl - close) / pt : na wr = nTrades > 0 ? 100.0 * nWins / nTrades : 0.0 table.cell(p, 0, 0, \"SMA18 v11\", bgcolor = #263238, text_color = color.white, text_size = size.small) table.cell(p, 1, 0, stName, bgcolor = stCol, text_color = color.white, text_size = size.small) lbl = array.from(\"chart TF\", \"entry level\", \"stop loss\", \"risk (pts)\", \"open (pts)\", \"closed trades\", \"win % / net pts\") val = array.from(timeframe.period + (timeframe.period == eaTF ? \"\" : \" MISMATCH\"), na(entryLvl) ? \"-\" : str.tostring(entryLvl, format.mintick), na(slLvl) ? \"-\" : str.tostring(slLvl, format.mintick), na(risk) ? \"-\" : str.tostring(risk, \"#\"), na(openP) ? \"-\" : str.tostring(openP, \"#\"), str.tostring(nTrades), str.tostring(wr, \"#.#\") + \"% / \" + str.tostring(cumPts, \"#\")) for i = 0 to 6 table.cell(p, 0, i + 1, array.get(lbl, i), bgcolor = #37474F, text_color = #B0BEC5, text_size = size.small) table.cell(p, 1, i + 1, array.get(val, i), bgcolor = #455A64, text_color = color.white, text_size = size.small) // ================================ ALERTS ===================================== // Fixed-condition alerts (Create Alert -> Condition: this indicator). alertcondition(evArm and st == PEND_L, \"Buy stop armed\", \"SMA18 v11: BUY STOP armed\") alertcondition(evArm and st == PEND_S, \"Sell stop armed\", \"SMA18 v11: SELL STOP armed\") alertcondition(evFill, \"Entry filled\", \"SMA18 v11: entry FILLED\") alertcondition(evExit, \"Exit\", \"SMA18 v11: position EXIT\") // Dynamic alert (Create Alert -> Condition: \"Any alert() function call\"). // Carries live prices, so it works as a webhook payload. if evArm alert(\"SMA18 v11 | \" + syminfo.ticker + \" \" + timeframe.period + \" | ARM \" + (st == PEND_L ? \"BUY STOP\" : \"SELL STOP\") + \" @ \" + str.tostring(entryLvl, format.mintick) + \" | SL \" + str.tostring(slLvl, format.mintick), alert.freq_once_per_bar_close) if evFill alert(\"SMA18 v11 | \" + syminfo.ticker + \" \" + timeframe.period + \" | FILLED \" + (st == LONG ? \"LONG\" : \"SHORT\") + \" @ \" + str.tostring(entryLvl, format.mintick) + \" | SL \" + str.tostring(slLvl, format.mintick), alert.freq_once_per_bar_close) if evExit alert(\"SMA18 v11 | \" + syminfo.ticker + \" \" + timeframe.period + \" | EXIT @ \" + str.tostring(exitPx, format.mintick) + \" | \" + exitWhy, alert.freq_once_per_bar_close) if evCancel alert(\"SMA18 v11 | \" + syminfo.ticker + \" \" + timeframe.period + \" | pending order CANCELLED (close crossed back through MA\" + str.tostring(fastLen) + \")\", alert.freq_once_per_bar_close)"