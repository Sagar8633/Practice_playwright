            - paragraph [ref=f9e1791]:
              - text: "How to rehearse: write each in the STAR shape above, then record yourself on your phone and play it back. Two minutes maximum. Most people discover three faults on the first listen — they spend 60 seconds on the situation, they never say what"
              - emphasis [ref=f9e1792]: they
              - text: personally decided, and they stop at the outcome without naming what changed afterwards. Fix those three and you are ahead of most candidates for a lead role.
          - generic [ref=f9e1793]:
            - generic [ref=f9e1794]: Prove it
            - paragraph [ref=f9e1795]: Twelve written stories, twelve recordings, each under two minutes. Do two per day for six days rather than all twelve in one sitting — recall degrades badly when you batch them. Keep two questions from this category in your daily drill for the whole sixty days.
