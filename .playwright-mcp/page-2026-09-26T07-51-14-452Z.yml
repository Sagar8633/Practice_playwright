  - generic [ref=e19]:
    - strong [ref=e20]: Verdict.
    - text: "Nothing in this collection improves your strategy. The Nyao entry is a coin flip before spread (win 35% against a 40% break-even at 1.5R), its exit design cuts winners at about $1 after three minutes and holds losers to a $5-10 close, its hedge chain has no loss cap by design, and its score used as a gate makes BASELINE worse. The one transferable finding is a method: any stop or trail smaller than the instrument's minute range has to be tested on ticks, and the tick sample you already have is enough to do it."
