          - paragraph [ref=f9e149]: "TypeScript is JavaScript with type labels added. You write normal JavaScript, annotate what each thing is, and a compiler catches mistakes before the test ever runs. That is genuinely all it is. For a test author the win is concrete: page-object methods autocomplete, and renaming a locator breaks the build instead of failing at 2am in CI. And because Playwright's own documentation is written in TypeScript, learning it makes every official example directly usable."
