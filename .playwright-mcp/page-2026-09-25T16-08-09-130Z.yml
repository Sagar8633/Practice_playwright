    - paragraph [ref=e1224]: "The accounting separates three effects. Blocking: baseline trades the protected run did not take, valued at what they actually did. New trades: signals the protected run took because a blocked trade had freed the slot. Management: the difference on trades both runs took. For the recommended stack the improvement is $2,179, of which $2,174 is blocking, $97 management, and -$92 the new trades let in."
    - paragraph [ref=e1225]: "Blocked trades are 61% losers by count and lose more per trade than the blocked winners make, so blocking a random sample of this signal is profitable. The gates differ a lot in precision. The 2-bar confirmation blocks 116 trades of which 106 would have lost (+$854 net benefit): a flip that reverses within two bars is the one thing this signal does reliably predict. The 2 ATR distance blocks 1,325 (56% losers, +$596), the large-candle lock 271 (56%, +$300), the spread gates 542 (73%, +$424). The daily-loss limit and the stop-for-the-day rule block 299 trades that are exactly 50/50 (-$240 together): they are damage limiters, not trade selectors, and their value is the survival shown in section 7, not the P&L here."
