    - paragraph [ref=e1485]: This is the separate test you asked for. Previous-day POC, value-area high and low are built from real one-minute volume; the order-flow gate is the aggressor delta of the last 20 minutes (up-bar volume minus down-bar volume over total), which is the only order-flow signal that exists in five years of history. XM's terminal keeps no depth-of-market history for GOLD, so nobody can backtest a real order-book rule on this symbol, and any vendor claiming to has invented the book.
    - paragraph [ref=e1486]: "The rotation playbook (fade a touch of the value-area edge back to the POC, only on days that open inside value) with the order-flow gate is the one thing in this report that is positive over the last six months on all three timeframes: M1 +$184 on 105 trades, M5 +$318 on 88 trades, M15 +$48 on 67 trades. Over five years it is -$1,011 on M1, -$337 on M5 and -$61 on M15 (profit factor 0.98). The gate helps: without it the same playbook is worse on every timeframe over five years. The acceptance playbook (trade the break of the value-area edge) loses everywhere except one small positive on M15 that is within noise."
    - paragraph [ref=e1487]: "Read this as: close to zero with costs, better than the TWK bots by a wide margin, and 100 trades of recent profit prove nothing yet. It is worth a demo forward test on M5 or M15; it is not worth real money."
  - generic [ref=e1488]:
    - heading "Method, validation and limits" [level=2] [ref=e1489]
    - paragraph [ref=e1490]: What the numbers can and cannot tell you.
    - list [ref=e1491]:
      - listitem [ref=e1492]:
        - strong [ref=e1493]: Data.
        - text: "Dukascopy XAUUSD one-minute bid candles, UTC shifted to XM server time (EET), prices rounded to XM's 0.01 point. XM's own bars were exported too (M1 back to June 2026, M15 back to July 2022) and used for the spread model: 32 points in 2021 to 2023, 36 in 2024, 38 in 2025, 51 in 2026, which are XM's medians. Swap is XM's: long -86.84 and short +19.79 points per night, triple on Wednesday."
      - listitem [ref=e1494]:
        - strong [ref=e1495]: Engine.
        - text: "An exact port of TWK_Core.mqh (Supertrend, 5-bar pivots, up/down volume rows, ADX) drives both bots with their shipped preset values: Momentum ratio 1.2, hard SL 500 points on M1, re-flip within 15 minutes, trail 200/500/100, one position per symbol; Pine reverse on flip, purple trail from the first profitable tick, lock +900 at +1000. Management runs on one-minute bars. Inside a bar a stop is checked before a target, and a trailed stop is tested against the bar's extreme when the bar closes against the trade."
      - listitem [ref=e1496]:
        - strong [ref=e1497]: Validation.
        - text: "Against your 25 September Strategy Tester run (M3, ratio 1.5, reverse on opposite): Jan to Feb 2026 tester 118 trades +$61 versus this engine 120 trades +$67 on a different feed, with 77 of the first 120 entry times matching within 3 minutes. In March 2026, when 37% of one-minute bars were wider than the 400-point trail gap, the tester's tick-level trailing exited earlier than any bar replay can, so the Momentum bot is reported under both trailing assumptions and the truth lies between them. Both are negative."
      - listitem [ref=e1498]:
        - strong [ref=e1499]: Limits.
        - text: Dukascopy volume is traded volume, XM's is tick count, so filter decisions differ trade by trade (the ratio-based filters are robust to this, the trade lists are not). 22 months are still missing from the five-year set. No slippage beyond the spread. The M3 preset was not replayed here because your own tester run already covers it (269 trades, -$193, ruin by May). For a final confirmation on XM's real ticks, run the Strategy Tester on M5 and M15 from 2024-01-02 with a $1,000 deposit and 0.01 lot; the sign will not change.