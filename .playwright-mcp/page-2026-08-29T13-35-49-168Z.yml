- generic [active] [ref=f1e1]: "//@version=6 // ============================================================================= // SRK SMA18 Bot v11 - line-for-line Pine port of SimpleSMA18Bot_v11.mq5 // Source EA : MQL5/Experts/Advisors/SimpleSMA18Bot_v11.mq5 (EA version 1.20) // // MT5 GROUND TRUTH (XAUUSD, M15, 0.01 lot, 2024-01-02 -> 2026-07-10): // trades 3597 | net +851.51 | PF 1.075 | win 64.05% | closed-trade DD 344.96 // exits: 2458 StopLoss/Protection, 1139 EA(MA18/MaxLoss/Partial) // The table (top-right) prints TradingView numbers next to these so the port // can be verified on the chart. // // BAR MAPPING USED THROUGHOUT: MT5 bar[N] == Pine [N-1] // The EA acts on the first tick of a new bar, so its \"bar 1\" (last closed bar) // is the bar Pine has just closed. Every rule below is written to that mapping, // which is also why process_orders_on_close stays false: an EA order sent on // the first tick of a new bar fills at that bar open == Pine next-bar-open. // // KNOWN DIVERGENCES FROM MT5 (read before comparing numbers): // 1. VOLUME. The EA uses MT5 tick volume. TradingView volume on XAUUSD comes // from a different feed, so the \"volume > 20-SMA\" filter selects DIFFERENT // bars. This is a data difference, not a porting bug. Set \"Volume filter\" // off on both sides for a like-for-like comparison. // 2. Break-even / partial / protection-start triggers are evaluated on the bar // EXTREME (high/low), so they arm on the same bar MT5 arms them, but the // resulting stop only becomes active on the next bar. // 3. Spread / commission / slippage are 0 here. Set them in Properties to // match the MT5 test. // ============================================================================= strategy( title = \"SRK SMA18 Bot v11 (MT5 port)\", shorttitle = \"SMA18 v11\", overlay = true, initial_capital = 10000, default_qty_type = strategy.fixed, default_qty_value = 1, pyramiding = 0, calc_on_every_tick = false, process_orders_on_close = false, currency = currency.USD, max_labels_count = 500, max_lines_count = 500) // ============================== INPUTS ======================================= // Group and label names mirror the MT5 Inputs tab 1:1 so values copy straight over. var string G0 = \"0 - Chart & sizing\" eaTF = input.timeframe(\"15\", \"TimeFrame (EA input)\", group = G0, tooltip = \"The EA TimeFrame input. This does NOT resample the chart - it only warns when the chart timeframe differs, so the port always runs on true chart bars (no repainting).\") lotSize = input.float(0.01, \"LotSize (MT5 lots)\", minval = 0.01, step = 0.01, group = G0) unitsLot = input.float(100, \"Units per 1.00 lot\", minval = 1, group = G0, tooltip = \"XAUUSD = 100 oz per lot, so 0.01 lot = 1 unit = 1 TradingView contract. Set this to the contract size of the symbol to make P&L match MT5 currency-for-currency.\") lotStep = input.float(0.01, \"Broker volume step\", minval = 0.001, step = 0.01, group = G0) lotMin = input.float(0.01, \"Broker min volume\", minval = 0.001, step = 0.01, group = G0) ptIn = input.float(0.01, \"_Point size (0 = chart mintick)\", minval = 0, step = 0.001, group = G0, tooltip = \"MT5 _Point for 2-digit XAUUSD is 0.01. EVERY Points input below is multiplied by this.\") lookbackDays = input.int(60, \"Backtest window (days back from now, 0 = all data)\", minval = 0, group = G0, tooltip = \"Restricts trading to the last N days. Done inside the script so it works on any TradingView plan - the Strategy Tester date range needs a paid Deep Backtesting subscription. 60 = last 2 months. The window rolls forward automatically.\") var string G1 = \"1 - Signal\" fastLen = input.int(18, \"FastMAPeriod\", minval = 1, group = G1) trendLen = input.int(200, \"TrendMAPeriod\", minval = 1, group = G1) volLen = input.int(20, \"VolumeMAPeriod\", minval = 1, group = G1) useVol = input.bool(true, \"Volume filter enabled\", group = G1, tooltip = \"OFF = ignore the volume>average rule. Turn it OFF on both MT5 and TradingView for a like-for-like comparison, because tick volume differs between feeds.\") swingStr = input.int(2, \"SwingStrength\", minval = 1, maxval = 20, group = G1) bufPts = input.int(11, \"EntryBufferPoints\", minval = 0, group = G1) var string G2 = \"2 - Break-even\" enableBE = input.bool(false, \"EnableBreakEven\", group = G2) bePts = input.int(500, \"BreakEvenTriggerPoints\", minval = 0, group = G2) beOff = input.int(10, \"BreakEvenOffsetPoints\", minval = 0, group = G2) var string G3 = \"3 - Follow-through & max loss\" F_OFF = \"Off - no follow-through exit\" F_NEXT = \"1st candle after entry must break the entry candle high/low\" F_STALL = \"Close on first candle that fails to make a new high/low\" F_TRIG = \"Next candle must exceed the breakout trigger (entry) level\" followMode = input.string(F_OFF, \"FollowMode\", options = [F_OFF, F_NEXT, F_STALL, F_TRIG], group = G3) M_OFF = \"Off - SL = swing only\" M_CAP = \"SL = tighter of swing vs entry +/- MaxLossPoints\" M_REPL = \"SL = entry +/- MaxLossPoints (ignore swing)\" M_RULE = \"Cap loss at MaxLossPoints only during follow-through window\" maxLossMode = input.string(M_OFF, \"MaxLossMode\", options = [M_OFF, M_CAP, M_REPL, M_RULE], group = G3) maxLossPts = input.int(2000, \"MaxLossPoints\", minval = 0, group = G3) fixWindowBug = input.bool(false, \"Close max-loss window even when FollowMode = Off\", group = G3, tooltip = \"EA BEHAVIOUR (default, unchecked): with FollowMode=Off the EA never clears gWindowOpen, so MaxLossMode = cap-during-window silently acts as a hard stop for the WHOLE trade. Tick this to close the window after the first post-entry bar as the mode name implies.\") var string G4 = \"4 - Profit protection\" P_NONE = \"PROTECTION_NONE\" P_SWNG = \"PROTECTION_SWING\" P_CHAN = \"PROTECTION_CHANDELIER\" P_TRAL = \"PROTECTION_TRAILING\" protMode = input.string(P_TRAL, \"ProtectionMode\", options = [P_NONE, P_SWNG, P_CHAN, P_TRAL], group = G4) S_IMM = \"START_IMMEDIATELY\" S_PTS = \"START_AFTER_POINTS\" protStartMode = input.string(S_IMM, \"ProtectionStartMode\", options = [S_IMM, S_PTS], group = G4) protStartPts = input.int(2000, \"ProtectionStartPoints\", minval = 0, group = G4) swingBufPts = input.int(200, \"SwingBufferPoints\", minval = 0, group = G4) chLb = input.int(22, \"ChandelierLookback\", minval = 1, group = G4) atrLen = input.int(22, \"ATRPeriod\", minval = 1, group = G4) atrMult = input.float(3.0,\"ATRMultiplier\", minval = 0, step = 0.1, group = G4) trailStartPts = input.int(500, \"TrailingStartPoints\", minval = 0, group = G4) trailDistPts = input.int(200, \"TrailingDistancePoints\",minval = 1, group = G4) trailStepPts = input.int(100, \"TrailingStepPoints\", minval = 0, group = G4) T_NATIVE = \"Native intrabar (matches MT5 tick trailing)\" T_BARSTEP = \"Bar close + TrailingStepPoints gate\" trailEngine = input.string(T_NATIVE, \"Trailing engine\", options = [T_NATIVE, T_BARSTEP], group = G4, tooltip = \"MT5 re-prices the trailing stop on EVERY TICK from the live bid. Native = the TradingView intrabar trailing stop, which reproduces that, but it ignores TrailingStepPoints (a 100-point step on gold is $1 of lag). Bar close = exact EA arithmetic including the step gate, but re-priced only once per bar.\") var string G5 = \"5 - Partial close\" enablePartial = input.bool(false, \"EnablePartialClose\", group = G5) partialTrigPts = input.int(6000, \"PartialCloseTriggerPoints\", minval = 0, group = G5) partialPct = input.float(50.0, \"PartialClosePercent\", minval = 1, maxval = 99, step = 1, group = G5) var string G6 = \"6 - Display\" showTable = input.bool(true, \"Show verification table\", group = G6) showLevels = input.bool(true, \"Show entry / stop levels\", group = G6) showSignals = input.bool(true, \"Show signal markers\", group = G6) showMAs = input.bool(true, \"Show moving averages\", group = G6) var string G7 = \"7 - MT5 benchmark column\" mLabel = input.string(\"MT5 Apr-Jun 26\", \"Column header\", group = G7, tooltip = \"Paste the numbers from your MT5 Strategy Tester run here and the table shows them next to TradingView's, so the two engines can be compared at a glance. Defaults are the SMA18_trades_XAUUSD.csv run of 2026-04-01 to 2026-06-04.\") mTrades = input.string(\"291\", \"MT5 trades\", group = G7) mNet = input.string(\"-133.93\", \"MT5 net profit\", group = G7) mPF = input.string(\"0.895\", \"MT5 profit factor\", group = G7) mWin = input.string(\"77.32\", \"MT5 win %\", group = G7) mDD = input.string(\"187.02\", \"MT5 max DD\", group = G7) mAvg = input.string(\"-0.4602\", \"MT5 avg trade\", group = G7) // ============================ DERIVED CONSTANTS ============================== pt = ptIn > 0 ? ptIn : syminfo.mintick qty = lotSize * unitsLot // ============================== INDICATORS =================================== // EA: iMA(SMA, PRICE_CLOSE) at shift 1/2, iATR at shift 1, volume average of // bars 1..N. All of those land on the current Pine bar under the bar mapping. ma18 = ta.sma(close, fastLen) ma200 = ta.sma(close, trendLen) avgVol = ta.sma(volume, volLen) atrV = ta.atr(atrLen) plot(showMAs ? ma18 : na, \"MA Fast\", color = color.new(#26C6DA, 0), linewidth = 2) plot(showMAs ? ma200 : na, \"MA Trend\", color = color.new(#FFA726, 0), linewidth = 2) // ===================== SWING DETECTION (GetSwingLow / GetSwingHigh) ========== // The EA scans MT5 bars SwingStrength+1 .. 100 and returns the FIRST bar whose // low is STRICTLY lower than the SwingStrength bars on each side; if nothing // qualifies inside that 100-bar window it falls back to iLow(bar 1). // In Pine that is: test offset swingStr on every bar, remember the newest hit, // and fall back to the current bar low once the newest hit ages past offset 99. isSwingLow(int sw) => float c = low[sw] bool ok = not na(c) if ok for i = 1 to sw if na(low[sw + i]) or low[sw + i] <= c or low[sw - i] <= c ok := false break ok isSwingHigh(int sw) => float c = high[sw] bool ok = not na(c) if ok for i = 1 to sw if na(high[sw + i]) or high[sw + i] >= c or high[sw - i] >= c ok := false break ok var float swLowVal = na var int swLowBar = na var float swHighVal = na var int swHighBar = na if isSwingLow(swingStr) swLowVal := low[swingStr] swLowBar := bar_index - swingStr if isSwingHigh(swingStr) swHighVal := high[swingStr] swHighBar := bar_index - swingStr swingLow = (not na(swLowBar) and bar_index - swLowBar <= 99) ? swLowVal : low swingHigh = (not na(swHighBar) and bar_index - swHighBar <= 99) ? swHighVal : high // ======================= ENTRY SIGNALS (BuySignal / SellSignal) ============== volOK = not useVol or volume > avgVol buySig = close > ma200 and close > ma18 and close[1] > ma18[1] and volOK sellSig = close < ma200 and close < ma18 and close[1] < ma18[1] and volOK // =============================== STATE ======================================= var bool pendL = false var bool pendS = false var float pendEntry = na var float pendSL = na var int entryBar = na var float entryPx = na var float curSL = na var bool partialDone = false var bool windowOpen = false var float runProfitPts = 0.0 inPos = strategy.opentrades > 0 isLong = strategy.position_size > 0 // warm-up guard: the EA needs the 200 SMA plus a 100-bar swing window ready = bar_index > math.max(trendLen, 100) + swingStr + 2 // rolling backtest window (indicators still warm up on the bars before it) inWindow = lookbackDays == 0 or time >= timenow - lookbackDays * 86400000 // ------- new-trade detection (survives partial closes) ----------------------- curEntryBar = inPos ? strategy.opentrades.entry_bar_index(0) : na isNewTrade = inPos and (na(entryBar) or curEntryBar != entryBar) if isNewTrade entryBar := curEntryBar entryPx := strategy.opentrades.entry_price(0) curSL := pendSL partialDone := false windowOpen := true runProfitPts := 0.0 if inPos pendL := false pendS := false // Favourable excursion in points. For a STOP entry the bar extreme can only // occur at or after the fill, so even on the entry bar this is exact. thisBest = isLong ? (high - entryPx) / pt : (entryPx - low) / pt runProfitPts := math.max(runProfitPts, thisBest) // ================ ManageFollowThrough() (EA runs this first) ================ followExit = false if inPos and ready age = bar_index - entryBar if followMode != F_OFF and age >= 1 if followMode == F_STALL made = isLong ? high > high[1] : low < low[1] if not made followExit := true windowOpen := false else if age == 1 and windowOpen ref = followMode == F_TRIG ? entryPx : (isLong ? high[1] : low[1]) followed = isLong ? high > ref : low < ref if not followed followExit := true windowOpen := false else if followMode == F_OFF and fixWindowBug and age >= 1 windowOpen := false if followExit strategy.close_all(comment = \"NoFollow\") // ======================= ManageOpenPositions() =============================== // EA order: exit signal (then return) -> partial -> break-even -> protection. maExit = inPos and not followExit and ready and (isLong ? close <= ma18 : close >= ma18) if maExit strategy.close_all(comment = \"MA18 exit\") protActive = protStartMode == S_IMM or runProfitPts >= protStartPts if inPos and not followExit and not maExit and ready // ---- ManagePartialClose(): the EA rounds the close volume down to the lot // step and needs one min lot left over. With LotSize 0.01 that is // impossible, so the EA sets PartialClosed=true and never partials. // Reproduced exactly rather than silently \"fixed\". if enablePartial and not partialDone and runProfitPts >= partialTrigPts closeLots = math.floor(lotSize * partialPct / 100.0 / lotStep) * lotStep if closeLots >= lotMin and lotSize - closeLots >= lotMin strategy.close(isLong ? \"L\" : \"S\", qty_percent = closeLots / lotSize * 100.0, comment = \"Partial\") partialDone := true // ---- ManageBreakEven() ---- if enableBE and runProfitPts >= bePts beLvl = isLong ? entryPx + beOff * pt : entryPx - beOff * pt curSL := isLong ? math.max(nz(curSL, beLvl), beLvl) : math.min(nz(curSL, beLvl), beLvl) // ---- ManageProtection(); ModifyStopLoss() only ever ratchets ---- if protActive if protMode == P_SWNG ns = isLong ? swingLow - swingBufPts * pt : swingHigh + swingBufPts * pt curSL := isLong ? math.max(nz(curSL, ns), ns) : math.min(nz(curSL, ns), ns) else if protMode == P_CHAN and atrV > 0 ns = isLong ? ta.highest(high, chLb) - atrV * atrMult : ta.lowest(low, chLb) + atrV * atrMult curSL := isLong ? math.max(nz(curSL, ns), ns) : math.min(nz(curSL, ns), ns) else if protMode == P_TRAL and trailEngine == T_BARSTEP and runProfitPts >= trailStartPts ns = isLong ? close - trailDistPts * pt : close + trailDistPts * pt improved = na(curSL) or (isLong ? ns - curSL >= trailStepPts * pt : curSL - ns >= trailStepPts * pt) if improved curSL := isLong ? math.max(nz(curSL, ns), ns) : math.min(nz(curSL, ns), ns) // ---------------- effective stop, incl. MAXLOSS cap-during-window ------------ effSL = curSL if inPos and maxLossMode == M_RULE and windowOpen and maxLossPts > 0 cap = isLong ? entryPx - maxLossPts * pt : entryPx + maxLossPts * pt effSL := isLong ? math.max(nz(effSL, cap), cap) : math.min(nz(effSL, cap), cap) // ------------------------------- exit order --------------------------------- useNativeTrail = protMode == P_TRAL and trailEngine == T_NATIVE and protActive actPts = protStartMode == S_PTS ? math.max(protStartPts, trailStartPts) : trailStartPts trailPx = isLong ? entryPx + actPts * pt : entryPx - actPts * pt trailTick = math.max(1, math.round(trailDistPts * pt / syminfo.mintick)) if inPos and not followExit and not maExit and not na(effSL) if useNativeTrail strategy.exit(\"X\", from_entry = isLong ? \"L\" : \"S\", stop = effSL, trail_price = trailPx, trail_offset = trailTick) else strategy.exit(\"X\", from_entry = isLong ? \"L\" : \"S\", stop = effSL) // -------------------------- flat: reset per-trade state ---------------------- if not inPos partialDone := false windowOpen := false curSL := na entryBar := na runProfitPts := 0.0 // ======================= NEW-BAR ORDER LOGIC (OnTick tail) =================== // EA: if a pending order exists -> only check invalidation, then return. // if a position exists -> return. Otherwise place ONE stop order. // A single EA OnTick can close a position AND arm the opposite order (the exit // runs before HasOpenPosition() is re-tested), so a bar that fires an exit // signal is treated as flat here too: the market close executes on the next // open, before any stop order can trigger. exitNow = maExit or followExit if (not inPos or exitNow) and ready and inWindow if pendL if close < ma18 // PendingBuyInvalidated() strategy.cancel(\"L\") pendL := false pendEntry := na else if pendS if close > ma18 // PendingSellInvalidated() strategy.cancel(\"S\") pendS := false pendEntry := na else if buySig e = high + bufPts * pt sl = maxLossMode == M_REPL ? e - maxLossPts * pt : maxLossMode == M_CAP ? math.max(swingLow, e - maxLossPts * pt) : swingLow strategy.entry(\"L\", strategy.long, qty = qty, stop = e, comment = \"SMA18 Entry\") strategy.exit(\"X\", \"L\", stop = sl) pendEntry := e pendSL := sl pendL := true else if sellSig e = low - bufPts * pt sl = maxLossMode == M_REPL ? e + maxLossPts * pt : maxLossMode == M_CAP ? math.min(swingHigh, e + maxLossPts * pt) : swingHigh strategy.entry(\"S\", strategy.short, qty = qty, stop = e, comment = \"SMA18 Sell\") strategy.exit(\"X\", \"S\", stop = sl) pendEntry := e pendSL := sl pendS := true // ================================ VISUALS ==================================== armed = not inPos and (pendL or pendS) plot(showLevels and armed ? pendEntry : na, \"Pending stop entry\", color = color.new(#B39DDB, 0), style = plot.style_linebr) plot(showLevels and armed ? pendSL : na, \"Pending SL\", color = color.new(#EF9A9A, 0), style = plot.style_linebr) plot(showLevels and inPos ? effSL : na, \"Active SL\", color = color.new(#EF5350, 0), style = plot.style_linebr, linewidth = 2) setupL = buySig and not buySig[1] and not inPos and not pendL and ready setupS = sellSig and not sellSig[1] and not inPos and not pendS and ready plotshape(showSignals and setupL, \"Long setup\", shape.triangleup, location.belowbar, color.new(#26A69A, 0), size = size.tiny) plotshape(showSignals and setupS, \"Short setup\", shape.triangledown, location.abovebar, color.new(#EF5350, 0), size = size.tiny) // ---- timeframe guard ------------------------------------------------------- if barstate.islast and timeframe.period != eaTF label.new(bar_index, high, \"TIMEFRAME MISMATCH\\nEA input = \" + eaTF + \" chart = \" + timeframe.period, style = label.style_label_down, color = color.new(color.red, 0), textcolor = color.white, size = size.small) // ---- verification table: TradingView vs the MT5 run ------------------------ var table t = table.new(position.top_right, 3, 7, border_width = 1) if showTable and barstate.islast pf = strategy.grossloss > 0 ? strategy.grossprofit / strategy.grossloss : 0.0 wr = strategy.closedtrades > 0 ? 100.0 * strategy.wintrades / strategy.closedtrades : 0.0 av = strategy.closedtrades > 0 ? strategy.netprofit / strategy.closedtrades : 0.0 table.cell(t, 0, 0, \"metric\", bgcolor = #263238, text_color = color.white, text_size = size.small) table.cell(t, 1, 0, \"TradingView\", bgcolor = #263238, text_color = color.white, text_size = size.small) table.cell(t, 2, 0, mLabel, bgcolor = #263238, text_color = color.white, text_size = size.small) rows = array.from(\"trades\", \"net profit\", \"profit factor\", \"win %\", \"max DD\", \"avg trade\") tv = array.from(str.tostring(strategy.closedtrades), str.tostring(strategy.netprofit, \"#.##\"), str.tostring(pf, \"#.###\"), str.tostring(wr, \"#.##\"), str.tostring(strategy.max_drawdown, \"#.##\"), str.tostring(av, \"#.####\")) mt = array.from(mTrades, mNet, mPF, mWin, mDD, mAvg) for i = 0 to 5 table.cell(t, 0, i + 1, array.get(rows, i), bgcolor = #37474F, text_color = color.white, text_size = size.small) table.cell(t, 1, i + 1, array.get(tv, i), bgcolor = #455A64, text_color = color.white, text_size = size.small) table.cell(t, 2, i + 1, array.get(mt, i), bgcolor = #455A64, text_color = #B0BEC5, text_size = size.small) // ---- alerts ---------------------------------------------------------------- alertcondition(setupL, \"SMA18 long setup\", \"SMA18 long setup - buy stop armed\") alertcondition(setupS, \"SMA18 short setup\", \"SMA18 short setup - sell stop armed\")"