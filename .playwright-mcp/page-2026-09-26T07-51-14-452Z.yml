  - heading "Nyao Scalper Autopsy" [level=1] [ref=e4]
  - paragraph [ref=e5]: The github.com/topics/scalping-bot collection holds one genuine gold EA. It was ported rule for rule, run on your five years of XAUUSD M1 data with XM costs, calibrated on real ticks and compared with the TWK M3 baseline. It loses the account in every period, and the thing that made it look good on bars is a 20-point trailing stop that ticks show never pays.
