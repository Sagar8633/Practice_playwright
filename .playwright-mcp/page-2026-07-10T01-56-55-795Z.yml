          - generic [ref=e89]:
            - paragraph [ref=e90]:
              - text: Recently, I sat down for a discussion with Andre, the CEO of
              - link "Edgeful" [ref=e91] [cursor=pointer]:
                - /url: https://edgeful.com/?via=TTS
              - text: . Our discussion covered mistakes aspiring traders often make, as well as tips on improving performance.
              - text: Finally, we discussed some specific strategies, mainly the Opening Range Breakout Strategy. The strategy is up 170% or 250% over the last year, based on going long and short, or only long. That’s making one trade a day…and it can be fully automated.
            - paragraph [ref=e92]: Edgeful has created Algos that you can load and backtest in TradingView (plots all trade levels for you), or connect to your broker to have trades placed automatically.
