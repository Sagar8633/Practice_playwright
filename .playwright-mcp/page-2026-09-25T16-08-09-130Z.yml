  - generic [ref=e18]:
    - paragraph [ref=e19]: Bottom line
    - paragraph [ref=e20]:
      - strong [ref=e21]: "The permission system does what it is for: when the signal is wrong it loses much less, and it does not get in the way when the signal is right."
      - text: Over five years on M3 the baseline lost $2,752 at 0.02 lot on 3,399 trades. The recommended stack loses $572 on 835 trades, the loss falls in every period (development -$1,579 to -$373, validation -$705 to -$198, out of sample -$467 to -$1), the longest losing streak drops from 19 to 16, and the drawdown from $2,856 to $907. With 0.5% risk sizing the same five years end at $857 from $1,000 with a 15.8% maximum drawdown, against a wipe-out at fixed lots.
    - paragraph [ref=e22]:
      - strong [ref=e23]: It does not make money, and nothing here suggests it can.
      - text: "Every phase and every period stays negative or flat. Among the 2,632 trades the stack blocks, 1,599 would have lost and 1,031 would have won: the gates are filtering a coin flip whose losses are larger than its wins, which is why blocking pays. The net benefit of blocking ($2,174) is almost exactly the improvement; the management changes add $97."
    - paragraph [ref=e24]: "Enable Level 1 and the four Level 2 and 4 items that helped in all three periods. Keep the volatility ban, the chop lockout, the hybrid stop and the health exit switched off: each looked good on 2021 to 2024 and hurt in 2025 to 2026."
