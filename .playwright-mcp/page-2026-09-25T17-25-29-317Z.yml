  - generic [ref=e58]:
    - heading "2. Protocol" [level=2] [ref=e59]
    - paragraph [ref=e60]: Fixed before the run; no threshold was searched.
    - list [ref=e61]:
      - listitem [ref=e62]:
        - strong [ref=e63]: Available data.
        - text: Dukascopy XAUUSD M1 bid with traded volume, Sep 2021 to Sep 2026 (39 of 61 months), shifted to XM server time; XM's yearly median spread (32 to 51 points); XM's own bars for spread calibration; the TWK series.
        - strong [ref=e64]: "Missing:"
        - text: tick data, per-trade spread, the economic calendar, order-book or aggressor data, your manual trades, execution logs, 22 months.
      - listitem [ref=e65]:
        - strong [ref=e66]: Generated without external data.
        - text: ATR(14) and its 100-bar percentile, Bollinger width and its percentile, session ranges (Asia 01:00 to 09:59, London 10:00 to 14:59, New York 15:00 to 23:59 server), 15-minute opening ranges at 10:00 and 15:00, previous-day high/low/close and the 14-day range, today's running high/low with touch counts, session VWAP from volume, 20-bar mean and standard deviation, consecutive-candle runs, 3-bar and 30-bar displacement in ATR, wick ratios, 5-bar pivots and equal highs/lows, volume versus its 20-bar mean, a five-state machine (compression, expansion, trend, exhaustion, range) and its transitions, first-occurrence-of-the-day flags.
      - listitem [ref=e67]:
        - strong [ref=e68]: Measurement.
        - text: "Each event's forward path on one-minute bars from the next open (ask for buys), unit = the event timeframe's ATR(14): first passage to +X before -X for X = 0.25, 0.5, 1 ATR and +2R/-1R, MFE and MAE at 5, 10, 20, 30, 50 and 100 bars, expectancy and profit factor after spread, with and against the event direction."
      - listitem [ref=e69]:
        - strong [ref=e70]: Statistical test.
        - text: z-score of the gross hit rate against its break-even (50% for symmetric shapes) and a bootstrap 95% interval of the net expectancy; both reported, neither alone decides.
      - listitem [ref=e71]:
        - strong [ref=e72]: Split.
        - text: Development Sep 2021 to Dec 2023 for discovery; validation 2024 untouched until a hypothesis is frozen; out of sample Jan 2025 to Sep 2026 final; per-year walk-forward for anything not rejected.
      - listitem [ref=e73]:
        - strong [ref=e74]: Acceptance.
        - text: "At least 200 development events, 50 validation, 100 out of sample; net expectancy above zero and profit factor above 1 in all three periods on the primary shape or any single fixed shape; then years positive, cost at 1.25x, 1.5x and 2x, no month above 40% of net, no trade above 20%, both directions and no single session carrying it. Statuses: CANDIDATE, WEAK, REJECT, DATA_INSUFFICIENT. No threshold was searched; every hypothesis ran once with its stated parameters, and the only follow-up was the phenomenon-first one: wider units and longer holds for the three gross asymmetries, decided on development."
