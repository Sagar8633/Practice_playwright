  - generic [ref=e17]:
    - paragraph [ref=e18]: Result of phases 5 to 9
    - paragraph [ref=e19]: No edge found in phases 5 to 9. Phases 10 and 11 need your data.
    - paragraph [ref=e20]: "With the strategy's real stop, 26% of raw M3 flips reach +2R before the stop, 45% never reach +0.5R, and the gross expectancy of the 1R/2R shape is -0.025R in development, -0.037R in validation and +0.032R out of sample: zero, before spread. Not one of 52 entry-time features (17 of them new structure features) has a best bucket with positive net expectancy in both selection periods. A gradient-boosted model of all 52 features reaches 0.76 AUC on the training years and 0.54 out of sample, and the signals it likes most lose money in validation and out of sample. Five entry mechanisms, the trend-continuation and reversal models, and the break-and-retest hypothesis all sit within 0.02R of the immediate entry. No candidate passes the profit-factor gate in all three periods."
    - paragraph [ref=e21]: "The two things that do separate A/B from D are the stop size relative to the spread and the direction of the first half-R after the flip. Neither is an edge: the first is cost, and the second goes the wrong way (in 64% of signals price moves 0.5R against the flip before it moves 0.5R with it)."
  - generic [ref=e22]:
    - heading "1. Verdict by phase" [level=2] [ref=e23]
    - list [ref=e24]:
      - listitem [ref=e25]:
        - strong [ref=e26]: Phase 5, outcomes.
        - text: A 26%, B 15%, C 14%, D 45%. Gross 1R/2R expectancy is zero in every period; net is -0.26R, -0.24R and -0.06R. The 2R target is reached 23% to 30% of the time against a 33% break-even before costs.
      - listitem [ref=e27]:
        - strong [ref=e28]: Phase 5, separation.
        - text: "Ranked by whether the best-versus-worst order holds in all three periods, 22 features qualify, and the best bucket of every one of them is negative in development and validation. The top separator, low cost-to-reward (wide stop relative to spread: 46% A/B versus 27%), is arithmetic, not information."
      - listitem [ref=e29]:
        - strong [ref=e30]: Phase 5, multivariate.
        - text: "Gradient boosting on all features: AUC 0.758 train, 0.594 validation, 0.544 out of sample. The top decile fixed on development earns +0.38R there and -0.15R and -0.10R afterwards. Permutation importance is cost-to-reward (0.049) and then nothing above 0.006. There is no combination of these features that predicts the outcome."
      - listitem [ref=e31]:
        - strong [ref=e32]: Phase 6, structure.
        - text: "HH/HL versus LH/LL: identical (PF 0.76 versus 0.78). Distance to the previous day's and today's high/low, nearest pivot, level proximity: all within noise. Closing beyond the previous day's high/low is the best structural condition (gross +0.06R, PF 0.70 / 0.83 / 1.13) and still below 1 in both selection periods; in the engine it is 0.56 / 0.52 / 1.26."
      - listitem [ref=e33]:
        - strong [ref=e34]: Phase 7, trend versus reversal.
        - text: "Continuation (M15 and H1 aligned, M15 structure aligned, price beyond the last M15 pivot): PF 0.63 / 0.86 / 1.08, gross +0.03R. Reversal (both against, 3 ATR15 move against, reclaim): 0.58 / 0.62 / 0.93. Neither model is positive before 2025, and the out-of-sample edge of continuation is the 2025 to 2026 trend regime seen in phase 1. The break-and-retest hypothesis (249 signals) is worse than the average flip."
      - listitem [ref=e35]:
        - strong [ref=e36]: Phase 8, entries.
        - text: Immediate -0.162R, breakout of the flip candle -0.148R, momentum candle -0.166R, retest of the purple line with rejection -0.166R (taken 11% of the time), pullback and reclaim -0.157R. Profit factor 0.76 to 0.79 for all five. Waiting does not help because what follows the flip is a coin flip whenever you enter it.
      - listitem [ref=e37]:
        - strong [ref=e38]: Phase 9, timing.
        - text: "A-bucket signals reach +0.5R in a median 13 minutes and +1R in 30; D-bucket signals hit the stop in a median 15 minutes. But across all signals -0.5R comes before +0.5R in 64% of cases (71% in development, 57% out of sample). The signal has timing information and it is adverse: the first move after a flip is usually against it. That is the re-flip loss from phase 1, measured cleanly, and the pullback entry that should exploit it does not, because the continuation after the pullback is again a coin flip."
