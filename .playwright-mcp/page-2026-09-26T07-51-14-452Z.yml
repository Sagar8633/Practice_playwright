  - paragraph [ref=e1313]: Only 141 of 5,354 BASELINE trades coincide with a Nyao entry on the same M3 bar and direction. TWK fires on a Supertrend flip a few times a day; Nyao fires whenever EMA, RSI and body agree, 25-70 times a day. There is no shared decision to transfer, and the overlap categories are too small to read.
  - heading "11. Conclusions" [level=2] [ref=e1314]
  - generic [ref=e1315]:
    - generic [ref=e1316]:
      - heading "Strong evidence" [level=3] [ref=e1317]
      - list [ref=e1318]:
        - listitem [ref=e1319]: The default profile loses the account on this data in 12 of 12 period runs; the continuous run is ruined by mid-2022. PF 0.57-0.73.
        - listitem [ref=e1320]: "The loss is structural: 25 perturbations and 9 ablations are negative in every period."
        - listitem [ref=e1321]: The $0.20 trail exits at its activation level on real ticks; the bar-level profit is a modelling artifact worth about $0.80 a trade, the whole difference between "PF 1.4" and ruin.
        - listitem [ref=e1322]: The score gate does not improve BASELINE; the EA's own threshold makes it worse in every period.
    - generic [ref=e1323]:
      - heading "Weak evidence" [level=3] [ref=e1324]
      - list [ref=e1325]:
        - listitem [ref=e1326]: "Entry-only, threshold 6, M5: gross +$0.02 / +$0.04 / +$0.36 per trade by period, net negative in all three."
        - listitem [ref=e1327]: "The safe profile does not ruin: -30% in five years at PF 0.66-0.75."
    - generic [ref=e1328]:
      - heading "Failed approaches" [level=3] [ref=e1329]
      - list [ref=e1330]:
        - listitem [ref=e1331]: Every shipped profile on every timeframe; the $200 account (28-30% win rate with a $2 stop); every cost scenario; the hedge chain.
    - generic [ref=e1332]:
      - heading "Important loss patterns" [level=3] [ref=e1333]
      - list [ref=e1334]:
        - listitem [ref=e1335]: Spread of 32-51 points on a trade whose target is 82-101 points and whose median life is 50 seconds; spread paid equals 2-3 times the deposit per year.
        - listitem [ref=e1336]: An account-defined stop that tightens as the account shrinks.
        - listitem [ref=e1337]: Immediate same-direction re-entry after a health close; lots increased in drawdown; a chain with no cap.
    - generic [ref=e1338]:
      - heading "Useful components" [level=3] [ref=e1339]
      - list [ref=e1340]:
        - listitem [ref=e1341]: None transferable. The dead-market gate removes 56 of 42,289 TWK signals and changes nothing; score, health close, break-even on spread, cooldown and drawdown gate are all in the family your filter and protection labs already found to carry no information after costs.
        - listitem [ref=e1342]: "Method: tick-calibrate any sub-range stop before believing a bar backtest."
    - generic [ref=e1343]:
      - heading "Baseline, relative to Nyao" [level=3] [ref=e1344]
      - list [ref=e1345]:
