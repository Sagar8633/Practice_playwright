              - generic [ref=e900]: //
              - generic [ref=e902]: "// MT5 GROUND TRUTH (XAUUSD, M15, 0.01 lot, 2024-01-02 -> 2026-07-10):"
              - generic [ref=e904]: // trades 3597 | net +851.51 | PF 1.075 | win 64.05% | closed-trade DD 344.96
              - generic [ref=e906]: "// exits: 2458 StopLoss/Protection, 1139 EA(MA18/MaxLoss/Partial)"
              - generic [ref=e908]: // The table (top-right) prints TradingView numbers next to these so the port
              - generic [ref=e910]: // can be verified on the chart.
              - generic [ref=e912]: //
              - generic [ref=e914]: "// BAR MAPPING USED THROUGHOUT: MT5 bar[N] == Pine [N-1]"
              - generic [ref=e916]: // The EA acts on the first tick of a new bar, so its "bar 1" (last closed bar)
              - generic [ref=e918]: // is the bar Pine has just closed. Every rule below is written to that mapping,
              - generic [ref=e920]: "// which is also why process_orders_on_close stays false: an EA order sent on"
              - generic [ref=e922]: // the first tick of a new bar fills at that bar open == Pine next-bar-open.
              - generic [ref=e924]: //
              - generic [ref=e926]: "// KNOWN DIVERGENCES FROM MT5 (read before comparing numbers):"
              - generic [ref=e928]: // 1. VOLUME. The EA uses MT5 tick volume. TradingView volume on XAUUSD comes
              - generic [ref=e930]: // from a different feed, so the "volume > 20-SMA" filter selects DIFFERENT
              - generic [ref=e932]: // bars. This is a data difference, not a porting bug. Set "Volume filter"
              - generic [ref=e934]: // off on both sides for a like-for-like comparison.
              - generic [ref=e936]: // 2. Break-even / partial / protection-start triggers are evaluated on the bar
              - generic [ref=e938]: // EXTREME (high/low), so they arm on the same bar MT5 arms them, but the
              - generic [ref=e940]: // resulting stop only becomes active on the next bar.
