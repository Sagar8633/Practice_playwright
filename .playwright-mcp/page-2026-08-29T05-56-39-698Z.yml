                - generic [ref=f9e882]: Easy
                - text: Stub a slow service. Run WireMock in Docker, stub an endpoint with a 5-second delay, and write a test asserting your client times out cleanly.
              - listitem [ref=f9e883]:
                - generic [ref=f9e884]: Medium
                - text: Fault matrix. Stub 500, 503, malformed JSON, and a connection reset. Write one parameterised test covering all four degradation paths.
              - listitem [ref=f9e885]:
                - generic [ref=f9e886]: Medium
                - text: Stateful scenario. Use WireMock scenarios so the first call returns 500 and the retry returns 200. Assert your retry logic works.
              - listitem [ref=f9e887]:
                - generic [ref=f9e888]: Hard
                - text: Full Pact loop. Write a consumer test, generate a pact file, run a local broker in Docker, and verify it against a small provider you write yourself.
