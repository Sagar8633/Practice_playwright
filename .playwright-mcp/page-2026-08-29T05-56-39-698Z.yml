        - generic [ref=f9e2194]:
          - heading "Sunday checkpoint" [level=4] [ref=f9e2195]
          - paragraph [ref=f9e2196]: Answer these four out loud, every week. Write the answers into the log as that Sunday's entry.
          - list [ref=f9e2197]:
            - listitem [ref=f9e2198]: What can I demonstrate today that I could not last Sunday? If the answer is "I read about X", the week did not land — ship something small before Monday.
            - listitem [ref=f9e2199]:
              - text: Which "Prove it" artifact moved? Name the repo and the commit. Skills that never reach
              - emphasis [ref=f9e2200]: Proved
              - text: are skills you will not be able to defend under questioning.
            - listitem [ref=f9e2201]: Which bank questions could I not answer in ninety seconds? Those go into next weekend's redo list, not into the "I'll get to it" pile.
            - listitem [ref=f9e2202]: Am I still applying? The gates are day 21 for Playwright and TypeScript roles, day 36 for Java Selenium, day 45 for lead and 20L+ roles. With a two-month notice period, waiting until day 60 pushes your start date into January.
          - paragraph [ref=f9e2203]: "If a week goes badly: protect the TypeScript and Java tracks, compress the cloud and GitLab entries, and never drop the daily bank drill — even on a zero-study day."
      - generic [ref=f9e2204]:
        - generic [ref=f9e2205]: Built from naukri_profile/data — 571 unique postings across Naukri and LinkedIn, 6 scan runs between 21 and 29 Aug 2026, 60 job descriptions with per-skill gap scoring, and a 598-question interview bank.
        - generic [ref=f9e2206]: Demand percentages are the share of analysed job descriptions naming each skill, averaged across runs. Status chips reflect the gap analysis already stored in your prep files. Every linked resource is free unless marked otherwise.
        - generic [ref=f9e2207]: Companion document to the 60-day plan. This one is organised by skill; that one is organised by day.