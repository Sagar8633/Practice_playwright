    - paragraph [ref=e860]: "At hourly resolution the cross-asset information is already in gold's own price by the time the bar closes: rank correlations between an asset's hourly return and gold's next one to sixty hours are below 0.03 in every period and change sign between periods; after a 2-sigma hour in silver, gold's next hour averages +0.03 ATR whether silver rose or fell; the monetisation rows are within noise of zero. If a cross-asset lead exists it is shorter than an hour, which makes it a tick-data question (Report E), not a bar question."
    - heading "Full design (what the data here could not cover)" [level=3] [ref=e861]
    - list [ref=e862]:
      - listitem [ref=e863]:
        - strong [ref=e864]: "Series:"
        - text: silver, platinum, EURUSD, USDJPY, S&P 500, Nasdaq, oil, bitcoin at H1 for five years (XM, cheap on disk one at a time), and a continuous dollar index and 10-year yield from an external daily or hourly source. XM's dollar index and VIX are single futures contracts and cannot be used for history.
      - listitem [ref=e865]:
        - strong [ref=e866]: "Tests:"
        - text: lead/lag at 1, 3, 5, 10, 15, 30, 60 bars; shock response by direction and magnitude; divergence (gold and dollar both up, gold and silver diverging, gold and yields diverging over the last three bars) with the next-k gold move; regime-conditional shocks (high versus low gold ATR ratio); each by DEV / VAL / OOS with the same acceptance rule as the ledger.
      - listitem [ref=e867]:
        - strong [ref=e868]: "Tick-level version:"
        - text: the same lead/lag at 1 to 60 seconds between silver and gold ticks, and between EURUSD and gold around 15:30 releases, from Dukascopy. This is the version the hourly data cannot rule out.
  - generic [ref=e869]:
    - 'heading "Report D: Macro and news experiment" [level=2] [ref=e870]'
    - list [ref=e871]:
      - listitem [ref=e872]:
        - strong [ref=e873]: "Fields per event:"
        - text: release timestamp (UTC to the second), country, event name, importance, previous, forecast, actual, revision; from a free calendar export (several sites export CSV; the FOMC statement and press-conference times separately).
      - listitem [ref=e874]:
        - strong [ref=e875]: "Join:"
        - text: to server time (EET) minute bars now, to ticks later. Tag every bar within +/- 60 minutes of a release with the event and its surprise (actual minus forecast, standardised by the event's own history).
      - listitem [ref=e876]:
        - strong [ref=e877]: "Scope:"
        - text: US CPI, PPI, payrolls, jobless claims, retail sales, GDP, PCE, ISM, FOMC decisions and minutes, Fed speeches; ECB and BoE decisions as a control group.
    - heading "Tests" [level=3] [ref=e878]
    - list [ref=e879]:
      - listitem [ref=e880]: "Pre-event: range, spread and the sign of the last 30 minutes' move by event class (positioning), versus the same clock on non-release days."
      - listitem [ref=e881]: "Reaction: at 1, 3, 5, 15 minutes from bars (1, 5, 10, 30 seconds need ticks): does the sign of the surprise predict the sign of the move (hit rate above 50% by event class, DEV / VAL / OOS), and does the size of the surprise predict the size?"
      - listitem [ref=e882]: "Post-event: continuation versus reversal of the first-minute move over 15, 30, 60 minutes; range expansion versus the unconditional profile; whether the straddle result in Report F is a release-day effect only (the weekday split says yes: Thursday +0.54 ATR, Monday to Wednesday +0.06 to +0.08)."
      - listitem [ref=e883]: Acceptance as in the ledger, per event class, with the surprise sign as the directional hypothesis and the range as the volatility hypothesis, tested separately.
    - paragraph [ref=e884]: "The 15:30 server effect measured in Report F is this experiment done blind: the clock knows when 8:30 New York is, the calendar would tell it which days matter. That is why the calendar is bundled into the next experiment rather than run alone."
  - generic [ref=e885]:
    - 'heading "Report E: Tick and microstructure experiment" [level=2] [ref=e886]'
    - list [ref=e887]:
      - listitem [ref=e888]:
        - strong [ref=e889]: "Source:"
        - text: "Dukascopy tick data for XAUUSD (and silver, EURUSD for the cross-asset version): timestamp in milliseconds, bid, ask, bid size, ask size. Free; about 150 MB per month as CSV; three months first, then the 15:30 windows over two years."
      - listitem [ref=e890]:
        - strong [ref=e891]: "Derived per second and per 5 seconds:"
        - text: spread, spread relative to its 10-minute median, tick arrival rate, signed tick imbalance (upticks minus downticks), top-of-book size imbalance, micro-price (size-weighted mid) minus mid, consecutive same-side pressure, spread-normalised displacement, liquidity withdrawal (size falling while spread widens).
    - heading "Tests" [level=3] [ref=e892]
    - list [ref=e893]:
      - listitem [ref=e894]:
        - strong [ref=e895]: "Information:"
        - text: for each feature, P(+0.1R / +0.25R / +0.5R before the mirror) over the next 1 to 5 minutes, with R = the 5-minute ATR, by DEV / VAL / OOS inside the sample, same acceptance rule. Horizons this short have never been tested here.
      - listitem [ref=e896]:
        - strong [ref=e897]: "Execution:"
        - text: "the true bid/ask path through the first minute after 15:30 (which trigger fired first, how far the ask ran, how wide the spread went), and at all hours: how often a stop order would fill inside the quoted spread versus beyond it. This decides the straddle and quantifies every stop-based result in the earlier reports."
      - listitem [ref=e898]:
        - strong [ref=e899]: "Timing:"
        - text: whether entering after spread normalisation (spread back under its median within N seconds) changes the expectancy of the same events, which is the execution-edge test separated from the information-edge test.
