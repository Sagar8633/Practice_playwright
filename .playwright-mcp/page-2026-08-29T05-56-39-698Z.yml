0)); } // ---------- ARRAY ASSERTIONS with JsonPath ---------- @Test public void filtersByName() { List<Integer> ids = given() .baseUri(BASE) .queryParam(\"firstname\", \"Sagar\") .when() .get(\"/booking\") .then() .statusCode(200) .extract().jsonPath().getList(\"bookingid\", Integer.class); assertThat(ids, everyItem(greaterThan(0))); } }"
            - paragraph [ref=f9e743]:
              - text: "What to notice:"
              - code [ref=f9e744]: .time(lessThan(3000L))
              - text: treats response time as a functional assertion, not a separate performance exercise — a small thing that reads as senior. And
              - code [ref=f9e745]: body("booking.bookingdates.checkin", ...)
              - text: shows JsonPath walking nested objects with plain dot notation. Map every line here to its pytest equivalent in your head; that mapping is the interview answer when they ask how you would transfer.
