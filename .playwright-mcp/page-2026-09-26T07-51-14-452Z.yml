  - heading "9. Where it loses" [level=2] [ref=e1106]
  - paragraph [ref=e1107]:
    - text: "Fixed-stop M5, expectancy per trade: every session (Asia -0.37, London -0.40, NY overlap -0.30, NY late -0.49), every hour (best 05:00 at -0.12), every year (-0.29 to -0.33 in 2021-25, -0.54 in 2026 with a 51-point spread), with the H1 trend and against it alike (-0.37 / -0.37), in low, normal and high volatility (-0.50 / -0.38 / -0.35). Losers and winners have the same share of counter-trend, high-volatility and NY entries, so no pre-entry condition separates them. What separates them is the exit design: 79% of trades are cut at about +$1 after a median 3 minutes; 21% are held a median 21 minutes to a health close (-$4.37 average, 59% of the loss) or the stop (-$10, 40%). Full breakdowns in"
    - code [ref=e1108]: results/nyao/LOSS_PATTERN_ANALYSIS.md
    - text: .
