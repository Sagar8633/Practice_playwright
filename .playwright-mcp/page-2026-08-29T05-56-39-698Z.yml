          - generic [ref=f9e866]:
            - generic [ref=f9e867]:
              - text: Practical example —
              - emphasis [ref=f9e868]: WireMock standing in for a payment service you cannot break on demand
            - code [ref=f9e870]: "# Testing the failure paths a real payment provider will never give you on request. import requests, pytest BASE = \"http://localhost:8080/__admin/mappings\" def stub(payload): requests.post(BASE, json=payload).raise_for_status() def test_checkout_shows_retry_when_payment_times_out(page): # 1. Make the payment service hang for 8 seconds stub({ \"request\": {\"method\": \"POST\", \"url\": \"/payments\"}, \"response\": {\"status\": 200, \"fixedDelayMilliseconds\": 8000} }) page.goto(\"/checkout\") page.get_by_role(\"button\", name=\"Pay now\").click() # 2. Assert OUR app degrades correctly - that is the thing under test expect(page.get_by_text(\"Payment is taking longer than usual\")).to_be_visible() expect(page.get_by_role(\"button\", name=\"Retry\")).to_be_enabled() def test_checkout_does_not_double_charge_on_500(page): stub({ \"request\": {\"method\": \"POST\", \"url\": \"/payments\"}, \"response\": {\"status\": 500, \"body\": '{\"error\":\"upstream failure\"}'} }) page.goto(\"/checkout\") page.get_by_role(\"button\", name=\"Pay now\").click() expect(page.get_by_text(\"We could not take your payment\")).to_be_visible() # And the important assertion: the order was NOT created assert get_orders_for_user(TEST_USER) == []"
            - paragraph [ref=f9e871]: "What to notice: the thing under test is not the payment service — it is how your application behaves when the payment service misbehaves. That reframing is exactly what senior interviewers are listening for, and it is impossible to test without mocking."
          - generic [ref=f9e872]:
            - generic [ref=f9e873]:
              - text: The Pact flow —
              - emphasis [ref=f9e874]: be able to draw this in 60 seconds
            - code [ref=f9e876]: "CONSUMER side (the front-end team) 1. Write a test that says: \"when I GET /orders/1 I expect { id: number, status: string, total: number }\" 2. Running that test generates a PACT FILE (the contract). 3. Publish the pact file to the BROKER. PROVIDER side (the orders service team) 4. In their CI, fetch every pact published against them. 5. Replay each expectation against the real provider. 6. Publish the verification result back to the broker. DEPLOYMENT GATE 7. `pact-broker can-i-deploy --pacticipant orders-api --version 1.4.2` -> exits non-zero if any consumer's contract is not satisfied. WHAT IT CATCHES : a provider renaming `total` to `totalAmount`. WHAT IT DOES NOT: whether `total` is calculated correctly. Contract tests check SHAPE, not BEHAVIOUR."
            - paragraph [ref=f9e877]: Say that last line in an interview. Most candidates oversell contract testing as a replacement for integration testing. Naming its limit shows you have actually thought about where it fits.
