# Manufacturing Quality - Customer Quality and Supplier Quality.
#
# Written for a customer-quality / supplier-quality engineer in Indian
# manufacturing: complaints and 8D at the customer end, PPAP and supplier
# audits at the vendor end, gauges and capability studies in between.
# See docs/ROLES.md for the format.
#
# ---------------------------------------------------------------------------
# WHY `extends: none`, which no other shipped pack sets
# ---------------------------------------------------------------------------
# roles/_common.yaml is a SOFTWARE lexicon end to end - Docker, Kubernetes,
# Kafka, REST APIs, microservices, Terraform, ELK. Inheriting it would not just
# add harmless unused rows. The skill matrix counts every lexicon row across the
# ten highest-scoring job descriptions and those counts decide what you are told
# to study first, so a manufacturing scan would come back measuring this person
# against Kubernetes, reporting it as a Gap, and pushing PPAP, 8D and Cpk down
# the study page to make room for it. docs/ROLES.md states the rule outright -
# a generic lexicon is worse than a narrow one - and naukri/interview/skills.py
# makes the same point at line 10, where the module explains that a generic
# extractor "pulls 'communication' and 'stakeholder management' out of every JD
# and buries the three tools that actually decide the interview".
#
# Checked in the code before relying on it: naukri/roles.py line 123 reads
#
#     common = _read(COMMON) if role.get("extends", COMMON) == COMMON ... else {}
#
# so any `extends:` value other than `_common` resolves `common` to `{}`, and
# every merge below that line - must_have_any, exclude_title_keywords,
# tight_terms, synonyms, lexicon - is left with this file's contents alone.
# `none` is read by PyYAML as the plain string "none" (YAML null is `null` or
# `~`), which is exactly what that comparison needs.
#
# The cost is that nothing arrives for free, so this file carries its own
# complete exclude_title_keywords - intern / fresher / trainee included, which
# every other pack inherits - and its own tight_terms. The handful of _common
# rows that genuinely do turn up in manufacturing adverts (root cause analysis,
# documentation and SOPs, stakeholder communication, SAP/ERP, Excel data work)
# are re-declared in the lexicon below in manufacturing words. Nothing from the
# software infrastructure half is brought across.
extends: none

label: Manufacturing Quality (Customer & Supplier)
primary_role: Customer & Supplier Quality Engineer

# Seeds for the search terms jobs.yaml falls back to when it lists none.
seed_keywords:
  - Supplier Quality Engineer
  - Customer Quality Engineer
  - Quality Engineer
  - Supplier Quality Assurance Engineer
  - Vendor Development Engineer
  - Quality Control Engineer
  - Field Quality Engineer
  - Quality Assurance Engineer

# Ready-made searches. Copy these into jobs.yaml and set your own locations.
# Every location here is null (all of India) on purpose: a remote search for a
# shop-floor quality role returns software and BPO QA, and it compounds,
# because _location_score() awards "remote" full marks and floats exactly those
# adverts to the top of the daily report.
searches:
  - {keyword: Supplier Quality Engineer, location: null}
  - {keyword: Customer Quality Engineer, location: null}
  - {keyword: Quality Engineer Manufacturing, location: null}
  - {keyword: Supplier Quality Assurance, location: null}
  - {keyword: Vendor Development Engineer, location: null}
  - {keyword: Quality Control Engineer, location: null}

# The "is this even my field" gate: an advert mentioning none of these is
# dropped before scoring ever runs.
#
# Shaped above all to keep software QA out, which is the trap this whole pack
# exists to avoid. "QA", "quality assurance", "quality engineering" and "test
# engineer" are deliberately NOT gate terms - an SDET advert says all four, and
# a real shop-floor advert always says something more specific. What is left is
# either anchored to a party (supplier quality, customer quality, vendor
# quality) or is AIAG/IATF vocabulary no software advert carries: ppap, apqp,
# pfmea, spc, cpk, 8d, iatf, 16949.
#
# Three absences that look like oversights and are not:
#   * "control plan" - the gate is a plain substring test after normalisation,
#     and "control plan" sits inside "control plane", so it would pass every
#     Kubernetes advert ever posted. It is safe as a lexicon alias, where
#     \bcontrol plan\b cannot reach "control plane", and it is listed there.
#   * "gauge" - passes on the metaphor, "ability to gauge stakeholder
#     sentiment". Recall is untouched: inspection, calibration, metrology and
#     coordinate measuring machine are all still gate terms, and any metrology
#     advert carries at least one.
#   * "qms" - not a false positive, just a duplicate needle. _skill_key()
#     applies the qms synonym below, so "qms" and "quality management system"
#     normalise to the same string.
must_have_any:
  - supplier quality
  - customer quality
  - vendor quality
  - quality control
  - quality management system
  - ppap
  - apqp
  - pfmea
  - fmea
  - spc
  - cpk
  - 8d
  - iatf
  - "16949"
  - iso 9001
  - iso9001
  - corrective action
  - corrective and preventive action
  - non conformance
  - nonconformance
  - customer complaint
  - inspection
  - inspector
  - pdi
  - calibration
  - metrology
  - coordinate measuring machine
  - "gd&t"
  - measurement system analysis
  - supplier development
  - vendor development
  - supplier audit
  - poka yoke
  - iqc
  - oqc

# Dropped on the title alone. Nothing is inherited, so the first three - which
# every other pack gets from _common.yaml - are spelled out here.
#
# The software block is the point of the pack. The BPO block matters nearly as
# much: "Quality Analyst" is a call-centre title in India, and a BPO advert
# discusses calibration, audits, CAPA, defects and customer complaints in words
# that read like manufacturing all the way down. Bare "analyst" is deliberately
# absent - the match is on a title substring, and it would kill "Supplier
# Quality Analyst" and "Quality Data Analyst", which MNC component makers do
# use. The last block drops adjacent fields that share the quality vocabulary
# and none of the work.
exclude_title_keywords:
  - intern
  - fresher
  - trainee
  - software
  - sdet
  - test automation
  - automation testing
  - qa automation
  - selenium
  - appium
  - manual testing
  - api testing
  - performance testing
  - quality analyst
  - bpo
  - call center
  - call centre
  - voice process
  - process associate
  - customer support
  - telecaller
  - tele caller
  - sales
  - business development
  - marketing
  - recruiter
  - data entry
  - civil
  - food
  - haccp
  - agri
  - dairy
  - microbiologist
  - safety officer
  - apprentice
  - campus
  - faculty
  - trainer

# Terms whose bare form is too common to trust a loose match on.
#
# Read this as documentation rather than as protection. skills.py line 45
# assigns the list to _TIGHT and nothing in the repo reads _TIGHT again, so
# listing a term here does nothing to the matcher - safety has to come from the
# alias spelling itself, which is why several obvious acronyms appear below only
# in lengthened forms. The list is kept because it is the shortlist of bare
# forms that must never be shipped as an alias: 'car' is the vehicle in every
# automotive advert, 'cp' is the control plan, 'ncr' is Delhi NCR, 'ppm' is
# preventive maintenance, 'pcb' is the State Pollution Control Board, 'sqa' is
# software quality assurance. 'qc' is here because _common.yaml used to supply
# it and, with extends: none, no longer does.
tight_terms: [cmm, vmm, spc, msa, cpk, cp, ppm, ncr, car, pdi, fai, isir, iqc,
              oqc, fqc, ipqc, ndt, mpi, dpt, mrb, ev, oem, smt, pcb, ems, spm,
              dft, hrc, mtc, qms, sqa, tpm, 8d, qc]

# Folded together before scoring compares anything - applied to the needle as
# well as to the advert, which is why a gate term can be written 'gd&t' and
# still match an advert that spells the whole thing out.
#
# Two synonyms that are NOT here and must not be added back:
#   * ncr -> non conformance report. It reads harmless and it disables the
#     gate: _norm() rewrites NCR everywhere, so "Location: Noida, Delhi NCR"
#     becomes "...delhi non conformance report...", the gate term "non
#     conformance" then matches, and a Java advert in Delhi clears a
#     manufacturing quality gate. NCR is carried as a lexicon alias instead,
#     where word boundaries apply.
#   * sqa -> supplier quality assurance. However tempting, software adverts use
#     SQA for software quality assurance, and the expansion would walk every
#     one of them straight past "supplier quality".
# Two known leaks are left in deliberately, both far rarer than the Delhi one:
# "under the client MSA" (Master Service Agreement) and legacy "SEI CMM Level
# 5" both clear the gate. Both synonyms earn their place by folding acronym and
# expansion together everywhere else.
synonyms:
  cmm: coordinate measuring machine
  vmm: vision measuring machine
  ppap: production part approval process
  apqp: advanced product quality planning
  pfmea: process failure mode and effects analysis
  dfmea: design failure mode and effects analysis
  fmea: failure mode and effects analysis
  msa: measurement system analysis
  spc: statistical process control
  cpk: process capability index
  cp/cpk: process capability index
  capa: corrective and preventive action
  8d: eight disciplines problem solving
  pdi: pre dispatch inspection
  fai: first article inspection
  isir: initial sample inspection report
  iqc: incoming quality control
  ipqc: in process quality control
  oqc: outgoing quality control
  fqc: final quality control
  qms: quality management system
  ndt: non destructive testing
  mrb: material review board
  pdca: plan do check act
  "gd&t": geometric dimensioning and tolerancing
  gdt: geometric dimensioning and tolerancing
  gage: gauge
  guage: gauge
  calliper: caliper
  molding: moulding
  mold: mould
  oem: original equipment manufacturer
  ev: electric vehicle
  smt: surface mount technology
  tpm: total productive maintenance

interview_focus: >-
  Weight questions toward one complaint and one supplier walked end to end: how
  a customer complaint was received and contained the same day, what the
  interim and permanent corrective actions were, how deep the 5-why actually
  went, and what evidence closed it - dimensional data, capability study,
  updated control plan and PFMEA, not a promise. For the supplier side, ask
  about the decision rather than the procedure: why this supplier was put on
  containment and that one developed, what the incoming rejection and PPM trend
  looked like before and after, and what an audit finding cost to fix. Advanced
  questions should be drawing-and-gauge specific - read this GD&T callout, tell
  me which gauge you would trust and why - and scenario-based escalations,
  never recitation of ISO or IATF clause numbers.

# ===========================================================================
# The skill vocabulary.
#
# Ordering matters twice over. Categories run most-important first, because
# customer quality and supplier quality are what this person actually does and
# the study page reads top down. Within a row, aliases run specific-first:
# find() breaks on the FIRST alias that matches in list order and the matched
# alias is what gets printed, so a bare carrier listed ahead of its compounds
# would make the page say "supplier performance" on an advert that said
# "quarterly supplier business review".
#
# Two rules applied throughout, both learned the hard way:
#   * every alias has to be safe on its own spelling. tight_terms is inert (see
#     above), so a risky bare acronym is omitted or lengthened, never
#     "protected". Bare 'ppm', 'warranty', 'concession', 'resident engineer',
#     'vda', 'fai', 'pcb', 'flash' and 'harness' are all absent for that reason,
#     each with its compounds kept instead.
#   * where the four audited areas produced the same skill twice, the rows are
#     merged rather than both shipped - two rows that fire on one advert double
#     the count of one skill and shuffle the study order. Where the two audits
#     disagreed about an alias, a verified false positive beats a keep: that is
#     why bare 'fai', 'ppm level(s)', 'cs-1'/'cs-2', bare 'vda', bare 'tier 2'
#     and bare 'resident engineer' lost.
# ===========================================================================
lexicon:
  # --- Customer quality: the function itself, and the complaint that starts
  # --- every conversation in it. Bare "complaint" is excluded (it carries a
  # --- BPO advert on its own); "complaint handling" and "complaint resolution"
  # --- are the two loosest survivors here and the first to cut.
  Customer Complaint Handling:
    category: Customer Quality
    aliases: [customer complaint, customer complaints, customer complain, customer complains,
              complaint handling, complaint resolution, complaint closure, complaint investigation]
  Customer Quality Function:
    category: Customer Quality
    aliases: [customer end quality, customer quality, cqe]

  # --- Supplier quality: the job title half of the profile. 'purchase quality'
  # --- does fire on prose ("purchase quality raw material from vendors"), and
  # --- it stays only because Purchase Quality is a real Indian OEM department
  # --- and this row's count is already saturated by 'supplier quality' - the
  # --- same alias on a narrow row would not be acceptable.
  Supplier Quality Engineering:
    category: Supplier Quality
    aliases: [supplier quality engineer, supplier quality engineers, supplier quality engineering,
              supplier quality assurance, supplier quality management, supplier quality executive,
              supplier quality specialist, supplier quality head, supplier quality, sqe,
              vendor quality assurance, vendor quality engineer, vendor quality,
              purchase quality, procurement quality]
  # Bare 'resident engineer' is gone from both resident rows: it fires on
  # "Resident Engineer for the highway project", a high-volume Indian civil
  # title, and both of these rows are narrow enough for one such title to set
  # the whole count. The vendor- and customer-anchored phrasings replace it.
  Resident Engineer at Supplier:
    category: Supplier Quality
    aliases: [supplier resident engineer, vendor resident engineer, resident engineer at supplier,
              resident engineer at vendor, resident quality engineer, resident inspector,
              deputation at supplier site, stationed at supplier]

  # --- The customer-facing surface: audits, scorecards, portals, escalations.
  # --- Most of these are anchored on "customer" or "oem" on purpose, because
  # --- the unanchored versions ("escalation matrix", "customer satisfaction")
  # --- are service-desk and sales filler that would fire on half the pool.
  Customer Audits & Visits:
    category: Customer Interface
    aliases: [customer quality audit, customer plant visit, customer inspection visit,
              customer audit, customer audits, customer visit, customer visits,
              oem audit, oem audits]
  Customer Scorecards & Ratings:
    category: Customer Interface
    aliases: [customer quality rating, customer performance rating, customer quality index,
              customer scorecard, customer scorecards, customer score card, customer score-card,
              quality scorecard, quality score card, customer rating, customer ratings]
  # Merged: the customer-quality area and the systems area both produced this
  # row. Bare 'csr' stays out (corporate social responsibility) and so does
  # "customer requirements", which is boilerplate in every customer-facing
  # advert and - verified - cannot even reach "customer specific requirements".
  Customer Specific Requirements (CSR):
    category: Customer Interface
    aliases: [customer specific requirements, customer-specific requirements,
              customer specific requirement, customer specific standards,
              oem specific requirements, oem requirements, customer csr, csr requirements,
              customer specification, customer specifications, customer standards,
              customer specific, customer-specific]
  Customer Portals & Reporting:
    category: Customer Interface
    aliases: [customer quality portal, customer complaint portal, customer web portal,
              oem portal, customer portal, customer portals, customer quality reporting,
              quality reporting to customer, customer reporting, customer mis, quality mis]
  Customer Escalation Management:
    category: Customer Interface
    aliases: [customer escalation, customer escalations, escalation to customer, oem escalation]
  # Bare "customer satisfaction" is excluded: "ensure customer satisfaction at
  # all times" is filler across sales, service and operations, and this row
  # would have scored Critical on no evidence while real skills slid down the
  # page. The index and survey forms are what is left carrying it.
  Customer Satisfaction & Voice of Customer:
    category: Customer Interface
    aliases: [customer satisfaction index, customer satisfaction survey, voice of customer,
              voice of the customer, customer perception, customer feedback, csi rating]
  Resident Engineer at Customer Site:
    category: Customer Interface
    aliases: [resident engineer at customer, resident engineer at customer end,
              deputation at customer, customer end support, customer site support,
              customer plant support, customer end inspection, customer end sorting,
              onsite at customer, on-site at customer]

  # --- Supplier development and qualification: the "grow a vendor" half of the
  # --- job, as distinct from auditing one. Every alias is supplier- or
  # --- vendor-qualified, so nothing here can be carried by a generic advert.
  Supplier Development:
    category: Supplier Development
    aliases: [supplier development engineer, supplier development, vendor development engineer,
              vendor development, supplier upgradation, vendor upgradation,
              supplier capability development, supplier capability building,
              supplier improvement, vendor improvement, supplier handholding,
