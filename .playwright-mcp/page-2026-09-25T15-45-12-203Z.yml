  - generic [ref=e18]:
    - paragraph [ref=e19]: Final decision
    - paragraph [ref=e20]: C. No measurable edge in the available data
    - paragraph [ref=e21]: The raw Supertrend flip on M3 gold reaches +X before -X between 43.5% and 50.0% of the time before costs, for every X from 0.25 to 2 ATR. Its best and worst excursions are equal at every horizon from 1 to 50 bars. That is the signature of a signal with no directional information. Everything downstream (stops, trailing, filters) is arithmetic on a coin flip minus a spread that is a quarter of the M3 ATR.
    - paragraph [ref=e22]: "No regime, location, timing, strength bucket or higher-timeframe context produces a subset with positive net expectancy in the development period, let alone in validation and out of sample. The same test on M1, M5 and M15 flips gives the same answer. The stop condition in your brief applies: the tested indicator does not demonstrate an edge for automated trading under the available data."
  - generic [ref=e23]:
    - heading "1. Does the raw signal have an edge?" [level=2] [ref=e24]
    - paragraph [ref=e25]: "Measured before any stop, trail or filter: first passage to +X before -X, excursions by horizon, outcome classes, year by year, and the same test on M1, M5 and M15."
    - paragraph [ref=e26]: "NO"
    - paragraph [ref=e27]: "The cleanest test is the first table: with stop = target = X, a signal with directional information hits the target more than half the time gross. This one hits 49.3% at 1 ATR, 50.0% at 2 ATR, 43.5% at 0.25 ATR (mean reversion right after the flip, which is the re-flip loss from phase 1). Gross expectancy is between -0.13R and 0.00R. After XM's spread the hit rate falls to 35% at 1 ATR and the expectancy to -0.31R, because the spread is 0.25 ATR on the median M3 signal."
    - paragraph [ref=e28]: "The excursion table says the same thing without any stop or target: the median best move and the median worst move after a signal are identical at 1, 3, 5, 10, 20, 30 and 50 bars, and MFE exceeds MAE in 48% to 50% of signals. The classification table shows the consequence: with a 1 ATR stop, 35% of signals are winners of some size and 54% are losers of some size, and that ratio is set by the spread offset, not by the signal."
    - paragraph [ref=e29]: "Year by year the net expectancy improves from -0.47R (2023) to -0.13R (2026) while the gross stays at zero: the improvement is entirely the spread shrinking from 0.42 to 0.13 ATR as gold's volatility rose. The signal did not get better; the cost got smaller. The cross-timeframe table shows M1 slightly below a coin flip gross (48.5%), M5 and M15 at 50%."
