  - generic [ref=e96]:
    - heading "2. Trade permission system" [level=2] [ref=e97]
    - paragraph [ref=e98]: The signal proposes; every gate can answer NO_TRADE with a reason tag that is logged and counted.
    - generic [ref=e99]:
      - generic [ref=e100]: Signal bar closes (TWK flip, M3)
      - generic [ref=e101]: LEVEL 1 HARD SAFETY
      - generic [ref=e102]: "Daily loss limit reached? -> NO_TRADE: DAILY_LOSS_LIMIT"
      - generic [ref=e103]: "Losing streak: 3 -> paused 60 min, 4 -> stopped for the day -> NO_TRADE: CONSEC_LOSS_PAUSE / CONSEC_LOSS_STOP_DAY"
      - generic [ref=e104]: "Spread > 0.5 x ATR or > 10% of the 2R target? -> NO_TRADE: SPREAD_VS_ATR / SPREAD_VS_REWARD"
      - generic [ref=e105]: LEVEL 2 STOP THE DESTRUCTIVE BEHAVIOUR
      - generic [ref=e106]: "Closer than 2 ATR to the previous signal? -> NO_TRADE: SIGNAL_DISTANCE"
      - generic [ref=e107]: "Two losses in this direction and no reset (newer pivot + 1 ATR move)? -> NO_TRADE: MAX_ATTEMPTS_DIR"
      - generic [ref=e108]: "Direction still holds 2 bars later? If not -> NO_TRADE: CONFIRM_FAILED"
      - generic [ref=e109]: LEVEL 3 ENVIRONMENT
      - generic [ref=e110]: "Any of the last 3 bars wider than 2 ATR? -> NO_TRADE: LARGE_CANDLE"
      - generic [ref=e111]: (off) ATR above 1.5x median -> VOL_EXTREME; chop score >= 4 -> CHOP_LOCK
      - generic [ref=e112]: SHIPPED FILTERS AND STOP
      - generic [ref=e113]: Volume ratio, M1 box, M3 box, ADX as today; pivot or purple stop; 2R target
      - generic [ref=e114]: RISK
      - generic [ref=e115]: "Lot = equity x 0.5% / stop (half if ATR > 1.25x median or after 2 losses). Minimum lot would risk > 2%? -> NO_TRADE: RISK_MIN_LOT"
      - generic [ref=e116]: "ENTRY, then management: purple trail, +1R lock +0.25R, +1.5R lock +0.75R, +900 pts lock and 1:1 trail; hold through opposite signals"
    - paragraph [ref=e117]: Every NO_TRADE carries its tag into the decision log, so the next backtest or the live journal can be aggregated by reason exactly as in section 4. The baseline already answers NO_TRADE 22,953 times out of 26,352 signals; the recommended stack answers it 25,517 times.
