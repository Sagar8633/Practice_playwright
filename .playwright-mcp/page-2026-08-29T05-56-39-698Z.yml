            - paragraph [ref=f9e1660]: "The five to know cold: Broken access control (IDOR — the one above); injection (SQL and command — parameterised queries are the fix); authentication failures (weak tokens, no expiry, no lockout); security misconfiguration (default credentials, verbose errors, missing headers); and sensitive data exposure (secrets in logs, PII in URLs, unencrypted transport). Learn these five properly rather than reciting all ten."
