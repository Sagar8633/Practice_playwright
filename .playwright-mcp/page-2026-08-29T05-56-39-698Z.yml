              - text: Practical example —
              - emphasis [ref=f9e1729]: the STAR structure, filled with your actual work
            - code [ref=f9e1731]: "QUESTION: \"Tell me about a time you had to deliver bad news about quality.\" SITUATION (15 seconds - set the scene, no rambling) Two days before an ITMS release, regression on the ANPR module was sitting at 78% pass. The client demo was already scheduled and the date was public. TASK (10 seconds - what was YOURS to own) I owned the go/no-go recommendation for that release. ACTION (60 seconds - the part they are actually assessing) I did not take \"78%\" to the release call, because a percentage invites an argument about the percentage. I triaged the 22 failures into three buckets: 14 were environment issues on the test rig, 5 were stale test data, and 3 were genuine product defects. I brought only those 3 to the call, each with reproduction steps, a severity, and the user impact in plain language. I proposed shipping with two fixed and the third deferred behind a config flag, and I said clearly which risk we would be accepting if we did that. RESULT (20 seconds - outcome, then what CHANGED because of it) We shipped on the original date. The deferred defect was fixed the next sprint and never reached a customer. More importantly, the bucket split became how we report release readiness now - the release call stopped arguing about pass percentages and started discussing three named risks. WHY THIS WORKS - It shows judgement, not just diligence. - It translates a QA metric into a business decision. - It ends with a durable change, which is what \"lead\" means. - It never blames a person or another team."
