    - paragraph [ref=e293]: "The M1 row settles the M1 question: for three of the five years the spread alone was more than a tenth of the profit target on three quarters of the signals. No filter recovers that. On M3 the ratio is half that, on M15 a quarter; the cost gate is therefore a timeframe decision more than a per-trade decision, and per-trade gating on M3 (A/B rows cost_reward, cost_stop) removed winners and losers in the same proportion."
