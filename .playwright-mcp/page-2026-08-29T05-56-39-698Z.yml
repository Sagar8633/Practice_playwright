            - code [ref=f9e1422]: "# 1. WHAT IS RUNNING, and is anything unhappy? kubectl get pods -n staging # NAME READY STATUS RESTARTS AGE # orders-api-7d4f8b-x2k9 0/1 CrashLoopBackOff 7 12m # ^ there is your problem # 2. WHY is it unhappy? Events at the bottom are the useful part. kubectl describe pod orders-api-7d4f8b-x2k9 -n staging # Events: # Warning Failed ... Error: secret \"db-credentials\" not found # 3. WHAT did the app say before it died? kubectl logs orders-api-7d4f8b-x2k9 -n staging kubectl logs orders-api-7d4f8b-x2k9 -n staging --previous # the crashed instance # 4. GET INSIDE and check what the app can actually see kubectl exec -it orders-api-7d4f8b-x2k9 -n staging -- /bin/sh # $ env | grep DATABASE # $ curl http://payments-svc:8080/health # 5. REACH IT FROM YOUR LAPTOP without a public URL kubectl port-forward svc/orders-api 8080:80 -n staging # now http://localhost:8080 hits the cluster service - run your API tests at it # 6. THE VOCABULARY, in one line each # Pod - one or more containers running together. The smallest unit. # Deployment - keeps N copies of a pod alive, handles rolling updates. # Service - a stable name and IP in front of pods that come and go. # ConfigMap - non-secret configuration injected as env vars or files. # Secret - the same, for credentials (base64, not encrypted by default). # Namespace - a folder that separates staging from production."
