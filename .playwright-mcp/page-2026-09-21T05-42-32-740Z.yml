- generic [active] [ref=f5e1]: "//@version=6 // ============================================================================ // XAU ICEBERG / ABSORPTION -- SECTION 0 : CANONICAL SHARED GLOBALS // Everything from here to the SECTION 18 banner is BYTE-IDENTICAL in the // indicator file and the strategy file. The ONLY differences are: // (a) the declaration call immediately below, and // (b) SECTION 18 (plots + alerts vs orders + alert_message). // NO module below SECTION 0 may re-declare anything defined here. // ============================================================================ indicator(\"ICEburg\", \"ICEburg\", overlay = true, max_labels_count = 500, max_lines_count = 500, max_boxes_count = 500, max_bars_back = 1000) // --- STRATEGY TWIN: swap the call above for exactly this, change nothing else. // strategy(\"XAU Iceberg / Absorption [S]\", \"XAU-ICE-S\", overlay = true, // initial_capital = 10000, // default_qty_type = strategy.fixed, // qty ALWAYS passed explicitly // default_qty_value = 1, // commission_type = strategy.commission.cash_per_contract, // commission_value = 0.25, // == i_spreadUsd, charged per FILL // slippage = 10, // TICKS. 10 * 0.01 = 0.10 USD/side // margin_long = 5.0, margin_short = 5.0, // 20x max lev. v6 DEFAULT IS 100, not 0 // pyramiding = 0, process_orders_on_close = false, // calc_on_every_tick = false, // strategy() ONLY - compile error on indicator() // max_labels_count = 500, max_lines_count = 500, max_boxes_count = 500, // max_bars_back = 1000) // // --------------------------------------------------------------------------- // LATENCY CONTRACT (stated once, here, contradicted nowhere): // official signal = close of a CONFIRMED bar // + i_pivotRight bars pivot confirmation - the ONLY structural delay // + 0 bars every other gate reads the confirmed bar or earlier // + 1 bar strategy fill only (process_orders_on_close = false) // // PROXY CONTRACT: TradingView exposes no order book, no bid/ask tape and no // aggressor flag for spot XAUUSD. `volume` on these feeds is TICK COUNT - the // number of price changes, not contracts and not USD notional. Everything // derived from it (rvol, deltaProxy, buyPressure, sellPressure, cvdProxy and // every \"absorption\" number) is a PROXY. User-facing text never claims real // order flow, real delta, or knowledge of hidden institutional orders. // // PINE v6 NOTES THAT SHAPE THIS FILE (verified against the v6 migration guide): // * a \"bool\" is ALWAYS true or false - never na. na()/nz()/fixnan() REJECT // bool arguments. Do not wrap a bool in nz(). // * `and`/`or` evaluate LAZILY, so every ta.* call sits at global scope and is // referenced by name inside conditions - never called inside one. // * numbers do NOT auto-cast to bool - use bool(x). // * int/int yields a FRACTION in v6, so all scoring maths is explicit float. // * timeframe.period always carries a multiplier (\"1D\", not \"D\"). // ============================================================================ // ---------------------------------------------------------------- G1 GROUPS GC = \"0 - Core\" GV = \"0 - Volume & Delta Proxy\" GS = \"0 - Session & Timezone\" GH = \"0 - Higher-Timeframe Bias\" GR = \"0 - Risk & Cost\" GD = \"0 - Display\" // ------------------------------------------ G2 CORE INPUTS (SINGLE SOURCE) i_atrLen = input.int(14, \"ATR length\", minval = 2, maxval = 200, group = GC, tooltip = \"ONE ATR for the whole script. Every ATR-scaled tolerance in every module reads this series. Do not shorten it on 1M: a short ATR on 1M gold is dominated by spread bounce.\", display = display.none) i_pivotLeft = input.int(5, \"Pivot LEFT legs\", minval = 1, maxval = 50, group = GC, tooltip = \"LEFT legs cost ZERO delay - the condition is already satisfied when the pivot bar prints.\", display = display.none) i_pivotRight = input.int(3, \"Pivot RIGHT legs\", minval = 1, maxval = 50, group = GC, tooltip = \"ta.pivothigh(src,L,R) returns the pivot R bars AFTER it printed, so the pivot bar is bar_index - R. Take the PRICE from the function return, never from high[R]. THIS INPUT IS THE SYSTEM SIGNAL LATENCY.\", display = display.none) i_minScore = input.float(75.0, \"Min setup score (0-100)\", minval = 0, maxval = 100, step = 1, group = GC, tooltip = \"THE score gate - the only one in the file. Presets: 1M 80 / 5M 75 / 15M 70. This is a SETUP CONFIDENCE score, NOT a win probability.\", display = display.none) i_mode = input.string(\"Clean\", \"Display mode\", options = [\"Clean\", \"Debug\"], group = GD, display = display.none) i_showStats = input.bool(false, \"Show stats / failure panel\", group = GD, display = display.none) i_rvolLen = input.int(50, \"Relative-volume baseline (bars)\", minval = 5, maxval = 500, group = GV, display = display.none) i_volTod = input.bool(true, \"Normalise volume by time of day\", group = GV, tooltip = \"XAUUSD tick volume has a 5-10x diurnal profile. Without this, a flat volume/SMA is a session clock wearing a participation costume: every London bar looks like high relative volume and every Asian bar looks dead, regardless of what actually happened.\", display = display.none) i_deltaMode = input.string(\"CLV x Volume (gap-aware)\", \"Delta proxy estimator\", options = [\"CLV x Volume (gap-aware)\", \"Wick-weighted\", \"Tick rule (volume-free)\"], group = GV, tooltip = \"Lower-timeframe intrabar reconstruction (request.security_lower_tf) is deliberately NOT offered: TradingView own reference states such scripts may calculate differently on historical and realtime bars, which repaints. It is excluded from this file, not merely defaulted off.\", display = display.none) i_wickWeight = input.float(1.5, \"Wick weight (lambda)\", minval = 0.0, maxval = 5.0, step = 0.1, group = GV, tooltip = \"lambda = 1 collapses EXACTLY back to plain CLV. Above 1 up-weights rejection wicks, which is the tell this system is built on.\", display = display.none) i_spreadUsd = input.float(0.25, \"Typical spread (USD / oz)\", minval = 0.0, step = 0.01, group = GR, tooltip = \"XAUUSD spot runs 0.15-0.35 USD. This is the NOISE FLOOR of the entire system: nothing in this file is denominated in ticks or points, because mintick is 0.01 on most gold feeds and 0.001 on others.\", display = display.none) i_slipUsd = input.float(0.10, \"Slippage per side (USD / oz)\", minval = 0.0, step = 0.01, group = GR, display = display.none) i_riskPct = input.float(0.50, \"Risk per trade (% of equity)\", minval = 0.01, maxval = 5.0, step = 0.05, group = GR, display = display.none) i_rrMin = input.float(2.0, \"Minimum NET R:R (gate on TP2)\", minval = 0.5, step = 0.1, group = GR, tooltip = \"Setups that cannot reach this after costs are rejected as POOR RR.\", display = display.none) i_tz = input.string(\"America/New_York\", \"Trading-day timezone (IANA)\", group = GS, tooltip = \"Governs the day and week boundary only. Each SESSION resolves in its own zone below, so DST is handled correctly even in the weeks when Europe and the US are out of step.\", display = display.none) i_sessMode = input.string(\"London + NY\", \"Active sessions\", options = [\"Off (24h)\", \"London + NY\", \"Overlap only\", \"All\"], group = GS, display = display.none) i_sessEdge = input.int(5, \"Session edge trim (minutes)\", minval = 0, maxval = 90, group = GS, display = display.none) i_htfSel = input.string(\"Auto\", \"HTF bias timeframe\", options = [\"Auto\", \"5\", \"15\", \"60\", \"240\", \"1D\"], group = GH, display = display.none) i_htfMode = input.string(\"Soft (score only)\", \"HTF bias mode\", options = [\"Off\", \"Soft (score only)\", \"Block opposite\", \"Require aligned\"], group = GH, tooltip = \"Soft is the default on purpose: this is a REVERSAL system, and a hard trend filter deletes the highest-value setup it has - absorption against an exhausted move.\", display = display.none) i_htfEmaLen = input.int(50, \"HTF EMA length\", minval = 2, maxval = 400, group = GH, display = display.none) i_htfDeadAtr = input.float(0.25, \"HTF neutral dead zone (x HTF ATR)\", minval = 0.0, step = 0.05, group = GH, display = display.none) // ----------------------------------------------------- G3 UNIVERSAL HELPERS // na PROPAGATES. It is never silently replaced by a bound: substituting `lo` for // na is exactly what turns a missing HTF bias into a full penalty on one side and // a full bonus on its mirror. Callers state their own na policy at the call site. f_clamp(float x, float lo, float hi) => na(x) ? na : math.max(lo, math.min(hi, x)) f_clamp01(float x) => f_clamp(x, 0.0, 1.0) // THE ramp - one definition, used by every sub-score in the file. // hi <= lo is a CONFIGURATION ERROR and returns na (so the gate reading it fails), // never 1.0 - \"set the threshold to 0 to disable\" must not hand a module a free // full sub-score. f_ramp(float x, float lo, float hi) => na(x) or hi <= lo ? na : f_clamp01((x - lo) / (hi - lo)) f_sgnDead(float x, float dz) => na(x) ? 0 : x > dz ? 1 : x < -dz ? -1 : 0 f_px(float p) => na(p) ? \"n/a\" : str.tostring(p, format.mintick) f_pct(float x) => na(x) ? \"n/a\" : str.tostring(x * 100.0, \"#.0\") + \"%\" // --------------------------------------------------------- G4 CORE SERIES // THE definition of \"confirmed\". Every state mutation, counter, array push and // signal evaluation in every module sits inside `if confirmed and warmupOk`. // barstate.islast blocks are DISPLAY ONLY and read already-committed state. confirmed = barstate.isconfirmed tick = syminfo.mintick atr = ta.atr(i_atrLen) // The ATR floor is in USD, not ticks: a tick-denominated floor mis-scales 10x // between a 0.01 and a 0.001 gold feed. aRef = math.max(nz(atr, 0.0), i_spreadUsd) atrPrev = nz(atr[1], aRef) // spike-free reference for the news guard costRt = i_spreadUsd + 2.0 * i_slipUsd // round-turn cost, USD/oz // THE tolerance primitive. Every \"is this close enough to be the same price?\" test // - EQ clusters, level proximity, retest touch, sweep reclaim buffer, zone break // buffer, duplicate suppression, FVG minimum - is f_tol(mult). Never a raw ATR // multiple (it collapses below spread in dead tape), never a tick count. f_tol(float mult) => math.max(mult * aRef, i_spreadUsd) barRange = math.max(high - low, tick) bodyAbs = math.abs(close - open) bodyTop = math.max(open, close) bodyBot = math.min(open, close) // DIRECTION CONVENTION, stated once: dir = +1 LONG/bullish, dir = -1 SHORT. // A LiquidityLevel side field uses the OPPOSITE polarity (+1 = born from a high = // acts as resistance), so level eligibility is ALWAYS `lvl.side == -dir`. f_wickFrac(int dir) => dir > 0 ? (bodyBot - low) / barRange : (high - bodyTop) / barRange f_closeLoc(int dir) => dir > 0 ? (close - low) / barRange : (high - close) / barRange // Identity: f_closeLoc(1) + f_closeLoc(-1) == 1 exactly, on every bar. These are the // ONLY direction-dependent primitives in the file, which is what makes long/short // symmetry STRUCTURAL rather than something a reviewer has to check by eye. // ------------------------------- G5 TICK VOLUME (PROXY - NOT CONTRACTS) var bool hasVol = false if not hasVol and not na(volume) and volume > 0 hasVol := true vol = nz(volume, 0.0) volSma = ta.sma(vol, i_rvolLen) // Time-of-day normalisation. Without it, rvol measures the clock, not participation. // 48 half-hour slots; each keeps its own EWMA baseline of volume. todSlot = hour(time, \"Etc/UTC\") * 2 + (minute(time, \"Etc/UTC\") >= 30 ? 1 : 0) var array<float> todBase = array.new<float>(48, na) todRef = array.get(todBase, todSlot) if confirmed and hasVol array.set(todBase, todSlot, na(todRef) ? vol : todRef + 0.05 * (vol - todRef)) // ONE na policy for rvol, stated once: na when the feed carries no usable volume - // never 0 (which would make every thin-volume veto a 100% kill switch) and never 1 // (which fabricates average participation out of nothing). // HARD GATES : written `not hasVol or rvol >= t` -> BYPASS when unknown // SCORE WEIGHT: w_rvol is zeroed and the rubric renormalised to 100 rvolFlat = hasVol and volSma > 0 ? vol / volSma : na rvolTod = hasVol and not na(todRef) and todRef > 0 ? vol / todRef : na rvol = i_volTod ? nz(rvolTod, rvolFlat) : rvolFlat effVol = hasVol ? vol : 1.0 // ---------------------- G6 DELTA PROXY (gap-aware; ratio in [-1, +1]) trHi = math.max(high, nz(close[1], high)) // True-Range bounds. Reduce IDENTICALLY to trLo = math.min(low, nz(close[1], low)) // H/L when there is no gap, and attribute trRn = trHi - trLo // the gap to a side when there is one. rClv = trRn > 0 ? (2.0 * close - trHi - trLo) / trRn : na uWick = trHi - bodyTop dWick = bodyBot - trLo bUp = math.max(close - open, 0.0) + i_wickWeight * dWick bDn = math.max(open - close, 0.0) + i_wickWeight * uWick rWk = (bUp + bDn) > 0 ? (bUp - bDn) / (bUp + bDn) : na // Tick rule: the universal fallback, and the only estimator that needs no volume. var float rTick = 0.0 prevClose = nz(close[1], close) rTick := close > prevClose ? 1.0 : close < prevClose ? -1.0 : close > open ? 1.0 : close < open ? -1.0 : nz(rTick[1], 0.0) rSel = i_deltaMode == \"Wick-weighted\" ? rWk : i_deltaMode == \"Tick rule (volume-free)\" ? rTick : rClv ratio = f_clamp(nz(rSel, rTick), -1.0, 1.0) deltaProxy = ratio * effVol buyPressure = (1.0 + ratio) / 2.0 sellPressure = (1.0 - ratio) / 2.0 // b + s == 1 EXACTLY, by construction // Mirroring a bar maps ratio -> -ratio and swaps buyPressure <-> sellPressure. // Zero directional bias here is structural, not a threshold choice. // --------------- G7 TRADING DAY / WEEK / SESSIONS (one owner, one clock) dayId = year(time, i_tz) * 10000 + month(time, i_tz) * 100 + dayofmonth(time, i_tz) weekId = year(time, i_tz) * 100 + weekofyear(time, i_tz) newDay = not na(dayId[1]) and dayId != dayId[1] newWeek = not na(weekId[1]) and weekId != weekId[1] // Each session resolves in its OWN IANA zone, so DST is correct including the // ~4 weeks a year when the EU and US offsets are out of step and the overlap widens. tAsia = time(timeframe.period, \"0900-1500\", \"Asia/Tokyo\") tLondon = time(timeframe.period, \"0800-1630\", \"Europe/London\") tNy = time(timeframe.period, \"0800-1700\", \"America/New_York\") inAsia = not na(tAsia) inLondon = not na(tLondon) inNy = not na(tNy) inOverlap = inLondon and inNy sessSel = i_sessMode == \"Off (24h)\" ? true : i_sessMode == \"Overlap only\" ? inOverlap : i_sessMode == \"All\" ? (inAsia or inLondon or inNy) : (inLondon or inNy) // Session QUALITY: direction-free, 0..1. The ONLY session number the score reads. sessQual = inOverlap ? 1.0 : (inLondon or inNy) ? 0.80 : inAsia ? 0.35 : 0.0 // Edge trim fires on EVERY session open, not only the first open of a contiguous // run - that is what makes it bite at the NY open while London is already active. anyOpen = (inAsia and not inAsia[1]) or (inLondon and not inLondon[1]) or (inNy and not inNy[1]) var int lastOpenBar = na if anyOpen lastOpenBar := bar_index edgeOk = i_sessEdge <= 0 or na(lastOpenBar) or (bar_index - lastOpenBar) * timeframe.in_seconds() >= i_sessEdge * 60 sessOk = sessSel and edgeOk // na(lastOpenBar) passing is deliberate: it stops sessOk latching false forever in // \"Off (24h)\" mode, where sessSel never has a false->true edge to latch on. // SESSION open price, NOT the chart-day open: on a gold CFD the daily boundary is // 17:00/18:00 NY, so a day open is 8-9 hours stale by the time London trades. var float sessOpenPx = na if anyOpen or na(sessOpenPx) sessOpenPx := open // CVD epoch. EVERY divergence test - pivot-confirmed AND fast - must additionally // require cvdEpoch equality, or the first bars of every session compare a // post-reset value against a pre-reset extreme and diverge trivially every morning. var int cvdEpoch = 0 var float cvdProxy = 0.0 cvdEpoch := nz(cvdEpoch[1], 0) + (newDay ? 1 : 0) cvdProxy := (newDay ? 0.0 : nz(cvdProxy[1], 0.0)) + deltaProxy // ------------------------------------ G8 NON-REPAINTING HTF BIAS // The delivered value is the last FULLY CLOSED HTF bar, identical on history and // in realtime. Staleness is D_h in [0, T_h): zero the instant HTF bar n opens, at // most one HTF period just before it closes. // The one-bar shift is done with EXPLICIT var state rather than `expr[1]` on a // function local, so there is no ambiguity about what is being offset. htfAuto = timeframe.in_seconds() <= 60 ? \"15\" : timeframe.in_seconds() <= 300 ? \"60\" : timeframe.in_seconds() <= 900 ? \"240\" : timeframe.in_seconds() <= 3600 ? \"1D\" : \"1W\" htfPick = i_htfSel == \"Auto\" ? htfAuto : i_htfSel // HARD GUARD: a \"higher\" timeframe that is <= the chart timeframe turns // lookahead_on into a genuine future leak. Fall back to Auto, never to the choice. htfTf = timeframe.in_seconds(htfPick) > timeframe.in_seconds() ? htfPick : htfAuto f_htfBias() => float e = ta.ema(close, i_htfEmaLen) // hoisted: lazy and/or must not skip these float a = ta.atr(i_atrLen) float ph = ta.pivothigh(high, 2, 2) float pl = ta.pivotlow(low, 2, 2) var float h1 = na var float h2 = na var float l1 = na var float l2 = na if not na(ph) h2 := h1 h1 := ph if not na(pl) l2 := l1 l1 := pl float dz = i_htfDeadAtr * nz(a, 0.0) int bSt = na(h1) or na(h2) or na(l1) or na(l2) ? 0 : h1 > h2 and l1 > l2 ? 1 : h1 < h2 and l1 < l2 ? -1 : 0 // The EMA source is SIDE ONLY. \"slope AND side must agree\" is a TAUTOLOGY: // e - e[1] = alpha*(close - e[1]) and close - e = (1-alpha)*(close - e[1]) are // positive multiples of the same quantity and can never disagree. // VWAP as a third source is DELETED: ta.vwap() raises a RUNTIME ERROR on // volumeless gold feeds, and in a 1D/1W request context VWAP equals that bar // own hlc3, so the source degenerates to \"closed above its own midpoint\". int bNow = bSt != 0 and bSt == f_sgnDead(close - e, dz) ? bSt : 0 bool rdyNow = not na(e) and not na(h2) and not na(l2) var int bPrev = 0 var bool rdyPrev = false int bOut = bPrev bool rdyOut = rdyPrev bPrev := bNow rdyPrev := rdyNow [bOut, rdyOut] [htfBiasRaw, htfReadyRaw] = request.security(syminfo.tickerid, htfTf, f_htfBias(), gaps = barmerge.gaps_off, lookahead = barmerge.lookahead_on) htfBias = nz(htfBiasRaw, 0) // int CAN be na; a bool CANNOT, so htfReady is used raw htfReady = htfReadyRaw // ONE HTF contract. Unknown bias fails OPEN for the soft modes and CLOSED for // \"Require aligned\", so the hard mode is never weaker than Off. f_htfAllow(int dir) => i_htfMode == \"Off\" or i_htfMode == \"Soft (score only)\" ? true : not htfReady ? i_htfMode == \"Block opposite\" : i_htfMode == \"Block opposite\" ? (htfBias == 0 or htfBias == dir) : htfBias == dir // Signed scalar for the score. Unknown bias is 0.0 for BOTH sides, so it can never // hand one direction a bonus and its mirror an equal penalty out of missing data. f_htfScalar(int dir) => not htfReady or htfBias == 0 ? 0.0 : htfBias == dir ? 1.0 : -1.0 // ------------------------------ G9 WARMUP + FEED HEALTH (one gate) warmupOk = bar_index > math.max(i_rvolLen, i_atrLen * 3) + i_pivotLeft + i_pivotRight + 5 and not na(atr) and atr > 0 isGold = str.contains(str.upper(syminfo.ticker), \"XAU\") or str.contains(str.upper(syminfo.ticker), \"GOLD\") tickWarn = tick != 0.01 // the strategy slippage is a const int and cannot follow the feed // Every module top-level trigger is exactly: if confirmed and warmupOk // ========================= END SECTION 0 ==================================== // ============================================================================ // SECTION 1 : TYPES + ENUMS (one place, because Pine requires declaration // before use and several of these cross-reference each other) // // ONE vocabulary for \"why not\". Three overlapping taxonomies were merged here: // the pre-signal GATE causes (owned by SECTION 13 - Filters, first-match-wins // in the fixed priority order below) and the post-arm DEATH causes (owned by // SECTION 15 - Failure Analysis). The no-trade panel, the failure histogram, // the state machine and the alert payload all speak THIS enum and no other. // ============================================================================ enum NoTradeReason ok = \"OK\" // ---- GATE causes: evaluated most-upstream-first, first match wins ------- warmup = \"WARMING UP\" outsideSess = \"OUTSIDE SESSION\" sessEdge = \"SESSION EDGE TRIM\" lowAtr = \"DEAD TAPE (LOW ATR)\" newsSpike = \"HIGH VOLATILITY / SPIKE\" choppy = \"CHOPPY MARKET\" lowVolume = \"LOW VOLUME\" noLiquidity = \"NO LIQUIDITY\" midRange = \"MIDDLE OF RANGE\" extended = \"EXTENDED MOVE\" vwapFar = \"TOO FAR FROM VWAP\" noSweep = \"NO SWEEP\" noAbsorption = \"NO ABSORPTION\" zoneDead = \"ZONE INVALIDATED\" noRejection = \"NO REJECTION\" noDisplace = \"NO DISPLACEMENT\" noBos = \"NO BOS\" noRetest = \"NO RETEST\" lowScore = \"LOW CONFIDENCE\" poorRr = \"POOR RR\" wideStop = \"STOP TOO WIDE\" conflict = \"DIRECTIONAL CONFLICT\" htfBlock = \"HTF BIAS OPPOSED\" cooldown = \"COOLDOWN\" lossCooldown = \"LOSS COOLDOWN\" lossStreak = \"LOSS STREAK HALT\" duplicate = \"DUPLICATE SIGNAL\" maxSetups = \"SETUP SLOTS FULL\" tradeOpen = \"TRADE ALREADY OPEN\" outOfWindow = \"OUTSIDE BACKTEST WINDOW\" // ---- DEATH causes: why an armed setup died before or after entry ------- dTimeout = \"EXPIRED (TIMEOUT)\" dZoneBroken = \"ZONE BROKEN\" dFalseSweep = \"FALSE SWEEP\" dDispFail = \"DISPLACEMENT FAILED\" dBosFail = \"BOS FAILED (FAKEOUT)\" dRetestFail = \"RETEST FAILED\" dEvicted = \"EVICTED (SLOT REUSED)\" dConflict = \"KILLED BY CONFLICT\" dSessionEnd = \"SESSION CLOSED\" dStopped = \"STOPPED OUT\" dTarget = \"TARGET REACHED\" dTimeStop = \"TIME STOP\" // Setup lifecycle. RANK IS STRICTLY INCREASING and `dead` is ABSORBING - that // pair of invariants is the whole non-repainting argument for the state machine. // Confirmation mode adds exactly one legal edge: bos -> armed (skipping retest). enum SetupState idle = \"IDLE\" absorbing = \"ABSORBING\" rejected = \"REJECTED\" displaced = \"DISPLACED\" bos = \"BOS\" retest = \"AWAITING RETEST\" armed = \"ARMED\" active = \"ACTIVE\" dead = \"DEAD\" enum ZoneState zPending = \"PENDING\" zLive = \"LIVE\" zBroken = \"BROKEN\" zExpired = \"EXPIRED\" enum LevelKind pdh = \"PDH\" pdl = \"PDL\" pwh = \"PWH\" pwl = \"PWL\" psh = \"PSH\" psl = \"PSL\" csh = \"CSH\" csl = \"CSL\" swingHi = \"SWING H\" swingLo = \"SWING L\" eqh = \"EQH\" eql = \"EQL\" poc = \"POC\" dayOpenK = \"D-OPEN\" // ---------------------------------------------------------------- TYPES // `side` polarity is the ONE place in this file that is not dir-polarity: // side = +1 the level was born from a HIGH -> it is RESISTANCE // side = -1 the level was born from a LOW -> it is SUPPORT // A LONG (dir = +1) therefore needs a SUPPORT level, i.e. `lvl.side == -dir`. type LiquidityLevel float price = na LevelKind kind = LevelKind.swingLo int side = 0 int createdBar = 0 int touches = 0 int lastTouch = 0 float strength = 0.0 // 0..1 bool active = true bool swept = false type Swing float price = na int bar = 0 int dir = 0 // +1 = swing HIGH, -1 = swing LOW bool broken = false type SweepCand int dir = 0 // +1 = SELL-side liquidity swept (bullish candidate) float lvlPrice = na // SNAPSHOT at candidate open - a later merge must not move it float extreme = na int openBar = 0 int lvlIdx = -1 float maxPen = 0.0 float quality = 0.0 // 0..1 bool resolved = false type IcebergZone int id = 0 int dir = 0 float top = na float bottom = na int bornBar = 0 int bornTime = 0 float atrRef = na // FROZEN at creation - the break buffer never re-scales float strength = 0.0 // 0..1 int tests = 0 int lastTest = 0 float invalid = na ZoneState state = ZoneState.zPending float swpExt = na int breakRun = 0 box bx = na label lb = na type DispLeg int dir = 0 float originLo = na float originHi = na float extreme = na float fvgLo = na float fvgHi = na bool hasFvg = false float strength = 0.0 int bar = 0 type RiskPlan int dir = 0 float entry = na float stop = na float tp1 = na float tp2 = na float tp3 = na float risk = na // NET risk per oz, cost included float rr1 = na float rr2 = na float rr3 = na float qRr = 0.0 // 0..1, feeds the score modifier bool ok = false NoTradeReason why = NoTradeReason.ok type Setup int id = 0 int dir = 0 SetupState st = SetupState.idle int bornBar = 0 int stBar = 0 int zoneId = 0 float zoneTop = na float zoneBot = na float swpExt = na float bosLvl = na float dispOrg = na float dispFar = na float retestLv = na float score = na RiskPlan plan = na NoTradeReason death = NoTradeReason.ok // evidence snapshot, frozen at the signal bar, for the panel and the alert float qLevel = 0.0 float qSweep = 0.0 float qRvol = 0.0 float qAbsorb = 0.0 float qReject = 0.0 float qDisp = 0.0 float qBos = 0.0 float qRetest = 0.0 // drawing handles - every one of these is explicitly deleted on death box bx = na label lb = na line lnE = na line lnS = na line ln1 = na line ln2 = na line ln3 = na // The ONE virtual trade tracker. Multi-slot on purpose: a single slot silently // discards every trade that outlives the cooldown, which biases the loss streak // towards fast-resolving trades only. type VTrade int dir = 0 int openBar = 0 float entry = na float stop = na float be = na float tp1 = na float tp2 = na float tp3 = na float risk = na bool tp1Hit = false bool tp2Hit = false bool isOpen = true float mfe = 0.0 float mae = 0.0 float rMult = na int closeBar = 0 NoTradeReason outcome = NoTradeReason.ok type DirStats int armed = 0 int signals = 0 int tp1 = 0 int tp2 = 0 int tp3 = 0 int sl = 0 int be = 0 int wins = 0 int losses = 0 float sumR = 0.0 float grossW = 0.0 float grossL = 0.0 // ========================= END SECTION 1 ==================================== // ============================================================================ // SECTION 2 : METHODS + PURE HELPERS ON TYPES // Pure functions only - no state, no drawings, no side effects - so every // section below may call these in any order. // ============================================================================ // str.tostring() on an enum value returns that member's TITLE, which is why the // enum carries human-readable titles: one vocabulary, rendered one way. f_reason(NoTradeReason r) => str.tostring(r) f_dirName(int dir) => dir > 0 ? \"LONG\" : dir < 0 ? \"SHORT\" : \"FLAT\" f_dirWord(int dir) => dir > 0 ? \"Bullish\" : dir < 0 ? \"Bearish\" : \"Neutral\" f_mark(bool b) => b ? \"✓\" : \"✗\" f_dirCol(int dir, color up, color dn) => dir > 0 ? up : dn // --------------------------------------------------------- LEVEL METHODS // Eligibility is ALWAYS lvl.side == -dir. A LONG needs a level born from a LOW. method isFor(LiquidityLevel this, int dir) => this.active and this.side == -dir and not na(this.price) method distUsd(LiquidityLevel this, float px) => na(this.price) ? na : math.abs(px - this.price) // Level quality 0..1. Touch count dominates: an equal-highs cluster tested three // times is a materially better place to find resting liquidity than one swing. method quality(LiquidityLevel this) => float kindW = switch this.kind LevelKind.pdh => 0.90 LevelKind.pdl => 0.90 LevelKind.pwh => 1.00 LevelKind.pwl => 1.00 LevelKind.psh => 0.75 LevelKind.psl => 0.75 LevelKind.csh => 0.60 LevelKind.csl => 0.60 LevelKind.eqh => 0.95 LevelKind.eql => 0.95 LevelKind.poc => 0.70 LevelKind.dayOpenK=> 0.50 => 0.55 // bare swing high / low float touchW = f_clamp01(0.55 + 0.15 * math.min(this.touches, 3)) f_clamp01(kindW * touchW) // ---------------------------------------------------------- ZONE METHODS method mid(IcebergZone this) => (this.top + this.bottom) / 2.0 method height(IcebergZone this) => this.top - this.bottom method isLive(IcebergZone this) => this.state == ZoneState.zLive or this.state == ZoneState.zPending // A wick THROUGH the zone IS the absorption and must never kill it. Only // consecutive CONFIRMED CLOSES beyond the frozen buffer count as a break. method breachPx(IcebergZone this) => float buf = math.max(0.15 * nz(this.atrRef, aRef), i_spreadUsd) this.dir > 0 ? this.bottom - buf : this.top + buf method closedBeyond(IcebergZone this) => this.dir > 0 ? close < this.breachPx() : close > this.breachPx() // Price is \"in\" the zone if it trades anywhere inside it on this bar. method touched(IcebergZone this) => not na(this.top) and not na(this.bottom) and high >= this.bottom and low <= this.top // ----------------------------------------------------- RISK PLAN METHODS method rrText(RiskPlan this) => na(this.rr2) ? \"n/a\" : \"1:\" + str.tostring(this.rr2, \"#.0#\") method stopDist(RiskPlan this) => na(this.entry) or na(this.stop) ? na : math.abs(this.entry - this.stop) // The one-line trade block shown on the chart and repeated in the alert payload. method blockText(RiskPlan this, float score) => f_dirName(this.dir) + \"\\nEntry: \" + f_px(this.entry) + \"\\nSL: \" + f_px(this.stop) + \"\\nTP1: \" + f_px(this.tp1) + \"\\nTP2: \" + f_px(this.tp2) + \"\\nTP3: \" + f_px(this.tp3) + \"\\nRR: \" + this.rrText() + \"\\nConfidence: \" + (na(score) ? \"n/a\" : str.tostring(score, \"#\") + \"/100\") // --------------------------------------------------------- SWING METHODS method isAbove(Swing this, float px) => not na(this.price) and this.price > px method isBelow(Swing this, float px) => not na(this.price) and this.price < px // ------------------------------------------------------- SETUP METHODS method ageBars(Setup this) => bar_index - this.bornBar method rank(Setup this) => switch this.st SetupState.idle => 0 SetupState.absorbing => 1 SetupState.rejected => 2 SetupState.displaced => 3 SetupState.bos => 4 SetupState.retest => 5 SetupState.armed => 6 SetupState.active => 7 => 8 // dead - absorbing // Every drawing handle a Setup owns is released here, and only here. method wipe(Setup this) => if not na(this.bx) box.delete(this.bx) this.bx := na if not na(this.lb) label.delete(this.lb) this.lb := na if not na(this.lnE) line.delete(this.lnE) this.lnE := na if not na(this.lnS) line.delete(this.lnS) this.lnS := na if not na(this.ln1) line.delete(this.ln1) this.ln1 := na if not na(this.ln2) line.delete(this.ln2) this.ln2 := na if not na(this.ln3) line.delete(this.ln3) this.ln3 := na // ------------------------------------------------------ VTRADE METHODS method rText(VTrade this) => na(this.rMult) ? \"open\" : str.tostring(this.rMult, \"#.00\") + \"R\" // ========================= END SECTION 2 ==================================== // ============================================================================ // SECTION 2B : SHARED MUTABLE STATE // Pine demands declaration before use, but two pairs of sections read each // other: SECTION 13 (Filters) gates on the loss streak that SECTION 15 // (Failure Analysis) writes, and SECTION 16 (Presentation) draws the ids that // SECTION 6 and SECTION 14 mint. Rather than forward-declare inside a module - // which is how the same counter ends up existing twice under two names - every // cross-section variable is declared exactly once, here. // // READ/WRITE OWNERSHIP IS FIXED: // lastSigBar*/lastLossBar*/lossStreak* written by S15, read by S13 // dupLvl*/dupBar* written by S14, read by S13 // zoneSeq / setupSeq written by S6 / S14 // Within a bar S13 runs BEFORE S15, so S13 necessarily reads the values as of // the previous bar. That is deterministic and it is the intended behaviour: a // loss booked on this bar must not retro-gate a signal already evaluated on it. // ============================================================================ // --- per-direction signal / loss memory (index 0 = LONG, 1 = SHORT) --------- // Per-direction on purpose. A global cooldown lets a stopped-out long suppress // shorts for the next 100 minutes, which deletes the failed-absorption reversal - // the single highest-value setup this model has. var array<int> lastSigBar = array.new<int>(2, na) var array<int> lastLossBar = array.new<int>(2, na) var array<int> lossStreak = array.new<int>(2, 0) // --- per-direction duplicate memory: identity of the level last traded ------- var array<float> dupLvl = array.new<float>(2, na) var array<int> dupBar = array.new<int>(2, na) // dir (+1/-1) -> array slot (0/1). The ONLY place this mapping is written. f_slot(int dir) => dir > 0 ? 0 : 1 // --- monotonic ids ---------------------------------------------------------- var int zoneSeq = 0 var int setupSeq = 0 // --- signal plumbing filled by S14 and consumed by S16/S17/S18 ------------- var RiskPlan sigPlanL = na var RiskPlan sigPlanS = na var float sigScoreL = na var float sigScoreS = na // --- WALK-FORWARD WINDOW --------------------------------------------------- // These live here, not in SECTION 18, for one reason: SECTION 16 draws the // status panel and SECTION 18 runs AFTER it. With the window declared downstream // the panel could report a clean SECTION 13 verdict on a bar whose signal the // window had silently suppressed - the user reads OK and sees no marker. The // computation depends only on `time` and its own inputs, so it is free to sit // this early; SECTION 18 keeps the telemetry that genuinely needs longSignal. GEXEC = \"18 - Execution & Walk-Forward\" // --- WHY AN IN-SCRIPT WINDOW AT ALL -------------------------------------- // The Strategy Tester's date-range control is part of DEEP BACKTESTING, which // is a PAID TradingView feature. This account does not have it, so the tester's // own window is unavailable and a walk-forward fold cannot be expressed there. // The fold is therefore expressed IN THE SCRIPT, exactly as the user's existing // srk_sma18_v11_*.pine files already do, and it gates ORDER PLACEMENT only - // every indicator, array and counter keeps warming up on the bars before the // window, so fold 2 never starts from a cold ATR. i_useFixedWin = input.bool(false, \"Use fixed date window\", group = GEXEC, tooltip = \"ON = reproducible walk-forward folds with hard UTC dates. This is the CORRECT way to run a fold, but it only works if the chart has actually loaded bars that far back - see the rolling window below. OFF = rolling lookback only.\", display = display.none) i_winFrom = input.time(timestamp(\"2025-01-01T00:00:00+0000\"), \" Window FROM (UTC)\", group = GEXEC, tooltip = \"Inclusive start of the fold. Ignored unless the box above is ticked. Set EARLIER than the chart holds and the fold silently starts at the first loaded bar instead - compare the bars-in-window count in the panel against the total to see whether that happened.\", display = display.none) i_winTo = input.time(timestamp(\"2027-01-01T00:00:00+0000\"), \" Window TO (UTC)\", group = GEXEC, tooltip = \"Inclusive end of the fold. Set it in the FUTURE to run an open-ended fold; set it to the start of the next fold to keep in-sample and out-of-sample strictly disjoint, which is the whole point of the exercise. THE DEFAULT IS DELIBERATELY IN THE FUTURE: a TO date in the past makes the window EMPTY on every intraday chart this account can load (a free plan holds ~3.6 days at 1M, ~17 at 5M, ~52 at 15M), so ticking the box above would silently suppress every signal. Move it back only to close a fold.\", display = display.none) i_lookbackDays = input.int(0, \"Rolling window (days back, 0 = all data)\", minval = 0, maxval = 3650, group = GEXEC, tooltip = \"THE ACCOUNT-SPECIFIC FALLBACK. 0 = trade every loaded bar. Any other value trades only the last N days. At the extremes: a value LARGER than the chart actually holds is a silent no-op (a free plan loads ~5000 bars = ~3.6 days at 1M, ~17 days at 5M, ~52 days at 15M), and 1-2 days at 15M leaves too few trades to mean anything. NOTE this window SLIDES: it is measured from `timenow`, so the same fold re-run tomorrow is NOT the same fold. Use the fixed dates above whenever you need reproducibility.\", display = display.none) // Both arms must hold. The rolling arm is written exactly as the user's existing // v11 files write it, so the two systems agree on what \"in window\" means. inWindow = (not i_useFixedWin or (time >= i_winFrom and time <= i_winTo)) and (i_lookbackDays == 0 or time >= timenow - i_lookbackDays * 86400000) // ========================= END SECTION 2B =================================== // ============================================================================ // SECTION 3 : SWINGS, STRUCTURAL TREND, CHOP // // This section owns the skeleton every other section hangs off: // * confirmed pivots on the SHARED i_pivotLeft / i_pivotRight (SECTION 0), // * one capped array<Swing> per side, // * the most recent UNBROKEN swing per side (the reference level S9 breaks // and S10/S11 anchor against), // * structTrend - the CHART-TF structural sequence, HH/HL vs LH/LL, // * chopScore - a 3-vote composite, and isChoppy = chopScore >= 2. // // WHAT THIS SECTION DOES NOT DO, on purpose: // * NO break detection. BOS/CHoCH is SECTION 9. This section never reads a // break, never marks a Swing broken and never latches a direction from // one. SECTION 9 mutates the `broken` flag on the objects stored here; // because S9 runs BELOW this section, a flag set on bar b is first seen by // the reference scan on bar b+1. That ordering is deterministic and it is // what S9 wants: it must break the reference as it stood BEFORE its own // marking pass. // * NO absorption-zone lifecycle. The draft kept a private zoneLive/legLow // copy here; the ONE array<IcebergZone> belongs to SECTION 6, so that // state is deleted rather than duplicated under a second name. // * NO HTF role. structTrend is chart-TF only. The HTF bias is htfBias / // f_htfAllow() / f_htfScalar() in SECTION 0 and nothing here feeds it. // // DELETED FROM THE DRAFT (review blocker, not an omission): the \"chronological // precedence\" override that let the last BREAK outrank the swing sequence. // It made the CHoCH test circular - a break was certified as a reversal by the // previous break of the same oscillation, and since breaks in a range always // alternate, every whipsaw certified. structTrend is now proved by the swing // sequence ALONE, which is also what makes it computable here, above S9. // ============================================================================ // ---------------------------------------------------------------- S3 GROUPS G3S = \"3 - Structure & Swings\" G3C = \"3 - Chop & Range\" // ---------------------------------------------------------------- S3 INPUTS // NOTE: i_pivotLeft, i_pivotRight and i_atrLen are NOT declared here. One pivot // pair for the whole file lives in SECTION 0 because i_pivotRight IS the // system's entire declared signal latency; a second pair would mean a second, // undocumented latency. i_maxSwings = input.int(12, \"Swings kept per side\", minval = 3, maxval = 50, group = G3S, tooltip = \"How many CONFIRMED swing highs and swing lows stay in memory. The oldest is discarded when the cap is hit. Too low (3-5) and the reference level a break needs can be evicted before price reaches it; too high (40+) costs loop time on every bar and keeps prices that stopped being structure hours ago. 12 covers intraday gold.\", display = display.none) i_erLen = input.int(20, \"Efficiency Ratio length (bars)\", minval = 2, maxval = 200, group = G3C, tooltip = \"Kaufman Efficiency Ratio window: net move divided by path travelled. 1.0 is a perfectly straight move, 0.0 is pure noise that went nowhere. IMPORTANT: ER is NOT dimensionless across lengths - for a driftless random walk its expected value is about 1/sqrt(length) (0.22 at 20, 0.27 at 14). If you change this, rescale the threshold below by sqrt(oldLen / newLen) or the vote silently gets looser or tighter.\", display = display.none) i_erChopThresh = input.float(0.28, \"ER below this = one chop vote\", minval = 0.0, maxval = 1.0, step = 0.01, group = G3C, tooltip = \"At the default length of 20 the random-walk baseline is about 0.22, so 0.28 votes chop on anything only mildly straighter than noise. Raise it and the ER vote is on almost always; drop it below 0.22 and the vote effectively never fires.\", display = display.none) i_adxLen = input.int(14, \"ADX length\", minval = 2, maxval = 100, group = G3C, tooltip = \"Wilder DI / ADX smoothing, used for BOTH arguments of ta.dmi(). There is no ta.adx() in Pine v6 - ADX is the third element of the ta.dmi() tuple. Short lengths make the vote twitchy; long ones make it report the trend that is already over.\", display = display.none) i_adxChopThresh = input.float(18.0, \"ADX below this = one chop vote\", minval = 0.0, maxval = 100.0, step = 0.5, group = G3C, tooltip = \"ADX is directionless, so this vote is exactly symmetrical between longs and shorts. Be aware ADX measures the trend being REVERSED: at a genuine exhaustion turn the prior trend's ADX is still high, so this vote says 'not choppy' right where the system wants to trade. That is why it is one vote of three and not a veto. Above about 25 it votes chop nearly always.\", display = display.none) i_overlapPct = input.float(0.60, \"Swing-box overlap above this = one chop vote\", minval = 0.0, maxval = 1.0, step = 0.05, group = G3C, tooltip = \"Geometric overlap of the last two swing boxes, scored as the intersection divided by the TALLER of the two. 1.0 = consecutive legs occupy the same price band (a range); 0.0 = legs are cleanly stacked (a trend). Calibration, with r = the retracement fraction and e = how far the new leg extends past the old high, both in units of the old leg: overlap = r / max(1, r + e). A leg that stalls at the old high (e = 0) scores EXACTLY r, so 0.50 / 0.62 / 0.79 for a 50 / 61.8 / 78.6% retrace. A measured-move extension (e = r) is pinned at 0.50 for ANY r >= 0.5, because the taller box grows with the retrace. Deep retracement ALONE therefore never trips this vote: 0.60 fires only on a deep retrace that also fails to extend, which is a range. At 1.0 it never fires.\", display = display.none) // ------------------------------------------------------------- S3 HELPERS // Every loop below is guarded by `if n > 0`. In Pine `for i = n - 1 to 0` with // n = 0 becomes `for i = -1 to 0`, which counts UP and executes i = -1 - and in // v6 a negative array index is LEGAL (it counts from the end), so the guard is // the difference between a clean skip and silently reading the newest element. f_swPush(array<Swing> arr, Swing s, int cap) => array.push(arr, s) if array.size(arr) > cap array.shift(arr) // oldest out, FIFO, bounded memory array.size(arr) // Newest UNBROKEN swing, or na. Returns the OBJECT rather than an index: an // index sentinel of -1 is a valid negative index in v6, so a missed guard at a // future call site would silently return the newest swing instead of failing. f_swNewestUnbroken(array<Swing> arr) => Swing found = na int n = array.size(arr) if n > 0 for i = n - 1 to 0 Swing s = array.get(arr, i) if not s.broken and not na(s.price) found := s break found // Geometric overlap of two price boxes, 0..1. na in -> na out: an unknown box // pair must ABSTAIN from the chop vote, not assert 0.0 (\"perfectly stacked = // trending\"), which is a directional claim manufactured out of missing data. f_boxOverlap(float hi1, float lo1, float hi2, float lo2) => float den = math.max(hi1 - lo1, hi2 - lo2) na(hi1) or na(lo1) or na(hi2) or na(lo2) or na(den) or den <= 0 ? na : f_clamp01(math.max(0.0, math.min(hi1, hi2) - math.max(lo1, lo2)) / den) // ---------------------------------------------------------------------------- // 3.1 PIVOT DETECTION - the one and only source of structural delay // ta.pivothigh(high, L, R) returns non-na on the bar R bars AFTER the pivot // bar, and the value it returns IS that pivot's price. Take it from the RETURN // VALUE, never from high[R]: an indexed read is what forces the historical // buffer wider than max_bars_back and throws at runtime. // Both calls sit at global scope, unconditionally, on their own line - v6 // evaluates and/or lazily and a ta.* call inside a condition skips bars and // corrupts its own history. // ---------------------------------------------------------------------------- pvtHi = ta.pivothigh(high, i_pivotLeft, i_pivotRight) pvtLo = ta.pivotlow(low, i_pivotLeft, i_pivotRight) // THE anchor. Every pivot-derived drawing and every stored swing bar uses this. s3PvtBar = bar_index - i_pivotRight // ---------------------------------------------------------------------------- // 3.2 SWING MEMORY // Registration is gated on `confirmed` for a concrete reason, not ceremony: // on a FORMING bar the forming high is one of the pivot's right-hand legs, so // pvtHi can read non-na early in the bar and na again once the bar extends past // the pivot. Writing on the closing tick only is what makes the array identical // on history and in realtime. // No \"already broken at registration\" test exists because it would be dead // code: no bar between the pivot and its confirmation exceeded the pivot's // extreme, so no close could have either. A fresh swing is always unbroken. // ---------------------------------------------------------------------------- var array<Swing> swHiArr = array.new<Swing>() var array<Swing> swLoArr = array.new<Swing>() // Last TWO swings per side, in REGISTRATION order (broken or not). These drive // the HH/HL sequence and the overlap box - both are statements about the shape // price actually traced, so a swing that was later broken still counts as // having existed. Tracked per side INDEPENDENTLY: two swing highs can confirm // with no swing low between them, and an alternation assumption would silently // drop one of them. var float s3RegHi = na var float s3RegHiPrev = na var int s3RegHiBar = na var int s3RegHiPrevBar = na var float s3RegLo = na var float s3RegLoPrev = na var int s3RegLoBar = na var int s3RegLoPrevBar = na if confirmed and warmupOk if not na(pvtHi) f_swPush(swHiArr, Swing.new(price = pvtHi, bar = s3PvtBar, dir = 1, broken = false), i_maxSwings) s3RegHiPrev := s3RegHi s3RegHiPrevBar := s3RegHiBar s3RegHi := pvtHi s3RegHiBar := s3PvtBar if not na(pvtLo) f_swPush(swLoArr, Swing.new(price = pvtLo, bar = s3PvtBar, dir = -1, broken = false), i_maxSwings) s3RegLoPrev := s3RegLo s3RegLoPrevBar := s3RegLoBar s3RegLo := pvtLo s3RegLoBar := s3PvtBar // ---------------------------------------------------------------------------- // 3.3 REFERENCE LEVELS - newest UNBROKEN swing per side // Recomputed every bar by scan rather than latched into a var, so the instant // SECTION 9 flags a swing broken the reference moves on by itself. A latched // copy is how a reference ends up pinned to a price that was taken out hours // ago, which then freezes every break test that reads it. // na PROPAGATES here (SECTION 0 policy): \"no unbroken swing on this side\" is // reported as na, never substituted with high/low and never with the last // known value. Consumers state their own na policy at the call site. // ---------------------------------------------------------------------------- Swing s3RefHi = f_swNewestUnbroken(swHiArr) Swing s3RefLo = f_swNewestUnbroken(swLoArr) float lastSwHi = na(s3RefHi) ? na : s3RefHi.price float lastSwLo = na(s3RefLo) ? na : s3RefLo.price int lastSwHiBar = na(s3RefHi) ? na : s3RefHi.bar int lastSwLoBar = na(s3RefLo) ? na : s3RefLo.bar // ---------------------------------------------------------------------------- // 3.4 STRUCTURAL TREND (chart timeframe, descriptive, NOT a trade gate) // +1 = HH and HL, -1 = LH and LL, 0 = mixed / unknown / transitional. // Comparisons against na are FALSE in v6, so a side that has not yet produced // two swings can never manufacture a trend - it reaches 0 through the // `otherwise` branch, which is exactly the \"structure is not legible yet\" // answer, and it is the same 0 a genuinely mixed sequence produces. // // READ THIS BEFORE CONSUMING structTrend: it lags by construction, but it is a // THREE-state reading and the two transitions do NOT cost the same. After a // genuine bullish turn it leaves -1 as soon as EITHER a higher high OR a higher // low CONFIRMS - that first confirmation drops it to 0, not to +1 - and it only // reaches +1 once BOTH have, i.e. at least i_pivotRight bars after the second of // them prints. SECTION 9 reads structTrend == -1 as its bullish-CHoCH // precondition, so that test is satisfied only while the break is still ahead of // the first confirming pivot; a second break later in the same move typically // reads 0 and is graded ambiguous rather than reversal. That is deliberate - the // CHoCH claim is that sellers were demonstrably dominant BEFORE the break, and // once a higher pivot has confirmed that is no longer demonstrable. It must NOT // be used as an entry-direction veto: demanding structTrend agree with trade // direction would veto precisely the reversal the break just licensed. // ---------------------------------------------------------------------------- bool s3Hh = s3RegHi > s3RegHiPrev bool s3Hl = s3RegLo > s3RegLoPrev bool s3Lh = s3RegHi < s3RegHiPrev bool s3Ll = s3RegLo < s3RegLoPrev int structTrend = s3Hh and s3Hl ? 1 : s3Lh and s3Ll ? -1 : 0 // ---------------------------------------------------------------------------- // 3.5 CHOP / RANGE - three independent votes, none of which has a veto // Three measures that fail in DIFFERENT ways were chosen on purpose: ER is // blind to volatility, ADX is blind to the turn it is standing on, and the // overlap ratio is blind to time. Requiring two of three is what stops any one // blind spot from deciding on its own. // ---------------------------------------------------------------------------- // (a) Kaufman Efficiency Ratio. The path step uses nz(close[1], close) so bar 0 // contributes 0 instead of poisoning the whole rolling sum with na. s3ErStep = math.abs(close - nz(close[1], close)) s3ErPath = math.sum(s3ErStep, i_erLen) s3ErNet = math.abs(close - close[i_erLen]) // na, NEVER 0, when the path is unavailable or flat: 0 reads as \"maximum chop\" // and would flag every warmup bar and every frozen feed as a range. erVal = na(s3ErPath) or s3ErPath <= 0 ? na : f_clamp01(s3ErNet / s3ErPath) // (b) Wilder ADX. ta.dmi is the ONLY route to ADX in v6 and both of its // arguments must be simple int - which is why i_adxLen comes from input.int // and is never reassigned. The DI legs are destructured but deliberately // unused: ADX is directionless, and reading DI+ against DI- here would // smuggle a directional bias into a measure that must stay symmetrical. [s3DiPlus, s3DiMinus, adxVal] = ta.dmi(i_adxLen, i_adxLen) // (c) Swing-box overlap - TEMPORALLY GUARDED. // The naive version feeds (lastHi, lastLo) and (prevHi, prevLo) straight in, // but those are the last two pivots PER SIDE. When two highs confirm with no // low between them the two \"boxes\" interleave in time and the ratio // describes a shape that never existed on the chart. The guard demands that // BOTH swings of the newer box are strictly newer than BOTH swings of the // older box; when alternation is broken the vote ABSTAINS (na) rather than // inventing a number. bool s3BoxOk = not na(s3RegHiBar) and not na(s3RegLoBar) and not na(s3RegHiPrevBar) and not na(s3RegLoPrevBar) and math.min(s3RegHiBar, s3RegLoBar) > math.max(s3RegHiPrevBar, s3RegLoPrevBar) s3Overlap = s3BoxOk ? f_boxOverlap(s3RegHi, s3RegLo, s3RegHiPrev, s3RegLoPrev) : na // Composite. A measure with no value casts NO vote - `na < x` and `na > x` are // both false in v6 - so warmup abstains rather than certifying chop. The votes // are named rather than inlined so the sum needs no wrapped line and so Debug // mode can report WHICH measure objected. Each is an int ternary and the total // is a plain int sum in {0,1,2,3}: no division anywhere, so the v6 int/int // fraction trap cannot reach the chop score. int s3VoteEr = erVal < i_erChopThresh ? 1 : 0 int s3VoteAdx = adxVal < i_adxChopThresh ? 1 : 0 int s3VoteOvl = s3Overlap > i_overlapPct ? 1 : 0 int chopScore = s3VoteEr + s3VoteAdx + s3VoteOvl // Two of three. SECTION 13 gates on this flag and SECTION 12 grades on the raw // chopScore, so the same evidence is read once as a gate and once as a // gradient - never twice as a penalty. bool isChoppy = chopScore >= 2 // ========================= END SECTION 3 ==================================== // ============================================================================ // SECTION 4 : LIQUIDITY MAP // // THE one array<LiquidityLevel> in the file. Every other module reads this // registry; nobody else builds one. What lives here: // * PDH/PDL/PWH/PWL from the CALENDAR day/week (newDay/newWeek, SECTION 0) - // never from the feed's own daily bar, which on a gold CFD rolls at // 17:00/18:00 NY and is 8-9 hours stale by the time London trades, // * one previous-session high/low slot PER SESSION (Asia, London, NY have // INDEPENDENT lifecycles - a shared slot deletes the Asia high at the // London close, i.e. exactly before the session that most often sweeps it), // * the current session high/low, and the calendar day open, // * confirmed swings from SECTION 3, clustered into EQH/EQL, // * ONE manual session-anchored VWAP with sigma bands. // // THREE RULES THIS SECTION EXISTS TO ENFORCE // 1. MERGING A CLUSTER ALWAYS TAKES THE EXTREME, NEVER THE MEAN. Averaging two // equal highs moves the level DOWN into the range - i.e. it moves a stop // inside the liquidity that stop is supposed to sit beyond. The extreme is // where the resting orders are. // 2. A POLARITY FLIP MUST NOT DISQUALIFY A SWEPT LEVEL. A close through PDL is // the sweep this whole system trades. Flipping PDL to \"resistance\" on that // close would make it ineligible for the long the sweep just created, which // deletes the strongest evidence in the registry at the exact bar it // matters. The break is therefore slow (1.2 ATR AND two confirmed closes) // and a swept level keeps a grace window on the REVERSAL side. // 3. ta.vwap() IS BANNED FROM THIS FILE. It raises a RUNTIME ERROR on feeds // that report no volume, and several XAUUSD feeds report none - that kills // the whole script, not just the VWAP. The manual accumulator below // degrades to a TWAP instead. // // DELIBERATELY NOT HERE: // * NO volume-profile POC. A 48-bin histogram over 1.5x yesterday's range // quantises to ~0.94 USD per bin - coarser than the entire proximity // window it would be measured against (0.35-0.75 USD) - so \"price is at // the POC\" would be decided by where the bin grid happened to fall. The // LevelKind.poc member stays in SECTION 1 for a future profile that earns // its resolution; nothing in this build mints one. // * NO VWAP LEVEL in the registry. VWAP is a moving value, the registry is // a map of frozen prices; vwapS / vwapSd are published as values instead. // * NO session strings. SECTION 0 owns session membership in each session's // own IANA zone; this module consumes inAsia / inLondon / inNy. // ============================================================================ // ---------------------------------------------------------------- S4 GROUPS G4P = \"4 - Liquidity: Periods\" G4C = \"4 - Liquidity: Swings & Clusters\" G4V = \"4 - Liquidity: VWAP\" G4Q = \"4 - Liquidity: Proximity & Range\" // ---------------------------------------------------------------- S4 INPUTS // One enable/disable per LEVEL KIND, so a user who does not believe in one of // them can remove it from the map without touching anything else. NOTE: the // toggles govern REGISTRATION ONLY. pdh/pdl are still computed when the daily // toggle is off, because the mid-range reference reads them and that veto must // not silently switch itself off. i_useDaily = input.bool(true, \"Previous day high / low\", group = G4P, tooltip = \"PDH/PDL of the previous CALENDAR day in the trading-day timezone. The highest-quality intraday reference on gold. Off removes them from the level map but they are still used as the mid-range reference, which is a range measurement, not a level.\", display = display.none) i_useWeekly = input.bool(false, \"Previous week high / low\", group = G4P, tooltip = \"PWH/PWL. Scored highest of all kinds when touched, but on 1M-15M gold price reaches them a few times a month. Off by default so they do not occupy registry slots they rarely earn.\", display = display.none) i_useSessions= input.bool(true, \"Previous session high / low (per session)\", group = G4P, tooltip = \"Registers each session's high and low when THAT session closes. Asia, London and NY get independent slots: the Asia high must survive the London close, because the NY session is where it is most often swept.\", display = display.none) i_useCurSess = input.bool(true, \"Current session high / low\", group = G4P, tooltip = \"The live session extreme, as a level. It uses the PREVIOUS bar's session extreme and only activates once price has left it (below), because a high printed by the current bar has no resting orders at it - counting it would make 'at a meaningful level' true by construction on every new session extreme.\", display = display.none) i_csLeaveAtr = input.float(1.20, \"Current-session level: leave distance (x ATR)\", minval = 0.2, maxval = 5.0, step = 0.05, group = G4P, tooltip = \"Price must travel this far from the session extreme before that extreme counts as a level price can RETURN to. At 0.2 the level is live almost immediately and reads as a tautology; above ~2.5 it almost never activates intraday.\", display = display.none) i_useDayOpen = input.bool(true, \"Day open\", group = G4P, tooltip = \"The open of the current calendar day, as a NEUTRAL level (it acts as support and resistance depending on which side price approaches from). Weakest of the registered kinds - it needs confluence to clear the quality gate on its own.\", display = display.none) i_useSwings = input.bool(true, \"Confirmed swing highs / lows\", group = G4C, tooltip = \"Pivots from SECTION 3, registered at bar_index - pivot RIGHT legs. A lone untested swing scores ~0.30 and cannot clear the quality gate by itself - it has to be touched again, or be confluent with something bigger. That is intended: one pivot is a price, not a pool.\", display = display.none) i_useEq = input.bool(true, \"Cluster into equal highs / lows\", group = G4C, tooltip = \"Swings landing within the tight band of an existing cluster are merged instead of added, and the cluster is promoted to EQH/EQL. Off keeps every pivot as its own separate swing level and disables the promotion entirely (not just the label).\", display = display.none) i_eqTolATR = input.float(0.15, \"Equal-high / low band (x ATR)\", minval = 0.02, maxval = 1.0, step = 0.01, group = G4C, tooltip = \"Half-width of the 'same price' band, floored at one spread. The pool band is twice this. It is also the de-duplication band for confluence. Too tight (0.02) and genuine equal highs never cluster; too wide (0.5+) and a whole trend leg becomes one level.\", display = display.none) i_eqMinTouches = input.int(2, \"Swings required to call it equal highs / lows\", minval = 2, maxval = 6, group = G4C, tooltip = \"How many confirmed swings must sit inside the tight band before the cluster is promoted from a plain swing to EQH/EQL. 2 is the classic definition. Raising it makes EQH rare and the map mostly swings.\", display = display.none) i_eqMinDip = input.float(1.00, \"Minimum pullback between touches (x ATR)\", minval = 0.0, maxval = 5.0, step = 0.05, group = G4C, tooltip = \"Two highs only count as TWO touches if price actually pulled away between them. Without it a flat plateau registers as an equal-high pool with double the touch credit. At 0 the gate falls back to the spread floor, so nearly every plateau counts twice; above ~2 ATR almost nothing on 1M gold earns a second touch. Note the pivot still becomes a level either way - what the gate withholds is the TOUCH, not the price.\", display = display.none) i_eqMaxGap = input.int(240, \"Maximum bars between clustered touches\", minval = 20, maxval = 2000, group = G4C, tooltip = \"Equal highs are a micro-structure idea: adjacent swings deliberately left level. Two highs days apart that happen to land within tolerance are a coincidence, not an EQH - with ~80 swings spread over a ~100 USD envelope, chance alone produces a dozen of them per week. This is the recency bound that rejects them.\", display = display.none) i_proxAtr = input.float(0.45, \"Level proximity tolerance (x ATR)\", minval = 0.05, maxval = 2.0, step = 0.05, group = G4Q, tooltip = \"How close price must come for a level to count, floored at one spread by f_tol(). It is also the confluence radius - ONE tolerance for 'near', so the two can never disagree in the dead-volatility regime the floor exists for.\", display = display.none) i_minLevelQual = input.float(0.40, \"Minimum level quality (0..1)\", minval = 0.0, maxval = 1.0, step = 0.05, group = G4Q, tooltip = \"Quality is kind x touch count, decayed by age. Concrete values at zero touches: prev-week 0.55, prev-day 0.50, prev-session 0.41, current-session 0.33, bare swing 0.30, day open 0.28; a twice-touched equal-high cluster reaches 0.81. At the default 0.40 the period levels stand alone and a lone swing needs a second touch or confluence. This is a LEVEL-QUALITY weight, not a probability.\", display = display.none) i_conflBonus = input.float(0.15, \"Confluence bonus (x the second level's quality)\", minval = 0.0, maxval = 0.5, step = 0.05, group = G4Q, tooltip = \"Credit for a SECOND, distinct level inside the same proximity window, scaled by how good that second level is. Distinct means further than the equal-high band from the first, so one price event recorded under two kinds cannot pay twice. At 0 confluence is off.\", display = display.none) i_tightFrac = input.float(0.45, \"Precise-touch fraction of tolerance\", minval = 0.1, maxval = 1.0, step = 0.05, group = G4Q, tooltip = \"Inside the mid-range veto, only a touch this precise still counts as being AT a level. At 1.0 the veto stops applying to proximity at all; at 0.1 nothing survives it.\", display = display.none) i_midBand = input.float(0.15, \"Mid-range band (+/- around 0.50)\", minval = 0.0, maxval = 0.45, step = 0.01, group = G4Q, tooltip = \"Price is 'in the middle' when its position in the PREVIOUS day's range is within this of 0.50. Inside the band liquidity credit is cut and a touch must be precise. 0 disables the mid-range veto.\", display = display.none) i_minDayRangeAtr = input.float(8.0, \"Minimum reference range for the veto (x ATR)\", minval = 1.0, maxval = 40.0, step = 0.5, group = G4Q, tooltip = \"When yesterday's range is narrower than this there is no meaningful 'middle' - the whole day is one balance area - so the mid-range veto switches off rather than vetoing the entire chart.\", display = display.none) i_midPenalty = input.float(0.45, \"Mid-range liquidity credit multiplier\", minval = 0.0, maxval = 1.0, step = 0.05, group = G4Q, tooltip = \"What the level sub-score is multiplied by when price is mid-range. At 1.0 being mid-range costs nothing; at 0 it zeroes the level evidence outright.\", display = display.none) i_maxLevels = input.int(40, \"Maximum levels kept\", minval = 10, maxval = 200, group = G4Q, tooltip = \"Hard cap on the registry. Over the cap, the lowest-quality UNPROTECTED level is evicted, at most 4 per bar. The period kinds are never evicted, so the true upper bound is this + 13 + 4.\", display = display.none) i_maxLevelAge = input.int(1500, \"Forget a level after (bars since last touch)\", minval = 100, maxval = 10000, group = G4Q, tooltip = \"Age is measured from the LAST touch, not from creation, so a pool price keeps returning to stays young. Keyed on creation instead, a five-touch pool would be deleted for being old on the bar after its fifth touch, which is the opposite of the intent.\", display = display.none) i_decayBars = input.int(900, \"Quality decay constant (bars)\", minval = 50, maxval = 10000, group = G4Q, tooltip = \"Untouched levels fade as exp(-age / this), floored below. At 900 the floor binds at ~825 bars; past that a stale level holds its floor quality until the age prune removes it. Protected period kinds do not decay at all - yesterday's high does not get weaker because the session is long.\", display = display.none) i_decayFloor = input.float(0.40, \"Quality decay floor\", minval = 0.1, maxval = 1.0, step = 0.05, group = G4Q, tooltip = \"The most an old level can be discounted. At 1.0 age costs nothing.\", display = display.none) i_lvlBreakAtr = input.float(1.20, \"Decisive break distance (x ATR)\", minval = 0.2, maxval = 5.0, step = 0.05, group = G4Q, tooltip = \"How far beyond a level price must CLOSE, on two consecutive confirmed bars, before the level flips polarity. Deliberately far: at 0.40 ATR on 1M gold this is 0.14 USD, below the spread, so every level near price would ping-pong its polarity on noise and 'which direction may use this level' becomes a coin flip.\", display = display.none) i_sweepGrace = input.int(12, \"Swept level stays usable for (bars)\", minval = 0, maxval = 200, group = G4Q, tooltip = \"After a decisive break, the level remains eligible for the REVERSAL direction for this many bars, and keeps full quality. This is the sweep-and-reverse setup: the level was taken out, and that is the reason to trade back through it. At 0 a broken level is unusable by the very setup its break creates.\", display = display.none) i_flipPenalty = input.float(0.60, \"Quality kept after a break\", minval = 0.1, maxval = 1.0, step = 0.05, group = G4Q, tooltip = \"Once the grace window above has expired, a level price closed decisively through is worth this fraction of its unbroken quality. Applied once, not compounded, so chop cannot drive a level to zero.\", display = display.none) // -------------------------------------------------------------- S4 HELPERS // ONE registry. Declared before the helpers that push into it. var array<LiquidityLevel> levels = array.new<LiquidityLevel>() // Managed slots: exactly one live level per period kind, held by REFERENCE // rather than found by scanning for its kind. A reference survives the array // index shifts that pruning causes; an index does not, and in v6 a stale index // of -1 is a legal read of the LAST element rather than a loud error. int S4_PDH = 0 int S4_PDL = 1 int S4_PWH = 2 int S4_PWL = 3 int S4_PAH = 4 // previous ASIA high / low int S4_PAL = 5 int S4_PLH = 6 // previous LONDON high / low int S4_PLL = 7 int S4_PNH = 8 // previous NY high / low int S4_PNL = 9 int S4_CSH = 10 // current session high / low int S4_CSL = 11 int S4_DOP = 12 // day open var array<LiquidityLevel> s4Slot = array.new<LiquidityLevel>(13) // Period accumulators, one slot per period. Index 0 day, 1 week, 2 Asia, // 3 London, 4 NY. Arrays rather than 20 scalars because scalars cannot be // written from inside a helper and the alternative is five copy-pasted blocks. int S4_DAY = 0 int S4_WK = 1 int S4_ASI = 2 int S4_LON = 3 int S4_NYS = 4 var array<float> s4PHi = array.new<float>(5, na) // running, current period var array<float> s4PLo = array.new<float>(5, na) var array<float> s4PrvH = array.new<float>(5, na) // previous COMPLETED period var array<float> s4PrvL = array.new<float>(5, na) var array<bool> s4Full = array.new<bool>(5, false) // current period seen from bar 1 var array<bool> s4PrvF = array.new<bool>(5, false) // previous period was complete // Tolerances. Every one goes through f_tol(), so every one is floored at a // spread and NOTHING here is denominated in ticks: mintick is 0.01 on most // XAUUSD feeds and 0.001 on others, and a tick-denominated floor silently // mis-scales by 10x between them. s4EqTol = f_tol(i_eqTolATR) // TWICE THE FLOORED BAND, not the floor of twice the band. f_tol() clamps at one // spread (0.25 USD), and on 1M gold 0.15 x aRef is ~0.05 - so BOTH f_tol(0.15) // and f_tol(0.30) return the floor and the tight/wide pair collapses to one // number. That kills the asymmetric ratchet bound below AND makes the demotion // branch (bestD > s4EqTol) unreachable, because every merge already passed // d <= lim == s4EqTol. Deriving it from s4EqTol keeps the documented 2:1 ratio // at every timeframe, floor or no floor. s4PoolTol = 2.0 * s4EqTol s4ProxTol = f_tol(i_proxAtr) s4BrkTol = f_tol(i_lvlBreakAtr) // Protected kinds are never pruned, never decayed and never evicted. They are // exactly the kinds a managed slot points at, which is what keeps every slot // reference pointing at a level that is still IN the array. f_s4Prot(LevelKind k) => k == LevelKind.pdh or k == LevelKind.pdl or k == LevelKind.pwh or k == LevelKind.pwl or k == LevelKind.psh or k == LevelKind.psl or k == LevelKind.csh or k == LevelKind.csl or k == LevelKind.dayOpenK // Live quality: kind x touches (SECTION 2 owns that rubric), aged, and // discounted once the break grace has expired. Age runs from the LAST touch. f_s4Score(LiquidityLevel L) => // Explicit float throughout: in v6 int/int is a FRACTION, but math.max over // two ints is an int, and mixing the two inside math.exp is how a decay // silently becomes a step function. float age = math.max(float(bar_index - math.max(L.lastTouch, L.createdBar)), 0.0) float dec = f_s4Prot(L.kind) ? 1.0 : math.max(math.exp(-age / float(i_decayBars)), i_decayFloor) // The break discount waits for the grace window. Applying it AT the break // would strip the swept level of its quality on the exact bar the sweep // makes it most relevant - the same bug as flipping it out of eligibility. float pen = L.swept and (bar_index - L.lastTouch) > i_sweepGrace ? i_flipPenalty : 1.0 f_clamp01(L.quality() * dec * pen) // Eligibility. A SUPERSET of SECTION 2's strict isFor(): it additionally admits // NEUTRAL levels (the day open acts both ways) and a swept level inside its // grace window (rule 2 at the top of this section). f_s4Elig(LiquidityLevel L, int dir) => bool normal = L.side == 0 or L.side == -dir bool grace = L.swept and L.side == dir and (bar_index - L.lastTouch) <= i_sweepGrace L.active and not na(L.price) and (normal or grace) // The ONE insertion point. touches starts at 0 - \"touched once since birth\" is // one merge - which is what calibrates SECTION 2's quality() rubric: a fresh // previous-day extreme scores 0.50 and a bare swing 0.30. f_s4Add(float px, LevelKind k, int sd) => LiquidityLevel L = LiquidityLevel.new(price = px, kind = k, side = sd, createdBar = bar_index, touches = 0, lastTouch = bar_index, strength = 0.0, active = true, swept = false) L.strength := f_s4Score(L) array.push(levels, L) L // Period roll: the OUTGOING level is demoted to a plain swing, not deleted. // Yesterday's high is still a price the market remembers; it just stops being // THE previous-day high, and it re-enters the ordinary swing lifecycle where it // can be merged into, aged and eventually pruned. Its side is already correct // (+1 was born from a high), so the demotion cannot manufacture a neutral level. f_s4Roll(int slot, float px, LevelKind k, int sd, bool on) => LiquidityLevel old = array.get(s4Slot, slot) if not na(old) old.kind := sd > 0 ? LevelKind.swingHi : LevelKind.swingLo old.strength := f_s4Score(old) array.set(s4Slot, slot, na) if on and not na(px) array.set(s4Slot, slot, f_s4Add(px, k, sd)) // Tracked slot: ONE object whose price is re-pointed in place. Used for the // live session extreme and the day open, which would otherwise push a new // level on every bar / every day and flood the registry with stale neutrals. f_s4Track(int slot, float px, LevelKind k, int sd, bool on) => LiquidityLevel L = array.get(s4Slot, slot) bool live = on and not na(px) if na(L) if live array.set(s4Slot, slot, f_s4Add(px, k, sd)) else L.price := px L.active := live // The trailing expression is load-bearing. Without it the if/else IS the // return value, and its two branches disagree: the first ends in a void // array.set() while the second ends in an assignment, which Pine types as // series bool. \"Return type of one of the if or switch blocks is not // compatible\" is exactly that mismatch. live // Cluster merge. Returns true when the pivot was absorbed by an existing // cluster, false when it needs a level of its own. // // THE BAND IS ASYMMETRIC, and that is what bounds the ratchet. Because the // cluster price is always the EXTREME (rule 1), a merge that EXTENDS the // extreme moves the level; N successive higher highs each inside the wide band // would walk a \"level\" up an entire trend leg while every single step looked // like a legal merge. So extension is allowed only inside the TIGHT band while // retraction gets the wide one: total drift is bounded by touches x eqTol. f_s4Merge(float px, int sd, int atBar, bool fresh) => int hit = -1 float bestD = 1.0e20 int n = array.size(levels) // Clustering OFF means clustering off, not \"cluster silently and skip the // label\": without this guard two pivots landing on the same mintick-rounded // gold price still merge on exact equality, and 4000.00 twice is common. if n > 0 and i_useEq for i = 0 to n - 1 LiquidityLevel L = array.get(levels, i) bool ck = L.kind == LevelKind.swingHi or L.kind == LevelKind.swingLo or L.kind == LevelKind.eqh or L.kind == LevelKind.eql if L.active and ck and L.side == sd and not na(L.price) bool ext = sd > 0 ? px > L.price : px < L.price float lim = ext ? s4EqTol : s4PoolTol float d = math.abs(px - L.price) int gap = atBar - L.lastTouch // NEAREST cluster, not the first one found: binding to an older, // farther cluster while a closer one exists is how hot clusters // end up carrying stale timestamps. if d <= lim and gap <= i_eqMaxGap and d < bestD bestD := d hit := i bool merged = hit >= 0 if merged LiquidityLevel L = array.get(levels, hit) L.price := sd > 0 ? math.max(L.price, px) : math.min(L.price, px) L.lastTouch := atBar if fresh // A touch is only a touch if price genuinely left and came back. L.touches := L.touches + 1 // Promotion is by the tightness of THIS merge: touches + 1 is the number // of swings in the cluster, since creation contributes one at touches = 0. // A merge WIDER than the tight band demotes the cluster back to a plain // swing - the stored price is the envelope's extreme, so a wide merge is // evidence the cluster is a sloped shelf, not a pair of equal highs. if bestD <= s4EqTol and L.touches + 1 >= i_eqMinTouches L.kind := sd > 0 ? LevelKind.eqh : LevelKind.eql else if bestD > s4EqTol L.kind := sd > 0 ? LevelKind.swingHi : LevelKind.swingLo L.strength := f_s4Score(L) merged // ---------------------------------------------------------------------------- // 4.1 PERIOD EXTREMES // Rolled on the CALENDAR boundaries SECTION 0 publishes. `full` marks a period // observed from its own first bar: the partially loaded period at the left edge // of history is tracked but never PUBLISHED, so a fresh chart load and a // scrolled-back one agree about what PDH is. // ---------------------------------------------------------------------------- // Pivot-aligned running extremes for the dip gate. The pivot under test sits at // bar_index - i_pivotRight, so the accumulator must be fed that bar's data. Fed // with the LIVE bar instead, it swallows the i_pivotRight bars AFTER the pivot - // and any post-pivot impulse then launders a flat plateau into \"a real dip\". s4LoPiv = low[i_pivotRight] s4HiPiv = high[i_pivotRight] s4PivBar = bar_index - i_pivotRight var float s4RunLo = na var float s4RunHi = na var float dayOpen = na var float s4CsHiP = na // PRIOR-bar running high of the active session var float s4CsLoP = na var bool s4LeftHi = false // price has travelled away from that extreme var bool s4LeftLo = false // Session edges. SECTION 0 owns membership; these are just its transitions. s4AsiNew = inAsia and not inAsia[1] s4LonNew = inLondon and not inLondon[1] s4NyNew = inNy and not inNy[1] s4AsiEnd = not inAsia and inAsia[1] s4LonEnd = not inLondon and inLondon[1] s4NyEnd = not inNy and inNy[1] // Most specific session wins the \"current\" label during the London/NY overlap. s4CurSl = inNy ? S4_NYS : inLondon ? S4_LON : inAsia ? S4_ASI : -1 if confirmed and warmupOk // --- (a) close the period that just ended, then open the new one -------- if newDay array.set(s4PrvH, S4_DAY, array.get(s4PHi, S4_DAY)) array.set(s4PrvL, S4_DAY, array.get(s4PLo, S4_DAY)) array.set(s4PrvF, S4_DAY, array.get(s4Full, S4_DAY)) array.set(s4PHi, S4_DAY, na) array.set(s4PLo, S4_DAY, na) array.set(s4Full, S4_DAY, true) dayOpen := open if newWeek array.set(s4PrvH, S4_WK, array.get(s4PHi, S4_WK)) array.set(s4PrvL, S4_WK, array.get(s4PLo, S4_WK)) array.set(s4PrvF, S4_WK, array.get(s4Full, S4_WK)) array.set(s4PHi, S4_WK, na) array.set(s4PLo, S4_WK, na) array.set(s4Full, S4_WK, true) // Each session opens and closes on its OWN `if`, never a ternary chain: two // sessions can end on the same bar and a chain silently discards one of them. if s4AsiNew array.set(s4PHi, S4_ASI, na) array.set(s4PLo, S4_ASI, na) array.set(s4Full, S4_ASI, true) if s4LonNew array.set(s4PHi, S4_LON, na) array.set(s4PLo, S4_LON, na) array.set(s4Full, S4_LON, true) if s4NyNew array.set(s4PHi, S4_NYS, na) array.set(s4PLo, S4_NYS, na) array.set(s4Full, S4_NYS, true) if s4AsiEnd array.set(s4PrvH, S4_ASI, array.get(s4PHi, S4_ASI)) array.set(s4PrvL, S4_ASI, array.get(s4PLo, S4_ASI)) array.set(s4PrvF, S4_ASI, array.get(s4Full, S4_ASI)) if s4LonEnd array.set(s4PrvH, S4_LON, array.get(s4PHi, S4_LON)) array.set(s4PrvL, S4_LON, array.get(s4PLo, S4_LON)) array.set(s4PrvF, S4_LON, array.get(s4Full, S4_LON)) if s4NyEnd array.set(s4PrvH, S4_NYS, array.get(s4PHi, S4_NYS)) array.set(s4PrvL, S4_NYS, array.get(s4PLo, S4_NYS)) array.set(s4PrvF, S4_NYS, array.get(s4Full, S4_NYS)) // --- (b) fold this bar in. Day and week run 24h; sessions only when open. for s = 0 to 4 bool act = (s == S4_DAY or s == S4_WK) ? true : s == S4_ASI ? inAsia : s == S4_LON ? inLondon : inNy if act float h = array.get(s4PHi, s) float l = array.get(s4PLo, s) array.set(s4PHi, s, na(h) ? high : math.max(h, high)) array.set(s4PLo, s, na(l) ? low : math.min(l, low)) // Published values. A period that was not observed from its first bar publishes // na rather than a partial extreme. pdh = array.get(s4PrvF, S4_DAY) ? array.get(s4PrvH, S4_DAY) : na pdl = array.get(s4PrvF, S4_DAY) ? array.get(s4PrvL, S4_DAY) : na pwh = array.get(s4PrvF, S4_WK) ? array.get(s4PrvH, S4_WK) : na pwl = array.get(s4PrvF, S4_WK) ? array.get(s4PrvL, S4_WK) : na // Running extremes, as of the last CONFIRMED bar - the forming bar is excluded // on purpose, so nothing downstream can read a high that is still moving. dayHi = array.get(s4PHi, S4_DAY) dayLo = array.get(s4PLo, S4_DAY) csHi = s4CurSl < 0 ? na : array.get(s4PHi, s4CurSl) csLo = s4CurSl < 0 ? na : array.get(s4PLo, s4CurSl) // ---------------------------------------------------------------------------- // 4.2 SESSION-ANCHORED VWAP (manual - ta.vwap() is banned from this file) // Anchored to the shared newDay, which is also the CVD epoch boundary, so the // two series are always talking about the same session. // Sums are accumulated around an ANCHOR PRICE rather than around zero: gold // trades near 4000, so p^2 is ~1.6e7 and E[p^2] - E[p]^2 is a difference of two // huge nearly-equal numbers. Centring on the day's first price makes the // variance a sum of small numbers and the sigma bands trustworthy. // ---------------------------------------------------------------------------- var float s4Anchor = na var float s4SdV = 0.0 // sum d*v var float s4SV = 0.0 // sum v var float s4Sd2V = 0.0 // sum d^2*v var float s4SdT = 0.0 // sum d (TWAP fallback) var float s4Sd2T = 0.0 // sum d^2 var float s4NT = 0.0 // bar count if confirmed and warmupOk if newDay or na(s4Anchor) s4Anchor := hlc3 s4SdV := 0.0 s4SV := 0.0 s4Sd2V := 0.0 s4SdT := 0.0 s4Sd2T := 0.0 s4NT := 0.0 float d = hlc3 - s4Anchor s4SdV := s4SdV + d * vol s4SV := s4SV + vol s4Sd2V := s4Sd2V + d * d * vol s4SdT := s4SdT + d s4Sd2T := s4Sd2T + d * d s4NT := s4NT + 1.0 // TWAP fallback, not na: several XAUUSD feeds report zero volume, and a na VWAP // would make every downstream `close - vwapS` test na - which on a FLOOR gate // reads as \"always blocked\", a silent total shutdown that looks like a quiet day. s4VwUseV = s4SV > 0.0 s4VwMean = s4VwUseV ? s4SdV / s4SV : (s4NT > 0.0 ? s4SdT / s4NT : 0.0) vwapS = na(s4Anchor) ? hlc3 : s4Anchor + s4VwMean s4VwVar = s4VwUseV ? s4Sd2V / s4SV - s4VwMean * s4VwMean : s4NT > 0.0 ? s4Sd2T / s4NT - s4VwMean * s4VwMean : 0.0 vwapSd = math.sqrt(math.max(s4VwVar, 0.0)) // ---------------------------------------------------------------------------- // 4.3 REGISTRY MAINTENANCE (every mutation is inside `confirmed and warmupOk`) // ---------------------------------------------------------------------------- if confirmed and warmupOk // --- (a) period levels. Roll AFTER 4.1 published, so the price pushed here // is the completed period's, never a developing one. if newDay f_s4Roll(S4_PDH, pdh, LevelKind.pdh, 1, i_useDaily) f_s4Roll(S4_PDL, pdl, LevelKind.pdl, -1, i_useDaily) if newWeek f_s4Roll(S4_PWH, pwh, LevelKind.pwh, 1, i_useWeekly) f_s4Roll(S4_PWL, pwl, LevelKind.pwl, -1, i_useWeekly) if s4AsiEnd f_s4Roll(S4_PAH, array.get(s4PrvF, S4_ASI) ? array.get(s4PrvH, S4_ASI) : na, LevelKind.psh, 1, i_useSessions) f_s4Roll(S4_PAL, array.get(s4PrvF, S4_ASI) ? array.get(s4PrvL, S4_ASI) : na, LevelKind.psl, -1, i_useSessions) if s4LonEnd f_s4Roll(S4_PLH, array.get(s4PrvF, S4_LON) ? array.get(s4PrvH, S4_LON) : na, LevelKind.psh, 1, i_useSessions) f_s4Roll(S4_PLL, array.get(s4PrvF, S4_LON) ? array.get(s4PrvL, S4_LON) : na, LevelKind.psl, -1, i_useSessions) if s4NyEnd f_s4Roll(S4_PNH, array.get(s4PrvF, S4_NYS) ? array.get(s4PrvH, S4_NYS) : na, LevelKind.psh, 1, i_useSessions) f_s4Roll(S4_PNL, array.get(s4PrvF, S4_NYS) ? array.get(s4PrvL, S4_NYS) : na, LevelKind.psl, -1, i_useSessions) // --- (b) the live session extreme, as a level price can RETURN to. // It uses the PRIOR bar's session high and only once price has left it. // The running high already contains THIS bar's high, so probing it with // this bar's high gives distance zero on every new session extreme - // \"at a meaningful level\" would then be true by construction, which is // the reaction certifying the cause it is supposed to predict. // On a session EDGE the carried extreme still belongs to the session that // just ended, so the leave test is skipped rather than run against a stale // price - else the first London bar could activate a level at the Asia high // and call it the current session's. if s4AsiNew or s4LonNew or s4NyNew or s4AsiEnd or s4LonEnd or s4NyEnd s4LeftHi := false s4LeftLo := false else if not na(s4CsHiP) and s4CsHiP - low > f_tol(i_csLeaveAtr) s4LeftHi := true if not na(s4CsLoP) and high - s4CsLoP > f_tol(i_csLeaveAtr) s4LeftLo := true // A NEW session extreme retires the latch. Without this the latch outlives // the price it described: once price has left the session high ONCE, it // stays true for the rest of the session while s4CsHiP keeps re-pointing // at each later high - so the csh level sits live at ~zero distance on // every new session extreme, which is the reaction certifying the cause, // exactly what the leave test above exists to prevent. csHi/csLo already // include this bar (4.1 folded it in); s4CsHiP is still the prior bar's. if not na(csHi) and not na(s4CsHiP) and csHi > s4CsHiP s4LeftHi := false if not na(csLo) and not na(s4CsLoP) and csLo < s4CsLoP s4LeftLo := false f_s4Track(S4_CSH, s4CsHiP, LevelKind.csh, 1, i_useCurSess and s4LeftHi) f_s4Track(S4_CSL, s4CsLoP, LevelKind.csl, -1, i_useCurSess and s4LeftLo) f_s4Track(S4_DOP, dayOpen, LevelKind.dayOpenK, 0, i_useDayOpen) // --- (c) swings from SECTION 3, clustered. // The dip accumulators are fed the PIVOT-ALIGNED bar so their timeline // matches the pivot's, then reset on registration. s4RunLo := na(s4RunLo) ? s4LoPiv : math.min(s4RunLo, s4LoPiv) s4RunHi := na(s4RunHi) ? s4HiPiv : math.max(s4RunHi, s4HiPiv) if i_useSwings and not na(pvtHi) float dip = na(s4RunLo) ? 1.0e20 : pvtHi - s4RunLo bool fresh = dip >= f_tol(i_eqMinDip) if not f_s4Merge(pvtHi, 1, s4PivBar, fresh) f_s4Add(pvtHi, LevelKind.swingHi, 1) s4RunLo := na if i_useSwings and not na(pvtLo) float dip = na(s4RunHi) ? 1.0e20 : s4RunHi - pvtLo bool fresh = dip >= f_tol(i_eqMinDip) if not f_s4Merge(pvtLo, -1, s4PivBar, fresh) f_s4Add(pvtLo, LevelKind.swingLo, -1) s4RunHi := na // --- (d) breaks, rescore and prune, in ONE downward pass so that removing // an element cannot skip the next one. The break test is TWO consecutive // confirmed closes beyond the buffer, written as close and close[1] // rather than a per-level counter because LiquidityLevel has no counter // field and a series offset needs none. int n4 = array.size(levels) if n4 > 0 float pruneRef = (na(pdh) or na(pdl) or pdh <= pdl) ? aRef * 25.0 : pdh - pdl float pruneDst = math.max(f_tol(18.0), 1.5 * pruneRef) for i = n4 - 1 to 0 LiquidityLevel L = array.get(levels, i) // The live session extremes are EXCLUDED from the break test: their // own price moves with the session, so \"price closed through it\" // establishes nothing durable about where orders rest - it would just // flip the polarity of a level that is about to move anyway. bool trk = L.kind == LevelKind.csh or L.kind == LevelKind.csl if not na(L.price) bool upBrk = close > L.price + s4BrkTol and close[1] > L.price + s4BrkTol bool dnBrk = close < L.price - s4BrkTol and close[1] < L.price - s4BrkTol if not trk and ((L.side > 0 and upBrk) or (L.side < 0 and dnBrk)) // The level is not deleted, it INVERTS: broken resistance is // support. `swept` timestamps the event through lastTouch, which // is what the grace window and the discount both read. L.side := -L.side L.swept := true L.lastTouch := bar_index L.strength := f_s4Score(L) // Age runs from the last touch. Keyed on creation, a five-touch pool // would be deleted for being old one bar after its fifth touch. bool old = bar_index - math.max(L.lastTouch, L.createdBar) > i_maxLevelAge // Distance is measured against the DAY'S range, not the bar ATR: \"will // price ever come back here\" is a question about the day, and an // ATR-scaled answer is 7x tighter on 1M than on 15M for no reason. bool far = L.touches < 1 and (bar_index - L.createdBar) > 200 and not na(L.price) and math.abs(close - L.price) > pruneDst if (old or far) and not f_s4Prot(L.kind) array.remove(levels, i) // --- (e) hard cap. At most 4 evictions per bar, lowest quality first, and // never a protected kind - which is also what keeps every managed-slot // reference pointing at a level that is still in the array. for e = 0 to 3 if array.size(levels) > i_maxLevels int worst = -1 float wq = 1.0e20 for i = 0 to array.size(levels) - 1 LiquidityLevel L = array.get(levels, i) if not f_s4Prot(L.kind) and L.strength < wq wq := L.strength worst := i if worst >= 0 array.remove(levels, worst) // --- (f) carry the session extreme forward for the NEXT bar's level price. s4CsHiP := s4CurSl < 0 ? na : array.get(s4PHi, s4CurSl) s4CsLoP := s4CurSl < 0 ? na : array.get(s4PLo, s4CurSl) // ---------------------------------------------------------------------------- // 4.4 THE QUERY // f_nearestLevel(dir) -> [price, dist, qual, idx] // price : the nearest ELIGIBLE level, or na when the map has nothing for dir // dist : USD per ounce, NOT ATR multiples and NOT ticks. Compare it against // f_tol(x) like every other distance in this file. // qual : 0..1, that level's live quality plus the confluence bonus // idx : its index in `levels`, valid ONLY on the bar it was returned - // pruning shifts indices, and in v6 a stale -1 reads the LAST element // instead of throwing. Snapshot the PRICE if you need to remember it. // A long probes `low` as well as `close`: the sweep wick is the interaction // with the level, and a bar that wicked through and closed back inside has // touched it even though its close did not. // // \"NEAREST\" IS RANKED BY proximity x quality, NOT by distance alone. Distance // alone lets a bare swing 0.05 USD away hide the previous-day high 0.20 USD // away - both inside tolerance, and the one that matters is the one price is // reacting to. Ties, and the case where EVERYTHING is outside tolerance (every // product is then 0), fall back to the genuinely nearest, so `dist` still means // what it says and `near` is still correctly false. // ---------------------------------------------------------------------------- f_nearestLevel(int dir) => float probe = dir > 0 ? low : high float bPx = na float bD = na float bQ = 0.0 float bS = -1.0 int bI = -1 int n = array.size(levels) if n > 0 for i = 0 to n - 1 LiquidityLevel L = array.get(levels, i) if f_s4Elig(L, dir) float d = math.min(math.abs(probe - L.price), math.abs(close - L.price)) float sc = f_clamp01(1.0 - d / s4ProxTol) * L.strength if sc > bS or (sc == bS and (na(bD) or d < bD)) bD := d bS := sc bPx := L.price bQ := L.strength bI := i // Confluence, de-duplicated: credit for ONE genuinely distinct second level // in the same window, scaled by its own quality. Counting array ENTRIES // instead would pay three times for one price - the day high, the session // high and the swing high are routinely the same high wearing three labels. float b2Q = 0.0 if not na(bPx) and n > 0 and i_conflBonus > 0.0 for i = 0 to n - 1 LiquidityLevel L = array.get(levels, i) if f_s4Elig(L, dir) float d = math.min(math.abs(probe - L.price), math.abs(close - L.price)) if d <= s4ProxTol and math.abs(L.price - bPx) > s4EqTol and L.strength > b2Q b2Q := L.strength [bPx, bD, f_clamp01(bQ + i_conflBonus * b2Q), bI] // ---------------------------------------------------------------------------- // 4.5 MID-RANGE / NO-MAN'S-LAND // The reference is ALWAYS the previous COMPLETED day. A developing window would // switch the veto off during the quietest hours (a 3-hour Asia range is never // \"wide\") and on during the first hour, which is the exact inverse of the // intent - and on 1M it would flicker bar to bar. // ---------------------------------------------------------------------------- s4RefRng = (na(pdh) or na(pdl)) ? na : pdh - pdl // The only two raw ATR multiples in this section are here and in the prune // fallback, and deliberately so: they size a DAY'S RANGE, they do not ask \"is // this close enough to be the same price\". Flooring an 8-ATR range at one spread // through f_tol() would be meaningless - f_tol is for tolerances, not magnitudes. rangeWide = not na(s4RefRng) and s4RefRng > i_minDayRangeAtr * aRef // NOT clamped: above 1 means price is beyond yesterday's high, below 0 beyond // its low, and squashing that to the boundary would hide exactly the extension // the rest of the file wants to know about. rangePos = rangeWide ? (close - pdl) / s4RefRng : na midRange = rangeWide and math.abs(rangePos - 0.5) < i_midBand // ---------------------------------------------------------------------------- // 4.6 PUBLISHED EVIDENCE // Evaluated ONCE per direction per bar. Long and short are the same expression // with dir flipped - there is no second code path to keep in sync. // ---------------------------------------------------------------------------- [s4PxL, s4DistL, s4QualL, s4IdxL] = f_nearestLevel(1) [s4PxS, s4DistS, s4QualS, s4IdxS] = f_nearestLevel(-1) // \"No eligible level\" is a fact, not missing data, so it scores 0.0 rather than // na: na here would poison the whole setup score instead of costing it a row. f_s4Grade(float d, float q) => na(d) ? 0.0 : f_clamp01((1.0 - f_ramp(d, 0.0, s4ProxTol)) * q * (midRange ? i_midPenalty : 1.0)) qLevelL = f_s4Grade(s4DistL, s4QualL) qLevelS = f_s4Grade(s4DistS, s4QualS) // near AND strong AND (not mid-range OR a genuinely precise touch). The tight // override is what keeps a clean tag of a major level tradeable in the middle of // the day's range - only VAGUE mid-range proximity is vetoed. s4NearL = not na(s4DistL) and s4DistL <= s4ProxTol s4NearS = not na(s4DistS) and s4DistS <= s4ProxTol s4TightL = not na(s4DistL) and s4DistL <= i_tightFrac * s4ProxTol s4TightS = not na(s4DistS) and s4DistS <= i_tightFrac * s4ProxTol s4MeanL = s4NearL and s4QualL >= i_minLevelQual and (not midRange or s4TightL) s4MeanS = s4NearS and s4QualS >= i_minLevelQual and (not midRange or s4TightS) f_atMeaningful(int dir) => dir > 0 ? s4MeanL : s4MeanS // Price is nowhere in particular: no side has a level worth reacting to. This is // the NO LIQUIDITY gate SECTION 13 reads, and it is deliberately direction-free. noMansLand = not s4MeanL and not s4MeanS // ========================= END SECTION 4 ==================================== // ============================================================================ // SECTION 5 : LIQUIDITY SWEEP / STOP-RUN ENGINE // // READ-ONLY over SECTION 4's array<LiquidityLevel>. This module does not own a // level registry, does not create levels, does not merge them and does not // mutate a single field on one. The architect's ruling is explicit: SECTION 4 // owns the map, SECTION 5 owns the EVENT. So every value this engine needs from // a level - its price and its quality - is SNAPSHOTTED into a SweepCand at // candidate open. A later EQ merge in SECTION 4 can move lv.price by up to the // cluster tolerance; if the state machine kept reading lv.price live, the // penetration it is measuring would jump with no relation to what price did, // and a live candidate could flip to BROKEN on a bar where nothing happened. // // WHAT A SWEEP IS HERE: price pushes BEYOND a known resting-liquidity level by // at least minPen (so a graze inside the spread is not an event) but by no more // than maxPen (deeper than that and it is a genuine breakout, not a stop-run), // and then CLOSES back through the level plus a buffer inside a window of // i_sweepBars bars. Every one of those three distances goes through f_tol(), so // none of them is denominated in ticks and none of them can collapse below the // spread in dead tape. // // FROZEN AT CANDIDATE OPEN, and this is the whole non-drift argument: // * the level price (a later merge cannot move the goalposts) // * the max-penetration ceil (ATR is an RMA and drifts ~7%/bar; a candidate // opened under one ceiling must not be judged // under another, or a quiet bar with NO new // extreme can turn a live sweep into a breakout) // * the reclaim buffer (same reason) // * the level quality (SECTION 4 may re-score the level meanwhile) // // DIRECTION: one code path, dir = +1 LONG / -1 SHORT. A LONG needs SELL-side // liquidity taken below a SUPPORT level, so the eligible level is lvl.side == // -dir - which is what SECTION 4's f_s4Elig() tests, plus the two cases only it // can know about (a neutral level, and a level still inside its polarity-flip // grace window). probe/pen/beyond/reclaim are all written with the dir sign, so // the mirror is structural: there is no second block of arithmetic that can // drift out of step with this one. // // i_sweepRearmBars is a PER-LEVEL re-arm, NOT a global cooldown. Global // cooldowns belong to SECTION 13, are per-direction there, and mean something // different: this one stops ONE price pocket machine-gunning a candidate every // bar; that one stops the SYSTEM trading after a loss. // ============================================================================ G5 = \"5 - Liquidity Sweep\" // ------------------------------------------------------------- 5.1 INPUTS i_sweepMinPen = input.float(0.12, \"Min penetration (x ATR, floored at spread)\", minval = 0.0, maxval = 2.0, step = 0.01, group = G5, tooltip = \"Smallest push beyond a level that counts as a stop-run. It is f_tol()'d, so the effective floor is never below one spread - on 1M gold that floor, not ATR, is what keeps quote noise out. At 0 the spread floor still applies; raise it and only decisive raids register, at the cost of missing shallow surgical sweeps.\", display = display.none) i_sweepMaxPen = input.float(0.90, \"Max penetration (x ATR, floored at spread)\", minval = 0.1, maxval = 5.0, step = 0.05, group = G5, tooltip = \"Deepest push still treated as a SWEEP. Beyond this, a bar that also CLOSES beyond the level is reclassified as a genuine breakout and the candidate is dropped. A deep push that closes back inside is NOT reclassified - that is the violent NFP-style stop-run, and it still resolves as a sweep with a depth score of zero. Too low and every ordinary range bar looks like a breakout; too high and real trend breaks are mislabelled reversals. The band is auto-widened if it would invert against min penetration.\", display = display.none) i_sweepBuf = input.float(0.10, \"Reclaim buffer (x ATR, floored at spread)\", minval = 0.0, maxval = 1.0, step = 0.01, group = G5, tooltip = \"How far back THROUGH the level the reclaiming close must sit. Stops a close resting exactly on the level from counting as a reclaim. At 0 the spread floor still applies; raising it demands a more decisive rejection and produces fewer, later sweeps.\", display = display.none) i_sweepBars = input.int(3, \"Reclaim window (bars)\", minval = 1, maxval = 20, group = G5, tooltip = \"Bars allowed for the reclaiming close, COUNTING the penetration bar itself. 1 = same-bar sweep and reclaim only. Every candidate is fully resolved within this many bars - there is no state that lingers. Larger windows catch multi-bar raids but publish later, and the reclaim-speed part of the quality score then means less.\", display = display.none) i_sweepAccept = input.int(2, \"Acceptance closes = breakout\", minval = 1, maxval = 10, group = G5, tooltip = \"Closes BEYOND the level, inside the window, that reclassify the candidate as acceptance rather than a raid. 1 = strict: the penetration bar must close back. Higher values tolerate more closes beyond before giving up, which admits slower reversals and also more failed breaks pretending to be sweeps.\", display = display.none) i_sweepRearmBars = input.int(10, \"Per-level re-arm (bars)\", minval = 0, maxval = 500, group = G5, tooltip = \"After a level's candidate resolves - swept, broken or expired - that PRICE POCKET cannot open another candidate for this many bars. This is a per-level de-duplication, NOT the system cooldown (SECTION 13 owns that, per direction). At 0 a level that stays penetrated can re-arm every bar.\", display = display.none) i_sweepMinQual = input.float(0.45, \"Min sweep quality to publish (0..1)\", minval = 0.0, maxval = 1.0, step = 0.01, group = G5, tooltip = \"Sweeps scoring below this are detected but not published - the liquidity is still consumed and the level still re-arms, but the chain never starts. This is a SETUP QUALITY score, never a win probability. At 0 every reclaim publishes, which is the definition of the event rather than evidence about it; at 1 nothing ever does.\", display = display.none) // --------------------------------------------------- 5.2 SCORE CONSTANTS // Weights sum to 1.00 and qSweep is exported in [0,1] - SECTION 12 owns the one // 0-100 score in this file, so nothing here mints points. // // The weighting answers a specific criticism: reclaim SPEED and the rejection // WICK partly encode the same fact (a same-bar reclaim IS a big wick), and both // are implied by the confirmation condition itself. So speed is the SMALLEST // term, the wick and the participation proxy carry the independent evidence, and // the floor for \"it poked out and closed back in\" on a lone untested swing with // no volume and no wick is 0.427 - below the default publish gate. The gate can // therefore only be cleared by evidence the trigger did not already guarantee. SWQ_W_DEPTH = 0.20 SWQ_W_SPEED = 0.15 SWQ_W_PART = 0.20 SWQ_W_WICK = 0.25 SWQ_W_LEVEL = 0.20 // Depth is a HUMP, not a ramp. A one-spread graze sits at the noise floor and a // push that nearly reached the breakout boundary was nearly a breakout; the good // raid is in between. A pure \"shallower is better\" ramp makes the threshold that // exists to exclude noise and the threshold that maximises score the same number. SWQ_D_LO = 0.20 SWQ_D_HI = 0.55 // ------------------------------------------------- 5.3 PER-BAR THRESHOLDS // Every distance through f_tol(): nothing here is in ticks, and nothing can sit // below the spread. The band is clamped so it can NEVER invert - an inverted band // is silently catastrophic, because every touch then routes to \"breakout\" and the // engine emits zero sweeps forever while shredding the level map. swpMinPen = f_tol(i_sweepMinPen) swpCeil = math.max(f_tol(i_sweepMaxPen), swpMinPen * 2.0) swpBufNow = f_tol(i_sweepBuf) // Pocket tolerance: two levels closer together than this are ONE pocket of // liquidity for de-duplication purposes, so a wick through both cannot publish // twice from the same stop cluster. swpPocket = f_tol(0.10) // -------------------------------------------------------- 5.4 ENGINE STATE // Open candidates plus three LOCKSTEP side-cars. SweepCand (SECTION 1) has no // field for the bar statistics, the frozen buffer or the acceptance counter, and // SECTION 1 is frozen, so they live in parallel arrays that are only ever pushed // and removed through f_sweepAdd() / f_sweepDrop(). Nothing else may touch them. var array<SweepCand> swpCands = array.new<SweepCand>() var array<float> swpEvid = array.new<float>() // extreme-bar evidence, 0..1 var array<float> swpBuf = array.new<float>() // reclaim buffer frozen at open var array<int> swpAcc = array.new<int>() // closes beyond the level so far // Per-level re-arm memory, keyed by the PRICE POCKET rather than by an array // index (SECTION 4 prunes and re-orders its array, so an index is not an // identity) and rather than by the level object (which may be deleted). var array<float> swpArmPx = array.new<float>() var array<int> swpArmDir = array.new<int>() var array<int> swpArmBar = array.new<int>() // ------------------------------------------------------------ 5.5 EXPORTS // VAR, not per-bar locals. SECTION 7 reads sweepLvl* as the rejection edge and // SECTION 11 reads sweepExt* as a stop anchor, both on bars AFTER the sweep bar. // A non-var local would be na on every one of those bars, every comparison // against it would silently be false, and the chain would never fire. var bool sweepSigL = false var bool sweepSigS = false var float sweepExtL = na // the wick tip of a SELL-side raid: the natural stop var float sweepExtS = na // the wick tip of a BUY-side raid var float sweepLvlL = na // the level that was swept: the invalidation reference var float sweepLvlS = na var float qSweepL = 0.0 // 0..1 setup evidence for SECTION 12's rubric var float qSweepS = 0.0 var int sweepBarL = na // bar of the last published sweep - STALENESS lives var int sweepBarS = na // downstream (SECTION 14 owns phase deadlines) // ----------------------------------------------------- 5.6 DIR PRIMITIVES // The entire mirror, in four lines. dir = +1 probes the LOW against a support // level; dir = -1 probes the HIGH against a resistance level. Reflect the chart // vertically and every one of these maps onto its opposite exactly. f_sweepProbe(int dir) => dir > 0 ? low : high f_sweepPen(int dir, float lvlPx) => dir * (lvlPx - f_sweepProbe(dir)) f_sweepBeyond(int dir, float lvlPx) => dir * (lvlPx - close) > 0.0 f_sweepRecl(int dir, float lvlPx, float bf) => dir * (close - lvlPx) > bf // The level's contribution to the sweep score. SECTION 4 keeps lv.strength as // the LIVE quality - SECTION 2's kind x touches rubric, aged from the last touch // and discounted once a polarity flip is out of its grace window - so it is a // strictly better number than the raw rubric. The fallback covers a level that // has not been scored yet, which would otherwise zero the whole row. f_sweepLvlQ(LiquidityLevel lv) => float s = f_clamp01(nz(lv.strength, 0.0)) s > 0.0 ? s : f_clamp01(lv.quality()) // Bar evidence, latched on the bar that sets the extreme and never re-latched by // a later inside bar - the statistics of the real stop-run bar must survive. // rvol is na on a feed without volume: the participation row is then DROPPED and // the wick row carries the whole sub-block, which is this file's one na policy // (never 0 - that would make a missing feed a permanent penalty; never 1 - that // would fabricate participation out of nothing). f_sweepEvid(int dir) => float wk = nz(f_ramp(f_wickFrac(dir), 0.30, 0.70), 0.0) float pt = f_ramp(rvol, 1.0, 2.0) na(pt) ? wk : (SWQ_W_PART * pt + SWQ_W_WICK * wk) / (SWQ_W_PART + SWQ_W_WICK) // The 0..1 sweep quality. pen and ceil are BOTH the frozen candidate values, so // identical price action always scores identically no matter how ATR drifted // during the window. f_sweepQual(float pen, float ceil, int lag, float evid, float lvlQ) => float d = ceil > 0.0 ? f_clamp01(pen / ceil) : 1.0 float dUp = nz(f_ramp(d, 0.0, SWQ_D_LO), 0.0) // rises to the hump float dDn = nz(f_ramp(-d, -1.0, -SWQ_D_HI), 0.0) // falls off the hump float dep = math.min(dUp, dDn) float spd = nz(f_ramp(float(i_sweepBars - lag), 0.0, float(i_sweepBars)), 0.0) f_clamp01(SWQ_W_DEPTH * dep + SWQ_W_SPEED * spd + (SWQ_W_PART + SWQ_W_WICK) * nz(evid, 0.0) + SWQ_W_LEVEL * f_clamp01(nz(lvlQ, 0.0))) // ------------------------------------------------ 5.7 LOCKSTEP REGISTRIES // The four candidate arrays are index-aligned by construction: they are ONLY // grown and shrunk here, together, so no caller can desynchronise them. f_sweepAdd(SweepCand c, float evid, float bf, int acc) => array.push(swpCands, c) array.push(swpEvid, evid) array.push(swpBuf, bf) array.push(swpAcc, acc) f_sweepDrop(int i) => array.remove(swpCands, i) array.remove(swpEvid, i) array.remove(swpBuf, i) array.remove(swpAcc, i) // Record (or refresh) the re-arm clock for a price pocket. f_sweepRearm(int dir, float px) => bool found = false int n = array.size(swpArmPx) if n > 0 for i = 0 to n - 1 if array.get(swpArmDir, i) == dir and math.abs(array.get(swpArmPx, i) - px) <= swpPocket array.set(swpArmPx, i, px) array.set(swpArmBar, i, bar_index) found := true if not found array.push(swpArmPx, px) array.push(swpArmDir, dir) array.push(swpArmBar, bar_index) // Is this pocket allowed to open a candidate at all? f_sweepArmed(int dir, float px) => bool ok = true int n = array.size(swpArmPx) if n > 0 for i = 0 to n - 1 if array.get(swpArmDir, i) == dir and math.abs(array.get(swpArmPx, i) - px) <= swpPocket and bar_index - array.get(swpArmBar, i) < i_sweepRearmBars ok := false ok // One candidate per pocket at a time. Without this, two swing lows 0.25 USD // apart are two objects, one wick opens both, and the second publishes on the // next bar from the same stop cluster. f_sweepHasCand(int dir, float px) => bool hit = false for c in swpCands if c.dir == dir and math.abs(c.lvlPrice - px) <= swpPocket hit := true hit // Drop re-arm records that can no longer block anything. Walks DOWN so a removal // never disturbs an index still to be visited. f_sweepPrune() => int n = array.size(swpArmPx) if n > 0 for i = n - 1 to 0 if bar_index - array.get(swpArmBar, i) >= i_sweepRearmBars array.remove(swpArmPx, i) array.remove(swpArmDir, i) array.remove(swpArmBar, i) // ------------------------------------------------- 5.8 THE STATE MACHINE // ONE function, called once per direction. It mutates arrays and object fields // (both legal inside a Pine function) and returns its result as a tuple, because // assigning to a global inside a function is a hard compile error in v6. // // Returns [fired, sweptLevel, sweepExtreme, quality] for the best-scoring sweep // on this side this bar - at most ONE publish per side per bar. f_sweepRun(int dir) => bool fired = false float bLvl = na float bExt = na float bQ = 0.0 // --- A. advance every OPEN candidate on this side ---------------------- // Descending walk: f_sweepDrop() removes the entry we are standing on, and // walking down guarantees that only already-visited indices shift. int n = array.size(swpCands) if n > 0 for i = n - 1 to 0 SweepCand c = array.get(swpCands, i) if c.dir == dir float bf = array.get(swpBuf, i) float pen = f_sweepPen(dir, c.lvlPrice) float pMax = dir * (c.lvlPrice - c.extreme) // the RATCHET, derived bool bey = f_sweepBeyond(dir, c.lvlPrice) bool rec = f_sweepRecl(dir, c.lvlPrice, bf) // New extreme: re-latch the bar statistics onto THIS bar. An // inside bar never overwrites the stats of the real raid bar. if pen > pMax c.extreme := f_sweepProbe(dir) array.set(swpEvid, i, f_sweepEvid(dir)) pMax := pen if bey array.set(swpAcc, i, array.get(swpAcc, i) + 1) int lag = bar_index - c.openBar bool last = lag >= i_sweepBars - 1 // the LAST bar of the window bool deep = pMax > c.maxPen // ceiling FROZEN at open if deep and bey // Too deep AND accepted beyond: a genuine breakout. The close // is what decides - a 3-ATR spike that closed back inside is // the most characteristic gold stop-run there is, and calling // that a breakout would delete the level it just raided. f_sweepRearm(dir, c.lvlPrice) f_sweepDrop(i) else if array.get(swpAcc, i) >= i_sweepAccept // Acceptance beyond the level: the market took it, not a raid. f_sweepRearm(dir, c.lvlPrice) f_sweepDrop(i) else if rec and lag <= i_sweepBars - 1 // SWEPT. A deep-but-reclaimed raid lands here too and scores // ~0 on depth, which is the honest outcome rather than a veto. float q = f_sweepQual(pMax, c.maxPen, lag, array.get(swpEvid, i), c.quality) if q >= i_sweepMinQual and q > bQ fired := true bQ := q bLvl := c.lvlPrice bExt := c.extreme f_sweepRearm(dir, c.lvlPrice) f_sweepDrop(i) else if last // Window over with no reclaim. Nothing lingers unresolved. f_sweepRearm(dir, c.lvlPrice) f_sweepDrop(i) // --- B. open NEW candidates against SECTION 4's map (read-only) -------- int m = array.size(levels) if m > 0 for j = 0 to m - 1 LiquidityLevel lv = array.get(levels, j) // f_s4Elig() is SECTION 4's eligibility test and the only one used // here. It is a superset of SECTION 2's strict isFor(): besides // \"active, priced, born from the opposite polarity\", it admits a // neutral level and - critically - a level still inside its flip // grace window. That last case IS the setup: a close below PDL is // what flips PDL from support to resistance, and testing isFor() // alone would disqualify the level on the exact bar its sweep // becomes tradeable. if f_s4Elig(lv, dir) float lp = lv.price float pen = f_sweepPen(dir, lp) if pen >= swpMinPen bool free = not f_sweepHasCand(dir, lp) bool arm = f_sweepArmed(dir, lp) if free and arm bool bey = f_sweepBeyond(dir, lp) bool rec = f_sweepRecl(dir, lp, swpBufNow) if pen > swpCeil and bey // Born already broken: a breakout, never a candidate. f_sweepRearm(dir, lp) else // SNAPSHOT EVERYTHING. From here on this candidate is // judged against the numbers that existed when it // opened, not against whatever ATR or SECTION 4 do next. float ev = f_sweepEvid(dir) if rec // Same-bar raid and reclaim: lag 0, resolved now. float q = f_sweepQual(pen, swpCeil, 0, ev, f_sweepLvlQ(lv)) if q >= i_sweepMinQual and q > bQ fired := true bQ := q bLvl := lp bExt := f_sweepProbe(dir) f_sweepRearm(dir, lp) else if i_sweepBars <= 1 // One-bar window, already closed unreclaimed. f_sweepRearm(dir, lp) else f_sweepAdd(SweepCand.new(dir = dir, lvlPrice = lp, extreme = f_sweepProbe(dir), openBar = bar_index, lvlIdx = j, maxPen = swpCeil, quality = f_sweepLvlQ(lv), resolved = false), ev, swpBufNow, bey ? 1 : 0) [fired, bLvl, bExt, bQ] // --------------------------------------------------------- 5.9 PER-BAR RUN // Confirmed bars only. Nothing above this line mutated anything. if confirmed and warmupOk sweepSigL := false sweepSigS := false f_sweepPrune() // Both directions are advanced by the SAME function. There is no long block // and short block to keep in sync - there is one block, called twice. [fL, lvL, exL, qL] = f_sweepRun(1) [fS, lvS, exS, qS] = f_sweepRun(-1) if fL sweepSigL := true sweepLvlL := lvL sweepExtL := exL qSweepL := qL sweepBarL := bar_index if fS sweepSigS := true sweepLvlS := lvS sweepExtS := exS qSweepS := qS sweepBarS := bar_index // The latched values deliberately OUTLIVE their bar: the chain that consumes them // (rejection -> absorption -> displacement -> BOS -> retest) runs over the bars // AFTER the sweep. Judging whether a latched sweep is too old to still count is // SECTION 14's job, which is why sweepBarL/S is exported alongside them. // ========================= END SECTION 5 ==================================== // ============================================================================ // SECTION 6 : ABSORPTION + ICEBERG ZONES // // THIS SECTION OWNS THE ONE array<IcebergZone> AND THE ONE ZONE LIFECYCLE IN // THE ENTIRE FILE. Seven modules originally carried their own zone birth, // invalidation and touch rules; a zone could be simultaneously alive in one, // dead in another and never created in a third. Everything below is the single // source of truth: SECTION 9 links its BOS clock to the exported zone id, // SECTION 10 retests the exported bounds, SECTION 11 anchors a stop on them, // SECTION 13 gates on `not zoneAlive`, SECTION 16 draws one box per live zone. // No one else creates, ages, breaks or expires a zone. // // THE EFFORT-VS-RESULT TEST, AND WHY IT IS NOT CIRCULAR // A single bar's close-within-range cannot measure both \"how hard the aggressor // pushed\" and \"how little they got for it\": with a CLV-derived delta proxy those // two quantities are the SAME NUMBER, so \"heavy selling that failed to push // price down\" is self-contradictory on one bar and the test degenerates into a // tautology. This module therefore measures them over DIFFERENT WINDOWS: // // EFFORT = cumulative deltaProxy over the cluster's FIRST n-1 bars, // normalised by the tick volume of those same bars // -> a volume-weighted mean aggressor lean in [-1, +1] // RESULT = net displacement across the WHOLE cluster (all n bars), // normalised by BOTH the total path traded and by the // ATR x rvol move that much activity implied // // The final bar of the cluster is excluded from the effort window on purpose: // it is the bar that carries the rejection, and letting it vote on effort is // what made the two measurements collapse into one. // // EVERYTHING HERE IS A PROXY. TradingView exposes no order book and no bid/ask // tape for spot XAUUSD, and `volume` is TICK COUNT. There is no way to see a // hidden iceberg order from this data. What this module detects is a cluster // where a lot of one-sided activity produced almost no price result and then // reversed - a shape consistent with absorption. The user-facing word is // \"Potential\", the number is a setup score, and neither is a probability. // ============================================================================ G6A = \"6 - Absorption\" G6Z = \"6 - Iceberg Zones\" // ------------------------------------------------------------- 6.1 INPUTS i_absClusterBars = input.int(3, \"Cluster bars\", minval = 2, maxval = 8, group = G6A, tooltip = \"Consecutive CONFIRMED bars that form one absorption cluster. Minimum 2 and that is structural, not stylistic: the earlier bars carry the aggressor's EFFORT and the final bar carries the RESULT, and a 1-bar cluster would measure both on the same close. 3 suits 1M/5M gold, 2 suits 15M. Larger clusters are steadier but start the zone later.\", display = display.none) i_absRvolThresh = input.float(1.50, \"Relative tick-volume threshold\", minval = 1.0, maxval = 5.0, step = 0.05, group = G6A, tooltip = \"Mean relative TICK volume across the cluster. XAUUSD volume on TradingView is the number of price updates, not contracts, so this measures ACTIVITY, not size - re-tune it per broker feed. It is a veto AND a graded sub-score. On a feed with no volume at all the veto BYPASSES and the row is dropped from the score with the remaining weights renormalised, rather than scoring it 0 (which would silently disable the module) or 1 (which would invent participation that was never measured).\", display = display.none) i_absMaxProgress = input.float(0.40, \"Max price progress (effort vs result)\", minval = 0.05, maxval = 0.90, step = 0.01, group = G6A, tooltip = \"Ceiling on what the aggressor NETTED, as a fraction of (a) the price path they traded through and (b) the ATR x rvol move their activity implied. The WORSE of the two is used, so both denominators must agree that effort produced no result. Lower is stricter: at 0.05 only a dead-stall cluster qualifies, at 0.90 almost any pullback does. The SCORE uses the absolute value, so a cluster that already ran hard in the zone's own direction is penalised too - there is nothing left there to absorb. DEFAULT IS THE 5M PRESET, matching every other shipped default in this file. On 1M tighten it to 0.35: those bars are largely spread, so effort-without-result has to be judged more strictly.\", display = display.none) i_absMinWick = input.float(0.33, \"Min rejection wick (fraction of cluster range)\", minval = 0.10, maxval = 0.90, step = 0.01, group = G6A, tooltip = \"Cluster lower wick (bullish absorption) or upper wick (bearish) as a fraction of the cluster's whole high-low range. This is the veto that keeps the two directions mutually exclusive on the same cluster. Raising it demands a more violent rejection and produces far fewer zones; below ~0.25 a plain trend pullback qualifies.\", display = display.none) i_absLookback = input.int(8, \"Prior-test lookback (bars)\", minval = 4, maxval = 60, group = G6A, tooltip = \"How far back to count bars that ALREADY probed this shelf and closed back out of it, excluding the cluster's own bars. Those prior tests are what separate a shelf from a single wick. Also sets the hard zone expiry (this x 8 bars). Too short and the test count is always 0; too long and ancient unrelated wicks count.\", display = display.none) i_absZoneAtr = input.float(0.60, \"Zone thickness cap (x ATR)\", minval = 0.10, maxval = 4.0, step = 0.05, group = G6A, tooltip = \"Caps how thick the absorption shelf may be and centres the containment sub-score. The cluster is vetoed outright if its own range exceeds 1.5x this - a cluster that will not fit inside one and a half zone widths is volatility, not absorption. Thicker zones are easier to retest and give worse stops.\", display = display.none) i_absMinTests = input.int(2, \"Prior tests for a full test score\", minval = 1, maxval = 10, group = G6A, tooltip = \"The number of prior probes that scores 0.5 on the test row. This is SOFT-SCORED, never a veto, and that is deliberate: as a hard minimum it deadlocks against the max-touches ceiling and the system emits nothing at all. Raise it to prefer well-tested shelves over fresh ones.\", display = display.none) i_absMinReact = input.float(0.50, \"Min reaction to promote a zone (x ATR)\", minval = 0.10, maxval = 4.0, step = 0.05, group = G6A, tooltip = \"Stage-2 trigger: price must CLOSE this many ATR beyond the cluster's far extreme, in the absorption direction, within the reaction window. Measured on the CLOSE and from OUTSIDE the range the cluster already traded, so neither a wick spike nor a move the cluster itself already made can promote a zone. Keep it well above the 0.15-0.35 USD spread. Higher = later, surer, worse entry.\", display = display.none) i_absMinStrength = input.float(0.55, \"Min absorption strength (0..1)\", minval = 0.0, maxval = 1.0, step = 0.01, group = G6A, tooltip = \"Gate on the fused 0..1 score. This is the quality-over-quantity knob: raise it and the module simply says NO TRADE more often. It is a SETUP score built from proxies, never a win probability. The score is a weighted blend of graded sub-scores, so a cluster that is exceptional on five axes and marginal on one still qualifies - which a pure AND of thresholds could never do.\", display = display.none) i_absBreakBars = input.int(2, \"Confirmed closes that break a zone\", minval = 1, maxval = 6, group = G6Z, tooltip = \"A zone dies only after this many CONSECUTIVE confirmed CLOSES beyond its invalidation level. A WICK THROUGH THE ZONE IS THE ABSORPTION and must never kill it; one non-breaking close resets the counter. 1 makes zones fragile on gold's spike-and-revert tape; above 3 a genuinely broken shelf keeps blocking new zones.\", display = display.none) i_zoneMaxTouches = input.int(4, \"Max touches before a zone is worn out\", minval = 2, maxval = 20, group = G6Z, tooltip = \"A shelf that keeps being probed is being EATEN. After this many post-birth touches the zone retires. The cluster's own bars are never counted - counting them is what previously killed every zone at the exact moment it qualified, so the system emitted nothing forever. Must stay comfortably above the prior-test score anchor, which counts a different window entirely.\", display = display.none) i_absMaxZones = input.int(8, \"Max live zones\", minval = 1, maxval = 20, group = G6Z, tooltip = \"Cap on simultaneously tracked zones across BOTH directions. When full, the WEAKEST is dropped and a promoted (live) zone outranks a pending one, because the live zone is the one the rest of the chain is currently working on. Keep it below SECTION 16's box budget or zones will exist that are never drawn.\", display = display.none) // ------------------------------------------------ 6.2 DERIVED, NOT INPUTS // Two more inputs for these would be two more things to keep consistent with // the cluster length and the lookback. They are derived from both. abReactWin = math.max(4, i_absClusterBars * 3) // bars a PENDING zone may wait abMaxAge = i_absLookback * 8 // hard expiry for a LIVE zone // Score weights. They sum to 1.00, and qAbsorb is exported in [0,1] - SECTION 12 // owns the only 0-100 number in this file. EFFORT and RESULT carry the most // weight because together they are the definition of absorption; everything else // is corroboration. AB_W_EFF = 0.22 AB_W_PROG = 0.22 AB_W_RVOL = 0.14 AB_W_WICK = 0.16 AB_W_CONT = 0.12 AB_W_TEST = 0.14 // A volume-weighted mean lean of 0.60 is an emphatic one-sided cluster; the ramp // from 0 to there is the graded effort row. AB_EFF_HI = 0.60 // -------------------------------------------- 6.3 CLUSTER AGGREGATES // GLOBAL SCOPE, every bar, unconditionally. These use the history operator, and // a series that is only assembled on some bars has holes in its own history. // Nothing here mutates state - the confirmed-bar gate is further down, and on a // forming bar these values are simply read by nobody. abN = i_absClusterBars abHi = high abLo = low abTravel = 0.0 abDelta = 0.0 // EFFORT window only: cluster bars 1..n-1 abVolSum = 0.0 // EFFORT window only, so the normaliser matches the numerator abRvolSum = 0.0 abRvolCnt = 0 for i = 0 to abN - 1 abHi := math.max(abHi, high[i]) abLo := math.min(abLo, low[i]) abTravel += math.max(high[i] - low[i], 0.0) float rv = rvol[i] if not na(rv) abRvolSum += rv abRvolCnt += 1 if i > 0 abDelta += nz(deltaProxy[i], 0.0) abVolSum += nz(effVol[i], 0.0) abRvolMean = abRvolCnt > 0 ? abRvolSum / float(abRvolCnt) : na abOpen = open[abN - 1] abNet = close - abOpen abBodyTop = math.max(abOpen, close) abBodyBot = math.min(abOpen, close) abRng = math.max(abHi - abLo, tick) abSpan = (abHi - abLo) / math.max(aRef, tick) // ------------------------------------------------ 6.4 DIRECTIONAL MEASURES // EFFORT: the volume-weighted mean lean of the delta proxy over the cluster's // first n-1 bars, signed so that a POSITIVE value means the aggressor leaned // AGAINST dir - i.e. sellers for a bullish zone. Because effort(+1) is exactly // -effort(-1), only one direction can ever pass the effort veto on a given // cluster: the mutual exclusivity is algebraic, not a tuned threshold. f_absEffort(int dir) => abVolSum > 0.0 ? f_clamp(-dir * abDelta / abVolSum, -1.0, 1.0) : 0.0 // RESULT: what the aggressor actually netted, over the WHOLE cluster, measured // against two independent denominators. The max() is the conservative choice - // both the path and the volume-scaled expectation must agree that the effort // went nowhere. A negative value means price moved AGAINST the aggressor, which // is the strongest form of failure. f_absProg(int dir) => float adv = -dir * abNet math.max(adv / math.max(abTravel, i_spreadUsd), adv / math.max(math.max(aRef, tick) * nz(abRvolMean, 1.0), i_spreadUsd)) // The rejection wick at CLUSTER level, on the raw range - the same measure // SECTION 0 defines per bar, lifted to the cluster. f_absWick(int dir) => dir > 0 ? (abBodyBot - abLo) / abRng : (abHi - abBodyTop) / abRng // The shelf: the wick region price was pushed into and refused to hold, floored // so a body-heavy cluster still yields a usable band and capped at the thickness // ceiling. Written once with the dir sign, so the two zones are exact mirrors. f_absZone(int dir) => float far = dir > 0 ? abBodyBot : abBodyTop float raw = dir > 0 ? far - abLo : abHi - far float flr = f_tol(0.20) // math.max() on the ceiling so a thickness cap set below the floor cannot // invert the clamp and hand back a band wider than the cap it asked for. float dep = f_clamp(raw, flr, math.max(f_tol(i_absZoneAtr), flr)) [dir > 0 ? abLo + dep : abHi, dir > 0 ? abLo : abHi - dep] // Prior tests: bars BEFORE the cluster that probed this shelf and closed back // OUT of it. \"Closed back out\" means exactly that - a bar that closed inside the // shelf accepted the price and is not a rejection. Uses the history operator, so // it is called from global scope only. f_absTests(int dir, float zt, float zb) => int cnt = 0 float tol = f_tol(0.15) int last = i_absLookback - 1 if last >= abN for i = abN to last bool probe = dir > 0 ? (low[i] <= zt and low[i] >= zb - tol) : (high[i] >= zb and high[i] <= zt + tol) bool out = dir > 0 ? close[i] >= zt : close[i] <= zb if probe and out cnt += 1 cnt // -------------------------------------------------- 6.5 SCORE AND VETOES // GRADED sub-scores fused, then gated. Not a pure AND: a knife-edge AND on rvol // flips the whole signal between 1.49 and 1.51 on a tick-volume series that // differs between brokers, it cannot rank anything for the score downstream, and // it treats a cluster that is exceptional on five axes and marginal on one // identically to one that barely cleared every threshold. f_absScore(float eff, float prog, float wick, int tests) => bool hasRv = hasVol and not na(abRvolMean) float sEff = nz(f_ramp(eff, 0.0, AB_EFF_HI), 0.0) // |prog|: the aggressor getting paid AND the cluster having already run in // the zone's own direction are both disqualifying, and a plain clamp at zero // scored the second case a perfect 1.0. float sProg = nz(f_ramp(i_absMaxProgress - math.abs(prog), -i_absMaxProgress, i_absMaxProgress), 0.0) float sRvol = hasRv ? nz(f_ramp(abRvolMean, 1.0, i_absRvolThresh * 1.5), 0.0) : 0.0 float sWick = nz(f_ramp(wick, 0.0, math.min(0.95, i_absMinWick * 2.0)), 0.0) float sCont = nz(f_ramp(i_absZoneAtr - abSpan, -i_absZoneAtr, i_absZoneAtr), 0.0) float sTest = nz(f_ramp(float(tests), math.max(0.0, i_absMinTests - 2.0), float(i_absMinTests) + 2.0), 0.0) float wSum = AB_W_EFF + AB_W_PROG + AB_W_WICK + AB_W_CONT + AB_W_TEST + (hasRv ? AB_W_RVOL : 0.0) float s = AB_W_EFF * sEff + AB_W_PROG * sProg + AB_W_WICK * sWick + AB_W_CONT * sCont + AB_W_TEST * sTest + (hasRv ? AB_W_RVOL * sRvol : 0.0) f_clamp01(wSum > 0.0 ? s / wSum : 0.0) // The definitional vetoes. Each one is part of what the word \"absorption\" MEANS, // which is why they are not merely score rows: a 0.80 blend with no rejection // wick at all is not absorption, and labelling it so would be a lie. f_absOk(float eff, float prog, float wick, float strength) => bool vEff = eff > 0.0 bool vRvol = not hasVol or na(abRvolMean) or abRvolMean >= i_absRvolThresh bool vProg = prog <= i_absMaxProgress bool vWick = wick >= i_absMinWick bool vSpan = abSpan <= i_absZoneAtr * 1.5 vEff and vRvol and vProg and vWick and vSpan and strength >= i_absMinStrength // ------------------------------------------- 6.6 GLOBAL-SCOPE EVALUATION // One line per direction, no branch: the long and short numbers come out of the // same functions on every bar whether or not anything will be created. absEffL = f_absEffort(1) absEffS = f_absEffort(-1) absPrgL = f_absProg(1) absPrgS = f_absProg(-1) absWkL = f_absWick(1) absWkS = f_absWick(-1) [absZtL, absZbL] = f_absZone(1) [absZtS, absZbS] = f_absZone(-1) absTstL = f_absTests(1, absZtL, absZbL) absTstS = f_absTests(-1, absZtS, absZbS) absStrL = f_absScore(absEffL, absPrgL, absWkL, absTstL) absStrS = f_absScore(absEffS, absPrgS, absWkS, absTstS) absOkL = f_absOk(absEffL, absPrgL, absWkL, absStrL) absOkS = f_absOk(absEffS, absPrgS, absWkS, absStrS) // ------------------------------------------------------- 6.7 THE ZONE ARRAY // THE array. One per file. var array<IcebergZone> zones = array.new<IcebergZone>() // ---------------------------------------------------------- 6.8 EXPORTS var bool absSigL = false // promotion event: pending -> live, this bar only var bool absSigS = false var float qAbsorbL = 0.0 // 0..1 evidence for SECTION 12's rubric var float qAbsorbS = 0.0 var float zoneTopL = na var float zoneBotL = na var bool zoneAliveL = false var int zoneTestsL = 0 var int zoneIdL = na var float zoneTopS = na var float zoneBotS = na var bool zoneAliveS = false var int zoneTestsS = 0 var int zoneIdS = na // ------------------------------------------------------ 6.9 THE LIFECYCLE // ONE pass, on confirmed bars, walking DOWN so a removal never disturbs an index // still to be visited. It runs BEFORE creation, which is what guarantees a zone // can never be promoted on its own birth bar. // // Returns [firedLong, firedShort] - the promotion events for this bar. f_absLife() => bool fL = false bool fS = false int n = array.size(zones) if n > 0 for i = n - 1 to 0 IcebergZone z = array.get(zones, i) bool bull = z.dir > 0 int age = bar_index - z.bornBar // --- touch counting ------------------------------------------- // age > 0 is the fix for a deadlock that produced zero signals // forever: when the cluster's own bars counted as touches, a zone // hit the max-touch ceiling on the same bar it was born. if age > 0 and z.touched() bool out = bull ? close >= z.top : close <= z.bottom if out z.tests := z.tests + 1 z.lastTest := bar_index if z.tests > i_zoneMaxTouches z.state := ZoneState.zExpired // worn out, not broken // --- decisive break ------------------------------------------- // CLOSES only, against the buffer frozen against z.atrRef at birth // (SECTION 2 owns breachPx()/closedBeyond(), so this rule exists in // exactly one place). A wick through the zone IS the absorption. z.breakRun := z.closedBeyond() ? z.breakRun + 1 : 0 if z.breakRun >= i_absBreakBars z.state := ZoneState.zBroken // --- stage 2: promotion --------------------------------------- if z.state == ZoneState.zPending // Age is checked FIRST and unconditionally, so the window means // what it says and a late reaction cannot confirm past it. if age > abReactWin z.state := ZoneState.zExpired else if age > 0 // The anchor sits OUTSIDE the range the cluster already // traded (z.swpExt is the cluster's far extreme, frozen at // birth). Anchoring on the zone edge instead would let a // \"reaction\" be satisfied by price merely returning to the // cluster's own high, which is no reaction at all. float anch = bull ? math.max(z.top, z.swpExt) : math.min(z.bottom, z.swpExt) float aRf = math.max(nz(z.atrRef, aRef), i_spreadUsd) float rct = (bull ? close - anch : anch - close) / aRf // CLOSE-based, exactly like invalidation. A wick may not // promote a zone when a wick is not allowed to kill one. if rct >= i_absMinReact z.state := ZoneState.zLive if bull fL := true else fS := true // Too small a reaction leaves the zone PENDING: the window // keeps running and a real move can still promote it. The // strength score is NOT touched here - it is the setup // quality, and inflating it by how far price has already run // would score the worst available entry the highest. else if z.state == ZoneState.zLive and age > abMaxAge z.state := ZoneState.zExpired // --- retire ---------------------------------------------------- // Drawing handles belong to SECTION 16, which keys its own pool by // zone id and notices the disappearance itself. Deleting its boxes // from here would fight it for ownership. if not z.isLive() array.remove(zones, i) [fL, fS] // Does a candidate zone overlap a LIVE same-direction zone by more than half? // Normalised by the NEW zone's width, so a wide new zone that merely contains a // narrow old one is not suppressed - it covers ground the old one never did. f_absOverlap(int dir, float zt, float zb) => bool hit = false for z in zones if z.dir == dir and z.isLive() float ov = math.min(z.top, zt) - math.max(z.bottom, zb) float w = math.max(zt - zb, i_spreadUsd) if ov / w > 0.5 hit := true hit // Weakest-first eviction. A LIVE zone outranks every pending one because it is // the zone the rest of the chain is currently working on; dropping it would // orphan a setup mid-flight. `guard` bounds the loop no matter what the cap is. f_absCap() => int guard = 0 while array.size(zones) > i_absMaxZones and guard < 32 int worst = 0 float wk = 1.0e9 int n = array.size(zones) if n > 0 for j = 0 to n - 1 IcebergZone z = array.get(zones, j) float k = f_clamp01(z.strength) + (z.state == ZoneState.zLive ? 1.0 : 0.0) if k < wk wk := k worst := j array.remove(zones, worst) guard += 1 // Which zone represents this side right now? Promoted beats pending, and among // equals the YOUNGEST wins - the chain works forward from the most recent shelf. // Returns an array index, or -1 when this side has no zone at all. f_absPick(int dir) => int best = -1 int bRank = -1 int bBar = -1 int n = array.size(zones) if n > 0 for j = 0 to n - 1 IcebergZone z = array.get(zones, j) if z.dir == dir and z.isLive() int rk = z.state == ZoneState.zLive ? 1 : 0 if rk > bRank or (rk == bRank and z.bornBar > bBar) bRank := rk bBar := z.bornBar best := j best // -------------------------------------------------------- 6.10 PER-BAR RUN if confirmed and warmupOk // A. age, promote and prune BEFORE anything is created. The two flags are // assigned outright rather than cleared first: a promotion is a one-bar // event and f_absLife() reports it for every zone on the bar it happens. [fL, fS] = f_absLife() absSigL := fL absSigS := fS // B. overlap is tested HERE, against the PRUNED array. Testing it at global // scope would compare against zones that died earlier on this same bar, // and so would suppress the single most valuable case there is: a shelf // that breaks and immediately re-forms. bool ovL = f_absOverlap(1, absZtL, absZbL) bool ovS = f_absOverlap(-1, absZtS, absZbS) // C. birth. Two blocks rather than one loop because zoneSeq is a global and // Pine forbids assigning a global inside a function; they are otherwise a // line-for-line mirror. if absOkL and not ovL zoneSeq := zoneSeq + 1 IcebergZone zNewL = IcebergZone.new(id = zoneSeq, dir = 1, top = absZtL, bottom = absZbL, bornBar = bar_index, bornTime = time, atrRef = aRef, strength = absStrL, tests = absTstL, lastTest = bar_index, state = ZoneState.zPending, swpExt = abHi, breakRun = 0) // Derived from the method rather than re-typed, so the published // invalidation price and the break test can never disagree. zNewL.invalid := zNewL.breachPx() array.push(zones, zNewL) if absOkS and not ovS zoneSeq := zoneSeq + 1 IcebergZone zNewS = IcebergZone.new(id = zoneSeq, dir = -1, top = absZtS, bottom = absZbS, bornBar = bar_index, bornTime = time, atrRef = aRef, strength = absStrS, tests = absTstS, lastTest = bar_index, state = ZoneState.zPending, swpExt = abLo, breakRun = 0) zNewS.invalid := zNewS.breachPx() array.push(zones, zNewS) // D. cap. f_absCap() // E. publish the representative zone per side. Mirrored blocks, again // because these are assignments to globals. int iL = f_absPick(1) if iL >= 0 IcebergZone zSelL = array.get(zones, iL) zoneAliveL := true zoneTopL := zSelL.top zoneBotL := zSelL.bottom zoneTestsL := zSelL.tests zoneIdL := zSelL.id qAbsorbL := f_clamp01(zSelL.strength) else zoneAliveL := false zoneTopL := na zoneBotL := na zoneTestsL := 0 zoneIdL := na qAbsorbL := 0.0 int iS = f_absPick(-1) if iS >= 0 IcebergZone zSelS = array.get(zones, iS) zoneAliveS := true zoneTopS := zSelS.top zoneBotS := zSelS.bottom zoneTestsS := zSelS.tests zoneIdS := zSelS.id qAbsorbS := f_clamp01(zSelS.strength) else zoneAliveS := false zoneTopS := na zoneBotS := na zoneTestsS := 0 zoneIdS := na qAbsorbS := 0.0 // When a zone dies the exports go dark on the SAME bar. That is deliberate and it // is what stops a stale \"absorption happened here\" flag outliving the shelf it // described: SECTION 9's BOS clock, SECTION 13's gate and SECTION 16's box all // read these and all fall silent together. // ========================= END SECTION 6 ==================================== // ============================================================================ // SECTION 7 : REJECTION / FAILURE-TO-CONTINUE // // WHY THIS MODULE EXISTS AT ALL: the state machine (SECTION 14) needs the // absorbing -> rejected edge and the score rubric (SECTION 12) reserves 10 of // its 100 points for \"Rejection\", but NO design component ever defined the // measurement. Left as designed, rejSigL/rejSigS were undeclared identifiers - // a hard compile error - and the rubric's true maximum was 90, not 100. // This section is the missing definition. // // WHAT IT MEASURES: absorption says size was worked at a level. REJECTION is // the confirmation that the other side could not continue THROUGH it - the bar // that probed the edge and was pushed back off it before the close. Three // independent facts have to line up on ONE confirmed bar: // 1. the bar PROBED the reference edge (it went and looked) // 2. it CLOSED BACK THROUGH that edge (the probe failed) // 3. its own shape agrees - a long rejection wick, a close near the friendly // extreme, and a Delta Proxy that leans the trade's way // // The reference edge is, in priority order: // (a) the live iceberg zone edge from SECTION 6 - the defensive boundary of // the absorption itself, and the higher-quality structure; or // (b) the swept level from SECTION 5 - a reclaim of the level whose resting // liquidity was just taken, the classic failure-to-continue. // When neither exists the edge is na and this module is silent. It never // invents an edge out of the bar's own range: a bar is always \"at\" its own low, // so a self-referential edge would make every hammer a rejection. // // SYMMETRY: the whole measurement lives in ONE pure function parameterised by // dir and expressed through f_wickFrac(dir) / f_closeLoc(dir) / dir * ratio. // There is no bull block and no bear block that can drift apart. // ============================================================================ G7 = \"7 - Rejection\" i_rejMinWick = input.float(0.45, \"Min rejection wick (fraction of bar range)\", minval = 0.0, maxval = 1.0, step = 0.01, group = G7, tooltip = \"HARD GATE on f_wickFrac(dir): for a long, (min(open,close) - low) / range. At 0 the wick requirement is removed entirely and a plain directional close at the edge qualifies - far more signals, all of them weaker. At 1 only a pure pin bar with no body whatsoever can pass, i.e. nothing ever does.\", display = display.none) i_rejMinCloseLoc = input.float(0.55, \"Min close location (0 = hostile extreme, 1 = friendly extreme)\", minval = 0.0, maxval = 1.0, step = 0.01, group = G7, tooltip = \"HARD GATE on f_closeLoc(dir). 0.50 is exactly the bar midpoint, so any value below 0.50 admits bars that closed on the WRONG half of their own range and the gate stops meaning anything. At 1.00 the close must be the bar's exact high (long) or exact low (short), which is effectively off.\", display = display.none) i_rejUseDelta = input.bool(true, \"Require a Delta Proxy lean\", group = G7, tooltip = \"Adds the Delta Proxy sign as a hard gate AND gives it 0.15 of the sub-score weight. Switched off, the remaining four weights are renormalised to 1.00, so turning it off never silently deflates the rejection score. This is a PROXY built from tick volume and close location - it is not real order flow.\", display = display.none) i_rejDeltaMin = input.float(0.10, \"Min Delta Proxy lean (0..1, in the trade direction)\", minval = 0.0, maxval = 1.0, step = 0.05, group = G7, tooltip = \"Applied to dir * ratio, where ratio is the [-1,+1] Delta Proxy from SECTION 0. At 0 the gate only demands the proxy is not actively against the trade; at 1 it demands a perfectly one-sided bar, which does not print.\", display = display.none) i_rejEdgeTol = input.float(0.35, \"Edge probe tolerance (x ATR, floored at spread)\", minval = 0.0, maxval = 2.0, step = 0.05, group = G7, tooltip = \"How close the bar's hostile extreme must come to the edge to count as a PROBE, measured with f_tol(). At 0 it collapses to one spread, so price must trade essentially exactly to the edge; at large values a bar that never went near the edge can still claim it rejected one.\", display = display.none) i_rejMemBars = input.int(20, \"Rejection evidence memory (bars)\", minval = 1, maxval = 200, group = G7, tooltip = \"qReject is frozen on the rejection bar and stays on the books this long, because the BOS and the retest that follow are several bars later and the score is read THEN. Too long and a stale rejection keeps inflating the setup score after the market has moved on; too short and the rubric row reads 0 at exactly the moment the signal fires.\", display = display.none) // ------------------------------------------------------- 7.1 REFERENCE EDGE // Priority, stated once: the live zone edge beats the swept level. The zone IS // the absorption; the swept level is only what the absorption was defending. // A LONG defends the zone BOTTOM, a SHORT the zone TOP - the single place dir // enters the selection, and an exact mirror. // STALENESS IS THIS SECTION'S PROBLEM. sweepLvlL/S are var latches that SECTION // 5 never clears - it says so in its own closing comment - and nothing else in // the file ever ages them out. Read raw, the fallback edge is a FIXED price for // the rest of the chart: after one sweep ever prints, every later hammer within // f_tol(i_rejEdgeTol) of that dead price fires a rejection and reloads qReject // with 10 rubric points for an event that happened days ago. The swept level is // only a rejection edge while the sweep is still recent, on the same horizon the // rest of this section uses for rejection evidence. rejFreshL = not na(sweepBarL) and bar_index - sweepBarL <= i_rejMemBars rejFreshS = not na(sweepBarS) and bar_index - sweepBarS <= i_rejMemBars rejEdgeL = zoneAliveL and not na(zoneBotL) ? zoneBotL : rejFreshL ? sweepLvlL : na rejEdgeS = zoneAliveS and not na(zoneTopS) ? zoneTopS : rejFreshS ? sweepLvlS : na // ------------------------------------------------------ 7.2 THE MEASUREMENT // Pure function: no state, no drawings, no ta.* - so it is safe to call from // anywhere and it is identical for both directions BY CONSTRUCTION rather than // by inspection. Sub-scores are anchored to FIXED scales, never to the gate // values: a sub-score anchored at its own gate makes a bar that passes every // gate exactly score 0.000, and moving a gate then silently rescales the rubric. f_rejEval(int dir, float edge) => float ext = dir > 0 ? low : high // the hostile extreme float wf = f_wickFrac(dir) float cl = f_closeLoc(dir) float lean = dir * ratio // ratio is never na - tick-rule fallback float tolPx = f_tol(i_rejEdgeTol) // The two structural facts, kept deliberately separate: a bar that closed // beyond the edge without ever probing it is just a directional bar, and a // bar that probed and closed the wrong side of it is a break, not a rejection. bool probe = dir > 0 ? (low <= edge + tolPx) : (high >= edge - tolPx) bool reclaim = dir > 0 ? (close > edge) : (close < edge) bool gates = not na(edge) and probe and reclaim and wf >= i_rejMinWick and cl >= i_rejMinCloseLoc and (not i_rejUseDelta or lean >= i_rejDeltaMin) // Graded evidence: every term is an f_ramp over a fixed window, so the score // degrades smoothly instead of flipping at a threshold. float sWick = f_ramp(wf, 0.20, 0.70) // shape: rejection tail float sLoc = f_ramp(cl, 0.40, 0.90) // shape: where it settled float sRecl = f_ramp(dir * (close - edge) / aRef, 0.05, 0.60) // how far back through it got float sProbe = f_ramp(dir * (edge - ext) / aRef, 0.02, 0.60) // how deep the failed probe was float sDelta = f_ramp(lean, 0.00, 0.60) // Delta Proxy lean // Renormalisation, not deletion: with the delta term off the remaining four // still sum to 1.00, so the rubric row keeps its full 0..1 range either way. float wDelta = i_rejUseDelta ? 0.15 : 0.0 float den = 0.30 + 0.25 + 0.20 + 0.10 + wDelta float sc = (0.30 * nz(sWick, 0.0) + 0.25 * nz(sLoc, 0.0) + 0.20 * nz(sRecl, 0.0) + 0.10 * nz(sProbe, 0.0) + wDelta * nz(sDelta, 0.0)) / den [gates, f_clamp01(sc)] [rejOkL, rejScL] = f_rejEval( 1, rejEdgeL) [rejOkS, rejScS] = f_rejEval(-1, rejEdgeS) // --------------------------------------------------------- 7.3 THE SIGNALS // NON-REPAINTING by construction: a pure series that can only be true on a bar // which has already closed. No var holds a stale true into the forming bar. rejSigL = rejOkL and confirmed and warmupOk rejSigS = rejOkS and confirmed and warmupOk // ------------------------------------------------- 7.4 EVIDENCE (qReject) // SECTION 12 reads this on the SIGNAL bar, which is several bars after the // rejection printed, so the value has to be held. It is frozen on the rejection // bar and expires on a fixed bar horizon - never silently decayed, never carried // forever, and never recomputed from a bar that is no longer the rejection bar. var float qRejectL = 0.0 var float qRejectS = 0.0 var int rejBarL = na var int rejBarS = na if confirmed and warmupOk if rejSigL qRejectL := rejScL rejBarL := bar_index else if not na(rejBarL) and bar_index - rejBarL > i_rejMemBars qRejectL := 0.0 rejBarL := na if rejSigS qRejectS := rejScS rejBarS := bar_index else if not na(rejBarS) and bar_index - rejBarS > i_rejMemBars qRejectS := 0.0 rejBarS := na // ========================= END SECTION 7 ==================================== // ============================================================================ // SECTION 8 : DISPLACEMENT + FAIR VALUE GAP // // WHAT IT MEASURES: the impulse leg that leaves the absorption. Not \"a green // candle\" - a leg whose GEOMETRY is inconsistent with ordinary two-way trade: // large relative to ATR, body-dominant, closing at its own extreme, on elevated // participation. Four hard gates decide ADMISSION; a graded 0..1 score decides // RANK. Those two jobs are kept apart on purpose (see 8.2). // // THREE CORRECTIONS FROM REVIEW, APPLIED HERE, EACH OF WHICH KILLED THE MODULE // AS DESIGNED: // (1) Every sub-score used to be anchored to its OWN gate, so a leg that // passed all four gates exactly scored 0.000 and the 0.60 minimum could // never be met. Worse, the gate value silently rescaled the score, so the // documented thresholds were never the operative constraint and tightening // one input tightened twice. Sub-scores are now anchored to FIXED absolute // scales. Gates admit; anchors rank; i_dispMinScore means the same thing // at every gate setting. // (2) The FVG scan used to run over the whole leg and keep the WIDEST gap. The // window at offset k spans bars t-k-2 .. t-k, so for k >= n-1 its two older // bars lie entirely OUTSIDE the leg, and widest-wins systematically picked // that out-of-leg gap - publishing a retest band below the leg's own floor // and collecting the strength bonus for an imbalance the leg never created. // The scan is now the SINGLE three-bar window ending on the confirmation // bar, and i_dispMaxLegBars is capped at 2. // (3) The FVG bonus used to be added BEFORE the i_dispMinScore comparison, so // it admitted every leg scoring 0.50-0.59 while the comment claimed it // could \"rank, never admit\". Admission now compares the UNBONUSED score // and the bonus moves rank only. // // Plus a contiguity guard the design had nowhere: XAUUSD has a daily settlement // break and a Sunday reopen. The first bar after either is huge versus ATR, // body-dominant, closes at its extreme and carries elevated tick counts - a // maximum-strength displacement made of nothing but a gap, with the session gap // itself registering as a giant \"imbalance\". // // ORIGIN CONVENTION (the architect's conversion rule, so band and scalar agree): // dispOrg = the leg's FIRST-BAR OPEN - the NEAR edge, the price a pullback // retraces to, consumed by SECTION 10 (retest). // dispFar = the OPPOSITE edge (the leg's hostile extreme) - a stop-anchor // candidate consumed by SECTION 11 (risk). // The band between them is widened to a minimum width, because the score // actively rewards driving that wick to zero and a zero-width retest band is a // band price steps over without ever registering a touch. // ============================================================================ G8 = \"8 - Displacement & FVG\" i_dispBodyRatio = input.float(0.55, \"Min body / range of the leg\", minval = 0.0, maxval = 1.0, step = 0.01, group = G8, tooltip = \"HARD GATE. Body dominance separates a decisive leg from a wide, indecisive bar that closed mid-range. At 0 the gate is off and long-wicked two-way bars qualify as displacement; at 1 only a perfect marubozu passes, i.e. nothing.\", display = display.none) i_dispAtrMult = input.float(1.10, \"Min leg range (x ATR, per sqrt(bars))\", minval = 0.0, maxval = 10.0, step = 0.05, group = G8, tooltip = \"HARD GATE on legRange / (ATR * sqrt(n)). The sqrt(n) term is what stops a 2-bar leg qualifying by drift alone. Setting this to 0 disables the SIZE REQUIREMENT only - it can no longer hand every bar a free maximum sub-score, because the size sub-score is anchored at a fixed 1.00-3.00 ATR scale and not at this input. Above ~3 nothing but a news candle passes.\", display = display.none) i_dispRvol = input.float(1.25, \"Min relative volume of the leg\", minval = 0.0, maxval = 10.0, step = 0.05, group = G8, tooltip = \"HARD GATE, written to BYPASS when the feed carries no usable volume (several XAUUSD feeds report none) rather than to reject everything. Relative TICK volume is a participation PROXY, not contracts. Note it does NOT reject the rollover window: post-break and rollover bars carry ELEVATED tick counts.\", display = display.none) i_dispCloseLoc = input.float(0.65, \"Min close location within the leg\", minval = 0.0, maxval = 1.0, step = 0.01, group = G8, tooltip = \"HARD GATE. 1.00 means the leg closed exactly on its extreme - it gave nothing back. Below 0.50 the leg closed on the wrong half of its own range and the gate stops discriminating; at 1.00 it is effectively off because nothing prints.\", display = display.none) i_dispMaxLegBars = input.int(2, \"Max leg length (bars)\", minval = 1, maxval = 2, group = G8, tooltip = \"CAPPED AT 2 deliberately. The FVG window ending on the confirmation bar spans three bars; with longer legs the same window stops being contained by the leg and an out-of-leg gap wins. 1 = single-bar impulses only (fewest, cleanest).\", display = display.none) i_dispReqFvg = input.bool(false, \"Require a fair value gap\", group = G8, tooltip = \"Promotes the imbalance from a ranking bonus to a HARD GATE. On, it cuts the signal count very hard - a 3-bar imbalance is largely a CONSEQUENCE of a big fast bar, which the size gate has already tested, so this mostly pays twice for one fact. Off by default for that reason.\", display = display.none) i_dispMinScore = input.float(0.60, \"Min displacement score (0-1)\", minval = 0.0, maxval = 1.0, step = 0.01, group = G8, tooltip = \"Compared against the UNBONUSED score, so the FVG bonus can never buy admission. This is a setup-geometry score, not a probability. Because the sub-scores are anchored to fixed scales, this input means the same thing at every gate setting. Above ~0.85 it is an off switch: it needs all four features saturated at once.\", display = display.none) i_dispFvgMinAtr = input.float(0.15, \"Min FVG size (x ATR, floored at spread)\", minval = 0.0, maxval = 2.0, step = 0.01, group = G8, tooltip = \"Measured with f_tol(), never in ticks: mintick is 0.01 on most XAUUSD feeds and 0.001 on others, so a tick-denominated floor mis-scales tenfold between feeds. At 0 it collapses to one spread and nearly every gap qualifies.\", display = display.none) i_dispFvgBonus = input.float(0.10, \"FVG rank bonus (0-1)\", minval = 0.0, maxval = 0.5, step = 0.01, group = G8, tooltip = \"Applied AFTER the i_dispMinScore comparison, so it orders competing legs and never admits one. At 0 the imbalance affects rank not at all; large values make an imbalance outrank genuinely bigger legs.\", display = display.none) i_dispOriginMinAtr = input.float(0.25, \"Min origin band width (x ATR, floored at spread)\", minval = 0.0, maxval = 2.0, step = 0.01, group = G8, tooltip = \"The retest band is widened INTO the leg to at least this, keeping the far (invalidation) edge fixed. Without it the highest-scoring legs publish a band a few cents wide - the score rewards driving that wick to zero - and price steps over it without ever registering a touch. Large values make the band so deep that a retest of it is a full retracement.\", display = display.none) i_dispMemBars = input.int(16, \"Displacement evidence memory (bars)\", minval = 1, maxval = 200, group = G8, tooltip = \"MUST COVER SECTION 10's retest window, which stamps its freshness clock on the displacement bar and stays open for i_retestMaxBars bars after it. At 12 the last three bars of that window fired a retest with qDisp already zeroed, which failed SECTION 12's core-evidence floor and deleted the signal in silence. How long the published origin band, FVG and qDisp stay on the books after the leg. SECTION 12 reads qDisp on the signal bar, which is later than the leg. Too long and a stale leg keeps inflating the setup score; too short and the rubric row reads 0 at the moment the signal fires.\", display = display.none) // -------------------------------------------- 8.1 SYNTHETIC LEG AGGREGATES // Every aggregate is computed UNCONDITIONALLY at global scope for both candidate // lengths, then selected by name. Nothing is read from inside a branch, so no // history buffer can be skipped and no lazily-evaluated `and` can hide a read. dispTfMs = timeframe.in_seconds() * 1000.0 dispO1 = open dispH1 = high dispL1 = low dispO2 = open[1] dispH2 = math.max(high, high[1]) dispL2 = math.min(low, low[1]) // rvol is na when the feed carries no usable volume. That na is left to // propagate: the gate bypasses on `not hasVol` and the score weight is zeroed // and renormalised. It is never coerced to 0 (which would make a bypassing gate // a kill switch) nor to 1 (which fabricates average participation). dispRv1 = rvol dispRv2 = (rvol + rvol[1]) / 2.0 // CONTIGUITY: the leg must be one continuous stretch of trade. Two tests, both // needed - a session break shows up as a time discontinuity, a weekend reopen as // a price discontinuity, and the daily gold settlement break can be either. dispGap1 = math.abs(open - close[1]) <= f_tol(0.5) dispGap2 = math.abs(open[1] - close[2]) <= f_tol(0.5) dispCont1 = (time - time[1]) <= dispTfMs * 1.5 and dispGap1 dispCont2 = dispCont1 and (time[1] - time[2]) <= dispTfMs * 1.5 and dispGap2 // --------------------------------------------------- 8.2 THE LEG EVALUATOR // Gates ADMIT. Anchors RANK. They are separate numbers on purpose: anchoring a // sub-score to its own gate means a leg that clears every gate by exactly zero // scores exactly zero, and it makes every gate input a hidden rescaling of the // whole score. ONE function, parameterised by dir - long and short are the same // arithmetic with one sign flipped, not two blocks to keep in step. f_dispEval(int dir, int n, float lgO, float lgH, float lgL, float lgRv, bool cont) => float rng = math.max(lgH - lgL, tick) float br = math.abs(close - lgO) / rng float clv = dir > 0 ? (close - lgL) / rng : (lgH - close) / rng float srN = rng / (aRef * math.sqrt(float(n))) // leg size per sqrt(n), in ATR units // --- the four hard gates, plus direction and continuity ----------------- bool gDir = dir * (close - lgO) > 0 bool gSize = srN >= i_dispAtrMult bool gBody = br >= i_dispBodyRatio bool gLoc = clv >= i_dispCloseLoc bool gVol = not hasVol or (not na(lgRv) and lgRv >= i_dispRvol) bool gates = cont and gDir and gSize and gBody and gLoc and gVol // --- the rank score, on fixed absolute scales --------------------------- float sSize = f_ramp(srN, 1.00, 3.00) float sBody = f_ramp(br, 0.40, 0.90) float sLoc = f_ramp(clv, 0.50, 0.95) float sRvol = f_ramp(lgRv, 1.00, 2.50) // Volume contributes 0.20 when the feed supports it and 0.00 when it does // not, with the denominator renormalised so the score keeps its full 0..1 // range on a volumeless feed instead of being capped at 0.80. float wRv = hasVol and not na(sRvol) ? 0.20 : 0.0 float den = 0.35 + 0.25 + 0.20 + wRv float base = (0.35 * nz(sSize, 0.0) + 0.25 * nz(sBody, 0.0) + 0.20 * nz(sLoc, 0.0) + wRv * nz(sRvol, 0.0)) / den [gates, f_clamp01(base)] [dispOkL1, dispBsL1] = f_dispEval( 1, 1, dispO1, dispH1, dispL1, dispRv1, dispCont1) [dispOkL2, dispBsL2] = f_dispEval( 1, 2, dispO2, dispH2, dispL2, dispRv2, dispCont2) [dispOkS1, dispBsS1] = f_dispEval(-1, 1, dispO1, dispH1, dispL1, dispRv1, dispCont1) [dispOkS2, dispBsS2] = f_dispEval(-1, 2, dispO2, dispH2, dispL2, dispRv2, dispCont2) // ------------------------------------------------------------- 8.3 THE FVG // ONE window: bars t-2, t-1, t - the three-bar window ending on the confirmation // bar. It is the only window guaranteed to contain the impulse and never to // reach outside the leg. Honest description of what it is: a band that only the // MIDDLE bar traded through, whose two neighbours did not overlap it. That is a // statement about printed OHLC and nothing more - it is not evidence of resting // institutional orders. dispFvgMin = f_tol(i_dispFvgMinAtr) dispFvgCont = (time - time[2]) <= dispTfMs * 2.5 and dispGap1 and dispGap2 dispGapUpPx = low - high[2] dispGapDnPx = low[2] - high dispFvgOkL = dispFvgCont and dispGapUpPx >= dispFvgMin dispFvgOkS = dispFvgCont and dispGapDnPx >= dispFvgMin dispFvgLoRawL = high[2] dispFvgHiRawL = low dispFvgLoRawS = high dispFvgHiRawS = low[2] // ------------------------------------------------- 8.4 ADMISSION AND RANK // Admission compares the UNBONUSED score. The bonus is added afterwards and only // decides which of two admitted candidates is the better one. dispAllow2 = i_dispMaxLegBars >= 2 dispQL1 = dispOkL1 and (not i_dispReqFvg or dispFvgOkL) and dispBsL1 >= i_dispMinScore dispQL2 = dispAllow2 and dispOkL2 and (not i_dispReqFvg or dispFvgOkL) and dispBsL2 >= i_dispMinScore dispQS1 = dispOkS1 and (not i_dispReqFvg or dispFvgOkS) and dispBsS1 >= i_dispMinScore dispQS2 = dispAllow2 and dispOkS2 and (not i_dispReqFvg or dispFvgOkS) and dispBsS2 >= i_dispMinScore dispBonusL = dispFvgOkL ? i_dispFvgBonus : 0.0 dispBonusS = dispFvgOkS ? i_dispFvgBonus : 0.0 dispRkL1 = math.min(1.0, dispBsL1 + dispBonusL) dispRkL2 = math.min(1.0, dispBsL2 + dispBonusL) dispRkS1 = math.min(1.0, dispBsS1 + dispBonusS) dispRkS2 = math.min(1.0, dispBsS2 + dispBonusS) // Ties go to the SHORTER leg: a 1-bar impulse is the same displacement stated // with less ambiguity, and it dates the event more precisely. dispUseL1 = dispQL1 and (not dispQL2 or dispRkL1 >= dispRkL2) dispUseL2 = dispQL2 and not dispUseL1 dispUseS1 = dispQS1 and (not dispQS2 or dispRkS1 >= dispRkS2) dispUseS2 = dispQS2 and not dispUseS1 dispOkL = dispUseL1 or dispUseL2 dispOkS = dispUseS1 or dispUseS2 dispRkL = dispUseL1 ? dispRkL1 : dispRkL2 dispRkS = dispUseS1 ? dispRkS1 : dispRkS2 // ----------------------------------------------------- 8.5 THE ORIGIN BAND // The INVALIDATION edge is fixed at the leg's hostile extreme; the band is // widened INTO the leg to reach the minimum width. Mirror-exact, so the symmetry // argument survives the widening. dispLegOL = dispUseL1 ? dispO1 : dispO2 dispLegLL = dispUseL1 ? dispL1 : dispL2 dispLegOS = dispUseS1 ? dispO1 : dispO2 dispLegHS = dispUseS1 ? dispH1 : dispH2 dispMinW = f_tol(i_dispOriginMinAtr) dispOrgRawL = math.max(dispLegOL, dispLegLL + dispMinW) // near edge - retest target dispFarRawL = dispLegLL // far edge - stop anchor dispOrgRawS = math.min(dispLegOS, dispLegHS - dispMinW) dispFarRawS = dispLegHS // --------------------------------------------------------- 8.6 THE SIGNALS dispSigL = dispOkL and confirmed and warmupOk dispSigS = dispOkS and confirmed and warmupOk // ------------------------------------------- 8.7 PUBLISHED STATE (frozen) // SECTION 10 retests this band and SECTION 11 anchors a stop on it, both LATER // than the leg, so these are frozen at the leg and expire on a fixed horizon. // They are never live series: a live origin band would move under the retest // that is trying to touch it. var float dispOrgL = na var float dispFarL = na var float dispOrgS = na var float dispFarS = na var float fvgLoL = na var float fvgHiL = na var float fvgLoS = na var float fvgHiS = na var bool hasFvgL = false var bool hasFvgS = false var float qDispL = 0.0 var float qDispS = 0.0 var int dispBarL = na var int dispBarS = na if confirmed and warmupOk if dispSigL dispOrgL := dispOrgRawL dispFarL := dispFarRawL hasFvgL := dispFvgOkL fvgLoL := dispFvgOkL ? dispFvgLoRawL : na fvgHiL := dispFvgOkL ? dispFvgHiRawL : na qDispL := dispRkL dispBarL := bar_index else if not na(dispBarL) and bar_index - dispBarL > i_dispMemBars dispOrgL := na dispFarL := na hasFvgL := false fvgLoL := na fvgHiL := na qDispL := 0.0 dispBarL := na if dispSigS dispOrgS := dispOrgRawS dispFarS := dispFarRawS hasFvgS := dispFvgOkS fvgLoS := dispFvgOkS ? dispFvgLoRawS : na fvgHiS := dispFvgOkS ? dispFvgHiRawS : na qDispS := dispRkS dispBarS := bar_index else if not na(dispBarS) and bar_index - dispBarS > i_dispMemBars dispOrgS := na dispFarS := na hasFvgS := false fvgLoS := na fvgHiS := na qDispS := 0.0 dispBarS := na // ========================= END SECTION 8 ==================================== // ============================================================================ // SECTION 9 : BREAK OF STRUCTURE / CHANGE OF CHARACTER // // WHAT IT DECIDES: whether the displacement leg actually BROKE the structural // skeleton SECTION 3 maintains, and whether that break is a continuation of the // existing sequence (BOS) or a reversal of it (CHoCH). This is the last piece // of evidence before the retest, and it is the one that most easily manufactures // false confidence, so three specific traps are closed here. // // TRAP 1 - THE CHoCH THAT IS ONLY A WHIPSAW. Classifying a break as a reversal // because it runs COUNTER TO THE PREVIOUS BREAK is circular: the break engine // is self-clearing, so inside a range breaks NECESSARILY alternate (up through // the range high, down through the range low, up again) and the swing trend is // 0 throughout. Under that rule every whipsaw in a range certifies as a CHoCH - // in exactly the market the whole system is built to sit out. A CHoCH here // therefore requires a genuine opposing swing sequence (structTrend == -dir) // AND chopScore <= 1. The chop measure is admitted into the classification, not // left outside it as a separate downstream filter that arrives too late. // // TRAP 2 - THE BUFFER THAT SITS UNDER THE SPREAD. A 0.05 x ATR buffer is // 0.05-0.20 USD on 1M/5M gold, i.e. at or BELOW the 0.15-0.35 USD spread, while // the thing it is meant to survive - a stop run - routinely spikes 1-3 USD // through a swing. And a syminfo.mintick floor is decorative: mintick is 0.01 // on most XAUUSD feeds, two orders of magnitude under the ATR term, so it never // binds. The buffer is f_tol(i_bosBufMult), which is floored at one full spread // and denominated in USD on every feed. // // TRAP 3 - THE OUTSIDE BAR THAT QUIETLY SETS THE TREND. A bar that breaks both // sides is not structure. Suppressing only the two TRIGGERS while still running // both mutation blocks flags swings broken on both sides and leaves the last // break direction set to whichever block happens to be written second. Here an // outside bar is consumed whole: no trigger, no broken flags, no state, on // EITHER side. // // LINKAGE: the break is tied to the LIVE zone exported by SECTION 6 - read // every bar, never copied into a private lifecycle that outlives the zone, // which is how a long-dead absorption ends up permanently inflating the break // level. Age is capped at i_maxBarsAbsToBos and the post-absorption leg must // have traded into the zone BODY, not merely brushed its outer edge (touching // the edge is true within one bar of every zone and filters nothing). // ============================================================================ G9 = \"9 - Break of Structure\" i_bosMode = input.string(\"Close\", \"Break confirmation\", options = [\"Close\", \"Wick\"], group = G9, tooltip = \"Close: the bar must CLOSE beyond the swing plus the buffer - slower, and it will not register the stop run itself as structure. Wick: the high/low suffices, which is faster but hands every liquidity spike a break, including the ones this system is designed to trade AGAINST.\", display = display.none) i_bosBufMult = input.float(0.25, \"Break buffer (x ATR, floored at spread)\", minval = 0.0, maxval = 2.0, step = 0.05, group = G9, tooltip = \"Clearance required beyond the swing, via f_tol(), so it can never fall below one spread on any feed. At 0 it IS one spread and marginal ticks through a level count as structure; above ~1 ATR the break is so far past the swing that the retest which follows is already a new leg.\", display = display.none) i_maxBarsAbsToBos = input.int(12, \"Max bars from absorption to BOS\", minval = 1, maxval = 100, group = G9, tooltip = \"The causal link between the zone and the break. Short values demand the break follow the absorption immediately; long values let an unrelated break borrow the credit of an old zone that merely happens to still be alive. This governs ADMISSION only - how long the evidence then survives is the memory below.\", display = display.none) i_bosMemBars = input.int(16, \"BOS evidence memory (bars)\", minval = 1, maxval = 200, group = G9, tooltip = \"How long qBos keeps its value after the break, which is a DIFFERENT clock from the admission deadline above. It must exceed SECTION 10's retest window (i_retestMaxBars, default 15) or the two interlock: a retest firing on bar 13, 14 or 15 after the BOS would pass SECTION 10's own freshness test and then read qBos = 0, fail SECTION 12's core-evidence floor, and be deleted silently - losing 3 of the 15 legally reachable retest bars for no stated reason.\", display = display.none) i_bosStructReq = input.string(\"Either\", \"Structural requirement\", options = [\"CHoCH (reversal)\", \"BOS (continuation)\", \"Either\"], group = G9, tooltip = \"CHoCH only: reversal trades exclusively - fewest signals, and it stands down in chop by construction. BOS only: continuation trades exclusively. Either is the union of the two, with the chop requirement still attached to the CHoCH branch alone, so widening the mode never weakens the reversal test.\", display = display.none) i_bosAllowAmbig = input.bool(false, \"Allow breaks with no confirmed swing sequence\", group = G9, tooltip = \"When the swing sequence is mixed, structTrend is 0 and a break is neither BOS nor CHoCH; by default nothing fires. Switched on, such a break counts as a continuation ONLY when all three chop votes say the tape is trending (chopScore == 0). Off is the honest default - it is an admission that the structure has not stated a direction yet.\", display = display.none) // --------------------------------------------------------- 9.1 THE HELPERS // The PRICE of the most recent UNBROKEN swing on a side. Recency is taken from // .bar, never from array position, because the ordering convention of the array // belongs to SECTION 3 and this section must not silently depend on it. It // returns na for \"none\" rather than an index sentinel: in v6 a negative array // index is legal and counts from the end, so an out-of-band index no longer // fails loudly, but na still propagates into every comparison as false. f_bosRef(array<Swing> arr) => float px = na int bb = -1 int sz = array.size(arr) if sz > 0 for i = 0 to sz - 1 Swing s = array.get(arr, i) if not s.broken and not na(s.price) and s.bar > bb px := s.price bb := s.bar px // SELF-CLEARING BROKEN FLAGS. This runs on EVERY confirmed bar, not only on a // break bar, and that is the whole point: a swing price has already traded // through must not linger unbroken, waiting to become the \"most recent unbroken\" // reference the moment the real one is consumed and to fire a break that already // happened. SECTION 3 owns the arrays' membership; SECTION 9 owns .broken, which // needs no reset because a freshly confirmed pivot always enters unbroken and // old pivots age out of the array. f_bosMark(array<Swing> arr, int dir, float px, float buf) => int sz = array.size(arr) int cnt = 0 if sz > 0 for i = 0 to sz - 1 Swing s = array.get(arr, i) bool cleared = dir > 0 ? (s.price + buf < px) : (s.price - buf > px) if not s.broken and not na(s.price) and cleared s.broken := true cnt += 1 cnt // Zone linkage, one path for both sides. na legExt means the break landed on the // absorption bar itself, which is maximal linkage, not missing evidence. f_bosLink(int dir, bool alive, float zTop, float zBot, int absBar, float legExt) => float zMid = (zTop + zBot) * 0.5 bool ageOk = not na(absBar) and (bar_index - absBar) <= i_maxBarsAbsToBos bool bodyOk = na(legExt) or (dir > 0 ? legExt <= zMid : legExt >= zMid) alive and not na(zTop) and not na(zBot) and ageOk and bodyOk // Break quality, 0..1, graded on fixed scales. ONE function, both directions. f_bosQual(int dir, float refPx, float srcPx, int age, bool isCh) => float sMargin = f_ramp(dir * (srcPx - refPx) / aRef, 0.05, 0.60) // how decisively it cleared float sClose = f_ramp(f_closeLoc(dir), 0.45, 0.90) // and held the clearance float sFresh = f_clamp01(1.0 - float(age) / float(i_maxBarsAbsToBos)) float sClean = f_clamp01(1.0 - float(chopScore) / 3.0) float sKind = isCh ? 1.0 : 0.65 // a reversal break is the higher-value event here f_clamp01(0.30 * nz(sMargin, 0.0) + 0.20 * nz(sClose, 0.0) + 0.20 * sFresh + 0.15 * sClean + 0.15 * sKind) // ------------------------------------------------- 9.2 LEVELS AND RAW BREAK bosBuf = f_tol(i_bosBufMult) bosSrcUp = i_bosMode == \"Close\" ? close : high bosSrcDn = i_bosMode == \"Close\" ? close : low // Read BEFORE this bar's marking pass runs, so the reference is the state as of // the previous close plus any pivot SECTION 3 confirmed on this bar. A pivot // confirmed on this bar is always still unbroken at registration. bosRefHi = f_bosRef(swHiArr) bosRefLo = f_bosRef(swLoArr) bosBreakRawL = not na(bosRefHi) and bosSrcUp > bosRefHi + bosBuf bosBreakRawS = not na(bosRefLo) and bosSrcDn < bosRefLo - bosBuf bosOutside = bosBreakRawL and bosBreakRawS // an outside bar is not structure // ------------------------------------------------------ 9.3 CLASSIFICATION // structTrend and chopScore are SECTION 3 exports and chart-timeframe only - // they are not, and must never be used as, the HTF bias. bosChopOk = chopScore <= 1 bosKChochL = structTrend == -1 and bosChopOk // sellers were demonstrably in control bosKChochS = structTrend == 1 and bosChopOk bosKContL = structTrend == 1 bosKContS = structTrend == -1 bosKAmbigL = i_bosAllowAmbig and structTrend == 0 and chopScore == 0 bosKAmbigS = bosKAmbigL bosKindOkL = i_bosStructReq == \"CHoCH (reversal)\" ? bosKChochL : i_bosStructReq == \"BOS (continuation)\" ? (bosKContL or bosKAmbigL) : (bosKChochL or bosKContL or bosKAmbigL) bosKindOkS = i_bosStructReq == \"CHoCH (reversal)\" ? bosKChochS : i_bosStructReq == \"BOS (continuation)\" ? (bosKContS or bosKAmbigS) : (bosKChochS or bosKContS or bosKAmbigS) // ------------------------------------------------------- 9.4 STATE + FIRE // bosSigL/bosSigS are var pulses cleared at the top of every confirmed bar. On a // forming bar they hold the previous confirmed value, which is why every // consumer reads them inside `if confirmed` and the display sections treat them // as already-committed history. var bool bosSigL = false var bool bosSigS = false var float bosLvlL = na var float bosLvlS = na var float qBosL = 0.0 var float qBosS = 0.0 var bool isChochL = false var bool isChochS = false var int bosBarL = na var int bosBarS = na // Zone identity clock. The bar a zone id first appears is the absorption anchor; // when the exported zone dies or its id changes, the clock and the leg extreme // reset with it. Nothing here survives the zone. var int bosZidL = na var int bosZidS = na var int bosAbsBarL = na var int bosAbsBarS = na var float bosLegLoL = na var float bosLegHiS = na // How many swings the maintenance pass retired on this bar. Debug-panel value // only: nothing gates on it, but a run of zeros on a trending chart means the // structure arrays are not being fed, which is otherwise silent. var int bosMarked = 0 if confirmed and warmupOk bosSigL := false bosSigS := false bosMarked := 0 // --- zone clock, LONG --------------------------------------------------- if not zoneAliveL bosZidL := na bosAbsBarL := na bosLegLoL := na else if na(bosZidL) or bosZidL != zoneIdL bosZidL := zoneIdL bosAbsBarL := bar_index bosLegLoL := na else bosLegLoL := na(bosLegLoL) ? low : math.min(bosLegLoL, low) // --- zone clock, SHORT (line-for-line mirror of the block above) -------- if not zoneAliveS bosZidS := na bosAbsBarS := na bosLegHiS := na else if na(bosZidS) or bosZidS != zoneIdS bosZidS := zoneIdS bosAbsBarS := bar_index bosLegHiS := na else bosLegHiS := na(bosLegHiS) ? high : math.max(bosLegHiS, high) bool bosLinkL = f_bosLink( 1, zoneAliveL, zoneTopL, zoneBotL, bosAbsBarL, bosLegLoL) bool bosLinkS = f_bosLink(-1, zoneAliveS, zoneTopS, zoneBotS, bosAbsBarS, bosLegHiS) bool bosFireL = bosBreakRawL and not bosOutside and bosLinkL and bosKindOkL bool bosFireS = bosBreakRawS and not bosOutside and bosLinkS and bosKindOkS // --- LONG: fire, or expire the evidence -------------------------------- if bosFireL bosSigL := true bosLvlL := bosRefHi isChochL := bosKChochL qBosL := f_bosQual( 1, bosRefHi, bosSrcUp, bar_index - bosAbsBarL, bosKChochL) bosBarL := bar_index else if not na(bosBarL) and bar_index - bosBarL > i_bosMemBars bosLvlL := na isChochL := false qBosL := 0.0 bosBarL := na // --- SHORT: line-for-line mirror --------------------------------------- if bosFireS bosSigS := true bosLvlS := bosRefLo isChochS := bosKChochS qBosS := f_bosQual(-1, bosRefLo, bosSrcDn, bar_index - bosAbsBarS, bosKChochS) bosBarS := bar_index else if not na(bosBarS) and bar_index - bosBarS > i_bosMemBars bosLvlS := na isChochS := false qBosS := 0.0 bosBarS := na // --- maintenance: clear every swing price has already traded through ---- // Runs unconditionally on both sides, EXCEPT on an outside bar, which is // consumed whole and leaves neither side's flags touched. if not bosOutside int bosMkUp = f_bosMark(swHiArr, 1, bosSrcUp, bosBuf) int bosMkDn = f_bosMark(swLoArr, -1, bosSrcDn, bosBuf) bosMarked := bosMkUp + bosMkDn // ========================= END SECTION 9 ==================================== // ============================================================================ // SECTION 10 : RETEST / ENTRY MODES // // This section owns the ONE question \"does the confirmed BOS ever become an // order, and at what price is the thesis dead?\". It owns nothing else: // * cooldown, duplicate suppression and every other hygiene gate belong to // SECTION 13 (that is why i_cooldownBars does NOT exist here), // * the stop / TP / RR arithmetic belongs to SECTION 11, // * the setup lifecycle and the slot arrays belong to SECTION 14. // What leaves here is a raw per-direction trigger plus the two prices the rest // of the file needs: the level price had to defend, and the invalidation // anchor that becomes a stop candidate in f_riskPlan(). // // WHY THE BOS BAR MUST LATCH ITS LEVELS // The absorption zone was tagged several bars before the BOS, and the // displacement leg one or more bars before that. Reading those detectors on // the BOS bar and hoping they still publish a value is the single most // dangerous failure mode available here: if they are per-bar pulses, NOTHING // ever arms, every setup dies as \"no level\", and total silence is // indistinguishable from the design working as intended. So the BOS bar takes // a SNAPSHOT into var state, and the displacement origin additionally carries // its own last-seen latch with a freshness bound. // // WHY THE ARM-TIME SIDE GUARD IS NOT OPTIONAL // \"Nearest of three\" is a max() for a long and a min() for a short, which is // only \"nearest\" if every candidate genuinely sits on the retracement side of // the BOS close. A zone top that straddles the broken level, or a displacement // origin that began above it, lands the touch level AT or BEYOND the close - // and then the very next bar satisfies `low <= lvl + tol` trivially, a phantom // retest prints one bar after the BOS, and the invalidation anchor ends up on // the wrong side of entry where math.abs() in the risk module hides the sign // error completely. Every candidate is therefore filtered to STRICTLY the // retracement side and at least f_tol(i_rtMinSep) away before anything folds. // // MODES // \"Retest (default)\" arm at the BOS bar, signal only when price returns and // the level is DEFENDED. Fewer, more selective trades - // which is what was asked for, hence the default. // \"Confirmation\" signal on the close of the BOS bar itself. Zero extra // lag, wider stop, materially more signals. // Both modes still require a surviving level: the anchor is the stop. // ============================================================================ GRT = \"10 - Retest / Entry\" i_entryMode = input.string(\"Retest (default)\", \"Entry mode\", options = [\"Retest (default)\", \"Confirmation\"], group = GRT, tooltip = \"RETEST (default): after the BOS the setup is ARMED, and a signal prints only when price comes back to the chosen level and DEFENDS it. Far fewer trades, much tighter stop, and NO TRADE is the normal outcome. CONFIRMATION: the signal prints on the close of the BOS bar itself - zero extra lag, a wider stop and several times the signal count. Both modes still need a level on the retracement side, because that level IS the stop reference.\", display = display.none) i_retestTarget = input.string(\"Nearest of three\", \"Retest target\", options = [\"Nearest of three\", \"Broken structure\", \"Absorption zone\", \"Displacement origin\", \"Any of three (wide)\"], group = GRT, tooltip = \"Which price the retest must reach. The three candidates are the broken structure level, the near edge of the absorption zone and the displacement origin. NEAREST OF THREE (default) uses the one closest to the BOS close as BOTH the touch level and the invalidation anchor - the tightest and most selective setting. ANY OF THREE (wide) touches the nearest but only invalidates past the deepest, which tolerates a full retrace into the zone at the cost of a wider stop; that is the right trade on 15M and wrong on 1M.\", display = display.none) i_retestMinBars = input.int(1, \"Min bars after BOS before a touch counts\", minval = 1, maxval = 20, group = GRT, tooltip = \"The structural floor is 1 and cannot be lowered: the BOS bar can never be its own retest. Raising it forces price to leave the level before coming back, which discards the shallow same-bar graze.\", display = display.none) i_retestMaxBars = input.int(15, \"Max bars a setup may stay armed\", minval = 2, maxval = 100, group = GRT, tooltip = \"After this many bars the armed setup EXPIRES with no signal. This is a BAR count, so it means 15 minutes on 1M and nearly 4 hours on 15M - retune it whenever the timeframe changes. At the maximum a stale absorption can be paired with an unrelated break much later; at the minimum most genuine retests never get the chance to print.\", display = display.none) i_rtRejectBars = input.int(3, \"Max bars from the last touch to the rejection\", minval = 0, maxval = 20, group = GRT, tooltip = \"Once price is AT the level the defence must print within this many bars. The clock is refreshed on EVERY touch, not just the first, so it measures 'price has walked away from the level' rather than 'bars since price first came near it' - a shallow graze must not be allowed to burn the window before the real retest arrives. 0 means the defence has to be the touch bar itself.\", display = display.none) i_rtTolAtr = input.float(0.12, \"Touch tolerance (x ATR)\", minval = 0.0, maxval = 1.0, step = 0.01, group = GRT, tooltip = \"How close price must come to count as a touch. Applied through f_tol(), so it can never fall below one spread no matter how dead the tape is - without that floor, a 1M ATR of 0.5 USD would make the broker's quote, not price action, decide whether a touch registered. At 0 the tolerance IS one spread; at 1.0 almost any bar in the neighbourhood counts as a touch.\", display = display.none) i_rtMinSep = input.float(0.20, \"Min level separation from the BOS close (x ATR)\", minval = 0.0, maxval = 2.0, step = 0.05, group = GRT, tooltip = \"A candidate closer to the BOS close than this - or on the WRONG side of it - is discarded, and if nothing survives the setup does not arm at all. Without it the 'retest' can be satisfied by the bar immediately after the break, which is not a retest, and the invalidation anchor can land on the wrong side of entry. Raising it demands a deeper pullback and produces fewer, better entries.\", display = display.none) i_rtInvalAtr = input.float(0.25, \"Invalidation buffer past the anchor (x ATR)\", minval = 0.0, maxval = 2.0, step = 0.05, group = GRT, tooltip = \"CLOSE-based. The setup dies when a bar CLOSES this far beyond the invalidation anchor (below it for a long, above for a short). Wicks through the anchor are allowed and expected - that is precisely what a retest looks like. Routed through f_tol() so a spread blip can never kill a setup.\", display = display.none) i_rtWickKill = input.float(0.0, \"Extra wick kill past the buffer (x ATR, 0 = off)\", minval = 0.0, maxval = 3.0, step = 0.1, group = GRT, tooltip = \"Optional SECOND kill: also invalidate when the bar's low (long) or high (short) runs this much further again past the close-based invalidation price. 0 disables it entirely. Turn it on only if setups keep surviving a violent spike and then failing anyway.\", display = display.none) i_rtWickFrac = input.float(0.45, \"Defence: min wick (fraction of bar range)\", minval = 0.0, maxval = 0.90, step = 0.05, group = GRT, tooltip = \"A LONG needs a lower wick of at least this fraction of the bar's range; a SHORT needs the mirror upper wick. Identical threshold both ways - the measure itself is f_wickFrac(dir), so the two sides cannot drift apart. At 0 the wick stops filtering; above ~0.6 only extreme pin bars qualify and the stop they imply is wide.\", display = display.none) i_rtCloseLoc = input.float(0.60, \"Defence: min directional close location (0..1)\", minval = 0.50, maxval = 1.0, step = 0.05, group = GRT, tooltip = \"A LONG needs (close - low) / range at or above this; a SHORT needs the exact mirror, and f_closeLoc(+1) + f_closeLoc(-1) == 1 on every bar so no directional bias is possible. 0.60 puts the close in the far 40% of the bar in the trade's direction. At 1.0 only a close exactly on the extreme passes.\", display = display.none) i_rtEngulf = input.bool(false, \"Defence: also require body engulfment\", group = GRT, tooltip = \"Optional. LONG: the bullish body fully engulfs the previous body; SHORT is the exact mirror. Raises quality and cuts the signal count hard, especially on 1M.\", display = display.none) i_rtReqVol = input.bool(true, \"Defence: also require a relative-volume surge\", group = GRT, tooltip = \"ON by default, and deliberately NOT a delta-lean test. With the default CLV estimator buyPressure is arithmetically IDENTICAL to the close-location number already tested above, so a delta gate would be the same fact counted twice and could never reject a bar that passed. Relative volume is the one piece of evidence close location cannot produce. On a feed with no usable volume the test BYPASSES rather than failing, per the file's one na policy.\", display = display.none) i_rtVolMult = input.float(1.20, \"Defence: relative volume multiple\", minval = 1.0, maxval = 5.0, step = 0.05, group = GRT, tooltip = \"The defence bar must carry at least this much relative volume. TICK volume, never contracts and never real order flow. At 1.0 the test is inert; above ~2.0 only the heaviest bars of the session qualify and most genuine retests are discarded.\", display = display.none) // An empty retest window (min > max) would silently expire every setup with no // diagnostic, and the two minval/maxval ranges permit it. Clamp rather than // raise a runtime error - a misconfigured input must not kill the whole script. rtMaxBars = math.max(i_retestMaxBars, i_retestMinBars + 1) // --------------------------------------------------------- GLOBAL BAR READS // Hoisted OUT of f_rtDefended on purpose. v6 evaluates `and`/`or` lazily, so any // history reference living inside a conditionally-reached function body is // evaluated on an irregular subset of bars. These are cheap; keep them global. rtPrevTop = math.max(open[1], close[1]) rtPrevBot = math.min(open[1], close[1]) rtEngBull = close > open and close >= rtPrevTop and open <= rtPrevBot rtEngBear = close < open and close <= rtPrevBot and open >= rtPrevTop // ------------------------------------------------------------- PURE HELPERS // A candidate is eligible only if it sits STRICTLY on the retracement side of // the reference (the BOS close) AND at least `sep` away from it. Returning na // for a failure lets the folds below skip it without poisoning the result. f_rtCand(int dir, float c, float ref, float sep) => na(c) ? na : (dir > 0 ? (c <= ref - sep ? c : na) : (c >= ref + sep ? c : na)) // na-skipping fold toward the reference. Every eligible long candidate sits // BELOW the BOS close, so \"nearest\" is the maximum; shorts mirror exactly. // Call it with -dir to get the DEEPEST candidate instead - one helper, two uses, // and the two can never disagree about what \"nearest\" means. f_rtPick(int dir, float a, float b) => na(a) ? b : na(b) ? a : (dir > 0 ? math.max(a, b) : math.min(a, b)) // A LONG retest that HOLDS and a SHORT retest that FAILS are the same event // mirrored: the level defends and price closes back on the BOS side of it. One // name, one code path, parameterised by dir - symmetry is structural here, not // something a reviewer has to verify by eye. f_rtDefended(int dir, float lvl) => bool okRange = barRange > tick and not na(lvl) bool okWick = f_wickFrac(dir) >= i_rtWickFrac bool okLoc = f_closeLoc(dir) >= i_rtCloseLoc bool okSide = na(lvl) ? false : (dir > 0 ? close > lvl : close < lvl) bool okEng = not i_rtEngulf or (dir > 0 ? rtEngBull : rtEngBear) // Unknown volume BYPASSES, never fails - a thin-volume veto that fires on a // volumeless feed is a 100% kill switch wearing a filter's clothes. bool okVol = not i_rtReqVol or not hasVol or na(rvol) or rvol >= i_rtVolMult okRange and okWick and okLoc and okSide and okEng and okVol // 0..1 GRADE of the trigger bar as a retest event - never a probability, and // never binary. Components that do not exist on this bar (no level in // Confirmation mode, no volume on the feed) are SKIPPED, not scored zero: // scoring a missing measurement as zero is how a mode the user chose ends up // penalised for the evidence it was never meant to have. f_rtGrade(int dir, float lvl) => float gWick = f_ramp(f_wickFrac(dir), 0.15, 0.55) float gLoc = f_ramp(f_closeLoc(dir), 0.50, 0.85) float gRcl = na(lvl) ? na : f_clamp01(math.abs(close - lvl) / f_tol(0.30)) float gVol = na(rvol) ? na : f_ramp(rvol, 0.80, 1.80) float sum = 0.0 float cnt = 0.0 // float on purpose: int/int is a fraction in v6 if not na(gWick) sum += gWick cnt += 1.0 if not na(gLoc) sum += gLoc cnt += 1.0 if not na(gRcl) sum += gRcl cnt += 1.0 if not na(gVol) sum += gVol cnt += 1.0 cnt > 0.0 ? f_clamp01(sum / cnt) : 0.0 // -------------------------------------------------------------- ARMED STATE // Slot 0 = LONG, slot 1 = SHORT - the same mapping f_slot(dir) uses in SECTION // 2B, so a reader never has to hold two conventions at once. Arrays rather // than two mirrored variable sets so the whole machine below is ONE loop over // both directions: there is literally no long-only or short-only statement in // this section, which is what makes the mirror structural. var array<bool> rtArmed = array.new<bool>(2, false) var array<int> rtBosBar = array.new<int>(2, na) var array<float> rtLvl = array.new<float>(2, na) // the touch level var array<float> rtAnch = array.new<float>(2, na) // the invalidation anchor var array<bool> rtTouch = array.new<bool>(2, false) var array<int> rtTchBar = array.new<int>(2, na) var array<float> rtQual = array.new<float>(2, 0.0) var array<bool> rtFire = array.new<bool>(2, false) // Defensive latch of the displacement leg. The BOS bar is at least one bar // after the displacement, so reading dispOrg on the BOS bar reads na whenever // the detector is a per-bar pulse. Freshness is bounded by the same window the // retest itself uses - a displacement older than that belongs to another move. var array<float> rtDispOrg = array.new<float>(2, na) var array<float> rtDispFar = array.new<float>(2, na) var array<int> rtDispBar = array.new<int>(2, na) // ============================================================================ // THE MACHINE - every mutation below is inside `if confirmed and warmupOk`. // ============================================================================ if confirmed and warmupOk for q = 0 to 1 int qd = q == 0 ? 1 : -1 float dO = qd > 0 ? dispOrgL : dispOrgS float dF = qd > 0 ? dispFarL : dispFarS float dP = array.get(rtDispOrg, q) // Stamp the bar only when the published origin CHANGES. SECTION 8 holds // its origin live for i_dispMemBars bars rather than pulsing it, so // re-stamping on every bar it is non-na slides the freshness window // along with it and the bound below never bites: the real horizon // silently becomes i_dispMemBars + rtMaxBars instead of rtMaxBars. if not na(dO) and (na(dP) or dP != dO) array.set(rtDispOrg, q, dO) array.set(rtDispFar, q, dF) array.set(rtDispBar, q, bar_index) for s = 0 to 1 int dir = s == 0 ? 1 : -1 // The trigger is a one-bar pulse and must never survive its own bar - // and the level it fired on dies WITH it. Without this release the // anchor outlives the signal indefinitely (forever in Confirmation // mode, where nothing ever expires a setup), SECTION 11 keeps folding // that dead price into `anchor` as a stop FLOOR, and every later plan // on that side is widened until the width gate rejects the direction // outright. Guarded on rtArmed so a slot that fired and re-armed on one // bar keeps the NEW level. if array.get(rtFire, s) and not array.get(rtArmed, s) array.set(rtLvl, s, na) array.set(rtAnch, s, na) array.set(rtQual, s, 0.0) array.set(rtFire, s, false) // ---- direction-local view of everything upstream -------------------- bool bosNow = dir > 0 ? bosSigL : bosSigS bool bosOpp = dir > 0 ? bosSigS : bosSigL bool bosAmbig = bosSigL and bosSigS // a two-sided bar has NO opinion float bosLvl = dir > 0 ? bosLvlL : bosLvlS bool zAlive = dir > 0 ? zoneAliveL : zoneAliveS float zTopD = dir > 0 ? zoneTopL : zoneTopS float zBotD = dir > 0 ? zoneBotL : zoneBotS // A dead zone is not a level. Price approaching from above meets the TOP // first on a long and the BOTTOM first on a short - hence near/far. float zNear = zAlive ? (dir > 0 ? zTopD : zBotD) : na float zFar = zAlive ? (dir > 0 ? zBotD : zTopD) : na int dBar = array.get(rtDispBar, s) bool dFresh = not na(dBar) and (bar_index - dBar) <= rtMaxBars float dOrg = dFresh ? array.get(rtDispOrg, s) : na float dFar = dFresh ? array.get(rtDispFar, s) : na float tol = f_tol(i_rtTolAtr) float buf = f_tol(i_rtInvalAtr) // ---- (a) resolve a setup that is already armed ---------------------- if array.get(rtArmed, s) float lvl = array.get(rtLvl, s) float anch = array.get(rtAnch, s) int k = bar_index - nz(array.get(rtBosBar, s), bar_index) float hard = na(anch) ? na : (dir > 0 ? anch - buf : anch + buf) bool cBad = na(hard) ? false : (dir > 0 ? close < hard : close > hard) float wx = f_tol(i_rtWickKill) bool wkOn = i_rtWickKill > 0.0 and not na(hard) bool wBad = wkOn and (dir > 0 ? low < hard - wx : high > hard + wx) // An ambiguous bar cannot advance the chain, so it must not be // allowed to kill one either - a tie is \"no opinion\", both ways. bool oppB = bosOpp and not bosAmbig bool dead = cBad or wBad or oppB bool tNow = na(lvl) ? false : (dir > 0 ? low <= lvl + tol : high >= lvl - tol) // Refresh on EVERY touch. Latching the first graze makes the reject // window measure \"bars since price first came near\", which expires // the setup one bar before the deep retest it was built to take. if not dead and k >= i_retestMinBars and tNow array.set(rtTouch, s, true) array.set(rtTchBar, s, bar_index) bool touched = array.get(rtTouch, s) int tb = nz(array.get(rtTchBar, s), bar_index) bool gone = k > rtMaxBars or (touched and (bar_index - tb) > i_rtRejectBars) bool fire = not dead and not gone and touched and f_rtDefended(dir, lvl) if fire array.set(rtFire, s, true) array.set(rtQual, s, f_rtGrade(dir, lvl)) array.set(rtArmed, s, false) // one signal per armed setup, ever else if dead or gone array.set(rtArmed, s, false) array.set(rtLvl, s, na) array.set(rtAnch, s, na) array.set(rtQual, s, 0.0) // ---- (b) a fresh BOS supersedes: arm, or fire in Confirmation mode --- // Runs AFTER (a) so a bar can resolve the old setup and arm a new one - // EXCEPT on a bar where (a) actually fired. There is exactly ONE level // and ONE anchor exported per direction, so re-arming on the signal bar // publishes the NEW setup's kill price as the stop reference of a // signal that belongs to the OLD one, and zeroes the retest grade the // fire just computed. The BOS pulse is dropped instead; SECTION 13's // duplicate and cooldown gates would have suppressed a same-direction // re-entry one bar later in any case. if bosNow and not bosAmbig and not array.get(rtFire, s) float ref = close float sep = f_tol(i_rtMinSep) float cS = f_rtCand(dir, bosLvl, ref, sep) float cZn = f_rtCand(dir, zNear, ref, sep) float cZf = f_rtCand(dir, zFar, ref, sep) float cD = f_rtCand(dir, dOrg, ref, sep) float cDf = f_rtCand(dir, dFar, ref, sep) float near = f_rtPick(dir, f_rtPick(dir, cS, cZn), cD) float far = f_rtPick(-dir, f_rtPick(-dir, cS, cZf), cDf) float lv = na float an = na if i_retestTarget == \"Broken structure\" lv := cS an := cS else if i_retestTarget == \"Absorption zone\" lv := cZn an := na(cZf) ? cZn : cZf else if i_retestTarget == \"Displacement origin\" lv := cD an := cD else if i_retestTarget == \"Any of three (wide)\" lv := near an := na(far) ? near : far else lv := near an := near // Validate exactly the levels the chosen target actually uses. A // blanket \"all upstream levels present\" check would force NO TRADE // on a Broken-Structure setup that had everything it needed. if not na(lv) and not na(an) array.set(rtLvl, s, lv) array.set(rtAnch, s, an) array.set(rtBosBar, s, bar_index) array.set(rtTouch, s, false) array.set(rtTchBar, s, na) if i_entryMode == \"Confirmation\" array.set(rtFire, s, true) array.set(rtQual, s, f_rtGrade(dir, float(na))) array.set(rtArmed, s, false) else array.set(rtArmed, s, true) array.set(rtQual, s, 0.0) // nothing has been retested yet else // Nothing survived the side/separation guard. The setup is // already sitting at its own retest, so the trigger would be // meaningless. NO TRADE is the correct outcome. array.set(rtArmed, s, false) array.set(rtLvl, s, na) array.set(rtAnch, s, na) array.set(rtQual, s, 0.0) // ------------------------------------------------------------------ EXPORTS // `and confirmed and warmupOk` keeps the pulse pinned to the bar that produced // it: during the next forming bar the array still holds the old value, and // without the guard every plot and every alert would re-fire on it. entryRawL = confirmed and warmupOk and array.get(rtFire, 0) entryRawS = confirmed and warmupOk and array.get(rtFire, 1) // These PERSIST while armed (SECTION 16 draws the pending level from them) and // are cleared the moment a setup expires or is invalidated, so non-na means // \"armed, or fired on this bar\" and nothing else. retestLvlL = array.get(rtLvl, 0) retestLvlS = array.get(rtLvl, 1) invAnchorL = array.get(rtAnch, 0) invAnchorS = array.get(rtAnch, 1) qRetestL = array.get(rtQual, 0) qRetestS = array.get(rtQual, 1) // ========================= END SECTION 10 =================================== // ============================================================================ // SECTION 11 : RISK PLAN - f_riskPlan(), the ONLY stop / TP / RR function // // DELIBERATELY ABOVE THE SCORE. SECTION 12 carries an R:R modifier and must be // able to call this, so the planner is declared first. SECTION 12 calls it with // entryPx = close for a PROVISIONAL qRr; SECTION 14 calls it once more on the // signal bar to freeze the real plan. On the signal bar both calls pass // entryPx = close, so they agree by construction rather than by coincidence. // // f_riskPlan IS PURE. It reads globals (aRef, costRt, tick, the inputs, and the // liquidity map) and assigns to NONE of them. Pine forbids writing a global // from inside a function anyway; the point here is that calling it twice on the // same bar with the same arguments is guaranteed to be free of side effects. // // ── THE STOP ANCHOR, AND WHY IT IS THE NEAREST AND NOT THE FURTHEST ──────── // \"Most protective = the candidate furthest from entry\" sounds right and is // wrong. The three candidates are monotone in a real sweep-then-absorption // setup - the sweep runs the liquidity below the zone, and the pivot swing sits // at or beyond the sweep - so \"furthest\" resolved to the lagged pivot on every // single trade. Three consequences followed: the absorption and sweep anchors // became dead inputs, the pivot's confirmation lag applied to every stop, and // the stop inflated to multiple ATR, at which point the module rejected its own // trade as too wide. The thesis of this system is that the sweep extreme WAS // the liquidity grab, so the stop belongs just beyond THAT, not beyond an older // unrelated pivot. Hence: // anchor = NEAREST of the non-na absorption bound and sweep extreme // the structural swing is consulted ONLY when both of those are na // The retest module's invalidation anchor joins as a fallback above the swing, // and as a floor: the stop may never sit INSIDE the price whose breach already // kills the thesis, because a stop nearer than that gets taken by the ordinary // noise at that very level. // // ── WHY THE R:R GATE CAN ACTUALLY FIRE ──────────────────────────────────── // A target ladder floored at its own R multiple makes rr2 >= i_tp2R by // construction, so a gate of `rr2 >= i_rrMin` with i_tp2R == i_rrMin is dead // code that rejects nothing but mintick rounding. Two things fix it here: // 1. i_tp2R is 2.4 against a 2.0 gate, and the comparison carries a one-tick // tolerance, so rounding alone can never fire it. // 2. The gate additionally reads the FIRST meaningful opposing level in front // of the trade with NO minimum distance. A target ladder can only ever // push targets further out; the nearest shelf is the thing that actually // ends the move, and if it sits closer than the minimum R then the R:R is // genuinely poor however far the plotted TP2 is. That is the only path in // this module that ever rejects a setup for reward, and it is the honest // one. // ============================================================================ GRK = \"11 - Risk Plan\" i_slMode = input.string(\"Structure + ATR\", \"Stop anchor mode\", options = [\"Structure + ATR\", \"Structure\", \"ATR\"], group = GRK, tooltip = \"STRUCTURE + ATR (default): one ATR buffer beyond the structural anchor, which clears the routine overshoot wick. STRUCTURE: one spread beyond the anchor - tightest, and stopped out by any overshoot. ATR: a pure multiple of ATR from entry, ignoring structure entirely; this is also the automatic fallback whenever no anchor survives on the adverse side of entry.\", display = display.none) i_slBufAtr = input.float(0.25, \"Structure buffer (x ATR)\", minval = 0.0, maxval = 1.50, step = 0.05, group = GRK, tooltip = \"Room added beyond the anchor in Structure + ATR mode, routed through f_tol() so it can never collapse below one spread. At 0 the stop sits one spread off the anchor and the routine overshoot takes it; above ~0.5 you are paying for protection the R:R gate then rejects.\", display = display.none) i_slAtrMult = input.float(1.20, \"ATR stop multiple\", minval = 0.30, maxval = 5.0, step = 0.10, group = GRK, tooltip = \"Used by ATR mode and as the no-anchor fallback. 1.2 ATR sits just outside ordinary XAUUSD noise on 1M-15M. Below ~0.8 the stop is inside the noise; above ~2.0 nothing clears the R:R gate.\", display = display.none) i_slMaxAtr = input.float(2.20, \"Max stop distance (x ATR)\", minval = 0.50, maxval = 6.0, step = 0.10, group = GRK, tooltip = \"Hard rejection: a wider stop is discarded as STOP TOO WIDE, because clearing the minimum R:R would then need a session-sized move. The minimum-stop floor is CLAMPED below this, so the module can never widen a stop past its own gate and then reject the trade for being too wide. At the maximum the gate stops filtering.\", display = display.none) i_useLiqTp = input.bool(true, \"Use liquidity-map targets\", group = GRK, tooltip = \"ON: each target independently takes the nearest level from the liquidity map when that level is at least this leg's minimum R away and inside its cap, otherwise it falls back to the R multiple. OFF: pure R multiples. A missing or empty map is never an error - it just means every target falls back.\", display = display.none) i_tp1R = input.float(1.0, \"TP1 (R)\", minval = 0.5, maxval = 3.0, step = 0.1, group = GRK, tooltip = \"The de-risking leg. At 1.0R the partial taken here exactly pays for a full stop-out on the remainder, which is the entire reason it exists. Below 1.0R it does not, and the scale-out stops being risk reduction.\", display = display.none) i_tp2R = input.float(2.4, \"TP2 (R)\", minval = 1.0, maxval = 6.0, step = 0.1, group = GRK, tooltip = \"The gated leg and the one the position is really sized for. Kept deliberately ABOVE the minimum R:R in SECTION 0 (2.4 against 2.0): setting it equal to the gate makes the gate unreachable, because an R-multiple fallback then passes its own test by construction and the only thing left to reject is mintick rounding.\", display = display.none) i_tp3R = input.float(3.6, \"TP3 (R)\", minval = 1.5, maxval = 10.0, step = 0.1, group = GRK, tooltip = \"The runner. It is only the last quarter of the position, so it can afford a further, lower-frequency objective. Past ~4R on 5M gold it is a session-sized move and the trailing stop, not the limit, will take it.\", display = display.none) i_tpLiqCap = input.float(2.0, \"Liquidity target cap (x nominal R)\", minval = 1.0, maxval = 4.0, step = 0.1, group = GRK, tooltip = \"A liquidity level further than this multiple of its leg's nominal R is ignored rather than promoted into a target. Without the cap one distant level - yesterday's high, say - manufactures a 6R plan that never fills. At the maximum the cap effectively stops binding.\", display = display.none) i_rkBlockQual = input.float(0.45, \"Blocking level: minimum quality (0..1)\", minval = 0.0, maxval = 1.0, step = 0.05, group = GRK, tooltip = \"Only levels at least this good are allowed to veto a setup for poor R:R when they sit in front of the trade. Level quality is kind x touch count: a fresh previous-day extreme scores ~0.50 and a bare untested swing ~0.30, so 0.45 listens to major levels and ignores minor ones. At 0 EVERY level can veto and almost nothing trades; at 1.0 the veto is off and the R:R gate goes back to being unreachable.\", display = display.none) i_tp1Pct = input.float(40, \"Close at TP1 (%)\", minval = 20, maxval = 50, step = 5, group = GRK, tooltip = \"Percentage of the INITIAL position closed at TP1. Pine applies qty_percent to the initial size, so the three legs sum to 100 directly - do not compensate for the remaining size the way pre-2022 guides tell you to.\", display = display.none) i_tp2Pct = input.float(35, \"Close at TP2 (%)\", minval = 20, maxval = 40, step = 5, group = GRK, tooltip = \"Also a percentage of the initial position. The maxima here and on TP1 sum to 90, so the runner leg is always at least 10% and no renormalisation is ever needed.\", display = display.none) // The runner. Guaranteed to land in [10, 60] by the two maxvals above. tp3Pct = 100.0 - i_tp1Pct - i_tp2Pct // ------------------------------------------------------------- PURE HELPERS // ONE rounding rule for every price this module produces: round DOWN for a long // and UP for a short. Applied to a stop that can only make it WIDER (never // inside the structure it protects); applied to a target it can only pull it // NEARER (a limit in front of the shelf fills, one behind it may not). The // second round_to_mintick cleans the binary residue so labels print exactly. // The 1e-9 nudges absorb binary residue so a price that IS already on a tick // boundary is not shifted a whole tick by floor()/ceil(). f_rkSnap(float px, int dir) => na(px) ? na : math.round_to_mintick(dir > 0 ? math.floor(px / tick + 1e-9) * tick : math.ceil(px / tick - 1e-9) * tick) // A stop anchor that is not on the adverse side of entry is not a stop at all - // it is a sign error that math.abs() would then hide inside a plausible-looking // positive risk number. Reject it here rather than discover it in the backtest. f_rkAdverse(int dir, float c, float ref) => na(c) ? na : (dir > 0 ? (c < ref ? c : na) : (c > ref ? c : na)) // na-skipping fold. f_rkNear(d, a, b) is math.max when d > 0 and math.min when // d < 0 - that is ALL it is, and the CALLER owns the polarity, because the two // sides of entry invert it: // ADVERSE side (stops - a long's candidates sit BELOW entry) // f_rkNear( dir, ..) = NEAREST entry f_rkNear(-dir, ..) = FURTHEST // TARGET side (TPs - a long's candidates sit ABOVE entry) <- INVERTED // f_rkNear( dir, ..) = FURTHEST from entry, i.e. the BINDING FLOOR // Taking -dir on a target floor returns the NEARER price, which collapses TP2 to // roughly 1R and makes the R:R gate reject every plan on both sides, so every // call below states which side of entry it is folding. f_rkNear(int dir, float a, float b) => na(a) ? b : na(b) ? a : (dir > 0 ? math.max(a, b) : math.min(a, b)) // ONE linear scan of the liquidity map, used for both target selection and the // blocking test. Returns the level nearest to refPx inside [minLvl, capLvl] // (the band inverts for shorts) that also clears minQual, or na when nothing // qualifies. No sort, no allocation, no per-bar array churn. // // TARGET eligibility deliberately does NOT test LiquidityLevel.side. `side` is // about which way a level ACTS as a barrier when price arrives from the other // direction; a previous-day LOW sitting above a long entry is every bit as much // of a magnet and a wall as a previous-day high. What matters for a target is // only that resting liquidity sits in front of the trade. f_rkScan(int dir, float refPx, float minLvl, float capLvl, float minQual) => float best = na if not na(levels) int n = array.size(levels) if n > 0 // `for 0 to -1` counts DOWN in Pine and throws for i = 0 to n - 1 LiquidityLevel L = array.get(levels, i) if L.active and not na(L.price) and L.quality() >= minQual bool inBand = dir > 0 ? (L.price >= minLvl and L.price <= capLvl) : (L.price <= minLvl and L.price >= capLvl) if inBand if na(best) or math.abs(L.price - refPx) < math.abs(best - refPx) best := L.price best // Cost-aware break-even, moved after TP1 fills. A stop exactly at entry is a // GUARANTEED small loss because the round turn is still paid on the way out, so // the level is offset by whichever of the cost and a small ATR fraction is // larger, and snapped in the PROTECTIVE direction (-dir) so the offset can never // round back under the cost it exists to cover. f_bePrice(int dir, float entryPx) => na(entryPx) ? na : f_rkSnap(entryPx + dir * math.max(costRt, 0.05 * aRef), -dir) // ============================================================================ // f_riskPlan - one stop, three targets, one verdict. Pure. // // absLo/absHi : absorption-zone bounds swpLo/swpHi : sweep extreme // swgLo/swgHi : structural swing invAnchor : SECTION 10's kill price // Only the bound matching `dir` is ever read from each pair; the mirror is // present so one signature serves both sides and callers never branch. // ============================================================================ f_riskPlan(int dir, float entryPx, float absLo, float absHi, float swpLo, float swpHi, float swgLo, float swgHi, float invAnchor) => RiskPlan p = RiskPlan.new() p.dir := dir p.entry := entryPx // aRef, not atr: aRef is the na-safe ATR with a spread floor, and the two are // identical whenever atr exceeds one spread, which is every bar the system is // allowed to trade. Using atr raw would make every number here na during // warm-up and hand the gate a silent, unexplained blackout. float cost = costRt float maxStop = i_slMaxAtr * aRef // The cost term is the one that matters on 1M: a structural anchor 0.30 USD // away next to a 0.45 USD round turn is not a stop, it is a rounding error. // CLAMPED below maxStop so the floor can never manufacture the very width the // gate below then rejects - that inversion produces a 100% rejection rate // labelled with the wrong reason, and it is invisible in the output. float minStop = math.min(math.max(0.30 * aRef, 2.0 * cost), maxStop) // ---- 1. ANCHOR --------------------------------------------------------- float cAbs = f_rkAdverse(dir, dir > 0 ? absLo : absHi, entryPx) float cSwp = f_rkAdverse(dir, dir > 0 ? swpLo : swpHi, entryPx) float cInv = f_rkAdverse(dir, invAnchor, entryPx) float cSwg = f_rkAdverse(dir, dir > 0 ? swgLo : swgHi, entryPx) // NEAREST of the zone bound and the sweep extreme - see the banner. float base = f_rkNear(dir, cAbs, cSwp) // The swing is consulted ONLY when both of those are missing, and the retest // module's kill price ranks ahead of it: it is a live, event-driven level // rather than a pivot that is already i_pivotRight bars old when it appears. base := na(base) ? (na(cInv) ? cSwg : cInv) : base // ...and the stop is never placed INSIDE the price whose breach already kills // the setup. f_rkNear(-dir, ...) is the FURTHEST of the two. float anchor = na(base) or na(cInv) ? base : f_rkNear(-dir, base, cInv) // ---- 2. STOP ----------------------------------------------------------- // Structure mode buffers by exactly one spread: f_tol(0.0) == i_spreadUsd. // Nothing here is denominated in ticks - mintick is 0.01 on most XAUUSD // feeds and 0.001 on others, so a tick-denominated buffer mis-scales 10x. float buf = i_slMode == \"Structure\" ? f_tol(0.0) : f_tol(i_slBufAtr) float slRaw = (i_slMode == \"ATR\" or na(anchor)) ? entryPx - dir * i_slAtrMult * aRef : anchor - dir * buf float stopDist = math.max(math.abs(entryPx - slRaw), minStop) p.stop := f_rkSnap(entryPx - dir * stopDist, dir) // Re-derive from the SNAPPED stop so the printed level, the risk and every // R multiple below describe one number rather than three near-misses. stopDist := math.abs(entryPx - p.stop) // ONE TICK of tolerance, for the same reason rrEps exists below: f_rkSnap // moves the stop AWAY from entry, so a plan built to land exactly on maxStop // (which is what the minStop clamp above deliberately produces in dead tape) // would otherwise be rejected by the rounding artefact the clamp exists to // prevent - a 100% rejection rate carrying the wrong reason. bool tooWide = stopDist > maxStop + tick // Stopped out => you lose the distance AND the cost. The one-tick floor only // ever binds in a degenerate configuration (zero spread, zero slippage and a // pre-warmup ATR); it exists so nothing below can divide by zero. float rNet = math.max(stopDist + cost, tick) p.risk := rNet // ---- 3. TARGETS -------------------------------------------------------- // TPn_rr = entry + dir*(R*riskNet + cost) makes the NET R multiple exactly R: // (R*riskNet + cost - cost) / riskNet = R. A target labelled 2.4R genuinely // nets 2.4R after spread and slippage, which is the only version of the // number worth quoting to anyone. float gap = f_tol(0.25) // minimum separation between the three legs float rr1Px = entryPx + dir * (i_tp1R * rNet + cost) float rr2Px = entryPx + dir * (i_tp2R * rNet + cost) float rr3Px = entryPx + dir * (i_tp3R * rNet + cost) float cap1 = entryPx + dir * (i_tpLiqCap * i_tp1R * rNet + cost) float cap2 = entryPx + dir * (i_tpLiqCap * i_tp2R * rNet + cost) float cap3 = entryPx + dir * (i_tpLiqCap * i_tp3R * rNet + cost) // TP1 may never be a sub-1R \"de-risk\" leg: below 1R the partial cannot pay // for a stop-out on the remainder, which is the whole reason it is taken. float minL1 = rr1Px float lv1 = i_useLiqTp ? f_rkScan(dir, entryPx, minL1, cap1, 0.0) : na float t1 = na(lv1) ? rr1Px : lv1 // TP2's floor is the GATE itself, not i_tp2R - that is what lets a liquidity // shelf at 2.1R be taken in preference to an arithmetic 2.4R, while a shelf // at 1.6R is refused and the plan falls back. // TARGET side: f_rkNear(dir, ..) is the FURTHER of the two, i.e. the floor // that binds - the gate price, or TP1 plus one separation, whichever is deeper. float minL2 = f_rkNear(dir, entryPx + dir * (i_rrMin * rNet + cost), t1 + dir * gap) float lv2 = i_useLiqTp ? f_rkScan(dir, entryPx, minL2, cap2, 0.0) : na float t2 = na(lv2) ? f_rkNear(dir, rr2Px, minL2) : lv2 // TARGET side float minL3 = f_rkNear(dir, rr3Px, t2 + dir * gap) // TARGET side float lv3 = i_useLiqTp ? f_rkScan(dir, entryPx, minL3, cap3, 0.0) : na float t3 = na(lv3) ? minL3 : lv3 p.tp1 := f_rkSnap(t1, dir) p.tp2 := f_rkSnap(t2, dir) p.tp3 := f_rkSnap(t3, dir) // Cost charged ONCE per outcome: added to risk above, subtracted from reward // here. Charging it twice is how a 2R plan quietly becomes a 1.6R plan. p.rr1 := (math.abs(p.tp1 - entryPx) - cost) / rNet p.rr2 := (math.abs(p.tp2 - entryPx) - cost) / rNet p.rr3 := (math.abs(p.tp3 - entryPx) - cost) / rNet // ---- 4. GATE ----------------------------------------------------------- // One tick of tolerance: the targets are snapped TOWARDS entry, so a plan // built to land exactly on the floor can otherwise be rejected by a rounding // artefact worth 0.002R. That would make rounding the only thing the gate // ever rejects, which is worse than having no gate. float rrEps = tick / rNet + 1e-9 // The first meaningful opposing level in front of the trade, with NO minimum // distance. The ladder above can only push targets further out; this is the // only thing that can pull the verdict in. float blk = f_rkScan(dir, entryPx, entryPx + dir * tick, dir > 0 ? 1e12 : -1e12, i_rkBlockQual) float rrBlk = na(blk) ? na : (math.abs(blk - entryPx) - cost) / rNet bool poorRr = p.rr2 < i_rrMin - rrEps or (not na(rrBlk) and rrBlk < i_rrMin - rrEps) // Width first: it is the more upstream cause, and a too-wide stop makes every // R number downstream of it meaningless anyway. p.ok := not tooWide and not poorRr p.why := tooWide ? NoTradeReason.wideStop : poorRr ? NoTradeReason.poorRr : NoTradeReason.ok // ---- 5. qRr : 0..1 for the score modifier, never a probability --------- // Graded on the REACHABLE R, not the plotted one: if a wall sits nearer than // TP2 then the honest reward is the wall. 0 at the gate floor, 1 at double it. float rrEff = na(rrBlk) ? p.rr2 : math.min(p.rr2, rrBlk) p.qRr := nz(f_ramp(rrEff, i_rrMin, 2.0 * i_rrMin), 0.0) p // ========================= END SECTION 11 =================================== // ============================================================================ // SECTION 12 : CONFIDENCE + CONFLICT -- THE ONE 0-100 SCORE // // Every upstream module publishes q_* in [0,1] and NOTHING else in this file // mints points. This is the only place a 0-100 number is built, and SECTION 0's // i_minScore is the only gate on it (conflict resolution [13]). // // WHAT THE NUMBER IS: a SETUP CONFIDENCE score - a weighted sum of PROXY // evidence derived from OHLC and TICK volume. There is no order book, no // bid/ask tape and no aggressor flag on a spot XAUUSD feed. It is NOT a win // probability, NOT an edge estimate and NOT a forecast. A score of 90 does not // mean nine trades in ten work. // // EIGHT ROWS, MAXIMA FIXED BY THE BRIEF: // liquidity level 15 | sweep 15 | rel. volume 10 | absorption 20 | // rejection 10 | displacement 10 | structure break 10 | retest 10 = 100 // Every row is GRADED (row = weight * q), never binary. Eight binary flags can // take only 2^8 values and, with near-uniform weights, degenerate into \"how // many boxes were ticked\" - which destroys three things at once: threshold // tuning glides instead of stepping, the score stops ordering outcomes, and // the conflict test loses its meaning (two equal BINARY scores may just be // different boxes; two equal GRADED scores really are two-sided evidence). // // PURE SECTION. No var, no arrays, no drawings, no alerts, no ta.* calls. // Every value below is a function of this bar's already-committed upstream // values, so there is nothing here to guard with `if confirmed` - SECTION 14 // applies the confirmed gate to the SIGNAL that consumes these numbers. // ============================================================================ // ---------------------------------------------------------------- 12.0 GROUPS G12S = \"12 - Confidence Score\" G12C = \"12 - Conflict Filter\" // Repeated verbatim on every score-bearing tooltip. The claim this file is NOT // allowed to make is the one a user most wants to read into a 0-100 number. SC_NOTPROB = \"\\n\\nThis is a SETUP CONFIDENCE score built from PROXY evidence (tick volume and OHLC geometry). It is NOT a win probability and NOT an expected-value estimate: 80/100 does not mean an 80% chance of profit, it means four fifths of the evidence this rubric can measure was present.\" // ------------------------------------------------- 12.1 WEIGHTS (all inputs) // Every weight is an input so the rubric can be re-weighted after backtesting // without editing code. Keep the sum at 100 or leave renormalisation to do it. i_wLevel = input.float(15.0, \"Liquidity level\", minval = 0.0, maxval = 50.0, step = 0.5, group = G12S, tooltip = \"Max points for resting liquidity at a meaningful level. Graded by the level's own quality (kind and touch count), so one untested swing scores a fraction of a three-times-tested previous-day high. 0 removes the row entirely: the remaining weights are renormalised back to 100, so the top of the scale does not drop - the other rows simply become worth proportionally more.\" + SC_NOTPROB, display = display.none) i_wSweep = input.float(15.0, \"Liquidity sweep\", minval = 0.0, maxval = 50.0, step = 0.5, group = G12S, tooltip = \"Max points for the stop-run through that level which then failed. Graded by penetration depth and how quickly price reclaimed the level.\" + SC_NOTPROB, display = display.none) i_wRvol = input.float(10.0, \"Relative volume\", minval = 0.0, maxval = 50.0, step = 0.5, group = G12S, tooltip = \"Max points for participation. XAUUSD volume on TradingView is TICK volume (the count of price updates), not contracts - an activity proxy only. On a feed with no usable volume this row is REMOVED and the other seven weights are renormalised back to 100, so a volumeless feed is not silently capped below the threshold.\" + SC_NOTPROB, display = display.none) i_wAbsorb = input.float(20.0, \"Absorption (Delta Proxy)\", minval = 0.0, maxval = 50.0, step = 0.5, group = G12S, tooltip = \"Max points for Potential Absorption. The largest single row because it is the thesis - and the least directly measurable quantity in the file, since it is inferred from effort-vs-result on tick volume rather than read from a tape. If you distrust the proxy, move points from here to sweep and retest, which are visible in price alone.\" + SC_NOTPROB, display = display.none) i_wReject = input.float(10.0, \"Rejection\", minval = 0.0, maxval = 50.0, step = 0.5, group = G12S, tooltip = \"Max points for the rejection / failure-to-continue bar at the level. Graded by wick fraction and close location.\" + SC_NOTPROB, display = display.none) i_wDisp = input.float(10.0, \"Displacement\", minval = 0.0, maxval = 50.0, step = 0.5, group = G12S, tooltip = \"Max points for the impulse leg away from the level, graded in ATR units of body travel.\" + SC_NOTPROB, display = display.none) i_wBos = input.float(10.0, \"Structure break\", minval = 0.0, maxval = 50.0, step = 0.5, group = G12S, tooltip = \"Max points for the break of structure that confirms the reversal, graded by how decisively the swing was taken.\" + SC_NOTPROB, display = display.none) i_wRetest = input.float(10.0, \"Retest\", minval = 0.0, maxval = 50.0, step = 0.5, group = G12S, tooltip = \"Max points for the retest of the broken level, graded by precision and by whether it held. In Confirmation entry mode this row is usually 0 by construction - expect scores roughly ten points lower in that mode and set i_minScore accordingly.\" + SC_NOTPROB, display = display.none) i_rvolQLo = input.float(1.0, \"rvol scoring: zero-point\", minval = 0.0, maxval = 10.0, step = 0.05, group = G12S, tooltip = \"Relative volume that scores 0 on the volume row. 1.0 = an average bar earns nothing, which is the intent: average participation is not evidence.\", display = display.none) i_rvolQHi = input.float(2.5, \"rvol scoring: full-mark point\", minval = 0.1, maxval = 20.0, step = 0.05, group = G12S, tooltip = \"Relative volume that scores the full row. Set it at or below the zero-point and the row scores 0 for every bar - a misconfigured ramp never hands out a free full mark.\", display = display.none) // ------------------------------------------------ 12.2 MODIFIER MAGNITUDES // Each modifier supplies a signed scalar in [-1,+1]; these are its point value // at |s| = 1. maxval = 15 is LOAD-BEARING, not cosmetic: VWAP and session are // penalty-only, so only HTF and R:R can be positive and the bonus is capped at // 30, and the headroom rule below is only proved to stay under 100 while the // total possible bonus is under 100. i_mHtf = input.float(6.0, \"HTF alignment (+/- pts)\", minval = 0.0, maxval = 15.0, step = 0.5, group = G12S, tooltip = \"Points added when the higher-timeframe bias agrees with the trade and subtracted when it opposes. An UNKNOWN bias is 0 for both sides - never a penalty on one side and a bonus on its mirror. Note the deliberate asymmetry: bonuses are scaled by remaining headroom (at a base of 85 a 6-point bonus is worth ~0.9) while penalties apply at full face value. 0 disables.\" + SC_NOTPROB, display = display.none) i_mVwap = input.float(4.0, \"VWAP extension (+/- pts)\", minval = 0.0, maxval = 15.0, step = 0.5, group = G12S, tooltip = \"PENALTY ONLY, on both sides. Points subtracted when price is already extended away from session VWAP in the direction you are entering (chasing); full penalty at 2 ATR of extension. Being extended AGAINST a trade is not evidence FOR it, so the opposite side is never credited - a zero-sum transfer would lift the losing side toward the conflict floor and veto clean signals during gold trend days. 0 disables.\" + SC_NOTPROB, display = display.none) i_mSess = input.float(5.0, \"Session quality (+/- pts)\", minval = 0.0, maxval = 15.0, step = 0.5, group = G12S, tooltip = \"PENALTY ONLY, direction-neutral. 0 in the London/NY overlap, -0.20 of this in a single session, -0.65 in Asia and the full penalty outside all sessions (rollover, where the XAUUSD spread widens well beyond the usual 0.15-0.35 USD and tick volume is noise). A good session is not evidence for a setup; a dead one is evidence against. 0 disables.\" + SC_NOTPROB, display = display.none) i_mRr = input.float(5.0, \"Net R:R quality (+/- pts)\", minval = 0.0, maxval = 15.0, step = 0.5, group = G12S, tooltip = \"Points from the risk module's own qRr, measured NET of spread and slippage on a provisional plan priced at this bar's close. A plan that cannot be built at all scores the full penalty, and the POOR RR gate in SECTION 13 blocks it outright anyway. 0 disables.\" + SC_NOTPROB, display = display.none) // --------------------------------------------- 12.3 GATES / CONFLICT INPUTS i_coreMin = input.float(0.30, \"Core evidence floor (0..1)\", minval = 0.0, maxval = 1.0, step = 0.05, group = G12C, tooltip = \"Absorption, displacement AND structure break must EACH reach this quality. Pure summation lets eight mediocre rows add up to a high score; this is the anti-mediocrity gate. 0 disables it. Above ~0.6 expect very few setups, because all three must clear it on the same evaluation.\" + SC_NOTPROB, display = display.none) i_conflictOn = input.bool(true, \"Enable directional conflict filter\", group = G12C, tooltip = \"When BOTH sides are in contention on the same bar, emit CONFLICT and suppress both. This is the common XAUUSD compression / news case, where the absorption proxy fires on both sides of one level. Turning it OFF does not permit a simultaneous long and short - that case is blocked unconditionally.\", display = display.none) i_conflictBand = input.float(15.0, \"Conflict band (pts below the score gate)\", minval = 0.0, maxval = 60.0, step = 1.0, group = G12C, tooltip = \"Conflict floor = i_minScore - this band, and BOTH sides must EXCEED the floor. At the default gate of 75 the floor is 60. Larger values veto more: the floor is clamped so it can never fall below 30% of the gate, because a floor near zero would make every bar with any two-sided evidence a conflict and stop the script trading entirely without saying so.\", display = display.none) // -------------------------------------------------------------- 12.4 HELPERS // TWO na policies, split by RANGE - this is the single most load-bearing detail // in the section. SECTION 0's f_clamp PROPAGATES na (correctly: callers must // state their own policy). Here: // quality [0,1] : na -> 0 (no evidence) // scalar [-1,+1] : na -> 0 (NEUTRAL) // Substituting the lower bound for na on the SIGNED path - the obvious way to // write one helper for both - would turn a missing HTF bias into a full penalty // on one side and, because the bear scalar is a negated mirror, a full bonus on // the other. That is a directional bias manufactured out of missing data. f_scQ(float x) => math.max(0.0, math.min(1.0, nz(x, 0.0))) f_scSigned(float x) => math.max(-1.0, math.min(1.0, nz(x, 0.0))) // ------------------------------------------- 12.5 THE RELATIVE-VOLUME ROW // This section owns the rvol row because rvol itself is direction-free: it is // the SAME number for both sides. Both names exist so the per-direction API is // uniform for the panel and the Setup snapshot, and the value is deliberately // identical - the conflict test below excludes this row for exactly that // reason, so a common-mode term can never manufacture a veto. scQRvolRaw = f_scQ(f_ramp(rvol, i_rvolQLo, i_rvolQHi)) qRvolL = scQRvolRaw qRvolS = scQRvolRaw // ------------------------------------------- 12.6 VWAP EXTENSION (shared) // Signed distance from the session VWAP in ATR units. SECTION 4 owns vwapS; a // missing VWAP reads 0.0, which is neutral for this modifier and FAILS OPEN for // SECTION 13's VWAP ceiling - one definition, consumed twice, never recomputed. vwapExtAtr = na(vwapS) ? 0.0 : (close - vwapS) / math.max(aRef, tick) // ------------------------------------------------ 12.7 WEIGHT NORMALISATION // TWO scales, computed once and shared by both directions. // scKAll : the SCORING scale. When the feed carries no usable volume the rvol // row is REMOVED and the other seven weights are renormalised back to // 100. Scoring that row 0 would cap every setup on a volumeless gold // feed at 90 - below every shipped preset, so the script would simply // never trade and never say why. Scoring it 1 would invent evidence. // scKCon : the CONTENTION scale, used by the conflict test only. It ALWAYS // removes the rvol row, because a term that is identical on both sides // carries zero directional information while lifting both sides toward // the floor together - i.e. it manufactures vetoes out of nothing. scWSum = i_wLevel + i_wSweep + i_wRvol + i_wAbsorb + i_wReject + i_wDisp + i_wBos + i_wRetest scWSumNoRv = scWSum - i_wRvol scKAll = hasVol ? (scWSum > 0.0 ? 100.0 / scWSum : 0.0) : (scWSumNoRv > 0.0 ? 100.0 / scWSumNoRv : 0.0) scKCon = scWSumNoRv > 0.0 ? 100.0 / scWSumNoRv : 0.0 // All weights zeroed -> k = 0 -> every score 0 -> LOW CONFIDENCE on every bar. // That is the honest outcome of deleting the entire rubric, not a silent pass. // ---------------------------------------------------------- 12.8 BASE SCORE // ONE code path parameterised by dir. Long and short are mirrors STRUCTURALLY: // there is no second copy of this arithmetic to drift out of step. f_scBase(int dir, float kScale, bool useRv) => float s = 0.0 s += i_wLevel * f_scQ(dir > 0 ? qLevelL : qLevelS) s += i_wSweep * f_scQ(dir > 0 ? qSweepL : qSweepS) s += (useRv ? i_wRvol * f_scQ(dir > 0 ? qRvolL : qRvolS) : 0.0) s += i_wAbsorb * f_scQ(dir > 0 ? qAbsorbL : qAbsorbS) s += i_wReject * f_scQ(dir > 0 ? qRejectL : qRejectS) s += i_wDisp * f_scQ(dir > 0 ? qDispL : qDispS) s += i_wBos * f_scQ(dir > 0 ? qBosL : qBosS) s += i_wRetest * f_scQ(dir > 0 ? qRetestL : qRetestS) math.max(0.0, math.min(100.0, s * kScale)) // ------------------------------------------ 12.9 PROVISIONAL RISK PLAN // SECTION 11 owns f_riskPlan(). It is called here with entryPx = close for a // PROVISIONAL qRr, and SECTION 14 calls it once more on the signal bar to // freeze the real plan. On the signal bar both calls pass entryPx = close, so // they agree by construction - that is why RISK is declared before SCORE. // SECTION 13 consumes these two plans rather than building a third. f_scPlan(int dir) => float aLo = dir > 0 ? zoneBotL : zoneBotS float aHi = dir > 0 ? zoneTopL : zoneTopS float inv = dir > 0 ? invAnchorL : invAnchorS f_riskPlan(dir, close, aLo, aHi, sweepExtL, sweepExtS, lastSwLo, lastSwHi, inv) scPlanL = f_scPlan(1) scPlanS = f_scPlan(-1) // Field access on an `na` object is a runtime error, so the guard is an `if` // block and not a ternary (a ternary evaluates both arms). float scQRrL = 0.0 float scQRrS = 0.0 if not na(scPlanL) scQRrL := f_scQ(scPlanL.qRr) if not na(scPlanS) scQRrS := f_scQ(scPlanS.qRr) // ----------------------------------------------------------- 12.10 MODIFIERS // Four signed scalars in [-1,+1], mirrored between directions by construction. // `dirOnly` drops the direction-neutral session term for the conflict test. f_scMods(int dir, float qRr, bool dirOnly) => float sHtf = f_scSigned(f_htfScalar(dir)) // 0 for BOTH sides when unknown float sVwap = -f_scQ((dir > 0 ? vwapExtAtr : -vwapExtAtr) / 2.0) // [-1,0] penalty only float sSess = f_scSigned(sessQual - 1.0) // [-1,0] penalty only float sRr = f_scSigned(2.0 * f_scQ(qRr) - 1.0) // qRr 0.5 is the neutral point float t = i_mHtf * sHtf + i_mVwap * sVwap + i_mRr * sRr dirOnly ? t : t + i_mSess * sSess // THE CLAMPING RULE. // bonus (pts >= 0): scaled by REMAINING HEADROOM, adj = b + pts*(100-b)/100. // Proof it cannot reach 100: adj = 100 - (100-b)*(1 - pts/100), which is // < 100 for every b < 100 while pts < 100. Only HTF and R:R can be positive, // so pts <= 30 at maxval, hence adj == 100 only when b == 100. A naive // min(100, b+pts) // would instead flatten an 88 and a 99 onto the same 100 and destroy // exactly the grading the rubric was built to create. // penalty (pts < 0): UNDAMPED, so a penalty can kill a setup outright. This // is a conservatism asymmetry applied identically to both directions, so it // introduces no directional bias. f_scApply(float base, float pts) => float b = math.max(0.0, math.min(100.0, nz(base, 0.0))) float m = nz(pts, 0.0) float adj = m >= 0.0 ? b + m * (100.0 - b) / 100.0 : b + m math.max(0.0, math.min(100.0, adj)) // ------------------------------------------------------ 12.11 CORE EVIDENCE // The three irreducible links of the chain. A setup that is only \"absorption\" // or only \"break\" is not this model's setup, however many context points it // accumulated on a wide-range bar. f_scCore(int dir) => float qA = f_scQ(dir > 0 ? qAbsorbL : qAbsorbS) float qD = f_scQ(dir > 0 ? qDispL : qDispS) float qB = f_scQ(dir > 0 ? qBosL : qBosS) i_coreMin <= 0.0 or (qA >= i_coreMin and qD >= i_coreMin and qB >= i_coreMin) // ---------------------------------------------------------- 12.12 THE SCORES scBaseL = f_scBase(1, scKAll, hasVol) scBaseS = f_scBase(-1, scKAll, hasVol) scModL = f_scMods(1, scQRrL, false) scModS = f_scMods(-1, scQRrS, false) scoreL = f_scApply(scBaseL, scModL) scoreS = f_scApply(scBaseS, scModS) coreOkL = f_scCore(1) coreOkS = f_scCore(-1) // Contention scores: same arithmetic, rvol row and session term removed. scConBaseL = f_scBase(1, scKCon, false) scConBaseS = f_scBase(-1, scKCon, false) scConScoreL = f_scApply(scConBaseL, f_scMods(1, scQRrL, true)) scConScoreS = f_scApply(scConBaseS, f_scMods(-1, scQRrS, true)) // ------------------------------------------------- 12.13 CONFLICT FILTER // The floor test is the WHOLE test. A second \"minimum decisive gap\" veto was // deleted as provably dead: if one side qualifies then its score >= i_minScore // > floor, so the floor test can only be false when the loser sits at or below // the floor, which already forces a gap of at least the band. Any gap threshold // at or under the band is therefore a strict subset of the floor test, and // every shipped preset had it strictly under. It was an input, a tooltip and a // documented veto that could never change an outcome. // // CORE EVIDENCE APPLIES TO CONTENDERS, NOT ONLY TO SIGNALS. Without that, a // side the system has already declared untradeable can still veto the side that // can fire - and it happens on exactly the bars this model is built for, since // a wide-range bar at a level hands BOTH directions the four cheap rows (level, // sweep, rvol, rejection) regardless of which way the absorption went. scConfFloor = math.max(0.30 * i_minScore, i_minScore - i_conflictBand) scQualL = scoreL >= i_minScore and coreOkL scQualS = scoreS >= i_minScore and coreOkS scContendL = scConScoreL > scConfFloor and coreOkL scContendS = scConScoreS > scConfFloor and coreOkS // The first term is unconditional: with the filter switched off, two sides that // both clear the gate must still not emit a long and a short on one bar. conflictNow = (scQualL and scQualS) or (i_conflictOn and scContendL and scContendS) // WORKED EXAMPLE THAT MUST HOLD - bull 82 / bear 79, modifiers netting to zero. // Defaults i_minScore = 75, band 15 -> floor = max(22.5, 60) = 60. // Both clear 75, so (scQualL and scQualS) is true -> CONFLICT -> NO TRADE, and it // stays NO TRADE even with the filter disabled. // At the stricter preset i_minScore = 85 neither side qualifies and the floor // test carries it: floor = max(25.5, 70) = 70. Strip the common-mode rvol row // (q 0.70 x weight 10 = 7.0 points) and renormalise over the remaining 90: // bull (82 - 7)/90*100 = 83.3 > 70 and bear (79 - 7)/90*100 = 80.0 > 70. // -> CONFLICT -> NO TRADE. The mandated example holds on both presets. // ========================= END SECTION 12 =================================== // ============================================================================ // SECTION 13 : FILTERS -- THE GATE LAYER // // One fixed, first-match-wins priority order, most-upstream cause first, so // the panel narrates the chain instead of reporting whichever gate happened to // be tested last. Every branch emits exactly one member of the SECTION 1 // NoTradeReason enum - the panel, the failure histogram and the alert payload // all speak that one vocabulary. // // THIS SECTION CONSUMES, IT DOES NOT RECOMPUTE: // chopScore / isChoppy .......... SECTION 3 // midRange / noMansLand / vwapS . SECTION 4 (via vwapExtAtr, SECTION 12) // levels / f_nearestLevel / f_atMeaningful .. SECTION 4 // zone liveness ................. SECTION 6 // sessSel / edgeOk / f_htfAllow / warmupOk / atrPrev / costRt .. SECTION 0 // the risk plan ................. SECTION 11 (through SECTION 12's call) // the score and conflictNow ..... SECTION 12 // Its own arithmetic is limited to the environment measures nothing else owns: // the volatility-spike proxy, the dead-tape floor, the participation regime, // the leg-extension measure and the cooldown / duplicate rules. // // DELETED, DELIBERATELY, AND NOT TO BE RESURRECTED: // * The atr / SMA(atr, 150) ceiling. ta.atr is an RMA: one bar must carry a // range of 17.8x ATR to drag a 14-period ATR to 2.2x its own 150-bar mean. // No such gold bar exists. It could only ever block the REGIME, 20-30 // minutes after the event, which is the failure mode it was chosen to // avoid, and it duplicated the bar-range spike test below. The series // atrRatio survives as a DIAGNOSTIC because SECTION 15 reads it. // * The \"too close to VWAP\" floor. The merged taxonomy has no code for it and // SECTION 4's midRange / noMansLand already covers the same failure (price // in the neutral middle with no liquidity to trade against). // // EVERY COUNTER IS PER DIRECTION, through the SECTION 2B arrays and f_slot(). // A global cooldown lets a stopped-out long suppress shorts for the next 100 // minutes at 5M, which deletes the failed-absorption reversal - the single // highest-value setup this model has, and the one that is most informative at // exactly the moment a global brake would be freshest. // // WRITE OWNERSHIP (fixed in SECTION 2B, restated here because it is easy to // get wrong): this section READS lastSigBar / lastLossBar / lossStreak (S15 // writes them) and dupLvl / dupBar (S14 writes them). It owns the RULES, not // the writes. The only state it writes is its own lastSpikeBar. // ============================================================================ // ---------------------------------------------------------------- 13.0 GROUPS G13E = \"13 - Filters: Environment\" G13N = \"13 - Filters: Volatility Spike Guard\" G13L = \"13 - Filters: Location\" G13C = \"13 - Filters: Cooldown & Duplicates\" // ------------------------------------------------------- 13.1 ENVIRONMENT i_minAtrUsd = input.float(0.80, \"Dead-tape floor: min ATR (USD/oz)\", minval = 0.0, maxval = 50.0, step = 0.05, group = G13E, tooltip = \"Absolute ATR floor in QUOTE CURRENCY, never in ticks - mintick is 0.01 on most XAUUSD feeds and 0.001 on others, so a tick-denominated floor mis-scales tenfold between brokers. Presets: 1M 0.35 / 5M 0.80 / 15M 1.50. At 0 only the cost floor below can bind.\", display = display.none) i_atrCostMult = input.float(2.0, \"Dead-tape floor: x round-turn cost\", minval = 0.0, maxval = 20.0, step = 0.25, group = G13E, tooltip = \"The second floor: ATR must be at least this multiple of costRt (spread + 2x slippage = 0.45 USD at defaults), so 2.0 demands ATR >= 0.90. Whichever floor is higher binds. Be honest about what this means: at 1M gold on a 0.25 spread it blocks most of the session, and that is the correct answer rather than a bug. Raise it to 3-4 to demand that the round turn stay under ~10% of a 1.2-ATR stop; 0 disables the cost floor and leaves the absolute one.\", display = display.none) i_minRvol = input.float(0.80, \"Min relative volume\", minval = 0.0, maxval = 5.0, step = 0.05, group = G13E, tooltip = \"Blocks when relative volume is under this. Absorption needs participation: a displacement bar on half-average volume is usually a liquidity void, not aggression being absorbed. BYPASSED ENTIRELY when the feed reports no usable volume - a volumeless gold feed must not become a 100% kill switch. 0 disables.\", display = display.none) i_volFastLen = input.int(20, \"Participation regime: fast length\", minval = 2, maxval = 200, group = G13E, tooltip = \"Numerator length of the participation regime, SMA(volume, fast) / SMA(volume, slow). This is NOT relative volume: rvol self-normalises and therefore cannot see a slow global collapse in participation, which is exactly what the rollover void and the Asian lunch are.\", display = display.none) i_volSlowLen = input.int(200, \"Participation regime: slow length\", minval = 10, maxval = 1000, group = G13E, tooltip = \"Denominator length of the participation regime. Longer = a longer memory of what normal participation looks like, and a slower forgiveness of a dead stretch.\", display = display.none) i_deadSessRatio = input.float(0.50, \"Min participation regime ratio\", minval = 0.0, maxval = 2.0, step = 0.05, group = G13E, tooltip = \"Blocks when fast/slow volume falls under this. 0.50 means the recent tape is running at half its own longer-run participation. At 0 the gate is off; above ~0.9 it blocks most of the day, because the ratio oscillates around 1.0 by construction.\", display = display.none) i_chopVotes = input.int(2, \"Chop votes required to block\", minval = 1, maxval = 3, group = G13E, tooltip = \"SECTION 3 owns the chop measurement and publishes chopScore in {0,1,2,3} - one vote each from the Kaufman efficiency ratio, ADX and swing overlap. This gate blocks at or above this many votes. 1 is strict (any single vote blocks), 3 demands unanimity. This section deliberately does not own an efficiency ratio of its own: two thresholds on one concept is how a file ends up disagreeing with itself.\", display = display.none) i_atrRegimeLen = input.int(150, \"ATR regime baseline (bars)\", minval = 20, maxval = 500, group = G13E, tooltip = \"Baseline length for the DIAGNOSTIC series atrRatio = ATR / SMA(ATR, N). It is reported, not gated on: an RMA-based ATR cannot move far enough in one bar for a ratio ceiling to catch an event, so the spike guard below does that job instead. SECTION 15 reads this series when bucketing failures by volatility regime.\", display = display.none) // -------------------------------------------------- 13.2 SPIKE GUARD INPUTS i_spikeRangeAtr = input.float(3.0, \"Spike: bar range (x prior ATR)\", minval = 1.0, maxval = 20.0, step = 0.1, group = G13N, tooltip = \"A single bar whose range exceeds this multiple of the PRIOR bar's ATR starts the blackout. The reference is deliberately lagged: measured against the current ATR, a spike bar inflates its own denominator and hides from the very test built to catch it. Low values block routine expansion; above ~6 nothing short of a limit move fires.\", display = display.none) i_spikeGapAtr = input.float(1.5, \"Spike: open gap (x prior ATR)\", minval = 0.1, maxval = 20.0, step = 0.1, group = G13N, tooltip = \"Blackout when the bar opens this far from the previous close - the Sunday reopen and headline-driven repricing, where the quote is wide and the first prints are not tradeable.\", display = display.none) i_spikeVelLen = input.int(4, \"Spike: velocity window (bars)\", minval = 1, maxval = 50, group = G13N, tooltip = \"Lookback for the velocity test. It catches the event signature no single bar reveals: a multi-bar rip where each individual bar looks ordinary. This replaces a separate same-direction 'staircase' detector, which measures the same event over the same window while additionally demanding identical bar signs.\", display = display.none) i_spikeVelAtr = input.float(3.5, \"Spike: velocity (x prior ATR)\", minval = 0.5, maxval = 30.0, step = 0.1, group = G13N, tooltip = \"Blackout when price travels this many prior-ATRs over the velocity window. Lower = more of the session blocked; measure the duty cycle on your own feed before trusting a number here.\", display = display.none) i_spikeHoldBars = input.int(6, \"Spike blackout length (bars)\", minval = 0, maxval = 200, group = G13N, tooltip = \"Bars of blackout AFTER a spike is detected. Gold's post-event volatility and spread widening last 15-45 minutes, far beyond the spike bar. The block is forward-only - it is written on the bar the spike is confirmed and applies from there, so it can never revise a past signal. 0 blocks the spike bar alone. Note this is a VOLATILITY PROXY: Pine cannot read an economic calendar, and a proxy reacts only AFTER the first violent bar.\", display = display.none) // ----------------------------------------------------------- 13.3 LOCATION i_legLen = input.int(30, \"Extension: leg lookback (bars)\", minval = 2, maxval = 500, group = G13L, tooltip = \"Window whose extreme defines the origin of the current leg. Presets ~ 40 / 30 / 20 for 1M / 5M / 15M, i.e. comparable clock windows.\", display = display.none) i_maxLegAtr = input.float(4.0, \"Extension: max leg travel (x ATR)\", minval = 0.5, maxval = 50.0, step = 0.1, group = G13L, tooltip = \"Blocks when price has already travelled this many ATRs from the leg origin in the trade's direction - the anti-chase gate, answering 'how much of this move have I already missed?'. An RSI overbought veto is NOT used here and is not equivalent: a true displacement leg, precisely the event this system trades, pins RSI above 80, so an RSI veto would reject the best setups and keep the weak ones. Low values reject every momentum entry.\", display = display.none) i_useSessOpenExt = input.bool(false, \"Extension: also measure from session open\", group = G13L, tooltip = \"Adds a second extension test against the open of the CURRENT active session (never the chart-day open, which on a gold CFD rolls at 17:00/18:00 New York and is 8-9 hours stale by the London open). Genuinely useful in the first ~90 minutes of London while VWAP is still noisy; decays into irrelevance by New York, which is why it is off by default.\", display = display.none) i_maxSessOpenAtr = input.float(6.0, \"Extension: max move from session open (x ATR)\", minval = 0.5, maxval = 60.0, step = 0.5, group = G13L, tooltip = \"Only used when the session-open test above is enabled. Scale it with how many ATRs a session spans on your timeframe: roughly 12 / 6 / 4 for 1M / 5M / 15M.\", display = display.none) i_vwapMaxAtr = input.float(2.5, \"Max distance from VWAP (x ATR)\", minval = 0.1, maxval = 30.0, step = 0.1, group = G13L, tooltip = \"Directional anti-chase ceiling: blocks a long this far ABOVE session VWAP and a short this far BELOW it. Being far below VWAP is no obstacle to a long, and that per-direction asymmetry is exactly what makes the gate symmetric overall. FAILS OPEN when no VWAP is available. Low values refuse every entry away from fair value.\", display = display.none) // ------------------------------------------------ 13.4 COOLDOWN / DUPLICATES i_cooldownBars = input.int(8, \"Cooldown after a signal (bars)\", minval = 0, maxval = 500, group = G13C, tooltip = \"PER DIRECTION. A long signal never suppresses a short. Presets ~ 15 / 8 / 5 bars for 1M / 5M / 15M. 0 disables.\", display = display.none) i_lossCooldownBars = input.int(20, \"Cooldown after a loss (bars)\", minval = 0, maxval = 1000, group = G13C, tooltip = \"PER DIRECTION, counted from the virtual trade SECTION 15 booked as a loss - not from broker fills, so the indicator and the strategy gate on identical state and therefore take identical trades. Presets ~ 45 / 20 / 12 bars. 0 disables.\", display = display.none) i_maxLossStreak = input.int(3, \"Halt a direction after N consecutive losses\", minval = 0, maxval = 20, group = G13C, tooltip = \"PER DIRECTION halt. The pause lasts this many loss-cooldowns and then expires on its own, so no counter needs resetting anywhere. 0 disables the halt entirely.\", display = display.none) i_dupBars = input.int(60, \"Duplicate memory (bars)\", minval = 0, maxval = 2000, group = G13C, tooltip = \"PER DIRECTION. How long a level stays 'already traded' for that direction. The memory keys on the level's IDENTITY (its birth bar), not on a float price, so a brand-new level that happens to form at the same price as a level traded an hour ago is not born suppressed - and on gold, where levels cluster on round numbers, identical prices are the normal case rather than an edge case. 0 disables.\", display = display.none) // ============================== 13.5 GLOBAL SERIES ========================== // Every ta.* call in this section sits here, at global scope, unconditional, on // its own line, and is referenced by name below. v6 evaluates and/or LAZILY, so // a ta.* call placed inside a condition would skip bars and silently corrupt // its own history. fltAtrRegime = ta.sma(atr, i_atrRegimeLen) fltVolFast = ta.sma(vol, i_volFastLen) fltVolSlow = ta.sma(vol, i_volSlowLen) fltLegLow = ta.lowest(low, i_legLen) fltLegHigh = ta.highest(high, i_legLen) // DIAGNOSTIC ONLY - exported for SECTION 15's regime buckets, never gated on. atrRatio = na(fltAtrRegime) or fltAtrRegime <= 0.0 ? 1.0 : atr / fltAtrRegime // --------------------------------------------- 13.6 VOLATILITY SPIKE PROXY // A volatility PROXY, never \"news detection\": Pine has no economic calendar. // Three detectors, because gold's event signature is not one-dimensional - a // CPI print is one enormous bar, a headline or a Sunday reopen is a gap, and an // NFP rip is often five bars of which none looks individually extreme. spikeRange = barRange > i_spikeRangeAtr * atrPrev spikeGap = math.abs(open - nz(close[1], open)) > i_spikeGapAtr * atrPrev spikeVel = math.abs(close - nz(close[i_spikeVelLen], close)) > i_spikeVelAtr * atrPrev spikeNow = spikeRange or spikeGap or spikeVel var int lastSpikeBar = na if confirmed and warmupOk and spikeNow lastSpikeBar := bar_index // Forward-only: written on the confirmed spike bar, applied from that bar on. blkNews = not na(lastSpikeBar) and (bar_index - lastSpikeBar) <= i_spikeHoldBars // ------------------------------------------------ 13.7 DEAD TAPE / CHOP // Two floors, whichever binds. The absolute floor says there is not enough // range to pay for a stop; the cost floor says the round turn is too large a // fraction of any move this tape can produce. Both are USD, never ticks. fltAtrFloor = math.max(i_minAtrUsd, i_atrCostMult * costRt) blkDeadTape = not na(atr) and atr < fltAtrFloor blkChop = chopScore >= i_chopVotes // ------------------------------------------------- 13.8 PARTICIPATION // ONE na policy, SECTION 0's: a hard volume gate is written `not hasVol or ...` // and BYPASSES when participation is unknown. na(rvol) is the same unknown // state as no feed at all and bypasses identically. Never 0 (which would make a // volumeless gold feed a permanent kill switch), never 1 (which would fabricate // average participation out of nothing). fltVolPass = not hasVol or na(rvol) or rvol >= i_minRvol volRegime = not hasVol or na(fltVolFast) or na(fltVolSlow) or fltVolSlow <= 0.0 ? na : fltVolFast / fltVolSlow fltRegPass = na(volRegime) or volRegime >= i_deadSessRatio blkLowVol = not fltVolPass or not fltRegPass // ------------------------------------------------ 13.9 LEVEL IDENTITY // Called once per direction at global scope. f_nearestLevel returns a tuple, so // it must be destructured; doing it here also keeps a single evaluation per // direction per bar. [fltLvlPxL, fltLvlDistL, fltLvlQualL, fltLvlIdxL] = f_nearestLevel(1) [fltLvlPxS, fltLvlDistS, fltLvlQualS, fltLvlIdxS] = f_nearestLevel(-1) fltAtLvlL = f_atMeaningful(1) fltAtLvlS = f_atMeaningful(-1) // THE DUPLICATE KEY, and the contract SECTION 14 must honour. // The key is the level's BIRTH BAR - a stable identity that survives a merge, // a re-price or a prune - and never the level's float price. // // CONTRACT FOR SECTION 14: on the bar it emits a signal for `dir`, it writes // array.set(dupLvl, f_slot(dir), f_lvlKey(dir)) // array.set(dupBar, f_slot(dir), bar_index) // and writes NOTHING on a rejected signal - a signal that was gated must not // poison the level for the good signal that follows it twenty minutes later. // // na key (no eligible level) -> the duplicate gate fails OPEN, which is correct: // with no level there is no identity to have already traded, and the NO // LIQUIDITY gate upstream has already rejected that case anyway. f_lvlKey(int dir) => int idx = dir > 0 ? fltLvlIdxL : fltLvlIdxS float k = na if not na(idx) and idx >= 0 and idx < array.size(levels) LiquidityLevel lv = array.get(levels, idx) k := float(lv.createdBar) k // ============================== 13.10 THE GATE ============================== // Direction-free blockers are computed above at global scope; only the // direction-dependent ones live here, and every one of them is a single // expression parameterised by dir rather than a mirrored copy. // // The thirteen filters of the brief map onto the chain as: // 1 volume -> LOW VOLUME (rvol + participation regime, one reason code) // 2 volatility spike -> HIGH VOLATILITY / SPIKE // 3 dead tape -> DEAD TAPE (LOW ATR) // 4 chop -> CHOPPY MARKET 5 RR -> POOR RR / STOP TOO WIDE (plan) // 6 mid-range -> MIDDLE OF RANGE 7 extension -> EXTENDED MOVE // 8 duplicate -> DUPLICATE SIGNAL 9 zone -> ZONE INVALIDATED // 10 session -> OUTSIDE SESSION + SESSION EDGE TRIM // 11 cooldown -> COOLDOWN / LOSS COOLDOWN / LOSS STREAK HALT // 12 HTF bias -> HTF BIAS OPPOSED 13 VWAP -> TOO FAR FROM VWAP // plus WARMING UP, DIRECTIONAL CONFLICT (SECTION 12) and LOW CONFIDENCE. // // The chain-completeness reasons (NO SWEEP ... NO RETEST) are NOT emitted here: // SECTION 14 owns the setup state and prepends them. This function answers only // \"is the environment fit to trade this direction right now\". f_gate(int dir, float score, RiskPlan pl) => int slot = f_slot(dir) // --- location -------------------------------------------------------- float den = math.max(aRef, tick) float extLeg = (dir > 0 ? close - fltLegLow : fltLegHigh - close) / den float extOpen = na(sessOpenPx) ? 0.0 : dir * (close - sessOpenPx) / den bool blkExt = extLeg > i_maxLegAtr or (i_useSessOpenExt and extOpen > i_maxSessOpenAtr) // Signed VWAP extension in the trade's own direction; 0.0 when no VWAP, so // the ceiling fails OPEN rather than blocking a whole volumeless feed. bool blkVwapFar = (dir > 0 ? vwapExtAtr : -vwapExtAtr) > i_vwapMaxAtr bool atLvl = dir > 0 ? fltAtLvlL : fltAtLvlS // SECTION 4 names noMansLand as THE no-liquidity condition (\"no side has a // level worth reacting to\") and it belongs on THIS branch, not folded into // MIDDLE OF RANGE. `na(nearest eligible level)` on its own can only be true // when the level map holds nothing at all for this side, which after warmup // never happens - PDL, PWL, the session low and every confirmed swing low // are all support-side levels - so NO LIQUIDITY would be a reason code that // can never be emitted. Both branches block either way; this decides only // which cause the panel narrates and which bucket SECTION 15 counts. // noMansLand implies `not atLvl` on both sides, so the split is exact. bool noLvl = noMansLand or na(dir > 0 ? fltLvlPxL : fltLvlPxS) bool blkMid = midRange and not atLvl bool blkZone = not (dir > 0 ? zoneAliveL : zoneAliveS) bool blkHtf = not f_htfAllow(dir) // SECTION 12's anti-mediocrity floor is part of the CONFIDENCE verdict, not // a cause of its own. Without it on the chain, a setup that fails i_coreMin // is refused by SECTION 14 (`entryRawL and coreOkL and gateL == ok`) while // this function still returns OK: the panel prints \"all gates pass\" on a bar // that cannot fire, and SECTION 15 - which bumps the histogram only when the // gate is NOT ok - never records the rejection at all. bool coreOk = dir > 0 ? coreOkL : coreOkS // --- the plan: consumed, never rebuilt ------------------------------- // Field access on an na object is a runtime error, so this is an `if` // block and not a ternary (a ternary evaluates both arms). bool planBad = true NoTradeReason planWhy = NoTradeReason.poorRr if not na(pl) planBad := not pl.ok if not pl.ok and pl.why != NoTradeReason.ok planWhy := pl.why // --- cooldown / dedupe, ALL per direction ---------------------------- int lsb = array.get(lastSigBar, slot) int llb = array.get(lastLossBar, slot) int strk = array.get(lossStreak, slot) // ta.barssince() returns na before its condition has ever been true and // that na is not usable as a length, so the age is always bar_index minus // an explicit remembered bar, with a sentinel for \"never happened\". int sinceSig = na(lsb) ? 999999 : bar_index - lsb int sinceLoss = na(llb) ? 999999 : bar_index - llb bool blkCool = i_cooldownBars > 0 and sinceSig < i_cooldownBars bool blkLossCool = i_lossCooldownBars > 0 and sinceLoss < i_lossCooldownBars // The halt expires by arithmetic - streak * cooldown bars after the last // loss - so nothing has to reach into SECTION 15's counters to clear it. bool blkStreak = i_maxLossStreak > 0 and strk >= i_maxLossStreak and sinceLoss < i_lossCooldownBars * i_maxLossStreak float key = f_lvlKey(dir) float memKey = array.get(dupLvl, slot) int memBar = array.get(dupBar, slot) bool blkDup = i_dupBars > 0 and not na(key) and not na(memKey) and not na(memBar) and key == memKey and (bar_index - memBar) <= i_dupBars // --- first match wins, most upstream cause first ---------------------- // TWO ordering choices worth stating, because they decide what the panel // NAMES rather than what it decides (every gate must pass either way): // * The plan sits ABOVE the behavioural gates. Transaction cost is the // constraint that actually binds on low-timeframe gold; buried under the // cooldowns it would report COOLDOWN while the real reason a setup is // untradeable is that it can never pay for its own spread. // * The score is LAST, because it is an aggregate that is only meaningful // once the setup is otherwise valid - and LOW CONFIDENCE is the least // actionable thing this panel can say. NoTradeReason r = NoTradeReason.ok if not warmupOk r := NoTradeReason.warmup else if not sessSel r := NoTradeReason.outsideSess else if not edgeOk r := NoTradeReason.sessEdge else if blkNews r := NoTradeReason.newsSpike else if blkDeadTape r := NoTradeReason.lowAtr else if blkChop r := NoTradeReason.choppy else if blkLowVol r := NoTradeReason.lowVolume else if blkHtf r := NoTradeReason.htfBlock else if conflictNow r := NoTradeReason.conflict else if blkZone r := NoTradeReason.zoneDead else if noLvl r := NoTradeReason.noLiquidity else if blkMid r := NoTradeReason.midRange else if blkExt r := NoTradeReason.extended else if blkVwapFar r := NoTradeReason.vwapFar else if planBad r := planWhy else if blkStreak r := NoTradeReason.lossStreak else if blkLossCool r := NoTradeReason.lossCooldown else if blkCool r := NoTradeReason.cooldown else if blkDup r := NoTradeReason.duplicate else if na(score) or score < i_minScore or not coreOk r := NoTradeReason.lowScore r // Evaluated every bar for both directions, so the panel can narrate a rejection // without a signal having to exist. SECTION 14 calls f_gate once more with the // frozen plan on the bar it arms a setup; each written call site keeps its own // independent local scope, which is what makes that safe. gateL = f_gate(1, scoreL, scPlanL) gateS = f_gate(-1, scoreS, scPlanS) // ========================= END SECTION 13 =================================== // ============================================================================ // SECTION 14 : SETUP STATE MACHINE -- THE SPINE // // Every detector above this line answers ONE question about the current bar. // This section is the only thing in the file that remembers a TRADE IDEA // across bars: it births a Setup when SECTION 5 reports a sweep, walks it // forward through the SetupState ladder as each later detector confirms, and // emits exactly one signal per direction per bar when the chain completes. // // THE TWO INVARIANTS THAT MAKE THIS NON-REPAINTING // (1) RANK STRICTLY INCREASES. f_smEnter() refuses any transition whose // target rank is not strictly greater than the current rank. There is // no backward edge and no self-edge, so a state, once stamped with its // stBar, can never be revisited, re-stamped or downgraded. A label // anchored to a historical transition cannot move because the // transition itself cannot be un-made. // (2) `dead` IS ABSORBING. f_smStep() only looks at ranks 0..6 (idle..armed) // and `dead` is rank 8, so nothing can leave it. // // The ARCHITECT RELAXED the draft's stricter \"advancement is always rank+1\" // rule to plain \"rank strictly increases\", for one concrete reason: SECTION 10 // offers a Confirmation entry mode that has no retest leg, and under rank+1 // the bos -> armed edge it needs was ILLEGAL. Mode 1 was unreachable code. // Strict monotonicity preserves the whole non-repaint argument and legalises // exactly the skips the entry modes require. Both legal skip edges are // bos -> armed and bos -> retest -> armed, and which one fires is decided by // SECTION 10's trigger, not by a mode string duplicated here. // // THE ARMED STATE HAS A REAL ONE-BAR DEADLINE. In the draft the step window // stopped at `retest`, so `armed` was never evaluated and its documented // timeout was dead code: a setup that armed but was not the one promoted sat // in `armed` forever, was never invalidated, never timed out, never evicted // (the eviction filter protects everything above rank 0) and was still counted // as live - so the direction ran out of slots and silently went dark for the // rest of the chart. Here `armed` is inside the step window, the deadline is // enforced, and step 14b additionally reaps every armed setup that was not // promoted on the bar it armed. No setup can survive its own arming bar // unpromoted. // // ONE ARRAY, NOT TWO. The per-direction cap is the invariant that matters and // it is enforced on a dir-filtered LIVE count; a second array would only give // SECTION 16 two things to draw and two places to get the index wrong. // // TWO-PHASE DEATH, WITH NO EXCEPTIONS. kill() marks dead, stamps the reason // and stamps stBar - it never frees a handle. The NEXT bar's step 1 calls // .wipe() and removes the element. Eviction goes through the SAME path (the // draft freed and removed an evicted victim inline, which is a second death // path and the one place a handle can be freed twice or a death can vanish // before SECTION 15 sees it). Therefore: exactly one call site for .wipe(), // exactly one code path, every death visible to SECTION 15 on its death bar. // // WHAT THIS SECTION DOES NOT DO, on purpose: // * NO detection. It never asks whether a sweep happened; it reads sweepSigL. // * NO risk maths. f_riskPlan() belongs to SECTION 11 and is called here // EXACTLY ONCE per setup, on the bar it arms, with entryPx = close. // * NO gating. gateL / gateS are SECTION 13's first-match-wins verdict and // this section treats them as the single authority. // * NO zone lifecycle. SECTION 6 owns array<IcebergZone>; a Setup carries // the zone ID as identity plus a frozen snapshot of the bounds so its // drawing and its stop cannot move after the fact. // ============================================================================ // ---------------------------------------------------------------- S14 GROUPS G14L = \"14 - Setup Lifecycle\" G14T = \"14 - Setup Lifecycle Timeouts\" // ---------------------------------------------------------------- S14 INPUTS i_maxSetupsPerDir = input.int(2, \"Max live setups per direction\", minval = 1, maxval = 4, group = G14L, tooltip = \"Hard cap on concurrent UNFINISHED setups per direction. At 1 the engine commits to the first candidate and ignores a better one that forms behind it; at 4 four half-formed candidates compete for the same confirmations and the chart fills with boxes that never arm. Open trades do NOT consume a slot.\", display = display.none) i_maxHopsPerBar = input.int(2, \"Max state hops per bar\", minval = 1, maxval = 3, group = G14L, tooltip = \"How many forward states one setup may advance inside a single confirmed bar. 1 is strictest - one state per candle - and will miss the single decisive candle that IS both the sweep and the absorption, which is how a real gold trap prints. At 3 a very clean candle can carry a setup from birth to armed in one bar; nothing repaints, but the six confirmations are then six facts about one candle rather than six about six.\", display = display.none) i_conflictMode = input.string(\"Best score wins\", \"Long vs short on one bar\", options = [\"Best score wins\", \"Kill both\"], group = G14L, tooltip = \"What to do when a long and a short arm on the SAME bar. An EXACT score tie always resolves to NO TRADE under either setting: equal scores mean the model has no opinion. 'Allow both' is deliberately not offered - a TradingView strategy holds one net position, so the second entry would reverse the first rather than hedge it, and the indicator would then disagree with its own strategy twin.\", display = display.none) i_killOnSessionEnd = input.bool(true, \"Kill everything at the day rollover\", group = G14L, tooltip = \"Gold's structure does not survive the settlement gap and the thin rollover hour. ON discards every unfinished setup AND flattens every open idea at the new trading day (the day boundary is the one set by the timezone input in SECTION 0). OFF carries swept levels and absorption zones across the gap, which is how a setup ends up anchored to a price that no longer exists.\", display = display.none) i_barsToAbsorb = input.int(4, \"TRAP: bars from sweep to rejection\", minval = 1, maxval = 50, group = G14T, tooltip = \"Deadline on the `idle` and `absorbing` states. If absorption has not shown itself this fast, nothing was being absorbed - the sweep was just a move. Too low and every setup dies in the trap phase; too high and the engine holds stale ideas through a trend leg that already invalidated them.\", display = display.none) i_barsToBreak = input.int(8, \"BREAK: bars from rejection to BOS\", minval = 1, maxval = 100, group = G14T, tooltip = \"Deadline on `rejected` and `displaced`. Real absorption is followed by displacement quickly; a slow grind away from the zone is drift, not a reversal, and this is what expires it.\", display = display.none) i_barsToRetest = input.int(15, \"ENTRY: bars from BOS to armed\", minval = 1, maxval = 200, group = G14T, tooltip = \"Deadline on `bos` and `retest` - the most generous window, because the pullback is the part that legitimately takes time. Set it very high and the engine will chase a displacement that has already decayed; set it very low and only V-shaped retests ever arm.\", display = display.none) i_barsInTrade = input.int(60, \"TRADE: max bars in trade (time stop)\", minval = 5, maxval = 500, group = G14T, tooltip = \"THE time stop, and the only one in the file - SECTION 15's virtual ledger reads this same input so the setup and its trade record can never expire on different bars. An idea that has neither reached target nor been stopped in this many bars has lost its edge and is booked flat at the close.\", display = display.none) i_invalidAtrMult = input.float(0.35, \"Hard-invalidation buffer (x ATR)\", minval = 0.0, maxval = 2.0, step = 0.05, group = G14L, tooltip = \"Passed to f_tol(), so the buffer is this many ATR but never thinner than one spread. A CLOSE this far the wrong side of the sweep extreme, the zone or the displacement origin kills the setup. At 0 the buffer collapses to one spread and normal quote breathing will kill valid setups; above ~1.0 nothing is ever invalidated and every setup dies of timeout instead, which throws away the most informative failure signal there is.\", display = display.none) // ---------------------------------------------------------------------------- // 14.1 THE INTRABAR PATH POLICY - declared here, obeyed everywhere // // Bar-resolution data genuinely cannot tell whether the stop or the target was // touched first inside a bar that contains both. This file ALWAYS assumes the // STOP FILLED FIRST. That is deliberately pessimistic, it can only make the // reported result worse than reality, and it is what keeps this ledger honest // next to TradingView's broker emulator, which guesses the path from the bar's // open and will therefore look better than this on exactly the bars that // matter most. SECTION 15 reuses these two primitives rather than restating // the rule, so there is one definition of \"touched\" in the file. // ---------------------------------------------------------------------------- f_pathStop(int dir, float px) => na(px) ? false : dir > 0 ? low <= px : high >= px f_pathTgt (int dir, float px) => na(px) ? false : dir > 0 ? high >= px : low <= px // ---------------------------------------------------------------------------- // 14.2 RANK AND DEADLINE // f_smRankOf() is the SAME ladder as Setup.rank() in SECTION 2, taking a bare // SetupState instead of a Setup, because f_smEnter() has to rank a state it // has not committed yet. If one is ever edited the other must follow. // Deadlines are PER STATE, measured from stBar. The frozen Setup type carries // stBar and no phaseBar, so a per-PHASE clock is not expressible; per state is // marginally more generous (a rejected -> displaced hop restarts the BREAK // clock) and is stated here rather than quietly assumed. // ---------------------------------------------------------------------------- f_smRankOf(SetupState st) => switch st SetupState.idle => 0 SetupState.absorbing => 1 SetupState.rejected => 2 SetupState.displaced => 3 SetupState.bos => 4 SetupState.retest => 5 SetupState.armed => 6 SetupState.active => 7 => 8 f_smDeadline(SetupState st) => switch st SetupState.idle => i_barsToAbsorb SetupState.absorbing => i_barsToAbsorb SetupState.rejected => i_barsToBreak SetupState.displaced => i_barsToBreak SetupState.bos => i_barsToRetest SetupState.retest => i_barsToRetest SetupState.armed => 1 SetupState.active => i_barsInTrade => 1000000 // ---------------------------------------------------------------------------- // 14.3 THE COLLECTION + THE ARM TRIGGERS // ---------------------------------------------------------------------------- var array<Setup> setups = array.new<Setup>() // Hoisted to global scope and evaluated on EVERY bar, unconditionally, so that // nothing inside the state machine's lazily-evaluated conditions can skip them. // gateL / gateS are SECTION 13's first-match-wins verdict and carry the score // test, the R:R test, the cooldowns and the duplicate test, so they are the one // authority here; coreOk is SECTION 12's \"the evidence chain actually closed\" // flag and is required as well, because a contender that cannot show core // evidence must not be allowed to arm and then veto its mirror. s14ArmL = entryRawL and coreOkL and gateL == NoTradeReason.ok s14ArmS = entryRawS and coreOkS and gateS == NoTradeReason.ok // ---------------------------------------------------------------------------- // 14.4 LIFECYCLE PRIMITIVES // kill() NEVER frees a drawing. There is exactly one .wipe() call site in this // file and it is in the garbage collector at step 1. // ---------------------------------------------------------------------------- f_smKill(Setup s, NoTradeReason why) => s.st := SetupState.dead s.stBar := bar_index s.death := why true f_smEnter(Setup s, SetupState nxt) => // INVARIANT (1), enforced in code rather than asserted in prose. bool ok = f_smRankOf(nxt) > s.rank() if ok s.st := nxt s.stBar := bar_index ok f_smLive(int dir) => // An ACTIVE setup is a position, not a candidate, so it does not consume a // candidate slot. Counting it would let one open trade block every new // birth in its direction for i_barsInTrade bars - which on 15M is the best // part of a session - for no reason connected to the quality of the idea. int c = 0 int n = setups.size() if n > 0 for i = 0 to n - 1 Setup s = setups.get(i) int r = s.rank() if s.dir == dir and r <= 6 c += 1 c f_smHasActive(int dir) => bool found = false int n = setups.size() if n > 0 for i = 0 to n - 1 Setup s = setups.get(i) if s.dir == dir and s.st == SetupState.active found := true found // Weakest EVICTABLE peer: rank 0 (`idle`) only, oldest first. THE eviction // policy in one line - a newborn may only ever displace another newborn. // Anything that has reached `absorbing` has shown evidence and is protected. f_smWeakestIdx(int dir) => int wIdx = -1 int wBar = 2147483647 int n = setups.size() if n > 0 for i = 0 to n - 1 Setup s = setups.get(i) if s.dir == dir and s.st == SetupState.idle and s.bornBar < wBar wIdx := i wBar := s.bornBar wIdx f_smMakeRoom(int dir) => bool ok = f_smLive(dir) < i_maxSetupsPerDir if not ok int wi = f_smWeakestIdx(dir) if wi >= 0 f_smKill(setups.get(wi), NoTradeReason.dEvicted) ok := true ok // ---------------------------------------------------------------------------- // 14.5 HARD INVALIDATION - returns the reason that ACTUALLY fired // Returning a NoTradeReason rather than a bool is what lets SECTION 15's // histogram say WHICH thesis broke instead of which stage it broke in. All // three tests use CLOSE, never a wick: a wick through the level is the trap // this system trades, so killing on it would delete the setup at the exact // moment it becomes valid. Every test is a true mirror - the only difference // between long and short is the sign of dir. // ---------------------------------------------------------------------------- f_smInvalid(Setup s) => bool up = s.dir > 0 float buf = f_tol(i_invalidAtrMult) int r = s.rank() NoTradeReason why = NoTradeReason.ok // (1) The sweep was genuine continuation, not a trap: there was nothing // resting there to absorb. if not na(s.swpExt) bool gone = up ? close < s.swpExt - buf : close > s.swpExt + buf if gone why := NoTradeReason.dFalseSweep // (2) Price closed back through the absorption zone. Only meaningful once // the rejection has printed - before that the zone is still forming. if why == NoTradeReason.ok and r >= 2 and not na(s.zoneTop) and not na(s.zoneBot) bool lost = up ? close < s.zoneBot - buf : close > s.zoneTop + buf if lost why := NoTradeReason.dZoneBroken // (3) SECTION 6 itself declared the zone dead. Only applied when the zone // the setup was born on is still the CURRENT one for its side - a // superseded zone is not an invalidated one. if why == NoTradeReason.ok and r >= 2 and s.zoneId != 0 int zid = up ? zoneIdL : zoneIdS bool alive = up ? zoneAliveL : zoneAliveS if s.zoneId == zid and not alive why := NoTradeReason.dZoneBroken // (4) The displacement leg has been fully retraced after the break, so the // break was a fake. dispOrg is the leg's near edge (SECTION 8's // canonical scalar), which is why this is a real test and not a // restatement of (2). if why == NoTradeReason.ok and r >= 4 and not na(s.dispOrg) bool faded = up ? close < s.dispOrg - buf : close > s.dispOrg + buf if faded why := NoTradeReason.dBosFail why // ---------------------------------------------------------------------------- // 14.6 GEOMETRY FREEZE // Returns NoTradeReason.ok to accept the transition, or the reason to kill on. // Everything a Setup will ever be drawn or traded from is copied into the // object HERE, at the instant the detector that owns it says so, and is never // recomputed. That is the whole of the \"historical labels do not move\" claim. // ---------------------------------------------------------------------------- f_smCapture(Setup s, SetupState nxt) => bool up = s.dir > 0 NoTradeReason why = NoTradeReason.ok switch nxt SetupState.absorbing => s.qAbsorb := up ? qAbsorbL : qAbsorbS s.qRvol := up ? qRvolL : qRvolS s.zoneId := up ? zoneIdL : zoneIdS s.zoneTop := up ? zoneTopL : zoneTopS s.zoneBot := up ? zoneBotL : zoneBotS // Never freeze an na or inverted zone: it would produce a stop on // the wrong side of entry and a plausible-looking plan with // nonsensical geometry that only ever exits on the time stop. bool bad = na(s.zoneTop) or na(s.zoneBot) or s.zoneTop <= s.zoneBot if bad why := NoTradeReason.zoneDead why SetupState.rejected => s.qReject := up ? qRejectL : qRejectS why SetupState.displaced => s.qDisp := up ? qDispL : qDispS s.dispOrg := up ? dispOrgL : dispOrgS s.dispFar := up ? dispFarL : dispFarS if na(s.dispOrg) why := NoTradeReason.noDisplace why SetupState.bos => s.qBos := up ? qBosL : qBosS s.bosLvl := up ? bosLvlL : bosLvlS s.retestLv := up ? retestLvlL : retestLvlS // No \"is the level already broken\" re-test here: SECTION 9 owns // break detection and bosSigL is by construction the bar the close // took the level out. Re-deriving it here is how displaced -> bos // turns into a rubber stamp that counts the displacement leg as // its own confirmation. if na(s.bosLvl) why := NoTradeReason.noBos why SetupState.armed => s.score := up ? scoreL : scoreS s.qRetest := up ? qRetestL : qRetestS // --------------------------------------------------------------- // THE ONE AND ONLY f_riskPlan() CALL FOR THIS SETUP. // entryPx is the CLOSE of this confirmed bar - the bar SECTION 10 // emitted the trigger on - not a price frozen at the BOS up to // i_barsToRetest bars ago. The plan is then frozen into the object // and every later read (stop, targets, R:R, the alert payload, the // strategy's order) is that same plan. SECTION 12 called // f_riskPlan() earlier on this same bar with entryPx = close for a // provisional qRr, so the two agree by construction. // --------------------------------------------------------------- float swpLo = up ? s.swpExt : na float swpHi = up ? na : s.swpExt RiskPlan pl = f_riskPlan(s.dir, close, s.zoneBot, s.zoneTop, swpLo, swpHi, lastSwLo, lastSwHi, up ? invAnchorL : invAnchorS) s.plan := pl if na(pl) why := NoTradeReason.poorRr else if not pl.ok why := pl.why == NoTradeReason.ok ? NoTradeReason.poorRr : pl.why why => why // ---------------------------------------------------------------------------- // 14.7 THE TRANSITION SWITCH // Pure: no side effects, no ta.* calls. Every detector was precomputed at // global scope above, so v6's lazy and/or cannot skip one and desynchronise // its own history. Two edges leave `bos` - straight to `armed` when SECTION 10 // triggers (Confirmation mode, and also a Retest-mode trigger that lands on // the touch bar itself) and to `retest` when price merely reaches the frozen // retest level. Both increase rank, so both are legal. // ---------------------------------------------------------------------------- f_smRetestTouch(Setup s) => // f_tol(0.05) and not an input: this edge is DESCRIPTIVE - what arms a // setup is SECTION 10's trigger, never this touch - so a second tolerance // knob here would only be a way to disagree with SECTION 10. float t = f_tol(0.05) na(s.retestLv) ? false : s.dir > 0 ? low <= s.retestLv + t : high >= s.retestLv - t f_smNext(Setup s) => bool up = s.dir > 0 bool arm = up ? s14ArmL : s14ArmS // Hoisted out of the switch arm: a multi-line ternary inside a switch arm is // legal but unreadable, and f_smRetestTouch() is pure so evaluating it for // every state costs nothing and cannot desynchronise anything. SetupState fromBos = arm ? SetupState.armed : f_smRetestTouch(s) ? SetupState.retest : s.st switch s.st SetupState.idle => (up ? absSigL : absSigS) ? SetupState.absorbing : s.st SetupState.absorbing => (up ? rejSigL : rejSigS) ? SetupState.rejected : s.st SetupState.rejected => (up ? dispSigL : dispSigS) ? SetupState.displaced : s.st SetupState.displaced => (up ? bosSigL : bosSigS) ? SetupState.bos : s.st SetupState.bos => fromBos SetupState.retest => arm ? SetupState.armed : s.st => s.st // One transition attempt. PRIORITY IS LOAD-BEARING: invalidation outranks // timeout outranks advancement, so a setup that is both stale and broken always // records the more informative reason. f_smStep(Setup s) => bool moved = false int r = s.rank() if r <= 6 NoTradeReason inv = f_smInvalid(s) if inv != NoTradeReason.ok f_smKill(s, inv) moved := true else if bar_index - s.stBar >= f_smDeadline(s.st) f_smKill(s, NoTradeReason.dTimeout) moved := true else SetupState nxt = f_smNext(s) if nxt != s.st NoTradeReason why = f_smCapture(s, nxt) if why == NoTradeReason.ok f_smEnter(s, nxt) else f_smKill(s, why) moved := true moved f_smAdvance(Setup s) => int hops = 0 bool go = true while go and hops < i_maxHopsPerBar go := f_smStep(s) hops += 1 hops // ---------------------------------------------------------------------------- // 14.8 COLLECTION PASSES // Every loop freezes its bound in a local first. v6 re-evaluates a for header's // `to` expression on every iteration, so `for i = 0 to setups.size() - 1` while // pushing or removing inside the body silently changes the iteration count. // The GC iterates DOWNWARD so a removal never disturbs an index still to be // visited, guarded by `if n > 0` because `for i = -1 to 0` on an empty array // counts UP and then indexes -1, which v6 reads as \"last element\". // ---------------------------------------------------------------------------- f_smGc() => int n = setups.size() if n > 0 for i = n - 1 to 0 Setup s = setups.get(i) // stBar < bar_index: a setup killed on THIS bar stays one more bar // so SECTION 15 can record its death and SECTION 16 can grey it out. if s.st == SetupState.dead and s.stBar < bar_index s.wipe() setups.remove(i) setups.size() f_smFlush(NoTradeReason why) => int n = setups.size() if n > 0 for i = 0 to n - 1 Setup s = setups.get(i) if s.st != SetupState.dead f_smKill(s, why) true f_smPass() => int n = setups.size() // frozen: nothing is added or removed in here if n > 0 for i = 0 to n - 1 f_smAdvance(setups.get(i)) n // Best armed setup in a direction, by the score FROZEN on this setup at its own // arm capture. Ties on score break on the older setup, which is deterministic // and independent of array order. f_smBestArmed(int dir) => int idx = -1 float best = -1.0 int bBar = 2147483647 int n = setups.size() if n > 0 for i = 0 to n - 1 Setup s = setups.get(i) if s.dir == dir and s.st == SetupState.armed float sc = nz(s.score, -1.0) if sc > best or (sc == best and s.bornBar < bBar) best := sc bBar := s.bornBar idx := i idx // No setup may survive the bar it armed on. The one promoted at step 14 is // already `active` by the time this runs, so this cannot touch it - which is // why the reaper needs no \"keep this index\" argument and cannot get it wrong. f_smReapArmed(int dir, NoTradeReason why) => int n = setups.size() if n > 0 for i = 0 to n - 1 Setup s = setups.get(i) if s.dir == dir and s.st == SetupState.armed f_smKill(s, why) true // ---------------------------------------------------------------------------- // 14.9 EXPORTED SIGNAL SURFACE // Recomputed from false / -1 every bar. sigIdxL/S index into `setups` and are // valid only on the bar the signal fires; the GC shifts indices on the next // bar, which is why nothing may cache them. // ---------------------------------------------------------------------------- longSignal = false shortSignal = false sigIdxL = -1 sigIdxS = -1 // ============================================================================ // THE CANONICAL PER-BAR ORDER. This ordering IS the non-repainting argument, // so it is written out as a list rather than left to be inferred from the // file's line order. // // 1. GARBAGE COLLECT free the handles of everything that died on a PREVIOUS // bar and remove it. The only .wipe() call site. // 1b SESSION FLUSH day rollover kills every non-dead setup. // 2. LEVELS SECTION 4 - liquidity map, VWAP, day/week extremes // 3. PRESSURE SECTION 0 - rvol, delta proxy, buy/sell pressure // 4. SWEEP SECTION 5 - sweepSigL/S, extremes, quality // 5. ABSORPTION SECTION 6 - zones, absSigL/S // 6. REJECTION SECTION 7 - rejSigL/S // 7. DISPLACEMENT SECTION 8 - dispSigL/S, origin, FVG // 8. STRUCTURE / BOS SECTIONS 3 + 9 - swings, bosSigL/S, CHoCH // 9. RETEST SECTION 10 - entryRawL/S, retest level, inv anchor // 10. RISK + FILTERS SECTIONS 11 + 13 - f_riskPlan(), gateL/S // 11. SCORING SECTION 12 - scoreL/S, coreOkL/S, conflictNow // Steps 2-11 are PURE MEASUREMENT. None of them reads setup state, and // every ta.* call in the file lives in them, unconditionally, at global // scope. That is what makes step 12 free to be as branchy as it likes. // 12. STATE MACHINE 12a births, then 12b advance. The ONLY writer of // setup state in the entire file. // 13. CONFLICT best armed long vs best armed short. LOSERS DIE HERE, // strictly before anything is emitted. // 14. SIGNAL promote the survivors to `active` and publish. // 14b REAP every armed setup not promoted this bar dies now. // 15. MANAGEMENT stop / target / time stop on `active` setups, never on // the bar that set them active. // 16. DRAW SECTION 16, display only, outside this gate, and it // never creates, advances, kills or frees anything. // ============================================================================ if confirmed and warmupOk // ---- 1. GARBAGE COLLECT ------------------------------------------------- f_smGc() // ---- 1b. SESSION FLUSH -------------------------------------------------- if i_killOnSessionEnd and newDay f_smFlush(NoTradeReason.dSessionEnd) // ---- 12a. BIRTHS -------------------------------------------------------- // setupSeq is incremented HERE and not inside a helper: a Pine function may // not reassign a global, and a one-element array counter would be a second // id source to get out of step with SECTION 2B's. if sweepSigL if f_smMakeRoom(1) setupSeq := setupSeq + 1 setups.push(Setup.new(id = setupSeq, dir = 1, st = SetupState.idle, bornBar = bar_index, stBar = bar_index, swpExt = sweepExtL, qSweep = qSweepL, qLevel = qLevelL)) if sweepSigS if f_smMakeRoom(-1) setupSeq := setupSeq + 1 setups.push(Setup.new(id = setupSeq, dir = -1, st = SetupState.idle, bornBar = bar_index, stBar = bar_index, swpExt = sweepExtS, qSweep = qSweepS, qLevel = qLevelS)) // ---- 12b. ADVANCE ------------------------------------------------------- f_smPass() // ---- 13. CONFLICT ------------------------------------------------------- int iL = f_smBestArmed(1) int iS = f_smBestArmed(-1) if iL >= 0 and iS >= 0 Setup sl = setups.get(iL) Setup ss = setups.get(iS) float cL = nz(sl.score, -1.0) float cS = nz(ss.score, -1.0) // An exact tie means the model has no opinion. NO TRADE, under EVERY // policy - the draft buried this inside one branch, so the promise the // tooltip makes was false for the other. bool tie = cL == cS if tie or i_conflictMode == \"Kill both\" f_smKill(sl, NoTradeReason.dConflict) f_smKill(ss, NoTradeReason.dConflict) iL := -1 iS := -1 else if cL > cS f_smKill(ss, NoTradeReason.dConflict) iS := -1 else f_smKill(sl, NoTradeReason.dConflict) iL := -1 // ---- 14. SIGNAL --------------------------------------------------------- // One position per direction. A second entry while one is still open is // refused here rather than left to SECTION 13, which cannot see this array. if iL >= 0 if f_smHasActive(1) f_smKill(setups.get(iL), NoTradeReason.tradeOpen) else Setup s = setups.get(iL) f_smEnter(s, SetupState.active) longSignal := true sigIdxL := iL sigPlanL := s.plan sigScoreL := s.score // Duplicate memory for SECTION 13. THE KEY MUST BE THE SAME // QUANTITY SECTION 13 COMPARES IT WITH, and that is f_lvlKey(): // the eligible level's createdBar, NOT a price. Writing the frozen // sweep extreme here made `key == memKey` compare a bar index // against a gold price, so DUPLICATE SIGNAL could never fire and // the dedupe filter was dead. SECTION 13 states the required write // verbatim in its own banner; this is that write. array.set(dupLvl, f_slot(1), f_lvlKey(1)) array.set(dupBar, f_slot(1), bar_index) if iS >= 0 if f_smHasActive(-1) f_smKill(setups.get(iS), NoTradeReason.tradeOpen) else Setup s2 = setups.get(iS) f_smEnter(s2, SetupState.active) shortSignal := true sigIdxS := iS sigPlanS := s2.plan sigScoreS := s2.score array.set(dupLvl, f_slot(-1), f_lvlKey(-1)) array.set(dupBar, f_slot(-1), bar_index) // ---- 14b. REAP ---------------------------------------------------------- // Anything still `armed` lost to a same-direction peer. dEvicted, not // dConflict: the cross-direction losers already died at step 13 and the two // causes must stay distinguishable in SECTION 15's histogram. f_smReapArmed(1, NoTradeReason.dEvicted) f_smReapArmed(-1, NoTradeReason.dEvicted) // ---- 15. MANAGEMENT ----------------------------------------------------- // `bar_index > s.stBar` is not a nicety. stBar is stamped when the setup // went active, i.e. at THIS bar's close, and the strategy twin fills at the // NEXT bar's open. Managing the signal bar's own range would book a stop or // a target from price action that happened BEFORE the signal existed, and // the indicator's ledger and the strategy's blotter would then disagree by // construction on exactly the impulse candles that matter. // // WHAT THIS IS AND IS NOT: an `active` Setup is a SLOT and a drawing, not a // position. It is released on the ORIGINAL stop, on TP3, or on the time // stop. The POSITION - partials, the break-even move after TP1, the // R-multiple - is SECTION 15's VTrade and that is the authoritative book. // With break-even enabled the VTrade can therefore close a few bars before // its Setup does. That costs nothing: an active Setup does not consume a // candidate slot (see f_smLive), so a lingering one cannot starve the // engine, and the two are never summed. int nMan = setups.size() if nMan > 0 for i = 0 to nMan - 1 Setup s3 = setups.get(i) if s3.st == SetupState.active and bar_index > s3.stBar and not na(s3.plan) bool sHit = f_pathStop(s3.dir, s3.plan.stop) bool tHit = f_pathTgt(s3.dir, s3.plan.tp3) if sHit // path policy: the stop wins ties f_smKill(s3, NoTradeReason.dStopped) else if tHit f_smKill(s3, NoTradeReason.dTarget) else if bar_index - s3.stBar >= i_barsInTrade f_smKill(s3, NoTradeReason.dTimeStop) // MEMORY BOUND, since this array is the only unbounded-looking thing here. // Within one bar: live <= 2 * i_maxSetupsPerDir (the dir-filtered cap), plus at // most that many again killed on this bar and awaiting the next GC, plus two // births. Every dead element is removed at the next bar's step 1, so // setups.size() <= 4 * i_maxSetupsPerDir + 2 at every point in every bar, i.e. // 10 at the default. Against a 500/500/500 drawing budget and 1 box + 1 label + // 5 lines per setup that is a 7x margin on the tightest of the three. // ========================= END SECTION 14 =================================== // ============================================================================ // SECTION 15 : FAILURE ANALYSIS + THE ONE VIRTUAL TRADE LEDGER // // Two jobs, one vocabulary. // // (A) THE FAILURE HISTOGRAM. Every setup death that SECTION 14 stamped on this // bar, and every bar on which the evidence chain completed but SECTION 13 // vetoed it, is counted against the SAME NoTradeReason enum the gate, the // panel and the alert payload speak. One taxonomy, one histogram, no // second enum and no free-text reasons. // // (B) THE VIRTUAL LEDGER. A multi-slot var array<VTrade> that replays every // emitted signal on confirmed bar highs and lows and books it as an // R-multiple. It is what lets the INDICATOR report win rate, expectancy, // MFE and MAE without a single strategy.* builtin - and, far more // importantly, it is what the cooldown and loss-streak gates in SECTION 13 // read. THE STRATEGY BUILD READS THIS LEDGER TOO, not strategy.closedtrades, // which is the only reason the sentence \"the strategy reuses the indicator // logic unmodified\" is true rather than aspirational. If the two scripts // derived their cooldowns from different books they would take different // trades and every comparison between them would be meaningless. // // WHY MULTI-SLOT. The draft carried ONE virtual slot, overwritten by the next // signal. Every trade that outlived the cooldown was silently discarded, so // the loss streak - a gate that can halt the system - was computed from a // biased subsample containing only fast-resolving trades. Slow winners were // invisible; fast losers were all of it. // // CLASSIFY BY THE CONDITION, NOT THE STAGE. The draft asked \"which stage was // the setup in when it died\" and answered with that stage's name, so a setup // that lost its swept level while waiting for a retest was booked as \"failed // retest\". SECTION 14's f_smInvalid() returns the reason that ACTUALLY fired // and this section records that, unchanged. The histogram is the diagnostic // that tells you which link of the chain is broken; a histogram that answers a // different question than the one asked is worse than no histogram. // // AGGREGATE PER POSITION, NOT PER EXIT LEG. One VTrade is one POSITION. The // 40/35/25 ladder contributes three weighted terms to that position's single // R-multiple; it does not create three trades. Counting legs is how a scaled // strategy reports a win rate three times too flattering and feeds a tripled // n into a confidence interval that then looks far tighter than it is. The // tp1/tp2/tp3/sl/be counters below ARE per leg and are labelled as such - they // are event counts and they are deliberately NOT mutually exclusive. // // INTRABAR PATH POLICY. Stated once in SECTION 14 and obeyed here without // restatement: when a bar contains both the stop and a target, THE STOP FILLED // FIRST. f_pathStop() and f_pathTgt() are the only definitions of \"touched\" in // the file. This is pessimistic on purpose. TradingView's broker emulator // guesses the intrabar path from the bar's open and will therefore report // better numbers than this ledger on exactly the bars where the path is // ambiguous - which are the volatile ones. When the Strategy Tester looks // better than this panel, that difference IS the ambiguity, not an edge. // // WHAT IS NOT CLAIMED. R-multiples here are modelled fills on confirmed bar // extremes with a round-turn cost charged once per position. They are not // broker fills, there is no partial-fill model, and no number on this panel is // a probability. // ============================================================================ // ---------------------------------------------------------------- S15 GROUPS G15 = \"15 - Failure Analysis & Virtual Ledger\" // ---------------------------------------------------------------- S15 INPUTS // NOTE: the time stop is i_barsInTrade from SECTION 14 and is NOT re-declared // here. One time stop, one input: the setup and its trade record must expire on // the same bar or the ledger and the chart disagree about when a trade ended. i_vtW1Pct = input.float(40.0, \"Partial at TP1 (% of position)\", minval = 0.0, maxval = 100.0, step = 5.0, group = G15, tooltip = \"The canonical ladder for this system is 40 / 35 / 25. The remainder after TP1 and TP2 runs to TP3. Set this to 100 to model a single all-out exit at TP1, which raises the hit rate and lowers expectancy - the classic trade-off, made visible rather than assumed. These weights must match whatever ladder the strategy build in SECTION 18 actually places, or this ledger and the Strategy Tester will report different R.\", display = display.none) i_vtW2Pct = input.float(35.0, \"Partial at TP2 (% of position)\", minval = 0.0, maxval = 100.0, step = 5.0, group = G15, tooltip = \"TP3 takes whatever is left: 100 - TP1% - TP2%, floored at 0. If the two percentages sum above 100 the TP3 leg simply has no size and nothing is double-counted.\", display = display.none) i_beAfterTp1 = input.bool(true, \"Move the stop to break-even after TP1\", group = G15, tooltip = \"BE is entry plus one round-turn cost (never less than 0.05 ATR), so a 'break-even' stop really is break-even after costs rather than a small loss wearing the name. Be honest about the cost of this on 1M gold: noise there is 0.3-0.8 USD against a 0.25 USD spread, so this converts a large share of eventual winners into BE exits. It is a strategy choice, and turning it off is a legitimate answer.\", display = display.none) i_vtKeep = input.int(200, \"Virtual trades retained\", minval = 20, maxval = 1000, group = G15, tooltip = \"How many CLOSED virtual trades stay in memory for the panel. The running totals in DirStats are never trimmed, so win rate, expectancy and profit factor always cover the whole chart; only the per-trade detail list (and therefore the average MFE and MAE shown alongside it) rolls. Open trades are never trimmed at any setting.\", display = display.none) // ---------------------------------------------------------------------------- // 15.1 THE HISTOGRAM TABLE // failHist is indexed by position in the NoTradeReason enum and s15FailName // holds the matching titles, seeded from the enum members themselves via // f_reason() so the two can never drift apart and no row name is ever typed // twice. One seeding pass on the first bar; both arrays are var. // ---------------------------------------------------------------------------- var array<string> s15FailName = array.new<string>() var array<int> failHist = array.new<int>() f_faSeed(NoTradeReason r) => array.push(s15FailName, f_reason(r)) array.push(failHist, 0) true if array.size(failHist) == 0 f_faSeed(NoTradeReason.ok) f_faSeed(NoTradeReason.warmup) f_faSeed(NoTradeReason.outsideSess) f_faSeed(NoTradeReason.sessEdge) f_faSeed(NoTradeReason.lowAtr) f_faSeed(NoTradeReason.newsSpike) f_faSeed(NoTradeReason.choppy) f_faSeed(NoTradeReason.lowVolume) f_faSeed(NoTradeReason.noLiquidity) f_faSeed(NoTradeReason.midRange) f_faSeed(NoTradeReason.extended) f_faSeed(NoTradeReason.vwapFar) f_faSeed(NoTradeReason.noSweep) f_faSeed(NoTradeReason.noAbsorption) f_faSeed(NoTradeReason.zoneDead) f_faSeed(NoTradeReason.noRejection) f_faSeed(NoTradeReason.noDisplace) f_faSeed(NoTradeReason.noBos) f_faSeed(NoTradeReason.noRetest) f_faSeed(NoTradeReason.lowScore) f_faSeed(NoTradeReason.poorRr) f_faSeed(NoTradeReason.wideStop) f_faSeed(NoTradeReason.conflict) f_faSeed(NoTradeReason.htfBlock) f_faSeed(NoTradeReason.cooldown) f_faSeed(NoTradeReason.lossCooldown) f_faSeed(NoTradeReason.lossStreak) f_faSeed(NoTradeReason.duplicate) f_faSeed(NoTradeReason.maxSetups) f_faSeed(NoTradeReason.tradeOpen) f_faSeed(NoTradeReason.outOfWindow) f_faSeed(NoTradeReason.dTimeout) f_faSeed(NoTradeReason.dZoneBroken) f_faSeed(NoTradeReason.dFalseSweep) f_faSeed(NoTradeReason.dDispFail) f_faSeed(NoTradeReason.dBosFail) f_faSeed(NoTradeReason.dRetestFail) f_faSeed(NoTradeReason.dEvicted) f_faSeed(NoTradeReason.dConflict) f_faSeed(NoTradeReason.dSessionEnd) f_faSeed(NoTradeReason.dStopped) f_faSeed(NoTradeReason.dTarget) f_faSeed(NoTradeReason.dTimeStop) f_faBump(NoTradeReason r) => int i = array.indexof(s15FailName, f_reason(r)) if i >= 0 array.set(failHist, i, array.get(failHist, i) + 1) i // ---------------------------------------------------------------------------- // 15.2 THE LEDGER + THE PER-DIRECTION AGGREGATES // ---------------------------------------------------------------------------- var array<VTrade> vtrades = array.new<VTrade>() var DirStats statsL = DirStats.new() var DirStats statsS = DirStats.new() // Rolling MFE / MAE sums over CLOSED positions, in R. Kept as plain globals // rather than DirStats fields because the frozen type has no slot for them, and // updated at top level because a Pine function may not reassign a global. var float s15MfeSumL = 0.0 var float s15MaeSumL = 0.0 var float s15MfeSumS = 0.0 var float s15MaeSumS = 0.0 // The ladder, normalised once. There is deliberately no third weight variable: // the TP3 leg is whatever f_faRemW() says is still on, floored at 0. Deriving // it rather than declaring it is what makes a misconfigured pair of percentages // (say 70 and 60) starve the TP3 leg instead of pushing the weights past 1 and // double-counting size. // Two percentages that sum past 100 are RESCALED, not clipped. Clipping them // would let the TP1 and TP2 legs book 1.3 of a position that only ever had 1.0 // of size, which inflates every R in the ledger; rescaling preserves their // ratio, keeps the total at exactly 1 and simply leaves TP3 with nothing. s15W1raw = f_clamp01(i_vtW1Pct / 100.0) s15W2raw = f_clamp01(i_vtW2Pct / 100.0) s15WSum = s15W1raw + s15W2raw s15W1 = s15WSum > 1.0 ? s15W1raw / s15WSum : s15W1raw s15W2 = s15WSum > 1.0 ? s15W2raw / s15WSum : s15W2raw // ---------------------------------------------------------------------------- // 15.3 R ARITHMETIC // R of ONE UNIT of size exiting at px, with the full round-turn cost charged. // The caller multiplies by that leg's weight, and the weights sum to 1, so the // cost is charged exactly ONCE per position no matter how many legs it exits // in. Because t.risk is the NET risk from f_riskPlan() (the stop distance plus // the same round turn), a full stop-out returns exactly -1.000, which is the // property that makes every R figure below comparable. // ---------------------------------------------------------------------------- f_faLegR(VTrade t, float px) => na(px) or na(t.entry) or na(t.risk) or t.risk <= 0 ? 0.0 : (t.dir * (px - t.entry) - costRt) / t.risk // Size still on: whatever the booked partials have not taken. f_faRemW(VTrade t) => math.max(0.0, 1.0 - (t.tp1Hit ? s15W1 : 0.0) - (t.tp2Hit ? s15W2 : 0.0)) // ---------------------------------------------------------------------------- // 15.4 OPEN / CLOSE // ---------------------------------------------------------------------------- f_faOpen(int dir, RiskPlan pl) => bool ok = false if not na(pl) bool full = not na(pl.entry) and not na(pl.stop) and not na(pl.tp1) and not na(pl.tp2) and not na(pl.tp3) if full float gross = math.abs(pl.entry - pl.stop) // na does NOT get replaced by a bound here: an incomplete plan is // refused outright rather than opened on a fabricated risk, because // one na risk poisons sumR, the profit factor and every average on // the panel for the rest of the chart with no visible cause. float rNet = not na(pl.risk) and pl.risk > 0 ? pl.risk : math.max(gross + costRt, i_spreadUsd) // BE is entry plus one round turn, never less than 0.05 ATR, so a // \"break-even\" stop really is break-even AFTER costs rather than a // small loss wearing the name. float bePx = pl.entry + dir * math.max(costRt, 0.05 * aRef) if gross > 0 and rNet > 0 array.push(vtrades, VTrade.new(dir = dir, openBar = bar_index, entry = pl.entry, stop = pl.stop, be = bePx, tp1 = pl.tp1, tp2 = pl.tp2, tp3 = pl.tp3, risk = rNet, rMult = 0.0, isOpen = true)) ok := true ok f_faClose(VTrade t, DirStats st, NoTradeReason why, float exitPx, float remW) => t.rMult := nz(t.rMult, 0.0) + math.max(remW, 0.0) * f_faLegR(t, exitPx) t.isOpen := false t.closeBar := bar_index t.outcome := why float rr = nz(t.rMult, 0.0) int sl = f_slot(t.dir) // PER POSITION. One increment of wins or losses, one term in sumR. st.sumR := st.sumR + rr if rr > 0 st.wins := st.wins + 1 st.grossW := st.grossW + rr array.set(lossStreak, sl, 0) else if rr < 0 st.losses := st.losses + 1 st.grossL := st.grossL + math.abs(rr) array.set(lossStreak, sl, nz(array.get(lossStreak, sl), 0) + 1) array.set(lastLossBar, sl, bar_index) // rr == 0 is a true scratch: it is neither a win nor a loss, it does not // touch the streak, and pretending it is a loss is how a BE-heavy ladder // trips the loss-streak halt on trades that cost nothing. true // ---------------------------------------------------------------------------- // 15.5 ONE BAR OF ONE OPEN POSITION // Never runs on the position's own open bar: the signal was decided at that // bar's CLOSE and the strategy twin fills at the NEXT bar's open, so managing // the open bar's range would book fills from price action that preceded the // decision - and the indicator and the strategy would disagree by construction // on exactly the impulse candles this system exists to trade. // ---------------------------------------------------------------------------- f_faStep(VTrade t, DirStats st) => bool closed = false if t.isOpen and bar_index > t.openBar and t.risk > 0 // Excursions first. These are facts about the bar, not decisions, and // they are recorded whatever the bar then does. Both are POSITIVE // magnitudes in R: mfe = best favourable, mae = worst adverse. float favPx = t.dir > 0 ? high : low float advPx = t.dir > 0 ? low : high t.mfe := math.max(t.mfe, t.dir * (favPx - t.entry) / t.risk) t.mae := math.max(t.mae, t.dir * (t.entry - advPx) / t.risk) float stp = t.tp1Hit and i_beAfterTp1 and not na(t.be) ? t.be : t.stop bool isBe = t.tp1Hit and i_beAfterTp1 and not na(t.be) if f_pathStop(t.dir, stp) // INTRABAR PATH POLICY: the stop fills first, always. if isBe st.be := st.be + 1 else st.sl := st.sl + 1 f_faClose(t, st, NoTradeReason.dStopped, stp, f_faRemW(t)) closed := true else if not t.tp1Hit and f_pathTgt(t.dir, t.tp1) t.tp1Hit := true t.rMult := nz(t.rMult, 0.0) + s15W1 * f_faLegR(t, t.tp1) st.tp1 := st.tp1 + 1 if not t.tp2Hit and f_pathTgt(t.dir, t.tp2) t.tp2Hit := true t.rMult := nz(t.rMult, 0.0) + s15W2 * f_faLegR(t, t.tp2) st.tp2 := st.tp2 + 1 if f_pathTgt(t.dir, t.tp3) st.tp3 := st.tp3 + 1 f_faClose(t, st, NoTradeReason.dTarget, t.tp3, f_faRemW(t)) closed := true // The time stop uses i_barsInTrade, the SAME input SECTION 14 kills the // setup on, so the position and its setup can never expire apart. if not closed and bar_index - t.openBar >= i_barsInTrade f_faClose(t, st, NoTradeReason.dTimeStop, close, f_faRemW(t)) closed := true closed f_faFlush(NoTradeReason why) => int n = array.size(vtrades) if n > 0 for i = 0 to n - 1 VTrade t = array.get(vtrades, i) if t.isOpen f_faClose(t, t.dir > 0 ? statsL : statsS, why, close, f_faRemW(t)) true // ============================================================================ // PER-BAR ORDER FOR THIS SECTION. It sits at steps 15-15c of SECTION 14's // canonical list, i.e. after every state mutation for the bar is committed and // before any drawing. Everything below mutates state and therefore all of it // lives inside `if confirmed and warmupOk`. // // a. RECORD DEATHS every setup SECTION 14 killed on THIS bar. It is still // in the array because the GC only reclaims deaths from // previous bars - that one-bar grace is exactly what makes // this readable without a callback. // b. RECORD VETOES the chain completed and SECTION 13 said no. The only // gate reasons worth counting: recording them on every bar // would bury the histogram under OUTSIDE SESSION. // c. STEP LEDGER advance every open position by one bar. // d. SESSION FLUSH the rollover closes open positions at the close, on the // same input and the same bar as SECTION 14's flush. // d2 ROLL UP bank the MFE / MAE of whatever closed on this bar. // e. OPEN this bar's emitted signals become positions, and // lastSigBar is stamped for SECTION 13's cooldown. // f. TRIM drop the oldest CLOSED positions past the retention cap. // ============================================================================ if confirmed and warmupOk // ---- a. RECORD DEATHS --------------------------------------------------- int nSet = setups.size() if nSet > 0 for ia = 0 to nSet - 1 Setup sd = setups.get(ia) if sd.st == SetupState.dead and sd.stBar == bar_index and sd.death != NoTradeReason.ok f_faBump(sd.death) // ---- b. RECORD VETOES --------------------------------------------------- // entryRawL/S is \"SECTION 10 says this is a tradeable moment\". If the gate // then refused it, THAT is the informative no-trade event, and it is the // one the user can act on: a histogram dominated by LOW CONFIDENCE means // the score threshold is doing the work, one dominated by DUPLICATE SIGNAL // means the dedupe window is too wide. if entryRawL and gateL != NoTradeReason.ok f_faBump(gateL) if entryRawS and gateS != NoTradeReason.ok f_faBump(gateS) // Trigger count vs emitted count. fireRate = signals / armed is then an // honest funnel number: how often a completed chain survived the gate. if entryRawL statsL.armed := statsL.armed + 1 if entryRawS statsS.armed := statsS.armed + 1 // ---- c. STEP LEDGER ----------------------------------------------------- int nVt = array.size(vtrades) // frozen: nothing is added or removed here if nVt > 0 for ib = 0 to nVt - 1 VTrade t = array.get(vtrades, ib) f_faStep(t, t.dir > 0 ? statsL : statsS) // ---- d. SESSION FLUSH --------------------------------------------------- // Same input and same bar as SECTION 14's flush, so a position and the setup // that opened it are never carried across the rollover gap by one script and // closed by the other. if i_killOnSessionEnd and newDay f_faFlush(NoTradeReason.dSessionEnd) // ---- d2. ROLL UP THE EXCURSIONS OF ANYTHING THAT CLOSED THIS BAR -------- // Runs AFTER the flush so a rollover-closed position is counted too, and at // top level rather than inside f_faClose because a Pine function may not // reassign a global. Uses the pre-open bound: a position opened on THIS bar // cannot have closed on it. if nVt > 0 for ic = 0 to nVt - 1 VTrade tc = array.get(vtrades, ic) if not tc.isOpen and tc.closeBar == bar_index if tc.dir > 0 s15MfeSumL := s15MfeSumL + nz(tc.mfe, 0.0) s15MaeSumL := s15MaeSumL + nz(tc.mae, 0.0) else s15MfeSumS := s15MfeSumS + nz(tc.mfe, 0.0) s15MaeSumS := s15MaeSumS + nz(tc.mae, 0.0) // ---- e. OPEN ------------------------------------------------------------ // lastSigBar is written HERE and nowhere else (SECTION 2B ownership). It is // per direction on purpose: a global cooldown would let a stopped-out long // suppress shorts, which deletes the failed-absorption reversal - the // single highest-value setup this model has. if longSignal statsL.signals := statsL.signals + 1 array.set(lastSigBar, f_slot(1), bar_index) f_faOpen(1, sigPlanL) if shortSignal statsS.signals := statsS.signals + 1 array.set(lastSigBar, f_slot(-1), bar_index) f_faOpen(-1, sigPlanS) // ---- f. TRIM ------------------------------------------------------------ // Only CLOSED positions are dropped, oldest first, and only the detail list // shrinks: every aggregate above is a running total that is never revised. int over = array.size(vtrades) - i_vtKeep if over > 0 for k = 1 to over if array.size(vtrades) > 0 if not array.get(vtrades, 0).isOpen array.remove(vtrades, 0) // ========================= END SECTION 15 =================================== // ============================================================================ // SECTION 16 : PRESENTATION -- THE ONE AND ONLY DRAWING OWNER // // Conflict [30] handed this section ALL drawing, for one reason: a drawing // budget that is split across seven modules is a budget nobody can sum. Every // label, line, box, table and plot slot in this file is created here, counted // here, and released here. // // ANCHORING RULE (one rule, applied without exception): // PIVOT-derived art -> bar_index - i_pivotRight // swing marks, liquidity-level birth, EQ clusters. The pivot BAR is // i_pivotRight bars back; drawing it at bar_index would claim the event // happened later than it did, which is the visual form of repainting. // SIGNAL-derived art -> bar_index // entry/SL/TP lines, zone boxes, LONG/SHORT block labels. The signal bar // IS the confirmed bar being processed - there is nothing to rewind. // // WHAT EACH MODE SHOWS (i_mode lives in SECTION 0, so both builds agree): // CLEAN (default) // * LONG / SHORT block label carrying blockText() at the signal bar // * the iceberg zone box, one per LIVE IcebergZone in SECTION 6's array // * Entry / SL / TP1 / TP2 / TP3 lines with their right-edge price tags // * the main status / no-trade panel (one table) // * dead zones are DELETED // DEBUG (everything above, plus) // * the per-condition checklist table: Liquidity, Sweep, Buy/Sell Pressure, // Absorption, Rejection, Displacement, BOS, Retest, RR, HTF Bias - with // f_mark() glyphs for BOTH sides, both scores, and the verdict line // * liquidity level lines from SECTION 4, near price, with kind + price // * swing-high / swing-low marks, anchored at bar_index - i_pivotRight // * per-bar diagnostics: bars tinted by the Delta Proxy, a background tint // on directional conflict, data-window series, chop / session glyphs // * dead zones are GREYED and frozen instead of deleted, so the post-mortem // is still on the chart // i_showStats (SECTION 0) independently toggles the SECTION 15 stats panel. // // BUDGET ARITHMETIC (caps: 500 labels / 500 lines / 500 boxes / 64 plots) // LABELS = 6 * i_maxTradeVisuals + i_maxLevelLines // (1 block + 5 price tags) (Debug level map, full redraw) // = 6*5 + 12 = 42 worst case 6*20 + 40 = 160 <= 500 OK // LINES = 5 * i_maxTradeVisuals + i_maxLevelLines // = 5*5 + 12 = 37 worst case 5*20 + 40 = 140 <= 500 OK // BOXES = i_maxZoneBoxes = 8 worst case 40 <= 500 OK // (the \"BUY ABSORPTION nn/100\" caption is box.text - zero objects) // PLOTS = 2 signal shapes + 2 swing shapes + 1 barcolor + 1 bgcolor // + 6 named plots for SECTION 17's alertcondition placeholders // + 2 data-window diagnostics + 2 diagnostic glyphs // = 16, plus SECTION 17's 4 alertcondition() calls = 20 of 64. // 44 slots are left for SECTION 18's execution build. // Swing marks are plotshape() with offset, NOT labels: they cost 0 of the 500 // drawing objects and 1 of the 64 plot slots each, and they carry the pivot // offset structurally so they can never drift off the pivot bar. // // Every pool below is a RING BUFFER with an explicit .delete() on eviction. // TradingView silently hiding the oldest instance is NOT a budget policy: the // object still exists, still counts, and still cannot be recoloured. // ============================================================================ // ---------------------------------------------------------------- V1 GROUPS G16 = \"16 - Presentation\" G16C = \"16 - Colours\" // ------------------------------------------------------------ V2 INPUTS i_maxTradeVisuals = input.int(5, \"Keep last N setups drawn\", minval = 1, maxval = 20, group = G16, tooltip = \"Each drawn setup costs 6 labels and 5 lines. At 1 the chart shows only the current setup; at 20 it holds 120 labels and 100 lines - still far inside the 500 cap, but a 1M gold chart becomes unreadable long before the cap binds. The ring buffer DELETES evicted drawings, it does not merely let TradingView hide them.\", display = display.none) i_lineExtend = input.int(30, \"Entry / SL / TP line length (bars)\", minval = 1, maxval = 200, group = G16, tooltip = \"Bars the level lines run to the RIGHT of the signal bar. Capped at 200 in ONE place (this maxval) because xloc.bar_index drawings may not sit more than 500 bars beyond the last bar, and the price tag is placed at the far end. At 1 the lines are stubs; at 200 they run most of a screen.\", display = display.none) i_showZoneBox = input.bool(true, \"Draw iceberg zone boxes\", group = G16, tooltip = \"One box per LIVE zone in SECTION 6's array. Off removes every box and its caption; the zones still exist and still drive the signal.\", display = display.none) i_maxZoneBoxes = input.int(8, \"Max zone boxes on chart\", minval = 1, maxval = 40, group = G16, tooltip = \"DRAWING budget only - this is deliberately NOT i_absMaxZones, which caps how many zone OBJECTS SECTION 6 tracks. Set this below that cap and the oldest box is deleted while its zone keeps trading; set it above and nothing is ever evicted early.\", display = display.none) i_showLevelLines = input.bool(true, \"Debug: draw liquidity level lines\", group = G16, tooltip = \"Debug mode only. Redrawn in full on the last bar, so the count can never creep - it is exactly the cap below, or fewer.\", display = display.none) i_maxLevelLines = input.int(12, \"Debug: max level lines\", minval = 0, maxval = 40, group = G16, tooltip = \"Only ACTIVE levels within 10 ATR of price are candidates. At 0 the level map is off even in Debug; at 40 a ranging gold session draws a ladder dense enough to hide the candles.\", display = display.none) i_showSwingMarks = input.bool(true, \"Debug: mark confirmed swings\", group = G16, tooltip = \"Drawn with plotshape(offset = -i_pivotRight), so the glyph sits on the PIVOT bar, not on the bar that confirmed it. Costs zero drawing objects.\", display = display.none) i_zoneTransp = input.int(85, \"Zone fill transparency at strength 50\", minval = 45, maxval = 95, group = G16C, tooltip = \"The CENTRE of the mapping, not a ceiling. A zone of absorption strength 50 renders at exactly this value; stronger zones get more solid and weaker ones fainter, clamped to 45..95. At 45 every zone is heavy; at 95 only the strongest are visible at all. (A one-sided math.min() cap here would be inert above strength 20 and INVERTED below it.)\", display = display.none) i_bullCol = input.color(#26A69A, \"Bullish / LONG\", group = G16C, display = display.none) i_bearCol = input.color(#EF5350, \"Bearish / SHORT\", group = G16C, display = display.none) i_slCol = input.color(#FFA726, \"Stop-loss line\", group = G16C, tooltip = \"A dedicated hue on purpose. If the stop borrowed the direction colour, a SHORT setup would draw a red SL one pixel from three red TP lines and the short side would get a materially worse read of stop-vs-target than the long side. The stop is the same colour on both sides - that IS the symmetry.\", display = display.none) i_entryCol = input.color(#90A4AE, \"Entry line\", group = G16C, display = display.none) i_panelPos = input.string(\"Top Right\", \"Main panel anchor\", options = [\"Top Left\", \"Top Center\", \"Top Right\", \"Middle Left\", \"Middle Right\"], group = G16, tooltip = \"Bottom-right and bottom-left are deliberately NOT offered: the Debug checklist owns bottom-right and the stats panel owns bottom-left. TradingView renders one table per anchor, so two tables sharing an anchor overlap unreadably. This script uses 3 of the 9 anchors and can never collide.\", display = display.none) // -------------------------------------------------------- V3 HOUSE PALETTE vxHdrBg = #263238 // header rows vxLblBg = #37474F // label / key column vxValBg = #455A64 // value column vxTxt = #ECEFF1 // primary text vxTxt2 = #B0BEC5 // secondary / disclaimer text vxOkCol = #66BB6A vxNoCol = #EF5350 vxWarnCol= #FFA726 vxDbg = i_mode == \"Debug\" // --------------------------------------------------- V4 RING-BUFFER POOLS // Budgets are computed ONCE, from the inputs, and the pools are trimmed against // them on every push. A pool that is sized in objects rather than in setups // silently changes meaning when a display toggle moves, so both budgets below // are stated as (objects per setup) * (setups kept). vxLblBudget = 6 * i_maxTradeVisuals // 1 block label + 5 price tags vxLnBudget = 5 * i_maxTradeVisuals // entry + stop + 3 targets var array<label> vxLbls = array.new<label>() var array<line> vxLns = array.new<line>() var array<line> vxLvlLn = array.new<line>() // Debug level map, full redraw var array<label> vxLvlLb = array.new<label>() // Zone boxes are keyed by the zone ID SECTION 6 mints, in three parallel arrays. // vxZoneMaxId is what stops an evicted box being re-born next bar and churning // forever: an id is drawn at most once, ever. var array<int> vxZoneId = array.new<int>() var array<box> vxZoneBx = array.new<box>() var array<bool> vxZoneOn = array.new<bool>() var int vxZoneMaxId = 0 // Which side signalled most recently, for the panel's SIGNAL row. var int vxLastDir = 0 var int vxLastBar = na f_vxPushLbl(label l) => array.push(vxLbls, l) while array.size(vxLbls) > vxLblBudget label.delete(array.shift(vxLbls)) f_vxPushLn(line l) => array.push(vxLns, l) while array.size(vxLns) > vxLnBudget line.delete(array.shift(vxLns)) // ------------------------------------------------------- V5 SMALL HELPERS f_vxPos(string s) => switch s \"Top Left\" => position.top_left \"Top Center\" => position.top_center \"Top Right\" => position.top_right \"Middle Left\" => position.middle_left \"Middle Right\" => position.middle_right => position.top_right f_vxCell(table t, int c, int r, string txt, color bg, color fg, string ha) => table.cell(t, c, r, txt, text_color = fg, bgcolor = bg, text_size = size.small, text_halign = ha, text_valign = text.align_top) f_vxNum(float x, string fmt) => na(x) ? \"n/a\" : str.tostring(x, fmt) f_vxInt(int x) => na(x) ? \"n/a\" : str.tostring(x) // Zone opacity from the zone's OWN absorption strength (0..1), never from the // composite setup score. A zone is born at the absorption step, before rejection, // displacement, BOS and retest can possibly be true, so the composite score at // zone birth is structurally capped around a third of its range - painting with // it would make every zone uniformly faint and carry no information at all. f_vxZoneAlpha(float strength01) => float s = f_clamp01(nz(strength01, 0.5)) * 100.0 int(math.round(f_clamp(i_zoneTransp - 0.5 * (s - 50.0), 45.0, 95.0))) // Is the zone carrying this id still live in SECTION 6's array? // Returns false both when the zone died and when SECTION 6 evicted it, which is // exactly the condition under which its box must stop growing. f_vxZoneLive(int id) => bool found = false int n = array.size(zones) if n > 0 for i = 0 to n - 1 IcebergZone z = array.get(zones, i) if z.id == id and z.isLive() found := true break found // How far the best still-breathing setup on this side got through the chain. // SetupState rank is strictly increasing (SECTION 2), so the max rank IS the // furthest progress, and `dead` is excluded rather than ranked highest. f_vxBestRank(int dir) => int best = 0 int n = array.size(setups) if n > 0 for i = 0 to n - 1 Setup s = array.get(setups, i) if s.dir == dir and s.st != SetupState.dead int rk = s.rank() best := rk > best ? rk : best best // ------------------------------------------------- V6 GLOBAL-SCOPE READS // These are hoisted to global scope and evaluated on EVERY bar, unconditionally. // Two reasons, both hard: a helper owned by another section may carry internal // state, and a conditional call would then skip bars; and f_riskPlan() must see // the same inputs on the panel bar that SECTION 12 saw when it scored, or the // panel and the score disagree about the same setup. vxLiqL = f_atMeaningful(1) vxLiqS = f_atMeaningful(-1) vxHtfL = f_htfAllow(1) vxHtfS = f_htfAllow(-1) vxRankL = f_vxBestRank(1) vxRankS = f_vxBestRank(-1) // PROVISIONAL risk plans for the panel's RR row, at entryPx = close - the same // call SECTION 12 makes for qRr. On a signal bar SECTION 14 freezes the real // plan with entryPx = close as well, so these agree by construction and the // panel can never show an RR the signal did not have. vxPlanL = f_riskPlan(1, close, zoneBotL, zoneTopL, sweepExtL, sweepExtS, lastSwLo, lastSwHi, invAnchorL) vxPlanS = f_riskPlan(-1, close, zoneBotS, zoneTopS, sweepExtL, sweepExtS, lastSwLo, lastSwHi, invAnchorS) // -------------------------------------------- V7 SIGNAL DRAWING (bar_index) // ONE path, parameterised by dir. f_dirCol() is the only branch; the geometry // is a mirror of itself, so a long and a short setup drawn from mirrored bars // produce mirrored art without a second code path to keep in sync. f_vxLevelLine(int x0, int x1, float px, string tag, color c, string sty) => if not na(px) f_vxPushLn(line.new(x1 = x0, y1 = px, x2 = x1, y2 = px, xloc = xloc.bar_index, extend = extend.none, color = c, style = sty, width = 1)) f_vxPushLbl(label.new(x = x1, y = px, text = tag + \" \" + f_px(px), xloc = xloc.bar_index, yloc = yloc.price, color = color.new(color.black, 100), style = label.style_label_left, textcolor = c, size = size.tiny, textalign = text.align_left)) f_vxDrawSignal(int dir, RiskPlan pl, float sc) => if not na(pl) color c = f_dirCol(dir, i_bullCol, i_bearCol) int x0 = bar_index int x1 = bar_index + i_lineExtend // The block label renders the EXACT user format through the frozen // RiskPlan.blockText() method, so the chart and the SECTION 17 payload // read the same numbers out of the same object. f_vxPushLbl(label.new(x = x0, y = dir > 0 ? low - 0.6 * aRef : high + 0.6 * aRef, text = pl.blockText(sc), xloc = xloc.bar_index, yloc = yloc.price, color = color.new(c, 8), style = dir > 0 ? label.style_label_up : label.style_label_down, textcolor = vxTxt, size = size.small, textalign = text.align_left)) f_vxLevelLine(x0, x1, pl.entry, \"E\", i_entryCol, line.style_solid) f_vxLevelLine(x0, x1, pl.stop, \"SL\", i_slCol, line.style_dashed) f_vxLevelLine(x0, x1, pl.tp1, \"TP1\", color.new(c, 0), line.style_dotted) f_vxLevelLine(x0, x1, pl.tp2, \"TP2\", color.new(c, 25), line.style_dotted) f_vxLevelLine(x0, x1, pl.tp3, \"TP3\", color.new(c, 45), line.style_dotted) // ---------------------------------------------------- V8 ZONE BOX LIFECYCLE f_vxNewZoneBox(IcebergZone z) => color c = f_dirCol(z.dir, i_bullCol, i_bearCol) // Clamp the left edge: a zone born beyond the drawing window cannot be // anchored at its birth bar, and clamping is cheaper than losing the box. int born = nz(z.bornBar, bar_index) int lft = born > bar_index - 500 ? born : bar_index - 500 box.new(left = lft, top = z.top, right = bar_index + 1, bottom = z.bottom, xloc = xloc.bar_index, border_color = color.new(c, 30), border_width = 1, border_style = line.style_solid, bgcolor = color.new(c, f_vxZoneAlpha(z.strength)), text = (z.dir > 0 ? \"BUY ABSORPTION \" : \"SELL ABSORPTION \") + str.tostring(math.round(f_clamp01(z.strength) * 100.0), \"#\") + \"/100\", text_color = color.new(c, 0), text_size = size.tiny, text_halign = text.align_left, text_valign = z.dir > 0 ? text.align_bottom : text.align_top) // ============================================================================ // V9 : ALL STATE-CHANGING DRAWING. Confirmed bars only, without exception. // ============================================================================ if confirmed and warmupOk // --- zone births ------------------------------------------------------- // Both sides are handled by the SAME loop over the array, so a bar that // gives birth to a bull zone AND a bear zone draws both. A single \"newest // zone\" slot would silently drop one of them. if i_showZoneBox int nZ = array.size(zones) if nZ > 0 for i = 0 to nZ - 1 IcebergZone z = array.get(zones, i) if z.isLive() and z.id > vxZoneMaxId array.push(vxZoneId, z.id) array.push(vxZoneBx, f_vxNewZoneBox(z)) array.push(vxZoneOn, true) vxZoneMaxId := z.id > vxZoneMaxId ? z.id : vxZoneMaxId while array.size(vxZoneId) > i_maxZoneBoxes array.shift(vxZoneId) box.delete(array.shift(vxZoneBx)) array.shift(vxZoneOn) // --- grow every live box, retire the dead ones ------------------------- // DOWNWARD loop: the Clean branch removes the entry it is standing on, and // walking down means a removal cannot disturb an index still to be visited. int nP = array.size(vxZoneId) if nP > 0 for i = nP - 1 to 0 if array.get(vxZoneOn, i) box b = array.get(vxZoneBx, i) if f_vxZoneLive(array.get(vxZoneId, i)) box.set_right(b, bar_index + 1) else if vxDbg // Debug keeps the corpse: a zone that died is the most // informative object on the chart for the next ten bars. array.set(vxZoneOn, i, false) box.set_bgcolor(b, color.new(color.gray, 92)) box.set_border_color(b, color.new(color.gray, 40)) box.set_border_style(b, line.style_dashed) box.set_text_color(b, color.new(color.gray, 20)) box.set_text(b, \"ZONE INVALIDATED\") else box.delete(b) array.remove(vxZoneId, i) array.remove(vxZoneBx, i) array.remove(vxZoneOn, i) // --- official signals (mirror blocks, line for line) ------------------- if longSignal f_vxDrawSignal(1, sigPlanL, sigScoreL) vxLastDir := 1 vxLastBar := bar_index if shortSignal f_vxDrawSignal(-1, sigPlanS, sigScoreS) vxLastDir := -1 vxLastBar := bar_index // ============================================================================ // V10 : TABLES. Three tables, three distinct anchors, DISPLAY ONLY. // barstate.islast reads state that is already committed; it writes none. // ============================================================================ var table vxMain = table.new(position.top_right, 2, 9, border_width = 1, frame_color = color.new(vxHdrBg, 20), frame_width = 1, border_color = color.new(#000000, 70)) var table vxChk = table.new(position.bottom_right, 3, 14, border_width = 1, frame_color = color.new(vxHdrBg, 20), frame_width = 1, border_color = color.new(#000000, 70)) var table vxStat = table.new(position.bottom_left, 3, 13, border_width = 1, frame_color = color.new(vxHdrBg, 20), frame_width = 1, border_color = color.new(#000000, 70)) // The ten checklist rows, in chain order. Column 1 is LONG, column 2 is SHORT, // so \"Buy / Sell Pressure\" reads left-to-right in the same order as the columns: // a LONG wants BUY pressure, its mirror wants SELL pressure. var array<string> vxChkName = array.new<string>() if barstate.isfirst array.push(vxChkName, \"Liquidity\") array.push(vxChkName, \"Sweep\") array.push(vxChkName, \"Buy / Sell Pressure\") array.push(vxChkName, \"Absorption\") array.push(vxChkName, \"Rejection\") array.push(vxChkName, \"Displacement\") array.push(vxChkName, \"BOS\") array.push(vxChkName, \"Retest\") array.push(vxChkName, \"RR\") array.push(vxChkName, \"HTF Bias\") // The DEATH half of NoTradeReason, in declaration order, so SECTION 15's // histogram indices can be rendered as words instead of as integers. The titles // are pulled THROUGH f_reason() rather than retyped, so if a member's title ever // changes in SECTION 1 this panel follows it instead of quietly lying. var array<string> vxDeathName = array.new<string>() if barstate.isfirst array.push(vxDeathName, f_reason(NoTradeReason.dTimeout)) array.push(vxDeathName, f_reason(NoTradeReason.dZoneBroken)) array.push(vxDeathName, f_reason(NoTradeReason.dFalseSweep)) array.push(vxDeathName, f_reason(NoTradeReason.dDispFail)) array.push(vxDeathName, f_reason(NoTradeReason.dBosFail)) array.push(vxDeathName, f_reason(NoTradeReason.dRetestFail)) array.push(vxDeathName, f_reason(NoTradeReason.dEvicted)) array.push(vxDeathName, f_reason(NoTradeReason.dConflict)) array.push(vxDeathName, f_reason(NoTradeReason.dSessionEnd)) array.push(vxDeathName, f_reason(NoTradeReason.dStopped)) array.push(vxDeathName, f_reason(NoTradeReason.dTarget)) array.push(vxDeathName, f_reason(NoTradeReason.dTimeStop)) // A per-condition snapshot for ONE side. The raw condition is OR-ed with the // chain rank because a sweep or a BOS is a one-bar event: without the rank the // checklist would read all-crosses on 99% of bars and tell the user nothing // about the setup that is actually half-built in front of them. f_vxChecks(int dir, int rk) => RiskPlan pl = dir > 0 ? vxPlanL : vxPlanS // Field access sits inside an `if`, never in the false branch of a ternary: // reading a field off an na object is a RUNTIME ERROR that blanks the whole // chart, and `?:` is not guaranteed to leave the untaken branch unevaluated. bool rrOk = false if not na(pl) rrOk := pl.ok array.from( dir > 0 ? vxLiqL : vxLiqS, (dir > 0 ? sweepSigL : sweepSigS) or rk >= 1, (dir > 0 ? buyPressure : sellPressure) > 0.5, (dir > 0 ? zoneAliveL : zoneAliveS) or (dir > 0 ? absSigL : absSigS), (dir > 0 ? rejSigL : rejSigS) or rk >= 2, (dir > 0 ? dispSigL : dispSigS) or rk >= 3, (dir > 0 ? bosSigL : bosSigS) or rk >= 4, (dir > 0 ? entryRawL : entryRawS) or rk >= 6, rrOk, dir > 0 ? vxHtfL : vxHtfS) f_vxExpectancy(DirStats d) => float out = na if not na(d) float n = d.wins + d.losses if n > 0 out := d.sumR / n out f_vxWinRate(DirStats d) => float out = na if not na(d) float n = d.wins + d.losses if n > 0 out := 100.0 * d.wins / n out f_vxPf(DirStats d) => float out = na if not na(d) if d.grossL > 0 out := d.grossW / d.grossL out // SECTION 15 indexes failHist by position in the WHOLE NoTradeReason enum - 43 // rows, gate causes AND death causes - while vxDeathName holds only the 12 death // titles. `n == array.size(vxDeathName)` was therefore 43 == 12: a gate that can // never be true, so this cell could only ever print the \"unmapped\" fallback. // Each death title is now looked up BY NAME in SECTION 15's own parallel array, // which is exactly how SECTION 15 bumps the histogram, so the two cannot drift. f_vxTopFail() => string out = \"n/a\" int n = array.size(failHist) int nd = array.size(vxDeathName) if n > 0 and nd > 0 and n == array.size(s15FailName) int bi = -1 int bv = 0 for i = 0 to nd - 1 int ix = array.indexof(s15FailName, array.get(vxDeathName, i)) int v = ix >= 0 ? array.get(failHist, ix) : 0 if v > bv bv := v bi := i out := bi < 0 ? \"none yet\" : array.get(vxDeathName, bi) + \" x\" + str.tostring(bv) else if n > 0 // Honest failure rather than a confident wrong word: if SECTION 15 ever // re-buckets its histogram, say so instead of mislabelling the cause. out := \"histogram size \" + str.tostring(n) + \" - unmapped\" out if barstate.islast table.set_position(vxMain, f_vxPos(i_panelPos)) // ---------------------------------------------------- MAIN STATUS PANEL string hdr = \"ICEburg - iceberg / absorption (proxy)\" string sub = syminfo.ticker + \" \" + timeframe.period + (barstate.isrealtime and not barstate.isconfirmed ? \" (bar forming)\" : \"\") f_vxCell(vxMain, 0, 0, hdr, vxHdrBg, vxTxt, text.align_left) f_vxCell(vxMain, 1, 0, sub, vxHdrBg, vxTxt2, text.align_right) // ------------------------------------------------- PLAIN-ENGLISH STATUS // The one row that answers \"what is this doing, and what do I change?\". // Everything else on this panel is supporting detail. Written without // jargon on purpose: the rest of the panel is for when you already trust it. string vxWhat = \"\" color vxWhatCol = vxTxt2 int vxBest = math.max(vxRankL, vxRankS) float vxTopScore = math.max(nz(scoreL, 0.0), nz(scoreS, 0.0)) if not warmupOk vxWhat := \"WARMING UP - still collecting history. Nothing is evaluated yet.\" vxWhatCol := vxWarnCol else if not inWindow // Without this branch the panel reports SECTION 13's verdict - possibly a // clean OK on a high score - while SECTION 18 silently suppresses the // marker, so the chart disagrees with the panel and neither says why. vxWhat := \"OUTSIDE THE BACKTEST WINDOW - setups are still scored, but no signal is published. Set Rolling window (days back) to 0, or untick Use fixed date window.\" vxWhatCol := vxWarnCol else if not sessOk vxWhat := \"DORMANT - outside the \" + i_sessMode + \" window, so every setup is vetoed. To watch it work right now, open Settings and set Active sessions to Off (24h).\" vxWhatCol := vxWarnCol else if conflictNow vxWhat := \"NO TRADE - both directions show evidence at once. Waiting for one side to win.\" vxWhatCol := vxWarnCol else if longSignal or shortSignal vxWhat := (longSignal ? \"LONG\" : \"SHORT\") + \" SIGNAL on this bar - levels below.\" vxWhatCol := longSignal ? i_bullCol : i_bearCol else if vxBest >= 6 vxWhat := \"ARMED - structure has broken. Waiting for the retest to hold.\" vxWhatCol := vxOkCol else if vxBest >= 4 vxWhat := \"BUILDING - absorption zone found and structure broke. Needs a retest.\" else if vxBest >= 1 vxWhat := \"BUILDING - possible absorption. Still needs displacement and a break of structure.\" else vxWhat := \"HUNTING - no absorption zone yet. Best side scores \" + str.tostring(vxTopScore, \"#\") + \"/100 and needs \" + str.tostring(i_minScore, \"#\") + \".\" f_vxCell(vxMain, 0, 1, \"STATUS\", vxLblBg, vxTxt2, text.align_left) f_vxCell(vxMain, 1, 1, vxWhat, vxValBg, vxWhatCol, text.align_left) f_vxCell(vxMain, 0, 2, \"Session\", vxLblBg, vxTxt2, text.align_left) f_vxCell(vxMain, 1, 2, (sessOk ? \"OPEN\" : \"BLOCKED\") + \" q=\" + str.tostring(sessQual, \"#.00\") + \" HTF \" + htfTf + \" \" + (htfReady ? f_dirName(htfBias) : \"warming\"), vxValBg, sessOk ? vxTxt : vxWarnCol, text.align_left) f_vxCell(vxMain, 0, 3, \"Market\", vxLblBg, vxTxt2, text.align_left) f_vxCell(vxMain, 1, 3, \"ATR \" + f_px(atr) + \" RVol \" + f_vxNum(rvol, \"#.00\") + \" Chop \" + f_vxInt(chopScore) + \"/3\" + (isChoppy ? \" CHOPPY\" : \"\") + \" Trend \" + f_dirName(structTrend), vxValBg, isChoppy ? vxWarnCol : vxTxt, text.align_left) // Per-side score + the FIRST gate that blocked it. One reason, not ten: // SECTION 13 is first-match-wins in a fixed upstream-first order, so the // reason it returns is the one that must be fixed first. f_vxCell(vxMain, 0, 4, \"LONG\", vxLblBg, i_bullCol, text.align_left) f_vxCell(vxMain, 1, 4, f_vxNum(scoreL, \"#\") + \"/100 \" + f_reason(gateL), vxValBg, gateL == NoTradeReason.ok ? vxOkCol : vxTxt2, text.align_left) f_vxCell(vxMain, 0, 5, \"SHORT\", vxLblBg, i_bearCol, text.align_left) f_vxCell(vxMain, 1, 5, f_vxNum(scoreS, \"#\") + \"/100 \" + f_reason(gateS), vxValBg, gateS == NoTradeReason.ok ? vxOkCol : vxTxt2, text.align_left) // The signal block, rendered by the SAME blockText() the chart label and the // alert payload use. Three surfaces, one renderer, one set of numbers. RiskPlan vxSp = vxLastDir > 0 ? sigPlanL : sigPlanS float vxSs = vxLastDir > 0 ? sigScoreL : sigScoreS string vxSigTxt = \"No signal yet this session.\" if vxLastDir != 0 and not na(vxSp) vxSigTxt := vxSp.blockText(vxSs) + \"\\n(\" + str.tostring(bar_index - vxLastBar) + \" bars ago)\" f_vxCell(vxMain, 0, 6, \"Last signal\", vxLblBg, vxTxt2, text.align_left) color vxSigCol = vxLastDir > 0 ? i_bullCol : vxLastDir < 0 ? i_bearCol : vxTxt2 f_vxCell(vxMain, 1, 6, vxSigTxt, vxValBg, vxSigCol, text.align_left) // Feed health. These are not cosmetic: a 0.001-mintick gold feed makes the // strategy twin's const tick slippage model a tenth of the real friction. string warn = \"\" warn := warn + (tickWarn ? \"mintick \" + str.tostring(tick) + \" (not 0.01) \" : \"\") warn := warn + (isGold ? \"\" : \"symbol is not gold \") warn := warn + (hasVol ? \"\" : \"no volume feed - rvol gates bypassed \") warn := warn + (warmupOk ? \"\" : \"WARMING UP \") f_vxCell(vxMain, 0, 7, \"Feed check\", vxLblBg, vxTxt2, text.align_left) f_vxCell(vxMain, 1, 7, str.length(warn) == 0 ? \"feed OK\" : warn, vxValBg, str.length(warn) == 0 ? vxOkCol : vxWarnCol, text.align_left) f_vxCell(vxMain, 0, 8, \"Delta Proxy from TICK volume - no order book or bid/ask tape exists for spot XAU.\", vxHdrBg, vxTxt2, text.align_left) f_vxCell(vxMain, 1, 8, \"Confidence is a setup score, not a probability.\", vxHdrBg, vxTxt2, text.align_right) // ------------------------------------------------------ DEBUG CHECKLIST if vxDbg array<bool> ckL = f_vxChecks(1, vxRankL) array<bool> ckS = f_vxChecks(-1, vxRankS) f_vxCell(vxChk, 0, 0, \"SETUP CHECKLIST\", vxHdrBg, vxTxt, text.align_left) f_vxCell(vxChk, 1, 0, \"LONG\", vxHdrBg, i_bullCol, text.align_center) f_vxCell(vxChk, 2, 0, \"SHORT\", vxHdrBg, i_bearCol, text.align_center) for r = 0 to 9 bool bl = array.get(ckL, r) bool bs = array.get(ckS, r) f_vxCell(vxChk, 0, r + 1, array.get(vxChkName, r), vxLblBg, vxTxt2, text.align_left) f_vxCell(vxChk, 1, r + 1, f_mark(bl), vxValBg, bl ? vxOkCol : vxNoCol, text.align_center) f_vxCell(vxChk, 2, r + 1, f_mark(bs), vxValBg, bs ? vxOkCol : vxNoCol, text.align_center) f_vxCell(vxChk, 0, 11, \"Score (min \" + str.tostring(i_minScore, \"#\") + \")\", vxLblBg, vxTxt2, text.align_left) f_vxCell(vxChk, 1, 11, f_vxNum(scoreL, \"#\") + \"/100\", vxValBg, nz(scoreL, 0.0) >= i_minScore ? vxOkCol : vxTxt2, text.align_center) f_vxCell(vxChk, 2, 11, f_vxNum(scoreS, \"#\") + \"/100\", vxValBg, nz(scoreS, 0.0) >= i_minScore ? vxOkCol : vxTxt2, text.align_center) f_vxCell(vxChk, 0, 12, \"Stage (rank 0-7)\", vxLblBg, vxTxt2, text.align_left) f_vxCell(vxChk, 1, 12, str.tostring(vxRankL), vxValBg, vxTxt, text.align_center) f_vxCell(vxChk, 2, 12, str.tostring(vxRankS), vxValBg, vxTxt, text.align_center) string verdict = conflictNow ? \"VERDICT: DIRECTIONAL CONFLICT - stand down\" : gateL == NoTradeReason.ok ? \"VERDICT: LONG \" + f_vxNum(scoreL, \"#\") + \"/100 - all gates pass\" : gateS == NoTradeReason.ok ? \"VERDICT: SHORT \" + f_vxNum(scoreS, \"#\") + \"/100 - all gates pass\" : \"VERDICT: NO TRADE - L:\" + f_reason(gateL) + \" S:\" + f_reason(gateS) f_vxCell(vxChk, 0, 13, verdict, vxHdrBg, gateL == NoTradeReason.ok or gateS == NoTradeReason.ok ? vxOkCol : vxTxt2, text.align_left) f_vxCell(vxChk, 1, 13, \"\", vxHdrBg, vxTxt2, text.align_center) f_vxCell(vxChk, 2, 13, \"\", vxHdrBg, vxTxt2, text.align_center) // ---------------------------------------------- STATS PANEL (SECTION 15) if i_showStats and not na(statsL) and not na(statsS) f_vxCell(vxStat, 0, 0, \"VIRTUAL STATS\", vxHdrBg, vxTxt, text.align_left) f_vxCell(vxStat, 1, 0, \"LONG\", vxHdrBg, i_bullCol, text.align_center) f_vxCell(vxStat, 2, 0, \"SHORT\", vxHdrBg, i_bearCol, text.align_center) f_vxCell(vxStat, 0, 1, \"Signals\", vxLblBg, vxTxt2, text.align_left) f_vxCell(vxStat, 1, 1, f_vxInt(statsL.signals), vxValBg, vxTxt, text.align_center) f_vxCell(vxStat, 2, 1, f_vxInt(statsS.signals), vxValBg, vxTxt, text.align_center) f_vxCell(vxStat, 0, 2, \"TP1\", vxLblBg, vxTxt2, text.align_left) f_vxCell(vxStat, 1, 2, f_vxInt(statsL.tp1), vxValBg, vxOkCol, text.align_center) f_vxCell(vxStat, 2, 2, f_vxInt(statsS.tp1), vxValBg, vxOkCol, text.align_center) f_vxCell(vxStat, 0, 3, \"TP2\", vxLblBg, vxTxt2, text.align_left) f_vxCell(vxStat, 1, 3, f_vxInt(statsL.tp2), vxValBg, vxOkCol, text.align_center) f_vxCell(vxStat, 2, 3, f_vxInt(statsS.tp2), vxValBg, vxOkCol, text.align_center) f_vxCell(vxStat, 0, 4, \"TP3\", vxLblBg, vxTxt2, text.align_left) f_vxCell(vxStat, 1, 4, f_vxInt(statsL.tp3), vxValBg, vxOkCol, text.align_center) f_vxCell(vxStat, 2, 4, f_vxInt(statsS.tp3), vxValBg, vxOkCol, text.align_center) f_vxCell(vxStat, 0, 5, \"SL\", vxLblBg, vxTxt2, text.align_left) f_vxCell(vxStat, 1, 5, f_vxInt(statsL.sl), vxValBg, vxNoCol, text.align_center) f_vxCell(vxStat, 2, 5, f_vxInt(statsS.sl), vxValBg, vxNoCol, text.align_center) f_vxCell(vxStat, 0, 6, \"Breakeven\", vxLblBg, vxTxt2, text.align_left) f_vxCell(vxStat, 1, 6, f_vxInt(statsL.be), vxValBg, vxTxt, text.align_center) f_vxCell(vxStat, 2, 6, f_vxInt(statsS.be), vxValBg, vxTxt, text.align_center) f_vxCell(vxStat, 0, 7, \"Win rate\", vxLblBg, vxTxt2, text.align_left) f_vxCell(vxStat, 1, 7, f_vxNum(f_vxWinRate(statsL), \"#.0\") + \"%\", vxValBg, vxTxt, text.align_center) f_vxCell(vxStat, 2, 7, f_vxNum(f_vxWinRate(statsS), \"#.0\") + \"%\", vxValBg, vxTxt, text.align_center) f_vxCell(vxStat, 0, 8, \"Sum R\", vxLblBg, vxTxt2, text.align_left) f_vxCell(vxStat, 1, 8, f_vxNum(statsL.sumR, \"#.00\"), vxValBg, vxTxt, text.align_center) f_vxCell(vxStat, 2, 8, f_vxNum(statsS.sumR, \"#.00\"), vxValBg, vxTxt, text.align_center) f_vxCell(vxStat, 0, 9, \"Expectancy R\", vxLblBg, vxTxt2, text.align_left) f_vxCell(vxStat, 1, 9, f_vxNum(f_vxExpectancy(statsL), \"#.00\"), vxValBg, vxTxt, text.align_center) f_vxCell(vxStat, 2, 9, f_vxNum(f_vxExpectancy(statsS), \"#.00\"), vxValBg, vxTxt, text.align_center) f_vxCell(vxStat, 0, 10, \"Profit factor\", vxLblBg, vxTxt2, text.align_left) f_vxCell(vxStat, 1, 10, f_vxNum(f_vxPf(statsL), \"#.00\"), vxValBg, vxTxt, text.align_center) f_vxCell(vxStat, 2, 10, f_vxNum(f_vxPf(statsS), \"#.00\"), vxValBg, vxTxt, text.align_center) f_vxCell(vxStat, 0, 11, \"Top death cause\", vxLblBg, vxTxt2, text.align_left) f_vxCell(vxStat, 1, 11, f_vxTopFail(), vxValBg, vxWarnCol, text.align_left) f_vxCell(vxStat, 2, 11, \"\", vxValBg, vxTxt2, text.align_center) f_vxCell(vxStat, 0, 12, \"Virtual tracker on CONFIRMED bars, stop assumed first on ambiguous bars. A TradingView Basic plan serves ~5k bars: on 1M gold that is under four days, far too few trades for these counts to mean anything.\", vxHdrBg, vxTxt2, text.align_left) f_vxCell(vxStat, 1, 12, \"\", vxHdrBg, vxTxt2, text.align_center) f_vxCell(vxStat, 2, 12, \"\", vxHdrBg, vxTxt2, text.align_center) // ------------------------------------- DEBUG LEVEL MAP (full redraw) // Deleted and rebuilt wholesale, so the object count is exactly the cap or // fewer and can never creep. Level lines describe where liquidity is NOW; // there is nothing historical to preserve. int nOldLn = array.size(vxLvlLn) if nOldLn > 0 for i = 0 to nOldLn - 1 line.delete(array.get(vxLvlLn, i)) array.clear(vxLvlLn) int nOldLb = array.size(vxLvlLb) if nOldLb > 0 for i = 0 to nOldLb - 1 label.delete(array.get(vxLvlLb, i)) array.clear(vxLvlLb) if vxDbg and i_showLevelLines and i_maxLevelLines > 0 float band = 10.0 * aRef int nL = array.size(levels) if nL > 0 for i = 0 to nL - 1 if array.size(vxLvlLn) < i_maxLevelLines LiquidityLevel lv = array.get(levels, i) if lv.active and not na(lv.price) and math.abs(lv.price - close) <= band // side = +1 was born from a HIGH (resistance), so the // colour is the colour of the side that would TRADE it: // a support level is a LONG's level. Hence -lv.side. color lc = f_dirCol(-lv.side, i_bullCol, i_bearCol) int lb0 = nz(lv.createdBar, bar_index) int lx = lb0 > bar_index - 300 ? lb0 : bar_index - 300 array.push(vxLvlLn, line.new(x1 = lx, y1 = lv.price, x2 = bar_index + i_lineExtend, y2 = lv.price, xloc = xloc.bar_index, extend = extend.none, color = color.new(lc, 45), style = line.style_dotted, width = 1)) array.push(vxLvlLb, label.new(x = bar_index + i_lineExtend, y = lv.price, text = str.tostring(lv.kind) + \" \" + f_px(lv.price) + \" q\" + str.tostring(lv.quality(), \"#.00\") + \" t\" + str.tostring(lv.touches), xloc = xloc.bar_index, yloc = yloc.price, color = color.new(color.black, 100), style = label.style_label_left, textcolor = color.new(lc, 20), size = size.tiny, textalign = text.align_left)) // ============================================================================ // V11 : PLOTS. Zero drawing objects, 16 of the 64 plot slots. // The six named price/score plots exist so SECTION 17's alertcondition() calls // can interpolate {{plot(\"...\")}}. They are PER SIDE on purpose: a single // shared \"Entry\" plot would let a SHORT alert publish a LONG's entry and stop. // Every UDT dereference is na-guarded - reading a field off an na object is a // runtime error that kills the whole script, not a silent na. // ============================================================================ plotshape(longSignal, \"LONG signal\", shape.triangleup, location.belowbar, i_bullCol, size = size.small, text = \"LONG\", textcolor = i_bullCol) plotshape(shortSignal, \"SHORT signal\", shape.triangledown, location.abovebar, i_bearCol, size = size.small, text = \"SHORT\", textcolor = i_bearCol) // PIVOT-anchored: offset = -i_pivotRight puts the glyph on the pivot bar itself. // The marks are NOT a claim about the current bar - they are backfilled onto the // bar where the pivot actually printed, i_pivotRight bars ago. vxSwingOn = vxDbg and i_showSwingMarks vxMarkHi = vxSwingOn ? pvtHi : na vxMarkLo = vxSwingOn ? pvtLo : na plotshape(vxMarkHi, \"DBG Swing High\", shape.xcross, location.absolute, color.new(i_bearCol, 40), offset = -i_pivotRight, size = size.tiny) plotshape(vxMarkLo, \"DBG Swing Low\", shape.xcross, location.absolute, color.new(i_bullCol, 40), offset = -i_pivotRight, size = size.tiny) // Transparency is clamped to 40..88. Letting it reach 100 makes a bar with // balanced pressure render invisible, which reads as a data gap, not as balance. // |buy - sell| IS |ratio| from SECTION 0, so this is symmetric by construction. vxBarTr = int(math.max(40.0, math.min(88.0, 88.0 - 48.0 * math.abs(buyPressure - sellPressure)))) vxBarHue = buyPressure > sellPressure ? i_bullCol : i_bearCol vxBarCol = vxDbg ? color.new(vxBarHue, vxBarTr) : na barcolor(vxBarCol, title = \"DBG Delta Proxy\") bgcolor(vxDbg and conflictNow ? color.new(vxWarnCol, 90) : na, title = \"DBG Conflict\") float vxPlotLE = na float vxPlotLS = na float vxPlotSE = na float vxPlotSS = na if not na(sigPlanL) vxPlotLE := sigPlanL.entry vxPlotLS := sigPlanL.stop if not na(sigPlanS) vxPlotSE := sigPlanS.entry vxPlotSS := sigPlanS.stop plot(vxPlotLE, \"L Entry\", display = display.data_window) plot(vxPlotLS, \"L Stop\", display = display.data_window) plot(vxPlotSE, \"S Entry\", display = display.data_window) plot(vxPlotSS, \"S Stop\", display = display.data_window) plot(scoreL, \"LONG Score\", display = display.data_window) plot(scoreS, \"SHORT Score\", display = display.data_window) plot(vxDbg ? rvol : na, \"DBG RVol\", display = display.data_window) plot(vxDbg ? atr : na, \"DBG ATR\", display = display.data_window) plotchar(vxDbg and isChoppy, \"DBG Choppy\", \"o\", location.top, color.new(vxTxt2, 40), size = size.tiny) plotchar(vxDbg and not sessOk, \"DBG Outside session\", \"x\", location.bottom, color.new(vxWarnCol, 40), size = size.tiny) // ========================= END SECTION 16 =================================== // ============================================================================ // SECTION 17 : ALERTS -- 13 EVENTS, ONE PAYLOAD BUILDER // // //////////////////////////////////////////////////////////////////////// // // READ THIS FIRST IF YOUR ALERT WILL NOT SAVE // // // // // // A TradingView BASIC (free) plan allows ZERO technical alerts. // // // Not \"a few\". Zero. Any alert whose condition is an indicator - // // // including every alert in this section, and including the \"Any // // // alert() function call\" condition - is refused at CREATION time with // // // // // // \"you have a limit of 0 technical alerts in your plan\" // // // // // // Nothing in this file can work around that: it is an account limit // // // enforced on TradingView's servers, not a scripting problem. Until // // // the account is on ESSENTIAL or above, THIS ENTIRE SECTION IS INERT. // // // The script still runs, the panel still updates and the chart art is // // // unaffected - you simply cannot attach an alert to it. // // // // // // What DOES still work on Basic: plain PRICE alerts (\"XAUUSD crosses // // // 4407.00\"), created from the price scale or the alert dialog with // // // the symbol - not the indicator - as the condition. The practical // // // workaround is to read Entry / SL / TP1-3 off the chart label or the // // // Data Window and set price alerts on those numbers by hand. // // //////////////////////////////////////////////////////////////////////// // // DELIVERY MODEL, and why alert() carries the load: // alert() - dynamic message, built at runtime, so it can carry the // real Entry/SL/TP numbers for THIS setup. Costs the user // exactly ONE alert: they pick the condition // \"Any alert() function call\" and every one of the 13 // events below is routed through it. Cannot be toggled // per event in the UI, which is why the i_alert* inputs // exist - the filtering happens here instead. // alertcondition() - appears as its own named condition in the dropdown, so // the user can create four separately named alerts and // switch them on and off independently. The cost: the // message is a CONST STRING fixed at compile time. It can // only interpolate {{placeholders}}, so the numbers have // to be published as plots (SECTION 16 does this, per // side, so a SHORT alert can never quote a LONG's entry). // PREFER alert(). Use the alertcondition() set only if you want the four // headline events as separate, individually mutable alerts - and be aware // each one you create consumes an alert slot of its own. // // NON-REPAINTING: every alert() call sits inside `if confirmed and warmupOk` // and uses alert.freq_once_per_bar_close, so an event is announced once, after // the bar that caused it has closed, and is never retracted. The two guards are // belt and braces on purpose: the freq argument alone would still let an alert // fire from an intrabar evaluation if a future edit moved the call. // ============================================================================ // ---------------------------------------------------------------- A1 GROUP G17 = \"17 - Alerts\" i_alertsOn = input.bool(true, \"Enable alert() events\", group = G17, tooltip = \"Master switch for all 13 events. Off silences every alert() call without touching the chart art. It does NOT remove the four alertcondition() entries from the dropdown - those are compile-time.\", display = display.none) i_alertZones = input.bool(true, \"Alert on iceberg zones\", group = G17, tooltip = \"BULLISH ICEBERG, BEARISH ICEBERG and ZONE INVALIDATION. These are EARLY, pre-entry warnings - a zone is born at the absorption step, long before rejection, displacement, BOS and retest are known. On at 15M this is a useful heads-up; on 1M it is a firehose.\", display = display.none) i_alertEntries = input.bool(true, \"Alert on entries\", group = G17, tooltip = \"LONG ENTRY and SHORT ENTRY - the only two events that carry a full tradeable plan. If you keep one thing on, keep this.\", display = display.none) i_alertLevels = input.bool(true, \"Alert on TP / SL hits\", group = G17, tooltip = \"The eight trade-management events, read off SECTION 15's VIRTUAL tracker. They tell you what the model's bookkeeping did, which is not necessarily what your broker did. On a bar that spans both the stop and a target, the STOP is assumed first and the target alert for that bar is suppressed - see the mutual exclusion below.\", display = display.none) i_alertTag = input.string(\"\", \"Routing tag\", group = G17, tooltip = \"Optional free text prefixed to the first payload line, for webhook routers that fan out on a keyword. Empty (the default) leaves the first line as the exact 'XAUUSD LONG' form.\", display = display.none) // ONE honesty line, appended to every payload. See rule: this system reads TICK // volume. There is no order book, no bid/ask tape and no aggressor flag for spot // XAUUSD on TradingView, so nothing here is real order flow. VX_PROXY = \"Delta Proxy from tick volume - not order-book flow. Confidence is a setup score, not a probability.\" f_vxTag() => str.length(i_alertTag) > 0 ? \"[\" + i_alertTag + \"] \" : \"\" // --------------------------------------------------------- A2 PAYLOAD // Every price goes through f_px(), which is str.tostring(p, format.mintick) - // the instrument's own precision, so the payload is correct on a 0.01 gold feed // and on a 0.001 one without a single hardcoded decimal count anywhere. f_vxRr(RiskPlan pl, int k) => float r = na if not na(pl) r := k == 1 ? pl.rr1 : k == 2 ? pl.rr2 : pl.rr3 na(r) ? \"n/a\" : \"1:\" + str.tostring(r, \"#.0#\") // The nine lines below \"XAUUSD LONG\" are the user's exact block, in the user's // exact order. Two lines are added after it: the full RR LADDER (because one // scalar cannot honestly summarise a three-target exit - the headline RR is the // TP2 figure that i_rrMin actually gates on, and the ladder shows what TP1 and // TP3 really pay), and the proxy disclaimer. f_vxPayload(string evt, int dir, RiskPlan pl, float sc) => bool isEntry = evt == \"LONG ENTRY\" or evt == \"SHORT ENTRY\" // UDT fields are read inside an `if`, never from a ternary's untaken branch: // dereferencing an na object is a runtime error that kills the script. float e = na float s = na float t1 = na float t2 = na float t3 = na string rr = \"n/a\" if not na(pl) e := pl.entry s := pl.stop t1 := pl.tp1 t2 := pl.tp2 t3 := pl.tp3 rr := pl.rrText() string m = isEntry ? \"\" : evt + \"\\n\" m := m + f_vxTag() + syminfo.ticker + \" \" + f_dirName(dir) m := m + \"\\nSetup: \" + f_dirWord(dir) + \" Iceberg / \" + (dir > 0 ? \"Buy\" : \"Sell\") + \" Absorption\" m := m + \"\\nConfidence: \" + (na(sc) ? \"n/a\" : str.tostring(sc, \"#\") + \"/100\") m := m + \"\\nEntry: \" + f_px(e) m := m + \"\\nSL: \" + f_px(s) m := m + \"\\nTP1: \" + f_px(t1) m := m + \"\\nTP2: \" + f_px(t2) m := m + \"\\nTP3: \" + f_px(t3) m := m + \"\\nRR: \" + rr m := m + \"\\nRR ladder: TP1 \" + f_vxRr(pl, 1) + \" | TP2 \" + f_vxRr(pl, 2) + \" | TP3 \" + f_vxRr(pl, 3) m := m + \"\\n\" + VX_PROXY m // Zone events have no plan yet - a zone is born six chain steps before an entry // exists. Printing \"Entry: n/a\" five times would be worse than saying what IS // known, so these get their own compact body. // top / bot / tst are PASSED IN rather than read from SECTION 6's exports here. // SECTION 6 wipes zoneTop*/zoneBot* to na and zoneTests* to 0 on the SAME // confirmed bar that drops zoneAlive*, so an invalidation message that read them // live could only ever say \"Zone: n/a - n/a tests: 0\" - it could never name the // zone it was reporting the death of. The birth events pass the live values; the // invalidation events pass the one-bar-old copies captured at global scope below. f_vxZoneMsg(string evt, int dir, float top, float bot, int tst) => float sc = dir > 0 ? scoreL : scoreS string m = evt + \"\\n\" + f_vxTag() + syminfo.ticker + \" \" + f_dirName(dir) m := m + \"\\nPotential \" + f_dirWord(dir) + \" Iceberg / \" + (dir > 0 ? \"Buy\" : \"Sell\") + \" Absorption\" m := m + \"\\nZone: \" + f_px(bot) + \" - \" + f_px(top) + \" tests: \" + str.tostring(tst) m := m + \"\\nSetup score so far: \" + (na(sc) ? \"n/a\" : str.tostring(sc, \"#\") + \"/100\") m := m + \"\\nNo entry plan yet - this is a pre-entry warning, not a trade.\" m := m + \"\\n\" + VX_PROXY m // One-bar-old copies of SECTION 6's zone exports, taken at GLOBAL scope on every // bar. The shift has to happen out here: a `[1]` reference written inside a // conditionally-called function advances per CALL, not per BAR, and these are // only ever needed on the bar an invalidation fires. vxPrvTopL = zoneTopL[1] vxPrvBotL = zoneBotL[1] vxPrvTstL = nz(zoneTestsL[1], 0) vxPrvTopS = zoneTopS[1] vxPrvBotS = zoneBotS[1] vxPrvTstS = nz(zoneTestsS[1], 0) f_vxTradeMsg(string evt, VTrade t, string note) => string m = evt + \"\\n\" + f_vxTag() + syminfo.ticker + \" \" + f_dirName(t.dir) m := m + \"\\nEntry: \" + f_px(t.entry) m := m + \"\\nSL: \" + f_px(t.stop) m := m + \"\\nTP1: \" + f_px(t.tp1) m := m + \"\\nTP2: \" + f_px(t.tp2) m := m + \"\\nTP3: \" + f_px(t.tp3) m := m + \"\\nResult so far: \" + t.rText() m := m + (str.length(note) > 0 ? \"\\n\" + note : \"\") m := m + \"\\n\" + VX_PROXY m // ------------------------------------------------ A3 TRADE-EVENT MEMORY // SECTION 15 mutates VTrade objects IN PLACE, so `t.tp1Hit[1]` does not exist - // an object field has no series history. This section therefore keeps its own // one-bar memory of what it has already announced, per direction, and resets it // whenever a new trade opens. Index 0 = LONG, 1 = SHORT, via f_slot() from 2B. var array<int> vxAlBar = array.new<int>(2, na) var array<bool> vxAlT1 = array.new<bool>(2, false) var array<bool> vxAlT2 = array.new<bool>(2, false) var array<bool> vxAlT3 = array.new<bool>(2, false) // Newest VTrade on this side, open or closed. The downward loop is guarded on // n > 0 because `for i = -1 to 0` counts UPWARD and would index array slot -1. f_vxCurTrade(int dir) => VTrade out = na int n = array.size(vtrades) if n > 0 for i = n - 1 to 0 VTrade t = array.get(vtrades, i) if t.dir == dir out := t break out // ============================================================================ // A4 : THE 13 EVENTS. Confirmed bars only, once per bar close, no exceptions. // 1 BULLISH ICEBERG 5 LONG TP1 9 SHORT TP1 // 2 BEARISH ICEBERG 6 LONG TP2 10 SHORT TP2 // 3 LONG ENTRY 7 LONG TP3 11 SHORT TP3 // 4 SHORT ENTRY 8 LONG SL 12 SHORT SL // 13 ZONE INVALIDATION // ============================================================================ if confirmed and warmupOk and i_alertsOn // --- 1, 2 : zone birth (mirror pair) ----------------------------------- if i_alertZones if absSigL alert(f_vxZoneMsg(\"BULLISH ICEBERG\", 1, zoneTopL, zoneBotL, zoneTestsL), alert.freq_once_per_bar_close) if absSigS alert(f_vxZoneMsg(\"BEARISH ICEBERG\", -1, zoneTopS, zoneBotS, zoneTestsS), alert.freq_once_per_bar_close) // --- 13 : zone invalidation, routed by SIDE ------------------------- // A falling edge on the exported alive flag. A bool is never na, so the // [1] read is safe on the first bar and needs no nz() - which would be // a compile error on a bool anyway. if zoneAliveL[1] and not zoneAliveL alert(f_vxZoneMsg(\"ZONE INVALIDATION\", 1, vxPrvTopL, vxPrvBotL, vxPrvTstL), alert.freq_once_per_bar_close) if zoneAliveS[1] and not zoneAliveS alert(f_vxZoneMsg(\"ZONE INVALIDATION\", -1, vxPrvTopS, vxPrvBotS, vxPrvTstS), alert.freq_once_per_bar_close) // --- 3, 4 : entries (mirror pair) -------------------------------------- if i_alertEntries if longSignal alert(f_vxPayload(\"LONG ENTRY\", 1, sigPlanL, sigScoreL), alert.freq_once_per_bar_close) if shortSignal alert(f_vxPayload(\"SHORT ENTRY\", -1, sigPlanS, sigScoreS), alert.freq_once_per_bar_close) // --- 5..12 : trade management, ONE path walked for both directions ------ // MUTUAL EXCLUSION, implemented here rather than merely documented: when a // single bar's range covers both the stop and a target, TradingView cannot // tell which came first, so the STOP is assumed first and the target alert // for that bar is suppressed. That under-reports winners, which is the only // safe direction for the error - firing both would let one bar book a win // AND a loss, and the stats panel would count both. if i_alertLevels for k = 0 to 1 int dir = k == 0 ? 1 : -1 int slot = f_slot(dir) VTrade t = f_vxCurTrade(dir) if not na(t) // A new trade wipes the memory of the previous one's targets. if na(array.get(vxAlBar, slot)) or array.get(vxAlBar, slot) != t.openBar array.set(vxAlBar, slot, t.openBar) array.set(vxAlT1, slot, false) array.set(vxAlT2, slot, false) array.set(vxAlT3, slot, false) // NOTE, stated rather than hidden: the event set is exactly 13, // so a trade that dies of dTimeStop or dSessionEnd produces no // alert. That is a deliberate omission, not an oversight - those // exits are visible in the panel and in SECTION 15's histogram. bool closedNow = not t.isOpen and t.closeBar == bar_index bool rawSl = closedNow and t.outcome == NoTradeReason.dStopped bool rawTp3 = closedNow and t.outcome == NoTradeReason.dTarget and not array.get(vxAlT3, slot) bool rawTp2 = t.tp2Hit and not array.get(vxAlT2, slot) bool rawTp1 = t.tp1Hit and not array.get(vxAlT1, slot) // Stop wins the bar; below it, only the FURTHEST target reached // is announced, so one bar produces at most one management event. bool fSl = rawSl bool fTp3 = rawTp3 and not fSl bool fTp2 = rawTp2 and not fSl and not fTp3 bool fTp1 = rawTp1 and not fSl and not fTp3 and not fTp2 string side = f_dirName(dir) string amb = \" (bar spanned stop and target - stop assumed first)\" if fSl alert(f_vxTradeMsg(side + \" SL HIT\", t, rawTp1 ? amb : \"\"), alert.freq_once_per_bar_close) if fTp3 alert(f_vxTradeMsg(side + \" TP3 HIT\", t, \"\"), alert.freq_once_per_bar_close) if fTp2 alert(f_vxTradeMsg(side + \" TP2 HIT\", t, \"\"), alert.freq_once_per_bar_close) if fTp1 alert(f_vxTradeMsg(side + \" TP1 HIT\", t, \"\"), alert.freq_once_per_bar_close) // Latch from the OBJECT, not from what was announced: a target // suppressed by the stop this bar must not re-announce next bar. array.set(vxAlT1, slot, t.tp1Hit) array.set(vxAlT2, slot, t.tp2Hit) array.set(vxAlT3, slot, array.get(vxAlT3, slot) or rawTp3) // ============================================================================ // A5 : STATIC alertcondition() SET (four headline events) // Must sit at global scope with a const message, so the numbers arrive through // {{plot(\"...\")}} placeholders pointing at SECTION 16's PER-SIDE plots. Using // one shared \"Entry\" plot here is the classic bug: activeView-style plumbing // lets a SHORT alert publish the LONG's entry and an inverted stop. // These are OPTIONAL. Each one the user creates costs an alert slot; the // alert() route above covers all 13 events for the price of one. // ============================================================================ alertcondition(longSignal and confirmed, \"LONG ENTRY\", \"ICEBERG LONG {{ticker}} {{interval}} @ {{close}} | Entry {{plot(\\\"L Entry\\\")}} | SL {{plot(\\\"L Stop\\\")}} | Score {{plot(\\\"LONG Score\\\")}}/100 (setup score, not a probability)\") alertcondition(shortSignal and confirmed, \"SHORT ENTRY\", \"ICEBERG SHORT {{ticker}} {{interval}} @ {{close}} | Entry {{plot(\\\"S Entry\\\")}} | SL {{plot(\\\"S Stop\\\")}} | Score {{plot(\\\"SHORT Score\\\")}}/100 (setup score, not a probability)\") alertcondition(absSigL and confirmed, \"BULLISH ICEBERG\", \"Potential BULLISH ICEBERG (buy absorption) {{ticker}} {{interval}} @ {{close}} | Score {{plot(\\\"LONG Score\\\")}}/100 | Pre-entry warning, no plan yet. Delta Proxy from tick volume.\") alertcondition(absSigS and confirmed, \"BEARISH ICEBERG\", \"Potential BEARISH ICEBERG (sell absorption) {{ticker}} {{interval}} @ {{close}} | Score {{plot(\\\"SHORT Score\\\")}}/100 | Pre-entry warning, no plan yet. Delta Proxy from tick volume.\") // ========================= END SECTION 17 =================================== // ============================================================================ // ############################################################################ // ## ## // ## S E C T I O N 1 8 : E X E C U T I O N S W A P B L O C K ## // ## ## // ## THIS IS THE ONLY SECTION THAT DIFFERS BETWEEN THE TWO SHIPPED FILES. ## // ## EVERYTHING ABOVE (SECTIONS 0-17) AND BELOW (SECTION 19) IS ## // ## BYTE-IDENTICAL IN THE INDICATOR AND THE STRATEGY. ## // ## ## // ############################################################################ // // SWAP PROCEDURE - exactly three edits, nothing else in the file moves: // 1. SECTION 0 : comment out indicator(...) / uncomment strategy(...) // 2. HERE : comment out BLOCK 18-I / uncomment BLOCK 18-S // 3. Save under the other file name. // Block 18-A below is SHARED and stays live in BOTH builds - that is what makes // the walk-forward window identical in the two scripts, so the markers you see // on the indicator are exactly the bars the strategy traded. // // WHY A SWAP BLOCK AND NOT A RUNTIME FLAG: with strategy() declared, plotshape // and alert() are still legal, but with indicator() declared EVERY strategy.* // call is a COMPILE error. No runtime switch in Pine can span that, so the // difference has to be textual - and it is confined to this one section. // ============================================================================ // -------------------------------------------------------------- 18 GROUPS // ============================================================================ // BLOCK 18-A : SHARED - LIVE IN BOTH BUILDS // The walk-forward window, its counters, and the window-gated signal pair. // ============================================================================ // --- window telemetry ----------------------------------------------------- // Counted, never silent: a fold that produced no trades because the window was // misconfigured must not look like a fold that produced no trades because the // system found nothing. var int barsInWindow = 0 var int wfBlockedL = 0 var int wfBlockedS = 0 var NoTradeReason execReason = NoTradeReason.ok if confirmed and warmupOk if inWindow barsInWindow += 1 execReason := NoTradeReason.ok if not inWindow if longSignal wfBlockedL += 1 execReason := NoTradeReason.outOfWindow if shortSignal wfBlockedS += 1 execReason := NoTradeReason.outOfWindow // THE pair every execution path below consumes. longSignal / shortSignal are // already confirmed-bar-only (SECTION 14), so this is a pure conjunction that // mutates nothing and needs no `if confirmed` wrapper of its own. execLongSig = longSignal and inWindow execShortSig = shortSignal and inWindow // ============================================================================ // BLOCK 18-I : INDICATOR BUILD <<<<<< ACTIVE >>>>>> // Markers only. SECTION 17 already owns every alert() call and fires them in // BOTH builds - they are NOT repeated here, because a duplicated alert() is a // duplicated webhook order. // ============================================================================ plotshape(execLongSig, \"BUY\", shape.labelup, location.belowbar, color.new(#26A69A, 0), text = \"BUY\", textcolor = color.white, size = size.tiny) plotshape(execShortSig, \"SELL\", shape.labeldown, location.abovebar, color.new(#EF5350, 0), text = \"SELL\", textcolor = color.white, size = size.tiny) // Suppression tell. plotchar costs ONE of the 64 plot slots and ZERO drawing // objects, so it is free against SECTION 16's 500/500/500 budget. Without it a // misconfigured window looks exactly like a quiet market. plotchar(i_mode == \"Debug\" and (longSignal or shortSignal) and not inWindow, \"WF window blocked\", \"x\", location.bottom, color.new(color.gray, 20), size = size.tiny) // ============================================================================ // BLOCK 18-S : STRATEGY BUILD <<<<<< COMMENTED OUT >>>>>> // Uncomment EVERY line from here to the \"END 18-S\" banner, and comment out // BLOCK 18-I above. Do not uncomment a subset: the ordering below is // load-bearing, and a half-enabled block will compile and lie. // // FILE ORDER INSIDE THIS BLOCK IS A CORRECTNESS REQUIREMENT, not a style // choice. Pine executes strictly top to bottom, so the closed-trade drain MUST // run before anything can overwrite pRisk OR pQty - otherwise every R statistic // is divided by the NEXT trade's risk, on exactly the bars where trades chain: // inputs -> pure helpers -> state -> DRAIN -> window flatten -> // fill re-anchor -> exit management -> ENTRY -> report // ============================================================================ // // // --------------------------------------------------------- 18-S.1 INPUTS // GSIZE = \"18 - Strategy Sizing\" // GEXIT = \"18 - Strategy Exits\" // // i_compound = input.bool(true, \"Compound (size off live equity)\", group = GSIZE, // tooltip = \"ON sizes off strategy.equity, so a drawdown shrinks the next \" + // \"position. OFF sizes off initial_capital, which makes every \" + // \"trade the same size and makes the R-multiple series directly \" + // \"comparable across the run - use OFF when reading the report.\") // i_qtyStep = input.float(1.0, \"Broker quantity step\", minval = 0.0001, step = 0.01, // group = GSIZE, // tooltip = \"Lot granularity in the SAME unit strategy.entry uses. Spot gold \" + // \"CFD: qty is OUNCES, so 1.0 = 1 oz = 0.01 lot. COMEX GC: 1.0 = 1 \" + // \"contract. Quantity is ALWAYS rounded DOWN to this step - \" + // \"rounding up would silently exceed the stated risk.\") // i_maxLev = input.float(20.0, \"Max leverage (notional / equity)\", minval = 1.0, // maxval = 100.0, step = 1.0, group = GSIZE, // tooltip = \"MUST equal 100 / margin_long in the SECTION 0 strategy() call \" + // \"(margin 5.0 -> 20). Pine cannot read margin_long back, so the \" + // \"guard below mirrors the literal by hand - edit both together.\") // i_marginUtil = input.float(0.50, \"Margin utilisation cap\", minval = 0.05, maxval = 1.0, // step = 0.05, group = GSIZE, // tooltip = \"Fraction of the leverage ceiling the sizer may use. AT 1.00 the \" + // \"position consumes 100% of available margin, so the FIRST adverse \" + // \"tick leaves funds insufficient and the emulator force-liquidates \" + // \"4x the loss - margin calls are GUARANTEED, and no exit bucket \" + // \"counts them. 0.50 is the default for that reason. This cap is \" + // \"normally INERT: it binds only above i_riskPct ~= 100 * util * L \" + // \"* minStop / price (~1.1% at 1M), far above every shipped preset. \" + // \"The report row says which arm actually won.\") // i_beAfterTp1 = input.bool(true, \"Move to break-even after TP1\", group = GEXIT) // i_trailLen = input.int(20, \"Chandelier lookback (bars)\", minval = 2, maxval = 200, // group = GEXIT) // i_trailAtrMult = input.float(2.5, \"Trail distance (x ATR)\", minval = 0.0, maxval = 10.0, // step = 0.1, group = GEXIT, // tooltip = \"0 disables the trail. An ATR-only trail is 1.5-2.6x the \" + // \"STRUCTURAL stop at every preset, so it can essentially never \" + // \"beat a break-even stop and the runner leg ends up decorative. \" + // \"The R-scaled cap below fixes that: the trail takes the TIGHTER \" + // \"of the two, which puts it on the same axis as the stop it must \" + // \"beat. Check the TRAIL exit count before trusting the feature.\") // i_trailRmult = input.float(1.5, \"Trail distance cap (x initial risk)\", minval = 0.2, // maxval = 5.0, step = 0.1, group = GEXIT) // i_maxBarsInTrade = input.int(24, \"Time stop (bars in trade, 0 = off)\", minval = 0, // maxval = 500, group = GEXIT, // tooltip = \"VERIFIED AGAINST THE ASSEMBLED FILE: nothing above declares \" + // \"this name, so uncommenting the line is safe. The clash is a \" + // \"SEMANTIC one instead - SECTION 14 owns i_barsInTrade (default \" + // \"60) and SECTION 15's virtual ledger times out on THAT, so \" + // \"leaving this at 24 makes the real trade expire 36 bars before \" + // \"its virtual twin and the two ledgers stop describing the same \" + // \"system. Set this equal to i_barsInTrade unless you are \" + // \"deliberately measuring the difference.\") // // // ------------------------------------------------- 18-S.2 PURE HELPERS // // These are the ONLY functions in this block, and they touch no global state. // // Pine forbids a function body from reassigning a global; the original draft // // of this component failed to compile for exactly that reason. // // // +1e-9 before the floor: q * 40 / 100 with q = 10 can land on // // 3.9999999999999996, and a naive floor then silently moves a whole lot step // // from TP1 to the runner. // f_floorToStep(float _q, float _step) => // _step <= 0.0 ? _q : math.floor(_q / _step + 1e-9) * _step // // // THE sizer. syminfo.pointvalue carries the contract size, so there is no // // hardcoded 100 oz and no hardcoded 0.01 anywhere in it: correct for a spot // // CFD (pointvalue 1, qty in ounces) AND for GC futures (pointvalue 100, qty in // // contracts) with no edit. // f_positionSize(float _entryPx, float _stopPx) => // float pv = na(syminfo.pointvalue) or syminfo.pointvalue <= 0.0 ? 1.0 : syminfo.pointvalue // float eq = i_compound ? strategy.equity : strategy.initial_capital // float dist = na(_entryPx) or na(_stopPx) ? na : math.abs(_entryPx - _stopPx) // float qty = 0.0 // // GUARD: a zero, negative or na stop distance would divide to infinity and // // hand the emulator an unbounded order. This returns 0 and the caller // // counts the veto - it NEVER falls back to a default size. // if not na(dist) and dist > 0.0 and eq > 0.0 and not na(_entryPx) and _entryPx > 0.0 // // Cost is charged INSIDE the risk budget: the stop fills at // // stop - slip and the round turn is paid regardless, so a sizer that // // ignores costRt over-sizes by cost/stopDist (~20% at the 1M preset). // float riskPerUnit = (dist + costRt) * pv // float riskCash = eq * i_riskPct / 100.0 // float rawQty = riskPerUnit > 0.0 ? riskCash / riskPerUnit : 0.0 // float capQty = i_marginUtil * (eq * i_maxLev) / (_entryPx * pv) // qty := f_floorToStep(math.min(rawQty, capQty), i_qtyStep) // qty < i_qtyStep ? 0.0 : qty // // // Same arithmetic, returning WHICH arm bound, so the report can never claim // // an effect the numbers do not have. // f_sizeBoundBy(float _entryPx, float _stopPx) => // float pv = na(syminfo.pointvalue) or syminfo.pointvalue <= 0.0 ? 1.0 : syminfo.pointvalue // float eq = i_compound ? strategy.equity : strategy.initial_capital // float dist = na(_entryPx) or na(_stopPx) ? na : math.abs(_entryPx - _stopPx) // string outS = \"n/a\" // if not na(dist) and dist > 0.0 and eq > 0.0 and _entryPx > 0.0 // float rawQty = (eq * i_riskPct / 100.0) / ((dist + costRt) * pv) // float capQty = i_marginUtil * (eq * i_maxLev) / (_entryPx * pv) // outS := rawQty <= capQty ? \"risk\" : \"leverage\" // outS // // // ----------------------------------------------- 18-S.3 FROZEN TRADE STATE // var string pId = \"\" // var int pDir = 0 // var float pEntry = na // var float pStop = na // var float pTp1 = na // var float pTp2 = na // var float pTp3 = na // var float pQty = 0.0 // var float pQ1 = 0.0 // var float pQ2 = 0.0 // var float pQ3 = 0.0 // var float pRisk = na // risk per UNIT, in account currency // var bool tp1Hit = false // var bool tp2Hit = false // var bool reAnchored = false // var float lastStop = na // the stop level currently sitting on the book // var int fillBar = na // var string sizeBoundBy = \"n/a\" // // counters - every one of these is a report row, so none of them is silent // var int vetoMinLot = 0 // var int riskAborts = 0 // var int cTP1 = 0 // var int cTP2 = 0 // var int cTP3 = 0 // var int cBE = 0 // var int cTRAIL = 0 // var int cSL = 0 // var int cOTHER = 0 // var int ambigBars = 0 // var int barsInTrade = 0 // // per-POSITION aggregation. A 40/35/25 ladder closes THREE legs per trade; // // counting legs triples n and inflates the win rate purely from the ladder. // var int seenClosed = 0 // var int curPosBar = na // var float curPosR = 0.0 // var int posN = 0 // var int posWins = 0 // var float posSumR = 0.0 // // // hoisted ta.* - a ta.* call inside an if/and/or skips bars and silently // // corrupts its own history, so both trail extremes live at global scope. // hiN = ta.highest(high, i_trailLen) // loN = ta.lowest(low, i_trailLen) // // // ------------------------------------------ 18-S.4 CLOSED-TRADE DRAIN // // FIRST, before anything can touch pRisk. Legs are folded into POSITIONS by // // shared entry bar index, and the POSITION numbers are the headline ones. // if strategy.closedtrades > seenClosed // int startAt = math.max(seenClosed, strategy.closedtrades.first_index) // for i = startAt to strategy.closedtrades - 1 // // POSITION risk, not LEG risk. curPosR SUMS the legs below, so every // // leg has to be expressed as a fraction of the position's single 1R. // // Dividing by the leg's OWN size instead made a full three-leg // // stop-out read -3R, and a full 40/35/25 ladder read 1 + 2.4 + 3.6 = // // 7.0R, against a position that risked exactly 1R - i.e. the headline // // \"Avg position R\" row was inflated roughly threefold. // float rUsd = nz(pRisk, 0.0) * nz(pQty, 0.0) // float rMul = rUsd > 0.0 ? strategy.closedtrades.profit(i) / rUsd : 0.0 // string cm = strategy.closedtrades.exit_comment(i) // // comment_loss is keyed to the ORDER TYPE, not to P&L, so the tag is // // made stateful at issue time (18-S.7) and read back here. Without // // that, BE and TRAIL exits both arrive as \"SL\" and the ladder cannot // // be evaluated at all. // if cm == \"TP1\" // cTP1 += 1 // else if cm == \"TP2\" // cTP2 += 1 // else if cm == \"TP3\" // cTP3 += 1 // else if cm == \"BE\" // cBE += 1 // else if cm == \"TRAIL\" // cTRAIL += 1 // else if cm == \"SL\" // cSL += 1 // else // cOTHER += 1 // int eb = strategy.closedtrades.entry_bar_index(i) // if na(curPosBar) or eb != curPosBar // if not na(curPosBar) // posN += 1 // posSumR += curPosR // posWins += curPosR > 0.0 ? 1 : 0 // curPosBar := eb // curPosR := 0.0 // curPosR += rMul // seenClosed := strategy.closedtrades // // // ------------------------------- 18-S.4b FLUSH THE FINAL POSITION // // The loop above folds a position only when a leg arrives carrying a DIFFERENT // // entry_bar_index, so the most recent position is never folded - nothing closes // // it out. Left unflushed, \"Positions (not legs)\", \"Position win rate\" and // // \"Avg position R\" are permanently one position short, which on a short // // walk-forward fold is a material fraction of the sample. Clearing curPosBar // // makes the flush idempotent across realtime re-executions of the last bar. // if barstate.islast and not na(curPosBar) // posN += 1 // posSumR += curPosR // posWins += curPosR > 0.0 ? 1 : 0 // curPosBar := na // curPosR := 0.0 // // // --------------------------------------------- 18-S.5 WINDOW FLATTEN // // No position may leak across a fold boundary, or fold n+1 inherits fold n's // // open risk and the two folds stop being independent samples. // if not inWindow and strategy.position_size != 0 // strategy.close_all(comment = \"WINDOW\") // // // ------------------------- 18-S.6 FILL RE-ANCHOR + RISK RE-VALIDATION // // The order fills at the NEXT bar's open, not at the close the sizer used. // // The stop stays STRUCTURAL - entry slippage raising realised risk is the // // honest outcome, not something to hide - but if it raises it past the budget // // the position is no longer the trade that was authorised. // // entry_bar_index is used rather than `position_size[1] == 0` because the // // latter misses a trade that opens and closes inside one bar, which is exactly // // the trade where entry slippage matters most. // bool justOpened = strategy.opentrades > 0 and // strategy.opentrades.entry_bar_index(strategy.opentrades - 1) == bar_index // if justOpened and not reAnchored // float pv = na(syminfo.pointvalue) or syminfo.pointvalue <= 0.0 ? 1.0 : syminfo.pointvalue // pEntry := strategy.opentrades.entry_price(strategy.opentrades - 1) // pRisk := math.abs(pEntry - pStop) * pv // fillBar := bar_index // reAnchored := true // float budget = (i_compound ? strategy.equity : strategy.initial_capital) * i_riskPct / 100.0 // // 20% is THE tolerance, stated once. Beyond it the position is FLATTENED, // // not resized: resizing would leave a partial position whose three exit // // legs were computed for a different quantity. // if pRisk * pQty > 1.20 * budget // strategy.close_all(comment = \"RISK OVERRUN\") // riskAborts += 1 // // // ------------------------------------------- 18-S.7 EXIT MANAGEMENT // if strategy.position_size != 0 and pDir != 0 // bool isLong = pDir > 0 // float absPos = math.abs(strategy.position_size) // barsInTrade += 1 // // Partial fills are read from the SIMULATED POSITION SIZE, never from // // price: price touching TP1 does not mean the limit filled. // // `pQ1 > 0.0 and` is not decoration. With a zero-sized leg the test reads // // `absPos <= pQty + step/2`, true the instant the position exists, which // // puts a break-even stop THROUGH the market on the entry bar and scratches // // every trade. pQ1 rounds to zero on small accounts at DEFAULT settings, // // so this is the normal case, not an input-boundary curiosity. // tp1Hit := tp1Hit or (pQ1 > 0.0 and absPos <= pQty - pQ1 + i_qtyStep * 0.5) // tp2Hit := tp2Hit or (pQ2 > 0.0 and absPos <= pQty - pQ1 - pQ2 + i_qtyStep * 0.5) // // When a leg does not exist, arm its STAGE from price instead, so the // // ladder still advances rather than freezing at stage 1. // bool beArm = pQ1 > 0.0 ? tp1Hit : (isLong ? high >= pTp1 : low <= pTp1) // bool trArm = pQ2 > 0.0 ? tp2Hit : (isLong ? high >= pTp2 : low <= pTp2) // // float curStop = pStop // if beArm and i_beAfterTp1 // // pEntry is ALREADY the slipped fill, so the entry-side slip must not // // be charged twice: to be flat you need exit_fill >= entry + 2*spread, // // and exit_fill = stopLevel - exit_slip. Hence spread + slip + 1 tick, // // NOT the full round turn. // float beOff = i_spreadUsd + i_slipUsd + tick // float bePx = pEntry + (isLong ? beOff : -beOff) // curStop := isLong ? math.max(curStop, bePx) : math.min(curStop, bePx) // if trArm and i_trailAtrMult > 0.0 // // TIGHTER of ATR-scaled and R-scaled. The ATR arm alone sits 1.5-2.6x // // the structural stop away and can never out-rank the break-even stop, // // which makes the runner leg decorative. // float trailDist = math.min(i_trailAtrMult * aRef, // i_trailRmult * math.abs(pEntry - pStop)) // float chRaw = isLong ? hiN - trailDist : loN + trailDist // curStop := isLong ? math.max(curStop, chRaw) : math.min(curStop, chRaw) // // A stop must NEVER be placed through the market. The emulator would fill // // it at the next OPEN as a market order, at a price that is not the level // // drawn on the chart, and the report would then quote a level that never // // existed. // curStop := isLong ? math.min(curStop, close - tick) : math.max(curStop, close + tick) // // string slTag = (trArm and i_trailAtrMult > 0.0) ? \"TRAIL\" : // (beArm and i_beAfterTp1) ? \"BE\" : \"SL\" // // // THE LADDER IS ISSUED ONCE PER TRADE (in 18-S.8, on the entry bar) and // // AMENDED here only when the stop actually moves or a leg fills. Calling // // strategy.exit with an existing id MODIFIES that order; re-issuing all // // three every bar for no reason churns the book and re-arms nothing. // bool legChanged = (tp1Hit != tp1Hit[1]) or (tp2Hit != tp2Hit[1]) // if legChanged or na(lastStop) or math.abs(curStop - lastStop) >= f_tol(0.02) // if pQ1 > 0.0 and not tp1Hit // strategy.exit(\"X1\", from_entry = pId, qty = pQ1, stop = curStop, // limit = pTp1, comment_profit = \"TP1\", comment_loss = slTag) // if pQ2 > 0.0 and not tp2Hit // strategy.exit(\"X2\", from_entry = pId, qty = pQ2, stop = curStop, // limit = pTp2, comment_profit = \"TP2\", comment_loss = slTag) // if pQ3 > 0.0 // strategy.exit(\"X3\", from_entry = pId, qty = pQ3, stop = curStop, // limit = pTp3, comment_profit = \"TP3\", comment_loss = slTag) // lastStop := curStop // // // Ambiguity diagnostic, measured against the levels that were ACTUALLY // // LIVE during this bar - orders issued at this bar's close are only active // // from the next one - and reported as a SHARE, because a raw count is // // uninterpretable without its denominator. // float liveStop = lastStop[1] // float liveTp = not tp1Hit ? pTp1 : not tp2Hit ? pTp2 : pTp3 // if not na(liveStop) and not na(liveTp) and // low <= math.min(liveStop, liveTp) and high >= math.max(liveStop, liveTp) // ambigBars += 1 // // if i_maxBarsInTrade > 0 and not na(fillBar) and bar_index - fillBar >= i_maxBarsInTrade // strategy.close_all(comment = \"TIME\") // // // ------------------------------------------------------ 18-S.8 ENTRY // // LAST, so the drain above has already consumed every closed leg against the // // OLD pRisk before this line overwrites it. // if confirmed and warmupOk and inWindow and strategy.position_size == 0 // int dNew = execLongSig ? 1 : execShortSig ? -1 : 0 // RiskPlan pl = dNew > 0 ? sigPlanL : dNew < 0 ? sigPlanS : na // if dNew != 0 and not na(pl) and pl.ok // float q = f_positionSize(pl.entry, pl.stop) // if q <= 0.0 // // The ONE veto the strategy adds over the indicator: the minimum // // lot cannot express this risk budget. Counted, never silent. // vetoMinLot += 1 // else // pId := dNew > 0 ? \"ICE-L\" : \"ICE-S\" // pDir := dNew // pEntry := pl.entry // pStop := pl.stop // pTp1 := pl.tp1 // pTp2 := pl.tp2 // pTp3 := pl.tp3 // pQty := q // pQ1 := f_floorToStep(q * 0.40, i_qtyStep) // pQ2 := f_floorToStep(q * 0.35, i_qtyStep) // // pQ3 IS THE REMAINDER, COMPUTED EXPLICITLY. Omitting qty on the // // last leg does NOT mean \"whatever is left\" - Pine reads it as // // 100% of the position, the three legs then over-request, and the // // engine silently shrinks one of them with no documented rule for // // which. With pQ3 explicit, pQ1 + pQ2 + pQ3 == pQty exactly, at // // all times, and no reduction can ever fire. // pQ3 := math.max(0.0, q - pQ1 - pQ2) // pRisk := math.abs(pl.entry - pl.stop) * // (na(syminfo.pointvalue) or syminfo.pointvalue <= 0.0 ? 1.0 : syminfo.pointvalue) // tp1Hit := false // tp2Hit := false // reAnchored := false // lastStop := pStop // fillBar := na // sizeBoundBy := f_sizeBoundBy(pl.entry, pl.stop) // string msg = f_dirName(dNew) + \" XAU-ICE @ \" + f_px(pl.entry) + // \" | SL \" + f_px(pl.stop) + \" | TP \" + f_px(pl.tp1) + \"/\" + // f_px(pl.tp2) + \"/\" + f_px(pl.tp3) + \" | qty \" + // str.tostring(q, \"#.##\") + \" | setup score \" + // str.tostring(dNew > 0 ? sigScoreL : sigScoreS, \"#\") + \"/100\" // strategy.entry(pId, dNew > 0 ? strategy.long : strategy.short, // qty = q, comment = f_dirName(dNew), alert_message = msg) // // PROTECTIVE LEGS ON THE SAME BAR AS THE ENTRY. Gating them on // // `position_size != 0` instead would leave the position NAKED for // // the whole fill bar - and that bar is the one most likely to run // // against a fresh absorption entry, so the backtest would be // // OPTIMISTIC exactly where it must not be. The emulator explicitly // // supports strategy.exit against a not-yet-filled from_entry. // if pQ1 > 0.0 // strategy.exit(\"X1\", from_entry = pId, qty = pQ1, stop = pStop, // limit = pTp1, comment_profit = \"TP1\", comment_loss = \"SL\") // if pQ2 > 0.0 // strategy.exit(\"X2\", from_entry = pId, qty = pQ2, stop = pStop, // limit = pTp2, comment_profit = \"TP2\", comment_loss = \"SL\") // if pQ3 > 0.0 // strategy.exit(\"X3\", from_entry = pId, qty = pQ3, stop = pStop, // limit = pTp3, comment_profit = \"TP3\", comment_loss = \"SL\") // // // ------------------------------------------------ 18-S.9 REPORT TABLE // // Declared at GLOBAL SCOPE: Pine forbids a function definition inside an if // // block, and table.new inside one would rebuild the table on every bar. // // ANCHOR: middle_right. SECTION 16 runs in BOTH builds and already owns // // top_right (vxMain), bottom_right (vxChk) and bottom_left (vxStat), and // // SECTION 19 owns middle_left - top_right would have stacked this report on // // top of vxMain the moment this block was uncommented. // var table exTbl = table.new(position.middle_right, 2, 12, border_width = 1) // f_exRow(table _t, int _r, string _k, string _v) => // table.cell(_t, 0, _r, _k, text_color = color.new(color.silver, 0), // text_size = size.tiny, text_halign = text.align_left) // table.cell(_t, 1, _r, _v, text_color = color.new(color.white, 0), // text_size = size.tiny, text_halign = text.align_right) // // if barstate.islast and i_showStats // float posWr = posN > 0 ? 100.0 * posWins / posN : na // float avgR = posN > 0 ? posSumR / posN : na // float ambPct = barsInTrade > 0 ? 100.0 * ambigBars / barsInTrade : na // f_exRow(exTbl, 0, \"XAU-ICE STRATEGY\", inWindow ? \"IN WINDOW\" : \"OUT OF WINDOW\") // f_exRow(exTbl, 1, \"Bars in window\", str.tostring(barsInWindow) + \" / \" + str.tostring(bar_index + 1)) // f_exRow(exTbl, 2, \"Positions (not legs)\", str.tostring(posN)) // f_exRow(exTbl, 3, \"Position win rate\", na(posWr) ? \"n/a\" : str.tostring(posWr, \"#.0\") + \"%\") // f_exRow(exTbl, 4, \"Avg position R\", na(avgR) ? \"n/a\" : str.tostring(avgR, \"#.00\") + \"R\") // f_exRow(exTbl, 5, \"Exit legs TP1/2/3\", str.tostring(cTP1) + \"/\" + str.tostring(cTP2) + \"/\" + str.tostring(cTP3)) // f_exRow(exTbl, 6, \"Exit legs SL/BE/TR\", str.tostring(cSL) + \"/\" + str.tostring(cBE) + \"/\" + str.tostring(cTRAIL)) // f_exRow(exTbl, 7, \"Sizing bound by\", sizeBoundBy) // f_exRow(exTbl, 8, \"Min-lot vetoes\", str.tostring(vetoMinLot)) // f_exRow(exTbl, 9, \"Risk-overrun flats\", str.tostring(riskAborts)) // f_exRow(exTbl, 10, \"WF blocked L/S\", str.tostring(wfBlockedL) + \"/\" + str.tostring(wfBlockedS)) // f_exRow(exTbl, 11, \"Ambiguous bars\", na(ambPct) ? \"n/a\" : str.tostring(ambPct, \"#.0\") + \"% of bars in trade\") // // ============================== END 18-S ===================================== // ============================================================================ // INTRABAR FILL AMBIGUITY - STATED HONESTLY, ONCE // // On any bar whose range contains BOTH the live stop and the live target, the // order in which they were touched is NOT in the OHLC data. TradingView's // broker emulator does not know it either: it GUESSES from the bar's open, on // the assumption that price travelled open -> nearest extreme -> other // extreme. That guess is systematically FLATTERING here, because a // mean-reversion entry usually opens nearer its target than its stop, so the // emulator tends to resolve the ambiguous bar as a win. // // SECTION 15's virtual ledger assumes the OPPOSITE - STOP FIRST - on every // such bar. The two will therefore disagree on exactly the bars that matter // most, and the size of that disagreement is the honest measure of how much of // the result is path assumption rather than edge. The report row \"Ambiguous // bars: n% of bars in trade\" makes it visible: at 1% the question is moot, at // 15% the equity curve is mostly a coin flip. // // MITIGATIONS, and what each actually costs: // * BAR MAGNIFIER - resolves the path from real lower-timeframe data. It is // the only true fix. It is a PAID feature (Premium and above) and this // account does not have it, so it is unavailable here. // * fill_orders_on_standard_ohlc = true in the strategy() call - forces fills // to be computed from standard OHLC even on a non-standard chart. It does // NOT resolve intrabar order; it only stops Heikin-Ashi / Renko prices from // manufacturing fills at prices that never traded. Worth setting anyway. // * calc_on_every_tick = true - changes nothing on historical bars, which is // where the entire backtest lives. It is NOT a mitigation, despite being // widely cited as one. // * Widening TP1 so it and the stop cannot share a bar - shrinks the // ambiguity by shrinking the strategy. That is a real cost, not a free fix. // // RECOMMENDED HONEST DEFAULT: leave the emulator's behaviour as-is, keep // fill_orders_on_standard_ohlc = true, read the ambiguous-bar share on every // run, and treat SECTION 15's stop-first ledger as the LOWER bound and the // Strategy Tester as the UPPER bound. Quote the pair. Never quote the upper // bound alone. // ============================================================================ // ========================= END SECTION 18 =================================== // ============================================================================ // SECTION 19 : PRESETS + RUNTIME SELF-TESTS // // (a) THE single recommended-settings block. Seven components shipped their // own preset tables and they contradicted each other - the score threshold // was 85/75/65 in one and 65 flat in another, the friction ratio k was // 4.0/3.0/2.0 with no owner, i_absMaxProgress was 0.35 in one and 0.40 in // another. Those tables are all DELETED. This one is the source of truth, // and every difference below is justified on its own line. // // (b) RUNTIME SELF-TESTS. Every invariant this file asserts in prose is // asserted here in code, on the last bar, and a failure renders as a RED // panel row. A silent invariant is a decoration. // ============================================================================ // --------------------------------------------------------------- 19 GROUP GTEST = \"19 - Presets & Self-Test\" // ============================================================================ // (a) RECOMMENDED SETTINGS - XAUUSD - 1M / 5M / 15M // // WHAT VARIES BY TIMEFRAME, AND WHY // ------------------------------------------------------------------------ // INPUT 1M 5M 15M WHY IT DIFFERS // ------------------------------------------------------------------------ // i_minScore 80 75 70 1M has the worst evidence-to- // noise ratio, so demand more of // it where it is cheapest to fake. // i_pivotLeft / Right 5 / 3 5 / 3 4 / 2 i_pivotRight IS the system // latency. 3 bars is 3 minutes at // 1M and 45 minutes at 15M - the // legs must shorten as the bar // gets expensive. // i_rvolLen 50 50 30 50 bars at 15M spans 12+ hours // and smears the whole diurnal // profile the baseline exists to // capture. // i_sessMode Overlap L+NY L+NY 1M outside the London/NY // only overlap is mostly spread // bounce, not participation. // i_sessEdge (min) 5 5 0 At 15M one bar already exceeds // a 5-minute trim, so the trim // would delete the open entirely. // i_htfMode Block Soft Soft 1M cannot absorb counter-trend // opposite chop; at 5M+ the reversal setup // is worth more than the filter. // i_riskPct (%) 0.25 0.50 0.50 The 1M sample is tiny and cost // is the largest share of R // there - size down until the // sample earns the risk. // i_rrMin (NET) 1.8 2.0 2.2 Cost is ~25% of R at 1M, so a // NET 2.0 is unreachable inside a // 20-bar horizon; 15M's wider stop // buys the room for 2.2. // min stop / cost (k) 4.0 3.0 2.0 NOT a separate input. It is // delivered by f_riskPlan()'s // minStop clamp (SECTION 11) and // equals ~1.80 / 1.35 / 0.90 USD // against costRt = 0.45. // HONESTY NOTE: at 1M that // rejects ~80% of the stop // distribution, which is why 1M // below is inspection-only. // i_absMaxProgress 0.35 0.40 0.40 1M bars are largely spread, so // \"effort without result\" has to // be measured more strictly. // i_absMinTests 2 2 1 At 15M a zone rarely gets // re-tested twice inside one // session before it resolves. // i_zoneMaxTouches 4 4 3 Mirror of the line above - keep // the gap, it is what stops the // deadlock (see self-test 13). // i_cooldownBars 10 8 4 The input is BARS, so these are // 10 / 40 / 60 minutes of wall // clock - NOT constant, and the // earlier draft of this table // claimed they were. The bar // count still has to FALL as the // bar grows or a flat 10 would be // 2.5 hours at 15M and eat the // session; it just does not fall // fast enough to hold the clock. // i_entryMode Confirm Retest Retest A 1M retest is spread noise - // there is no room between the // BOS and the level for one. // i_lookbackDays 3 20 60 THE ACCOUNT CONSTRAINT. No Deep // Backtesting on this plan, so // history is what the chart holds: // ~5000 bars = ~3.6 days at 1M, // ~17 days at 5M, ~52 days at // 15M. A larger value is a silent // no-op. // STRATEGY BUILD ONLY (BLOCK 18-S) // i_maxBarsInTrade 20 24 32 Same wall-clock ceiling, ~30 // min / 2 h / 8 h. // i_trailAtrMult 2.0 2.5 3.0 ATR arm only; the R-scaled cap // i_trailRmult = 1.5 is FLAT on // every timeframe and is usually // the binding one. // // DO NOT VARY BY TIMEFRAME - these are properties of the SYMBOL, not the bar: // i_atrLen 14 . i_spreadUsd 0.25 . i_slipUsd 0.10 (costRt = 0.45) // i_maxLevels 40 . i_eqTolATR 0.15 . i_absMaxZones 8 // (the zone BREAK buffer is not an input at all - it is the hardcoded // max(0.15 x atrRef, i_spreadUsd) in SECTION 2's breachPx(), frozen per // zone at creation. Do not go looking for it in the Settings panel.) // i_wickWeight 1.5 . i_volTod ON . i_deltaMode \"CLV x Volume (gap-aware)\" // i_maxSetupsPerDir 2 . i_tz America/New_York . i_trailRmult 1.5 // RUBRIC WEIGHTS level 15 . sweep 15 . rvol 10 . absorb 20 . reject 10 . // displace 10 . bos 10 . retest 10 = 100 EXACTLY. // Changing one without changing another breaks self-test 12. // // HOW TO USE THE 1M COLUMN, HONESTLY: // 1M is EXECUTION INSPECTION ONLY. ~3.6 days of history times a ~20% pass // rate through the minimum-stop clamp is one or two trades. That is not a // sample, it is an anecdote. Do not tune a single input on it, do not quote a // win rate from it, and do not run a walk-forward fold on it. Use it to watch // where the entries land relative to the zones, and nothing else. // Statistics come from 5M and 15M, over as many rolling folds as the loaded // history allows - more folds of a shorter window, with the claims reduced to // match, is the only protocol this account can actually execute. // ============================================================================ // ============================================================================ // (b) RUNTIME SELF-TESTS // All evaluated on the LAST BAR only, so they cost nothing on history. None of // them calls a ta.* function, so none of them can perturb a recursive series. // A failure NEVER halts the script - it renders red. A self-test that can kill // a live chart is worse than the bug it was looking for. // ============================================================================ i_selfTest = input.bool(true, \"Run self-tests\", group = GTEST, tooltip = \"Evaluates every structural invariant on the last bar. Costs one table and no drawing objects. Turn it OFF only to free the panel anchor - it does not measurably affect speed.\", display = display.none) i_testRows = input.string(\"Failures only\", \"Self-test panel\", options = [\"Off\", \"Failures only\", \"All checks\"], group = GTEST, tooltip = \"Failures only = the panel is invisible while everything passes, and appears in red the moment something breaks. All checks = the full list, useful once after any edit to the weights or caps.\", display = display.none) // Float comparison tolerance. Tight enough that a real arithmetic error is // caught, loose enough that IEEE-754 round-off in a sum of eight weights is not // reported as a bug. ST_EPS = 1e-6 // A sub-score may legitimately be na (no contender on that side this bar); an // na is NOT a failure. An out-of-range NUMBER is. f_ok01(float _x) => na(_x) or (_x >= -ST_EPS and _x <= 1.0 + ST_EPS) f_ok100(float _x) => na(_x) or (_x >= -ST_EPS and _x <= 100.0 + ST_EPS) // Appends one result. Mutating an array passed as a parameter is legal - it is // the OBJECT being changed, not a global variable being reassigned, which is // the thing Pine actually forbids inside a function body. f_stAdd(array<string> _n, array<bool> _p, string _label, bool _pass) => array.push(_n, _label) array.push(_p, _pass) array.size(_p) f_stRow(table _t, int _r, string _label, bool _pass) => table.cell(_t, 0, _r, _pass ? \"OK\" : \"FAIL\", text_color = _pass ? color.new(color.gray, 20) : color.white, bgcolor = _pass ? color.new(color.gray, 90) : color.new(#EF5350, 0), text_size = size.tiny, text_halign = text.align_center) table.cell(_t, 1, _r, _label, text_color = _pass ? color.new(color.silver, 20) : color.white, bgcolor = _pass ? color.new(color.gray, 95) : color.new(#EF5350, 25), text_size = size.tiny, text_halign = text.align_left) // -------------------------------------------------------- THE ASSERTIONS // Evaluated at global scope so no lazy `and` can skip one, then read by name. // 1. The delta-proxy identity. b + s == 1 is what makes long/short symmetry // structural rather than a threshold choice; if it ever drifts, every // mirrored sub-score in the file is quietly biased. st01 = math.abs(buyPressure + sellPressure - 1.0) <= ST_EPS // 2. The direction primitive identity. GUARDED on range >= tick: on a bar where // high == low, barRange is floored to tick and the sum is legitimately 0, // not 1. That guard is the honest statement of the identity, not a dodge. st02 = (high - low) < tick or math.abs(f_closeLoc(1) + f_closeLoc(-1) - 1.0) <= ST_EPS // 3. Same identity for the wick/body decomposition, same guard. st03 = (high - low) < tick or math.abs(f_wickFrac(1) + f_wickFrac(-1) + bodyAbs / barRange - 1.0) <= ST_EPS // 4. The delta ratio must stay inside its declared domain - everything // downstream assumes [-1, +1] and none of it re-clamps. st04 = na(ratio) or (ratio >= -1.0 - ST_EPS and ratio <= 1.0 + ST_EPS) // 5. The ONE 0-100 score, both sides. st05 = f_ok100(scoreL) and f_ok100(scoreS) // 6. Every rubric sub-score in [0,1], both sides. Sixteen numbers from eight // modules; a single one escaping its range silently re-weights the rubric. st06 = f_ok01(qLevelL) and f_ok01(qLevelS) and f_ok01(qSweepL) and f_ok01(qSweepS) and f_ok01(qRvolL) and f_ok01(qRvolS) and f_ok01(qAbsorbL) and f_ok01(qAbsorbS) and f_ok01(qRejectL) and f_ok01(qRejectS) and f_ok01(qDispL) and f_ok01(qDispS) and f_ok01(qBosL) and f_ok01(qBosS) and f_ok01(qRetestL) and f_ok01(qRetestS) // 7-9. Array caps. Each of these arrays has a prune step that is supposed to // hold the cap; an overflow here means a prune path was missed. // EACH BOUND IS THE ONE ITS OWNER DOCUMENTS, not the bare input, because a // self-test that goes red on a healthy system is worse than no self-test: // S4 evicts at most 4 levels per bar and never evicts a protected kind, // of which there are 13 slots -> i_maxLevels + 13 + 4 (its own words, // 04_liquidity.pine i_maxLevels tooltip). // S6 calls f_absCap() AFTER both births and loops until it is under the // cap, so this one really is the bare input. // S14 holds live <= 2 x per-dir, plus that many again killed on this bar // and awaiting the next bar's GC, plus two births // -> 4 x i_maxSetupsPerDir + 2 (its own words, 14_machine.pine). st07 = array.size(levels) <= i_maxLevels + 17 st08 = array.size(zones) <= i_absMaxZones st09 = array.size(setups) <= 4 * i_maxSetupsPerDir + 2 // 10. The drawing budget, summed across ALL owners. Every component budgeted // its own slice against 500/500/500 and nobody added them up. This does. // At 500 TradingView starts silently evicting the OLDEST object, which // looks like a drawing bug and is actually a budget bug. st10 = array.size(line.all) < 500 and array.size(box.all) < 500 and array.size(label.all) < 500 // 11. i_rrMin REACHABILITY. If TP2 is built to net exactly i_rrMin and then // tested with rr2 >= i_rrMin, the gate rejects nothing except when mintick // rounding drops it a hair below - i.e. it only ever fires spuriously. The // target must sit strictly above the gate for the gate to mean anything. st11 = i_tp2R > i_rrMin // 12. i_minScore REACHABILITY. The eight weights must sum to 100 or the score's // true maximum is not 100 and the threshold is denominated in a different // unit than the user thinks. // NAME CHECK: SECTION 12 spells the displacement weight i_wDisp, not // i_wDisplace. The long spelling was an undeclared identifier here. stWSum = i_wLevel + i_wSweep + i_wRvol + i_wAbsorb + i_wReject + i_wDisp + i_wBos + i_wRetest st12 = math.abs(stWSum - 100.0) <= ST_EPS and i_minScore <= 100.0 // 13. THE DEADLOCK CHECK. A zone must be testable at least i_absMinTests times // to qualify, and is invalidated after i_zoneMaxTouches. If min >= max, no // zone can ever both qualify and survive, and the system emits zero signals // forever while every individual module reports itself healthy. st13 = i_absMinTests < i_zoneMaxTouches // 14. mintick sanity. Gold feeds are 0.01 or 0.001. Anything else means the // symbol is not what this file was calibrated for, and the strategy's // const-int slippage silently models the wrong friction. st14 = tick > 0.0 and tick <= 0.01 + ST_EPS // 15. Warmup correctness: warmupOk must IMPLY that every series it guards has // enough history and a usable ATR. The right-hand side deliberately does NOT // restate warmupOk's own definition: copying those clauses back verbatim // makes the test literally `not X or X`, a tautology that can never go red. // These clauses test what warmupOk is supposed to GUARANTEE but never itself // mentions - that the rvol baseline has actually filled, that there is room // behind bar_index for both pivot legs, and that the news guard's // previous-bar ATR reference (atrPrev) exists. stHist = not na(volSma) and bar_index >= i_rvolLen + i_pivotLeft + i_pivotRight stAtrOk = not na(atr) and atr > 0.0 and not na(atr[1]) st15 = not warmupOk or (stHist and stAtrOk) // 16. The tolerance floor. f_tol() must never return less than the spread, or // every proximity test in the file collapses below the noise floor in dead // tape and starts matching spread bounce as structure. st16 = f_tol(0.0) >= i_spreadUsd - ST_EPS and costRt > 0.0 // 17. The degenerate-ramp contract. f_ramp with hi <= lo must return na, NOT // 1.0 - \"set the threshold to 0 to disable it\" must never hand a module a // free full sub-score. st17 = na(f_ramp(0.5, 1.0, 1.0)) // 18. The HTF guard. A \"higher\" timeframe at or below the chart timeframe turns // lookahead_on into a genuine future leak. SECTION 0 falls back to Auto; if // this ever fails the whole file is repainting. st18 = timeframe.in_seconds(htfTf) > timeframe.in_seconds() // 19. Session quality stays a weight, not a score. st19 = sessQual >= 0.0 and sessQual <= 1.0 // 20. Both directions can never fire on the same bar - SECTION 12's conflict // resolution exists precisely to make this impossible. st20 = not (longSignal and shortSignal) // ------------------------------------------------- PRESET ADVISORY (info) // Not an assertion - a preset mismatch is a choice, not a bug. It is surfaced // so the choice is a deliberate one. stTfSec = timeframe.in_seconds() stPresetTf = stTfSec <= 60 ? \"1M\" : stTfSec <= 300 ? \"5M\" : stTfSec <= 900 ? \"15M\" : \"other\" stRecScore = stTfSec <= 60 ? 80.0 : stTfSec <= 300 ? 75.0 : 70.0 stPresetOk = stPresetTf == \"other\" or math.abs(i_minScore - stRecScore) <= 0.5 // ------------------------------------------------------ RENDER + EXPORT // Anchor: middle_left, reserved for SECTION 19 alone. SECTION 16 owns THREE // anchors - vxMain top_right, vxChk bottom_right, vxStat BOTTOM_LEFT - and // vxStat renders whenever i_showStats is on, which is exactly when a user is // also watching the self-test. bottom_left was therefore a real collision and // this is the panel that moves, because it is the only one that is normally // invisible. Do not move it back without re-checking 16_visuals table.new(). var table stTbl = table.new(position.middle_left, 2, 24, border_width = 1) var string selfTestMsg = \"SELF-TEST: not run\" if barstate.islast if not i_selfTest selfTestMsg := \"SELF-TEST: disabled\" else array<string> nm = array.new<string>() array<bool> pv = array.new<bool>() f_stAdd(nm, pv, \"buyPressure + sellPressure == 1\", st01) f_stAdd(nm, pv, \"f_closeLoc(+1) + f_closeLoc(-1) == 1\", st02) f_stAdd(nm, pv, \"wick + body decomposition == 1\", st03) f_stAdd(nm, pv, \"delta ratio within [-1, +1]\", st04) f_stAdd(nm, pv, \"setup score within [0, 100]\", st05) f_stAdd(nm, pv, \"all 16 sub-scores within [0, 1]\", st06) f_stAdd(nm, pv, \"levels <= i_maxLevels + 17\", st07) f_stAdd(nm, pv, \"zones <= i_absMaxZones\", st08) f_stAdd(nm, pv, \"setups <= 4 x i_maxSetupsPerDir + 2\", st09) f_stAdd(nm, pv, \"lines/boxes/labels each < 500\", st10) f_stAdd(nm, pv, \"i_rrMin reachable (i_tp2R > i_rrMin)\", st11) f_stAdd(nm, pv, \"i_minScore reachable (weights == 100)\", st12) f_stAdd(nm, pv, \"i_absMinTests < i_zoneMaxTouches\", st13) f_stAdd(nm, pv, \"mintick is a gold tick (0.01 / 0.001)\", st14) f_stAdd(nm, pv, \"warmupOk implies history + live ATR\", st15) f_stAdd(nm, pv, \"f_tol() floored at the spread\", st16) f_stAdd(nm, pv, \"degenerate f_ramp returns na\", st17) f_stAdd(nm, pv, \"HTF strictly above chart timeframe\", st18) f_stAdd(nm, pv, \"sessQual within [0, 1]\", st19) f_stAdd(nm, pv, \"long and short never fire together\", st20) int nAll = array.size(pv) int nFail = 0 string firstFail = \"\" for i = 0 to nAll - 1 if not array.get(pv, i) nFail += 1 if str.length(firstFail) == 0 firstFail := array.get(nm, i) selfTestMsg := nFail == 0 ? \"SELF-TEST OK (\" + str.tostring(nAll) + \"/\" + str.tostring(nAll) + \")\" : \"SELF-TEST: \" + str.tostring(nFail) + \" of \" + str.tostring(nAll) + \" FAILED - first: \" + firstFail // The panel is deliberately invisible while everything passes, so a red // block appearing on the chart is unambiguous. bool showIt = i_testRows == \"All checks\" or (i_testRows == \"Failures only\" and nFail > 0) table.clear(stTbl, 0, 0, 1, 23) if showIt table.cell(stTbl, 0, 0, nFail == 0 ? \"OK\" : \"FAIL\", text_color = color.white, bgcolor = nFail == 0 ? color.new(#26A69A, 0) : color.new(#EF5350, 0), text_size = size.tiny, text_halign = text.align_center) table.cell(stTbl, 1, 0, selfTestMsg, text_color = color.white, bgcolor = nFail == 0 ? color.new(#26A69A, 40) : color.new(#EF5350, 20), text_size = size.tiny, text_halign = text.align_left) int r = 1 for i = 0 to nAll - 1 bool stPass = array.get(pv, i) if r <= 21 and (i_testRows == \"All checks\" or not stPass) f_stRow(stTbl, r, array.get(nm, i), stPass) r += 1 // Advisory row last: settings, not correctness. if r <= 22 f_stRow(stTbl, r, stPresetTf + \" preset: i_minScore \" + str.tostring(i_minScore, \"#\") + \" (recommended \" + str.tostring(stRecScore, \"#\") + \")\", stPresetOk) r += 1 if r <= 23 f_stRow(stTbl, r, \"Window: \" + (inWindow ? \"IN\" : \"OUT\") + \" . \" + str.tostring(barsInWindow) + \" bars . blocked \" + str.tostring(wfBlockedL) + \"L/\" + str.tostring(wfBlockedS) + \"S\", inWindow) // ========================= END SECTION 19 ==================================="