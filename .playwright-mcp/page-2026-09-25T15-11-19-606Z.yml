  - generic [ref=e22]:
    - paragraph [ref=e23]: Bottom line
    - paragraph [ref=e24]:
      - strong [ref=e25]: The automated strategy has no edge after costs, and no filter set creates one.
      - text: On M3 the raw signal plus the shipped management makes about $0.80 gross per trade at 0.02 lot and pays $1.56 of spread per trade. Every filter that passes the retention rule shrinks the loss by trading less; none turns the profit factor above 1.0 in the development or validation years, and the walk-forward test years are negative in all three windows (profit factor 0.53, 0.77, 0.99).
    - paragraph [ref=e26]: "The loss mechanisms you suspected are real and measurable, and this report ranks them. But 87% of the loss is initial-stop hits on trades whose best point was 0.15R: the entry is wrong far more often than the exit. Filters that remove those trades remove nearly as many winners, because the winners look the same at the moment of entry."
    - paragraph [ref=e27]:
      - strong [ref=e28]: Do not automate this signal for real money.
      - text: "What is worth doing: run the two-filter M3 variant (signal age and distance) on demo with risk-based sizing to collect the telemetry in section 13, and answer the questionnaire in section 15 so the discretionary part of your manual trading can be tested as rules."
  - generic [ref=e29]:
    - heading "1. Current strategy architecture" [level=2] [ref=e30]
    - paragraph [ref=e31]: "The shipped Momentum EA is a straight line from one indicator to an order. Everything below was tested as a stage added between SIGNAL and ORDER, or as an option inside TRADE MANAGEMENT. The signal itself (TWK_Core: Supertrend 1.5 / ATR 10 flip, 5-bar pivots, up/down volume rows, ADX 14) was not changed."
    - generic [ref=e32]: "SIGNAL GENERATION Supertrend(1.5, 10) flip on the signal timeframe (M3 here) | ENTRY FILTERS volume ratio >= 1.2 on the M1 row, M1 box, M3 box, ADX(14) > 20 [all derived from the same bars] | STOP / TARGET SL = last 5-bar pivot (purple line if none; hard 500 pts on M1); TP = 2 x risk | RISK fixed 0.02 lot, no cap on the stop distance, one position per symbol | ORDER market order at the next bar's open (ask for buys, bid for sells) | TRADE MANAGEMENT +360 pts: trail on the purple line | +900 pts: lock +180 and 1:1 trail with a 720-pt gap | EXIT SL, trailed SL, TP; opposite signals are ignored while a position is open (tester run: reverse) Tested in this lab (all configurable, all off by default): MARKET REGIME FILTER ATR regime, ADX level and slope, flip count, Bollinger width, opposite candles, HTF direction ENTRY QUALITY FILTER signal age vs the opposite flip, distance from the previous signal, overextension, entry score COST FILTER spread / (RR x stop), spread / stop RISK CHECK ATR-capped stops, hybrid structure+ATR stops, risk-based lot, daily loss, streak pause MANAGEMENT cooldown after a loss, re-entry distance, trail activation in R, break-even, R-based lock, time exit, opposite-signal models A/B/D"
  - generic [ref=e33]:
    - heading "2. Exact loss mechanisms" [level=2] [ref=e34]
    - paragraph [ref=e35]: Ranked by how much of the loss they explain. Evidence for each is in section 3.
    - list [ref=e36]:
      - listitem [ref=e37]:
        - strong [ref=e38]: 1. Spread larger than the gross edge.
        - text: "Baseline M3, 3,399 trades: gross before costs +$2,710, spread $5,318, net -$2,752. On M1 the median spread was 13% to 18% of the target distance in 2021 to 2024; on M3 7% to 10%; on M15 3% to 4%. Table 3.1."
      - listitem [ref=e39]:
        - strong [ref=e40]: 2. Entries that never move.
        - text: "1,686 initial-stop exits carry 87% of the gross loss. Their median best excursion is 0.15R: the market went against the signal almost immediately. Table 3.2 and 3.4."
      - listitem [ref=e41]:
        - strong [ref=e42]: 3. Volatility spikes.
        - text: Losers entered when ATR was above 1.5x its 30-day median are 27% of losers but 41% of the loss (average -$13 against -$8.6). Capping them helps in the range years and hurts in the trend years (A/B table, atr_ratio<=1.5).
      - listitem [ref=e43]:
        - strong [ref=e44]: 4. Rapid re-flips.
        - text: 524 losers came within 5 bars of the opposite signal, 25% of the loss. Requiring the opposite signal to be at least 10 bars old is the single most useful filter (PF 0.60 to 0.66 in DEV, 0.58 to 0.74 in VAL), and it is still below 1.
      - listitem [ref=e45]:
        - strong [ref=e46]: 5. Session and time-of-day.
        - text: The three worst development hours carry 19% of the loss, but the hourly sign agrees between periods only 62% to 75% of the time (correlation 0.2 to 0.4). Not stable enough to trade on.
      - listitem [ref=e47]:
        - strong [ref=e48]: 6. Trailing that gives back.
        - text: 566 losers were up 0.5R or more first (15% of the loss). Of trades reaching +1R, 13% still ended as losers. An R-based lock at +1R converts some of them but costs as many 2R targets; the net effect is about zero.
      - listitem [ref=e49]:
        - strong [ref=e50]: "7. Post-loss re-entry: an M1 problem, not an M3 problem."
        - text: On M3 trades after a loss have better expectancy (-$0.60 to -$0.79) than trades after a win (-$0.98). Cooldowns change almost nothing here; they mattered on M1 where 55% of the loss came from trades closed within 3 minutes.
      - listitem [ref=e51]:
        - strong [ref=e52]: 8. Fixed lots.
        - text: "Not a source of the negative expectancy, but the reason a negative expectancy becomes ruin: fixed 0.02 lot from $1,000 ends at -$1,752 on the baseline (max drawdown 281%); 0.5% risk per trade on the same trades ends at $327, a 67% loss with no margin call. Sizing sets the speed of the loss, not its sign. Section 7."
