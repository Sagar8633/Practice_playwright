    - paragraph [ref=e1151]: "The session filter (entries 15:00 to 20:00 server time, the London and New York overlap) is the only change that helps every bot on every timeframe, and it still loses: Momentum M1 -$642, M5 -$524, M15 -$298 over five years. Raising the volume ratio back to the default 1.5 halves the trades and the loss on M1 but changes nothing on M15. Reversing on the opposite signal, the setting you used in the 25 September tester run, is the worst variant on every timeframe. The pure Pine strategy (enter only when flat, no trailing) is better than the reverse-on-flip bot but still loses $12,265 on M1."
    - paragraph [ref=e1152]: "What would actually be needed is not in the parameter space: a stop capped at a multiple of ATR (skip the trade if the pivot is wider), a trail measured in ATR instead of points, one trade per direction per session, and risk-percent sizing with a hard cap on the stop distance. Even with all of that, the flip itself has to carry an edge, and over five years it does not."
