    - generic [ref=f8e46]:
      - generic [ref=f8e47]:
        - generic [ref=f8e48]: Diagnosis
        - heading "Your problem is not craft. It is stack coverage and articulation." [level=2] [ref=f8e49]
        - paragraph [ref=f8e50]:
          - text: The eight most-demanded skills in the market you are scanning are already yours — all eight rated
          - emphasis [ref=f8e51]: strong
          - text: in every one of the six analysis runs. What removes you from shortlists is a language you do not write, a pipeline platform you have not touched, a non-functional discipline with no tool behind it, and stories you have not rehearsed.
      - generic [ref=f8e52]:
        - generic [ref=f8e53]:
          - generic [ref=f8e54]: Already won · 8 of top 8
          - heading "Playwright, Python, Selenium, REST API, CI/CD, Git, Agile, exploratory testing" [level=3] [ref=f8e55]
          - paragraph [ref=f8e56]:
            - text: Every one of these sits above 48% demand and every one is rated strong. Do not spend the 60 days re-learning them — spend it making them
            - emphasis [ref=f8e57]: demonstrable
            - text: in public repos.
        - generic [ref=f8e58]:
          - generic [ref=f8e59]: Blocker 1 · 42% demand
          - heading "Stakeholder communication" [level=3] [ref=f8e60]
          - paragraph [ref=f8e61]:
            - text: The single highest-demand item marked
            - emphasis [ref=f8e62]: gap
            - text: in all six runs, and 24 questions in your bank. It is also the cheapest to fix — it costs rehearsal, not learning. Lead roles are lost here, not on syntax.
        - generic [ref=f8e63]:
          - generic [ref=f8e64]: Blocker 2 · 42% demand
          - heading "Java + TestNG + REST Assured + Maven" [level=3] [ref=f8e65]
          - paragraph [ref=f8e66]: A hard gate on roughly a third of postings, where a live Java coding round is standard. The most expensive gap on the board — it gets 15 days, the largest single allocation.
        - generic [ref=f8e67]:
          - generic [ref=f8e68]: Blocker 3 · 35% / 25% demand
          - heading "JavaScript & TypeScript" [level=3] [ref=f8e69]
          - paragraph [ref=f8e70]:
            - text: Highest leverage per hour on the whole plan. You already know Playwright deeply; only the language changes. 15 postings are literally titled
            - emphasis [ref=f8e71]: Playwright Automation Engineer
            - text: and most of them specify TS.
        - generic [ref=f8e72]:
          - generic [ref=f8e73]: Blocker 4 · 33% demand
          - heading "Azure & Azure DevOps" [level=3] [ref=f8e74]
          - paragraph [ref=f8e75]:
            - text: You own Jenkins and GitHub Actions. This is a vocabulary and YAML-dialect gap, not a concepts gap — but it reads as a hard
            - emphasis [ref=f8e76]: "no"
            - text: on a CV filter, so it needs one real pipeline behind it.
        - generic [ref=f8e77]:
          - generic [ref=f8e78]: Blocker 5 · 28% demand
          - heading "Performance testing" [level=3] [ref=f8e79]
          - paragraph [ref=f8e80]: Your resume claims performance and load testing but names no tool, which is worse than claiming nothing. One k6 script and one JMeter plan closes it permanently.
