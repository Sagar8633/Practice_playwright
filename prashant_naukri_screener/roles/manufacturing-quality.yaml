  # which is boilerplate on factory and contract postings. Every spelling below
  # is 6.3-bearing, and the hyphen and space forms are genuinely different
  # regexes - "vda 6.3" does not match "VDA-6.3".
  VDA 6.3 Process Audit:
    category: Supplier Audits
