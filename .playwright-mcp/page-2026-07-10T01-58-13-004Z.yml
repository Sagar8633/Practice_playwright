              - paragraph [ref=e108]: Symbiosis International University
            - paragraph [ref=e109]: "Date Written: April 26, 2026"
            - generic [ref=e110]:
              - heading "Abstract" [level=3] [ref=e111]
              - paragraph [ref=e112]: "This paper presents, formalises, and empirically validates a fully rule-based intraday trading strategy for gold spot (XAU/USD) that integrates Volume-Weighted Average Price (VWAP) as a primary structural reference level with Exponential Moving Averages (EMAs) as dynamic trend filters and trailing stop mechanisms. The strategy directly addresses two chronic structural inefficiencies in short-term gold trading: (i) the propensity of gold prices to produce aggressive intrabar wicks that prematurely trigger conventional fixeddistance stop-loss orders, and (ii) the difficulty of managing open profit as price approaches known institutional reference levels. The 200-period EMA serves as a binary regime classifier; entry is conditioned on a precisely defined pullback and rejection signal at the 50-period EMA above (or below) the session VWAP; and the 50-period EMA functions as a dynamic trailing stop activated exclusively on candle closes, not intrabar wick penetrations. All entry conditions are stated as machine-testable quantitative rules, eliminating hidden discretion. A simulated backtest over 247 trades on the XAU/USD 15-minute timeframe (January-December 2024) produces a win rate of 45.3%, mean expectancy of +0.414R per trade, profit factor of 1.76, annualised Sharpe ratio of 3.99, and maximum drawdown of 5.1% on a fixed 1% risk-per-trade model, substantially outperforming a simple EMA crossover benchmark across all evaluated metrics. Risk management incorporates ATR-adjusted position sizing, a hard daily loss limit, and explicit news-event exclusion protocols."
              - paragraph
