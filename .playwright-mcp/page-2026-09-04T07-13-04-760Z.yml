  - heading "2 · Paste into the Pine Editor" [level=2] [ref=e80]
  - list [ref=e81]:
    - listitem [ref=e82]:
      - text: On TradingView, open
      - strong [ref=e83]: Pine Editor
      - text: (bottom panel).
    - listitem [ref=e84]:
      - strong [ref=e85]: Open → New indicator
      - text: .
    - listitem [ref=e86]: Click inside the editor, Ctrl+A, then Ctrl+V. Paste — never type. Monaco's auto-indent silently corrupts hand-typed Pine.
    - listitem [ref=e87]:
      - strong [ref=e88]: Save
      - text: (Ctrl+S), keep the script's own name, then
      - strong [ref=e89]: Add to chart
      - text: .
    - listitem [ref=e90]:
      - text: Set the chart to the
      - strong [ref=e91]: 15m
      - text: timeframe.
  - heading "3 · Create the alert" [level=2] [ref=e92]
  - list [ref=e93]:
    - listitem [ref=e94]: Press Alt+A.
    - listitem [ref=e95]:
      - strong [ref=e96]: Condition
      - text: → the scanner script's name.
    - listitem [ref=e97]:
      - text: The dropdown just below it →
      - strong [ref=e98]: Any alert() function call
      - text: . This is the setting that makes one alert cover all 40 symbols — get it wrong and you get nothing.
    - listitem [ref=e99]:
      - strong [ref=e100]: Notifications
      - text: tab → tick
      - strong [ref=e101]: Notify on app
      - text: (this is the phone push), plus
      - strong [ref=e102]: Show popup
      - text: and
      - strong [ref=e103]: Play sound
      - text: .
    - listitem [ref=e104]: Leave the message box alone. The script writes it.
    - listitem [ref=e105]:
      - strong [ref=e106]: Expiration
      - text: → as far out as the plan allows, then
      - strong [ref=e107]: Create
      - text: .
  - generic [ref=e108]:
    - strong [ref=e109]: Only 2 indicators fit on a chart at once (free plan).
    - text: "That is fine: an alert keeps running after you remove the indicator. So — add b1, create its alert,"
    - emphasis [ref=e110]: remove b1 from the chart
    - text: ", add b2, and so on. Check the Alerts panel afterwards; all five should read as active."
  - generic [ref=e111]:
    - strong [ref=e112]: These alerts never fire on history.
    - text: TradingView ignores
    - code [ref=e113]: alert()
    - text: on historical bars, and the script also gates on
    - code [ref=e114]: barstate.isconfirmed
    - text: with
    - code [ref=e115]: alert.freq_once_per_bar_close
    - text: . Nothing triggers until a real 15m candle closes while the alert is live.
  - heading "4 · Prove the phone push works" [level=2] [ref=e116]
  - list [ref=e117]:
    - listitem [ref=e118]: Install the TradingView app and sign in as the same account.
    - listitem [ref=e119]:
      - text: Open b1's settings on the chart and set
      - strong [ref=e120]: ADX threshold
      - text: to
      - code [ref=e121]: "0"
      - text: ", then edit its alert so it uses that setting."
    - listitem [ref=e122]: Wait for the next 15m close — with the threshold at 0 something fires almost immediately. Confirm the phone buzzes.
    - listitem [ref=e123]:
      - text: Put the threshold back to
      - code [ref=e124]: "20"
      - text: .
