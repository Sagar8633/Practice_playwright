    - heading "2. What market conditions does it work in?" [level=2] [ref=e483]
    - paragraph [ref=e484]: Every split reported gross and net, by period, with the number of positive years.
    - paragraph [ref=e485]: "It works nowhere. The tables below are the honest version of 'what conditions': every group is negative net in every period, and gross is within a few hundredths of an R of zero in every group. The groups that lose least are the ones where the spread is smallest relative to the move (high ATR, the London/New York overlap, low cost-to-reward). Those are cost gradients, not edges: their gross expectancy is as flat as everyone else's."
