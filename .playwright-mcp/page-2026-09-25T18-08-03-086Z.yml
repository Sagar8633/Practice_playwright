  - generic [ref=e18]:
    - paragraph [ref=e19]: The single next experiment
    - paragraph [ref=e20]: Tick-resolution test of the 15:30 server (8:30 New York) scheduled-release straddle, Thursdays and Fridays first.
    - paragraph [ref=e21]: "It is the only thing in 222 ledger entries that is net positive in development, validation and out of sample after costs, and the only one with a mechanism you can name: the weekly US data releases at 8:30 New York (initial jobless claims every Thursday, payrolls and CPI on their Fridays). The five-minute bar ending 15:30 server predicts a 1.75x larger range over the next 100 minutes (AUC 0.80, stable in every period), and a straddle with stops 0.25 ATR either side and a 0.75 ATR target earns +0.12, +0.29 and +0.21 ATR per event in the three periods, +0.54 on Thursdays, positive in each of the six years, while the same straddle at random bars loses 0.15 to 0.41 ATR."
    - paragraph [ref=e22]: It is also undecidable with the data we have. In 86% of these events the first minute after 15:30 is wider than both triggers, and 390 of 827 events could not be resolved at one-minute resolution. Count those as losses and the expectancy is about -0.21 ATR; count them as wins and it is about +0.45. Only tick data says which side triggered first and what the spread did. Dukascopy publishes gold ticks with bid, ask and both sizes for free; the experiment needs roughly 120 release days (every Thursday of 2025 plus the payroll and CPI days), designed on 2025 and held out on 2026, a fixed configuration with a plateau check from 0.15 to 0.40 ATR, and Dukascopy's own spread plus XM's 51 points as the cost. If it survives, the follow-on is a four-week XM demo run placing the OCO at 15:29:30 with fill logging, which is the execution-edge question in your section 9. Zero data cost, about two hours of work, one predefined hypothesis.
