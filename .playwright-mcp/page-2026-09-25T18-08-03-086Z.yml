    - list [ref=e249]:
      - listitem [ref=e250]:
        - strong [ref=e251]: Validation is five months, not a year.
        - text: 2024 is 40% covered, 2022 is 40%, 2021 is 25%. Every 'validation' verdict in phases 5 to 13 rests on 2024's present months, and the development set is dominated by 2023. This does not rescue any rejected hypothesis (their effects are near zero, not marginal), but it weakens the 15:30 straddle's validation number (+0.29 on 54 events) more than its development and out-of-sample numbers.
      - listitem [ref=e252]:
        - strong [ref=e253]: The twelve holes are month boundaries, not random.
        - text: They come from the downloader's rate limit and were guarded in every simulation (positions closed at a hole, signals skipped in the warm-up). They do not bias within-month statistics. The missing months should be fetched before the next experiment (script in tools/, one process, gentle cadence).
      - listitem [ref=e254]:
        - strong [ref=e255]: Timezone and DST are consistent.
        - text: Monday's first bar is 01:00 server in 155 of 167 weeks and Friday's last bar 23:00 in 148 of 168, which is XM's EET schedule; the 12 exceptions are holiday weeks. Dukascopy and XM closes differ by a median $0.08 on the 99,000 overlapping minutes, against a 2026 one-minute ATR of $2.20.
      - listitem [ref=e256]:
        - strong [ref=e257]: Spread is a yearly median.
        - text: XM's quoted spread is nearly constant by hour (51 to 55 points on the overlap) and rarely spikes in the bar data (above 2x median in 0.27% of minutes, maximum 254). That says nothing about fills during releases, which is exactly the gap the next experiment closes.
      - listitem [ref=e258]:
        - strong [ref=e259]: No repair was done.
        - text: Zero duplicates, zero inconsistent bars, 0.1% zero-range bars left as they are.
  - generic [ref=e260]:
    - 'heading "Report B: Manual edge experiment" [level=2] [ref=e261]'
    - paragraph [ref=e262]: Exact fields and how they will be tested.
    - list [ref=e263]:
      - listitem [ref=e264]:
        - strong [ref=e265]: "Per trade, at entry (before the outcome is known):"
        - text: timestamp to the second, symbol, direction, entry price, initial stop, target if any, lot; TWK signal on the chart at that moment (yes/no, which timeframe, minutes since the flip); one line for why entered; expected type (continuation or reversal); whether you waited for the candle close, a pullback, or a confirmation; the higher timeframes you looked at and what they showed; news you were aware of; a screenshot.
      - listitem [ref=e266]:
        - strong [ref=e267]: "Per trade, at exit:"
        - text: exit time and price, reason (stop, target, discretionary, opposite signal, time), result in R, and whether you moved the stop and why.
      - listitem [ref=e268]:
        - strong [ref=e269]: "Per skipped signal:"
        - text: every TWK flip you saw and did not take, with the time and one line for why. This is the half of the dataset that matters most; without it the comparison in section 2 of your brief cannot be made.
      - listitem [ref=e270]:
        - strong [ref=e271]: "Minimum:"
        - text: 100 trades and all the skipped signals in the same weeks; a second 100 later as the out-of-sample set.
    - heading "Tests" [level=3] [ref=e272]
    - list [ref=e273]:
      - listitem [ref=e274]: "Join every manual trade and every skipped signal to the signal dataset by time (the 73-feature table already exists), so A/B/C/D are exact sets: manual with TWK, manual without, TWK skipped, TWK accepted."
      - listitem [ref=e275]: "For each set: expectancy, PF, win rate, average R, MFE and MAE in R, P(+0.5R), P(+1R), P(+2R), MAE before +1R, time to +0.5R and +1R, duration, measured with the same first-passage engine as the bot's signals, so the comparison is like for like."
      - listitem [ref=e276]: "The decisive number: expectancy of the signals you took versus the signals you skipped, in the same weeks. If skipped signals are not worse than taken ones, selection has no information and the manual edge, if any, is in exits or sizing."
      - listitem [ref=e277]: "Decision variables: your written reasons coded as binary features (waited for close, pullback, HTF up, near level, news day, and so on), each tested for correlation with the outcome across all trades, winners and losers alike; then Models A to D (TWK only, price context, manual variables, both) fitted on the first 100 and scored on the second 100 by expectancy, PF, top-decile precision and +1R / +2R hit rates, not AUC alone."
      - listitem [ref=e278]: "Rejection rule: a manual variable that does not improve out-of-sample expectancy is a story, not a rule."
