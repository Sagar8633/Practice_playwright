  - generic [ref=e12]:
    - paragraph [ref=e13]: Verdict
    - paragraph [ref=e14]:
      - strong [ref=e15]: Neither TWK bot has an edge, on any timeframe, in any year.
      - text: "Both are one indicator: a Supertrend with factor 1.5 and ATR length 10. On gold it flipped 85,968 times in five years of one-minute bars, about 70 times a day. Every flip is a trade for the Pine bot, and the Momentum bot's volume, box and ADX filters are computed from the same price bars, so they thin the trades without changing their sign."
    - paragraph [ref=e16]: "Before costs the system is a coin flip (gross P&L within a few hundred dollars of zero on every timeframe). After XM's spread it is a steady loss: the Pine bot on M1 paid $63,498 in spread to lose $66,887 at 0.02 lot. The best fix candidate, trading only 15:00 to 20:00 server time, still loses on every timeframe. The 95% confidence interval of the average trade is below zero for every base run, so this is not bad luck."
    - paragraph [ref=e17]:
      - strong [ref=e18]: Do not put real money on either bot.
      - text: At $200 and 0.02 lot every configuration except Momentum M15 wipes the account inside the last six months, which matches what the Strategy Tester did to you on 25 September (balance $7.02 by May 2026).
