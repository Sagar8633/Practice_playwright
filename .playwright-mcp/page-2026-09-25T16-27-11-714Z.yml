  - generic [ref=e2410]:
    - heading "9. Phases 10 to 12" [level=2] [ref=e2411]
    - paragraph [ref=e2412]: What needs your data, and what the new entry model would be built from if it existed.
    - list [ref=e2413]:
      - listitem [ref=e2414]:
        - strong [ref=e2415]: Phase 10, telemetry (your demo account).
        - text: "Run the Loss Prevention v1 configuration on demo with the decision log and the order log from the phase-1 report (signal price, requested price, fill, slippage, latency, spread at signal, order and exit, ATR, and the news flags). Until that exists, execution and news are unknowns, not causes: nothing in this study can attribute a loss to them."
      - listitem [ref=e2416]:
        - strong [ref=e2417]: Phase 11, manual log (you).
        - text: "At least 100 manual trades and the signals you skipped, in the format listed in the roadmap. This is the only remaining dataset that could contain an edge, because everything measurable in price context has now been measured. The comparison to run is the one you wrote: signals in the same window, your take rate, your hit rate versus the bot's on the same signals."
      - listitem [ref=e2418]:
        - strong [ref=e2419]: Phase 12, new entry model.
        - text: Not started, and it should not be started from this signal's price context. If phase 11 shows your selection has an edge, the entry model is built from the features that reproduce your selection; if it does not, the flip is the wrong starting point and the next hypothesis should be a different signal, tested with exactly this pipeline (buckets, separation, model, entries, gates, controls) before any management is added.
      - listitem [ref=e2420]:
        - strong [ref=e2421]: Controls stay frozen.
        - text: Raw TWK and Loss Prevention v1 are in the acceptance table and in the repo; every future candidate is compared to both.
