  - paragraph [ref=e22]: "20 repositories on the topic page on 26 Sep 2026. One is directly relevant (A), two are research-interesting crypto bots (C), seventeen are not relevant (D): a Windows Forms template farm with three identical \"Forex-Scalping-EA\" clones whose README badges point at the Linux kernel, two README-only shells, a landing page whose code is on a paid site, seven exchange-specific crypto bots, a Korean stock scanner, two tools, and a 60-line \"XAU/USD scalper\" that mixes MQL4 calls into an .mq5 file and cannot compile."
