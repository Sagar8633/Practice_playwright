            - paragraph [ref=f9e1701]: "Your two-minute answer, structured: (1) the problem — output is non-deterministic, so equality assertions are useless; (2) the method — golden datasets with property assertions: must-contain, must-not-contain, must-cite, must-refuse; (3) stability — run N times and assert on the distribution, not a single response; (4) agents — assert the tool-call sequence and arguments, because the plan is deterministic even when the prose is not; (5) budgets — latency and token cost are functional requirements; (6) drift — the model version is a dependency, so pin it and re-run the golden set on every upgrade. Finish with the concrete one from your own work: video analytics accuracy on the FRS and ANPR pipelines, where you agreed precision and recall thresholds with the ML team instead of a pass/fail assertion."
