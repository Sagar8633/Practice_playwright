              vendor assessment, supplier evaluation, new supplier approval, new vendor approval,
              supplier approval, vendor approval, supplier registration]

  # --- Second-party auditing. Bare "process audit", "system audit" and
  # --- "product audit" are deliberately NOT here - in-plant audits are a duty
  # --- in most manufacturing quality adverts, so they would drive this row to
  # --- Critical off internal-audit demand and send the study plan to
  # --- second-party auditing for adverts with no supplier scope at all. They
  # --- live on the internal-audit row further down, which is where they belong.
  Supplier Audit:
    category: Supplier Audits
    aliases: [supplier process audit, supplier system audit, supplier product audit,
              supplier qms audit, supplier quality audit, supplier site audit,
              on site supplier audit, on-site supplier audit, supplier audit, supplier audits,
