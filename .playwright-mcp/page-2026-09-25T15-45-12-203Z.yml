    - paragraph [ref=e2525]: No entry timing rescues the signal. Waiting for a confirmation bar (taken 48% of the time) gives -0.308R, the same as entering immediately. Delaying one to five bars moves the number from -0.308R to between -0.285R and -0.301R, inside noise and consistent with the first quarter-ATR being adverse. Entering on a 0.5 ATR pullback is worse (-0.334R), because 59% of signals pull back that far and then fail; only 16% pull back and continue. Entering on the break of the signal bar's high or low is -0.306R.
    - paragraph [ref=e2526]: "There is therefore no entry model to write. The deterministic rule the data supports is the null one: do not enter on this signal."
